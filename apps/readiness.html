/* ---------------- أدوات رقمية دقيقة ---------------- */
function rnd(x, d){
  d = (d===undefined) ? 2 : d;
  if(x===null || x===undefined || isNaN(x)) return null;
  const f = Math.pow(10,d);
  return Math.round(Number(x)*f)/f;
}
function fx(x, d){
  d = (d===undefined) ? 2 : d;
  if(x===null || x===undefined || isNaN(x)) return '—';
  return Number(x).toFixed(d);
}
function pc(x, d){ return fx(x,(d===undefined?1:d))+'%'; }
function quantile(sorted, p){
  if(!sorted.length) return null;
  if(sorted.length===1) return sorted[0];
  const idx = (sorted.length-1)*p;
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if(lo===hi) return sorted[lo];
  return sorted[lo] + (sorted[hi]-sorted[lo])*(idx-lo);
}
function describe(values){
  const a = values.filter(v=>typeof v==='number' && !isNaN(v)).slice().sort((x,y)=>x-y);
  const n = a.length;
  if(!n) return {n:0, mean:0, sd:0, variance:0, se:0, median:0, q1:0, q3:0, iqr:0,
                 min:0, max:0, range:0, cv:0, skew:0, kurt:0, sorted:[], ci95:[0,0]};
  const mean = a.reduce((s,x)=>s+x,0)/n;
  const varS = n>1 ? a.reduce((s,x)=>s+Math.pow(x-mean,2),0)/(n-1) : 0;
  const sd = Math.sqrt(varS);
  const q1 = quantile(a,0.25), median = quantile(a,0.5), q3 = quantile(a,0.75);
  let skew = 0, kurt = 0;
  if(n>2 && sd>0) skew = (n/((n-1)*(n-2))) * a.reduce((s,x)=>s+Math.pow((x-mean)/sd,3),0);
  if(n>3 && sd>0){
    const m4 = a.reduce((s,x)=>s+Math.pow((x-mean)/sd,4),0);
    kurt = ((n*(n+1))/((n-1)*(n-2)*(n-3)))*m4 - (3*Math.pow(n-1,2))/((n-2)*(n-3));
  }
  const se = n>0 ? sd/Math.sqrt(n) : 0;
  return {
    n, mean, sd, variance:varS, se, median, q1, q3, iqr:(q3-q1),
    min:a[0], max:a[n-1], range:a[n-1]-a[0],
    cv: mean ? (sd/mean)*100 : 0, skew, kurt, sorted:a,
    ci95: [mean - 1.96*se, mean + 1.96*se]
  };
}

/* ---------------- عتبات القرار ---------------- */
function thresholds(){
  const t = (DB.settings && DB.settings.thresholds) || {};
  return { ready: Number(t.ready!==undefined?t.ready:80), partial: Number(t.partial!==undefined?t.partial:60) };
}
function decisionOf(pct){
  const t = thresholds();
  if(pct >= t.ready) return 'جاهز';
  if(pct >= t.partial) return 'شبه جاهز';
  return 'غير جاهز';
}
function decisionClass(pct){
  const t = thresholds();
  return pct>=t.ready ? 'green' : (pct>=t.partial ? 'amber' : 'red');
}

/* ---------------- استخراج تفاصيل المحاولة بدقة كاملة ---------------- */
function exactPct(r){
  if(r && r.total) return (r.correct/r.total)*100;
  return Number(r && r.score) || 0;
}
function attemptItems(result){
  const exam = DB.exams.find(e=>e.id===result.examId);
  if(!exam || !Array.isArray(exam.questionIds)) return [];
  return exam.questionIds
    .map(id=>DB.questions.find(q=>q.id===id))
    .filter(Boolean)
    .map(q=>{
      const raw = result.answers ? result.answers[q.id] : undefined;
      const answered = raw!==undefined && raw!==null && raw!=='';
      return { q, answer: answered ? Number(raw) : null,
               correct: answered && Number(raw)===Number(q.correct) };
    });
}
function applyAttemptPolicy(results, policy){
  if(policy==='all') return results.slice();
  const map = {};
  results.forEach(r=>{
    const key = r.studentId+'|'+r.examId;
    const cur = map[key];
    if(!cur){ map[key] = r; return; }
    if(policy==='best'){ if(exactPct(r) > exactPct(cur)) map[key] = r; }
    else { if(new Date(r.submittedAt) > new Date(cur.submittedAt)) map[key] = r; }
  });
  return Object.keys(map).map(k=>map[k]);
}
const POLICY_LABEL = {last:'آخر محاولة لكل طالب', best:'أفضل محاولة لكل طالب', all:'كل المحاولات المسجّلة'};

/* ---------------- تحليل المفردات والثبات ---------------- */
function itemAnalysis(exam, results){
  const qs = (exam.questionIds||[]).map(id=>DB.questions.find(q=>q.id===id)).filter(Boolean);
  const n = results.length, k = qs.length;
  if(!n || !k) return null;
  const matrix = results.map(r=> qs.map(q=>{
    const a = r.answers ? r.answers[q.id] : undefined;
    return (a!==undefined && a!==null && a!=='' && Number(a)===Number(q.correct)) ? 1 : 0;
  }));
  const totals = matrix.map(row=>row.reduce((a,b)=>a+b,0));
  const meanT = totals.reduce((a,b)=>a+b,0)/n;
  const varT = totals.reduce((s,x)=>s+Math.pow(x-meanT,2),0)/n;   /* تباين المجتمع كما تقتضيه معادلة KR-20 */
  const sdT = Math.sqrt(varT);
  const order = totals.map((t,i)=>({t,i})).sort((a,b)=>b.t-a.t);
  const g = Math.max(1, Math.round(n*0.27));
  const upper = order.slice(0,g).map(o=>o.i);
  const lower = order.slice(n-g).map(o=>o.i);
  let sumPQ = 0;
  const items = qs.map((q,j)=>{
    const col = matrix.map(row=>row[j]);
    const nc = col.reduce((a,b)=>a+b,0);
    const p = nc/n, qq = 1-p;
    sumPQ += p*qq;
    const pu = upper.reduce((s,i)=>s+matrix[i][j],0)/g;
    const pl = lower.reduce((s,i)=>s+matrix[i][j],0)/g;
    const D = pu - pl;
    let rpb = null;
    if(sdT>0 && nc>0 && nc<n){
      const m1 = totals.filter((_,i)=>col[i]===1).reduce((a,b)=>a+b,0)/nc;
      const m0 = totals.filter((_,i)=>col[i]===0).reduce((a,b)=>a+b,0)/(n-nc);
      rpb = ((m1-m0)/sdT)*Math.sqrt(p*qq);
    }
    const counts = (q.options||[]).map(()=>0);
    let blank = 0;
    results.forEach(r=>{
      const a = r.answers ? r.answers[q.id] : undefined;
      if(a===undefined || a===null || a==='') { blank++; return; }
      const idx = Number(a);
      if(counts[idx]!==undefined) counts[idx]++;
    });
    const flags = [];
    if(p < 0.20) flags.push('صعوبة مرتفعة جدًا');
    if(p > 0.90) flags.push('سهولة مرتفعة جدًا');
    if(D!==null && D < 0) flags.push('تمييز سالب — يُراجع فورًا');
    else if(D!==null && D < 0.20) flags.push('تمييز ضعيف');
    const dead = counts.filter((c,i)=> i!==Number(q.correct) && (c/n) < 0.05).length;
    if(dead) flags.push('مموّهات غير فاعلة: '+dead);
    return {q, no:j+1, p, D, rpb, counts, blank, dead, flags};
  });
  const kr20 = (k>1 && varT>0) ? (k/(k-1))*(1 - sumPQ/varT) : null;
  const sem = (kr20!==null) ? sdT*Math.sqrt(Math.max(0, 1-kr20)) : null;
  return {items, kr20, sem, k, n, meanT, sdT, varT,
          semPct: sem!==null && k ? (sem/k)*100 : null,
          meanP: items.reduce((s,i)=>s+i.p,0)/k,
          meanD: items.reduce((s,i)=>s+(i.D||0),0)/k};
}
function reliabilityLabel(kr){
  if(kr===null || kr===undefined) return {text:'غير محسوب', cls:'gray'};
  if(kr>=0.90) return {text:'ممتاز — صالح للقرارات الفردية', cls:'green'};
  if(kr>=0.80) return {text:'جيد جدًا', cls:'green'};
  if(kr>=0.70) return {text:'مقبول للاستخدام الجماعي', cls:'amber'};
  if(kr>=0.60) return {text:'حدّي — يحتاج تحسين المفردات', cls:'amber'};
  return {text:'ضعيف — لا تُبنى عليه قرارات فردية', cls:'red'};
}

/* ---------------- التحليل الشامل ---------------- */
function buildAnalysis(opts){
  opts = opts || {};
  const examId = opts.examId || null;
  const policy = opts.policy || 'last';
  const exam = examId ? DB.exams.find(e=>e.id===examId) : null;
  const base = examId ? DB.results.filter(r=>r.examId===examId) : DB.results.slice();
  const results = applyAttemptPolicy(base, policy)
    .sort((a,b)=> new Date(a.submittedAt) - new Date(b.submittedAt));
  const scores = results.map(exactPct);
  const desc = describe(scores);
  const t = thresholds();

  const bandDefs = [
    {label:'أقل من 50%', short:'0–49', lo:-1, hi:50},
    {label:'50 – 59.9%', short:'50–59', lo:50, hi:60},
    {label:'60 – 69.9%', short:'60–69', lo:60, hi:70},
    {label:'70 – 79.9%', short:'70–79', lo:70, hi:80},
    {label:'80 – 89.9%', short:'80–89', lo:80, hi:90},
    {label:'90 – 100%', short:'90–100', lo:90, hi:101},
  ];
  const bands = bandDefs.map(b=>{
    const c = scores.filter(s=> s>=b.lo && s<b.hi).length;
    return {label:b.label, short:b.short, lo:b.lo, count:c, pct: scores.length ? (c/scores.length)*100 : 0};
  });

  /* تجميع تفصيلي من الإجابات الخام لا من النسب المدوّرة */
  const elemAgg = {}, unitAgg = {};
  results.forEach(r=>{
    attemptItems(r).forEach(it=>{
      const eid = it.q.elementId;
      if(!elemAgg[eid]) elemAgg[eid] = {correct:0, total:0};
      elemAgg[eid].total++; if(it.correct) elemAgg[eid].correct++;
      const u = unitOfElement(eid);
      const code = u ? u.code : 'غير مصنّف';
      if(!unitAgg[code]) unitAgg[code] = {correct:0, total:0, name: u?u.name:'غير مصنّف', kind: u?u.kind:'—', weight: u?Number(u.weight||0):0};
      unitAgg[code].total++; if(it.correct) unitAgg[code].correct++;
    });
  });
  const elements = Object.keys(elemAgg).map(eid=>{
    const v = elemAgg[eid];
    const u = unitOfElement(eid);
    return {eid, name: (elementOf(eid)||{}).name || eid, unit: u?u.code:'—',
            mastery: v.total ? (v.correct/v.total)*100 : 0, observations: v.total};
  }).sort((a,b)=>a.mastery-b.mastery);

  const totalWeight = Object.keys(unitAgg).reduce((s,c)=>s+unitAgg[c].weight,0) || 1;
  const units = Object.keys(unitAgg).map(code=>{
    const v = unitAgg[code];
    const mastery = v.total ? (v.correct/v.total)*100 : 0;
    const gap = Math.max(0, t.ready - mastery);
    return {code, name:v.name, kind:v.kind, weight:v.weight,
            weightShare: (v.weight/totalWeight)*100,
            mastery, gap, observations:v.total,
            priority: (v.weight/totalWeight)*gap,
            contribution: (v.weight/totalWeight)*mastery};
  }).sort((a,b)=>b.priority-a.priority);
  const weightedMastery = units.reduce((s,u)=>s+u.contribution,0);

  /* الطلاب: الرتبة والدرجة المعيارية والرتبة المئينية */
  const sortedScores = scores.slice().sort((a,b)=>a-b);
  const students = results.map(r=>{
    const st = DB.students.find(s=>s.id===r.studentId);
    const pct = exactPct(r);
    const below = sortedScores.filter(s=>s<pct).length;
    const equal = sortedScores.filter(s=>s===pct).length;
    return {
      result:r, student:st, pct,
      z: desc.sd ? (pct-desc.mean)/desc.sd : 0,
      percentile: sortedScores.length ? ((below + 0.5*equal)/sortedScores.length)*100 : 0,
      decision: decisionOf(pct),
      minutes: r.durationUsed ? r.durationUsed/60 : null,
      examName: (DB.exams.find(e=>e.id===r.examId)||{}).name || '—',
      submittedAt: r.submittedAt,
    };
  }).sort((a,b)=>b.pct-a.pct);
  students.forEach((s,i)=> s.rank = i+1);

  const readyCount = scores.filter(s=>s>=t.ready).length;
  const partialCount = scores.filter(s=>s>=t.partial && s<t.ready).length;
  const notReady = scores.filter(s=>s<t.partial).length;

  const item = (exam && results.length>=3) ? itemAnalysis(exam, results) : null;

  const times = results.map(r=>r.durationUsed).filter(x=>typeof x==='number' && x>0).map(x=>x/60);
  const timeDesc = describe(times);

  const dates = results.map(r=>r.submittedAt).filter(Boolean).sort();

  return {
    scope: exam ? exam.name : 'جميع الاختبارات المسجّلة',
    exam, policy, policyLabel: POLICY_LABEL[policy] || policy,
    results, scores, desc, bands, elements, units, weightedMastery,
    students, item, timeDesc, thresholds:t,
    counts:{ready:readyCount, partial:partialCount, notReady:notReady,
             attempts:base.length, analyzed:results.length,
             distinctStudents: Object.keys(results.reduce((o,r)=>{o[r.studentId]=1;return o;},{})).length,
             exams: Object.keys(results.reduce((o,r)=>{o[r.examId]=1;return o;},{})).length},
    readyRate: scores.length ? (readyCount/scores.length)*100 : 0,
    period: dates.length ? {from:dates[0], to:dates[dates.length-1]} : null,
  };
}

/* ---------------- رسوم SVG ---------------- */
function svgHistogram(bands, opts){
  opts = opts||{};
  const W = 620, H = 240, pad = {t:16, r:14, b:46, l:44};
  const max = Math.max(1, ...bands.map(b=>b.count));
  const bw = (W-pad.l-pad.r)/bands.length;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="Tajawal,sans-serif">';
  for(let i=0;i<=4;i++){
    const y = pad.t + (H-pad.t-pad.b)*(i/4);
    const v = Math.round(max - max*(i/4));
    s += '<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="#E4DFD1" stroke-width="1"/>';
    s += '<text x="'+(W-pad.r+6)+'" y="'+(y+4)+'" font-size="10" fill="#6B7680">'+v+'</text>';
  }
  bands.forEach((b,i)=>{
    const hgt = (H-pad.t-pad.b)*(b.count/max);
    const x = pad.l + i*bw + bw*0.16;
    const y = H-pad.b-hgt;
    const col = i>=4 ? '#2F7D4F' : (i>=2 ? '#B9791C' : '#B3462C');
    s += '<rect x="'+x+'" y="'+y+'" width="'+(bw*0.68)+'" height="'+Math.max(1,hgt)+'" rx="4" fill="'+col+'" opacity="0.88"/>';
    if(b.count) s += '<text x="'+(x+bw*0.34)+'" y="'+(y-5)+'" font-size="11" font-weight="700" text-anchor="middle" fill="#152B35">'+b.count+'</text>';
    s += '<text x="'+(x+bw*0.34)+'" y="'+(H-pad.b+18)+'" font-size="10" text-anchor="middle" fill="#6B7680" direction="ltr">'+(b.short||b.label)+'</text>';
  });
  s += '<line x1="'+pad.l+'" y1="'+(H-pad.b)+'" x2="'+(W-pad.r)+'" y2="'+(H-pad.b)+'" stroke="#152B35" stroke-width="1.2"/>';
  s += '<text x="'+(W/2)+'" y="'+(H-8)+'" font-size="10.5" text-anchor="middle" fill="#6B7680" direction="rtl">'+(opts.xlabel||'فئات الدرجة (%)')+'</text>';
  s += '</svg>';
  return s;
}
function trimLabel(txt, n){
  const t = String(txt||'');
  if(t.length<=n) return t;
  return t.slice(0,n).replace(/[\s(\[\-–—]+$/,'')+'…';
}
function svgUnitBars(units, cut){
  const rows = units.slice().sort((a,b)=>a.mastery-b.mastery);
  const rowH = 25, W = 660, pad = {t:14, r:14, b:26, l:212};
  const H = pad.t + pad.b + rows.length*rowH;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="Tajawal,sans-serif">';
  const plotW = W - pad.l - pad.r;
  [0,25,50,75,100].forEach(v=>{
    const x = W - pad.r - plotW*(v/100);
    s += '<line x1="'+x+'" y1="'+pad.t+'" x2="'+x+'" y2="'+(H-pad.b)+'" stroke="#EFEBE0" stroke-width="1"/>';
    s += '<text x="'+x+'" y="'+(H-pad.b+16)+'" font-size="9.5" text-anchor="middle" fill="#6B7680" direction="ltr">'+v+'%</text>';
  });
  const xc = W - pad.r - plotW*(cut/100);
  s += '<line x1="'+xc+'" y1="'+pad.t+'" x2="'+xc+'" y2="'+(H-pad.b)+'" stroke="#C08A2E" stroke-width="1.4" stroke-dasharray="4 3"/>';
  rows.forEach((u,i)=>{
    const y = pad.t + i*rowH + 4;
    const w = plotW*(u.mastery/100);
    const col = u.mastery>=cut ? '#2F7D4F' : (u.mastery>=cut-20 ? '#B9791C' : '#B3462C');
    s += '<rect x="'+(W-pad.r-w)+'" y="'+y+'" width="'+Math.max(1,w)+'" height="'+(rowH-10)+'" rx="3" fill="'+col+'" opacity="0.9"/>';
    s += '<text x="'+(pad.l-10)+'" y="'+(y+11)+'" font-size="10.5" text-anchor="end" fill="#152B35" direction="rtl">'+String(u.name).slice(0,30)+'</text>';
    s += '<text x="6" y="'+(y+11)+'" font-size="9.5" text-anchor="start" fill="#6B7680" direction="ltr">'+u.code+'</text>';
    s += '<text x="'+(W-pad.r-w-7)+'" y="'+(y+11)+'" font-size="10" text-anchor="end" fill="#152B35" font-weight="700" direction="ltr">'+u.mastery.toFixed(1)+'%</text>';
  });
  s += '</svg>';
  return s;
}
function svgPriorityMap(units, cut){
  const W = 620, H = 330, pad = {t:18, r:24, b:44, l:52};
  const maxW = Math.max(1, ...units.map(u=>u.weightShare));
  let s = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="Tajawal,sans-serif">';
  const px = v => W - pad.r - (W-pad.l-pad.r)*(v/100);                 /* الإتقان: من اليمين لليسار */
  const py = v => (H-pad.b) - (H-pad.t-pad.b)*(v/maxW);                /* الوزن */
  s += '<rect x="'+pad.l+'" y="'+pad.t+'" width="'+(W-pad.l-pad.r)+'" height="'+(H-pad.t-pad.b)+'" fill="#FBF9F4" stroke="#E4DFD1"/>';
  s += '<rect x="'+px(cut)+'" y="'+pad.t+'" width="'+(px(0)-px(cut))+'" height="'+((H-pad.b)-pad.t)/2+'" fill="#FBE7E0" opacity="0.55"/>';
  s += '<text x="'+(px(cut)+8)+'" y="'+(pad.t+16)+'" font-size="10" fill="#B3462C">منطقة التدخّل العاجل (وزن مرتفع وإتقان منخفض)</text>';
  s += '<line x1="'+px(cut)+'" y1="'+pad.t+'" x2="'+px(cut)+'" y2="'+(H-pad.b)+'" stroke="#C08A2E" stroke-width="1.3" stroke-dasharray="4 3"/>';
  [0,25,50,75,100].forEach(v=>{
    s += '<text x="'+px(v)+'" y="'+(H-pad.b+16)+'" font-size="9.5" text-anchor="middle" fill="#6B7680" direction="ltr">'+v+'%</text>';
  });
  const labelled = units.slice(0,5).map(u=>u.code);
  units.forEach((u,i)=>{
    const x = px(u.mastery), y = py(u.weightShare);
    const col = u.mastery>=cut ? '#2F7D4F' : (u.mastery>=cut-20 ? '#B9791C' : '#B3462C');
    const rad = 5 + (u.weightShare/maxW)*7;
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+rad.toFixed(1)+'" fill="'+col+'" opacity="0.7" stroke="#fff" stroke-width="1.2"/>';
    if(labelled.indexOf(u.code)>=0){
      const dy = [-(rad+6), (rad+12), -(rad+16)][i%3];
      s += '<text x="'+x.toFixed(1)+'" y="'+(y+dy).toFixed(1)+'" font-size="9" text-anchor="middle" fill="#152B35" font-weight="700" direction="ltr">'+u.code+'</text>';
    }
  });
  s += '<text x="'+(W/2)+'" y="'+(H-8)+'" font-size="10.5" text-anchor="middle" fill="#6B7680">نسبة الإتقان ←</text>';
  s += '<text x="16" y="'+(H/2)+'" font-size="10.5" text-anchor="middle" fill="#6B7680" transform="rotate(-90 16 '+(H/2)+')">الوزن النسبي للمقرر</text>';
  s += '</svg>';
  return s;
}
function svgTrend(points){
  const W = 620, H = 210, pad = {t:16, r:20, b:38, l:44};
  if(points.length<2) return '';
  let s = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="Tajawal,sans-serif">';
  const px = i => W - pad.r - (W-pad.l-pad.r)*(i/(points.length-1));
  const py = v => (H-pad.b) - (H-pad.t-pad.b)*(v/100);
  [0,50,80,100].forEach(v=>{
    s += '<line x1="'+pad.l+'" y1="'+py(v)+'" x2="'+(W-pad.r)+'" y2="'+py(v)+'" stroke="'+(v===80?'#C08A2E':'#EFEBE0')+'" stroke-width="1" '+(v===80?'stroke-dasharray="4 3"':'')+'/>';
    s += '<text x="'+(pad.l-8)+'" y="'+(py(v)+4)+'" font-size="9.5" text-anchor="end" fill="#6B7680">'+v+'%</text>';
  });
  let d = '';
  points.forEach((p,i)=>{ d += (i?' L ':'M ')+px(i).toFixed(1)+' '+py(p.value).toFixed(1); });
  s += '<path d="'+d+'" fill="none" stroke="#1F3F4D" stroke-width="2"/>';
  points.forEach((p,i)=>{
    s += '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p.value).toFixed(1)+'" r="4" fill="#C08A2E"/>';
    s += '<text x="'+px(i).toFixed(1)+'" y="'+(H-pad.b+15)+'" font-size="9" text-anchor="middle" fill="#6B7680">'+String(p.label).slice(0,14)+'</text>';
  });
  s += '</svg>';
  return s;
}

/* ---------------- عناصر واجهة مساعدة ---------------- */
function kpi(value, label, cls){
  return h('div',{class:'kpi'+(cls?' kpi-'+cls:'')},
    h('b',{}, String(value)), h('span',{}, label));
}
function dataTable(headers, rows, opts){
  opts = opts||{};
  const t = h('table',{});
  t.appendChild(h('thead',{}, h('tr',{}, ...headers.map(x=>h('th',{}, x)))));
  const tb = h('tbody',{});
  if(!rows.length) tb.appendChild(h('tr',{}, h('td',{colspan:String(headers.length)}, h('div',{class:'empty-state'},'لا توجد بيانات'))));
  rows.forEach(r=>{
    tb.appendChild(h('tr',{}, ...r.map(c=>
      (c && c.nodeType) ? h('td',{}, c) : h('td',{}, String(c===null||c===undefined?'—':c))
    )));
  });
  t.appendChild(tb);
  return h('div',{class:'table-wrap'+(opts.card===false?'':' card')}, opts.title? h('div',{style:'font-weight:800;margin-bottom:10px'}, opts.title):null, t);
}
function flagChip(text){
  const warn = /ضعيف|سالب|غير فاعلة/.test(text);
  return h('span',{class:'flag'+(warn?'':' warn')}, text);
}

    wrap.appendChild(h('div',{class:'card empty-state'},'لا تملك صلاحية الاطلاع على هذه الصفحة.'));

  }

  const selExam = h('select',{class:'search-input', style:'min-width:260px'},
    h('option',{value:''},'كل الاختبارات مجتمعة'),
    ...DB.exams.map(e=>h('option',{value:e.id}, e.name)));
  const selPolicy = h('select',{class:'search-input', style:'min-width:200px'},
    h('option',{value:'last'},'آخر محاولة لكل طالب'),

  const body = h('div',{});

    }
    const d = A.desc, t = A.thresholds;

    /* --- المؤشرات الرئيسية --- */
    body.appendChild(h('div',{class:'kpi-grid'},
      kpi(A.counts.analyzed, 'محاولات داخلة في التحليل'),
      kpi(A.counts.distinctStudents, 'طلاب مختلفون'),
      kpi(fx(d.mean,2)+'%', 'المتوسط الحسابي'),
      kpi('± '+fx(d.sd,2), 'الانحراف المعياري'),
      kpi(fx(d.median,2)+'%', 'الوسيط'),
      kpi(fx(A.readyRate,1)+'%', 'بلغوا حد الجاهزية ('+t.ready+'%)'),
    ));

    /* --- الإحصاء الوصفي الكامل --- */
    body.appendChild(dataTable(
      ['المؤشر','القيمة','الدلالة العملية'],
      [
        ['حجم العينة (n)', A.counts.analyzed, 'عدد المحاولات وفق سياسة: '+A.policyLabel],
        ['المتوسط الحسابي', fx(d.mean,2)+'%', 'مستوى الأداء العام للمجموعة'],
        ['فاصل الثقة 95% للمتوسط', fx(d.ci95[0],2)+'% – '+fx(d.ci95[1],2)+'%', 'المدى المرجّح لمتوسط المجتمع الطلابي'],
        ['الخطأ المعياري للمتوسط', '± '+fx(d.se,3), 'دقة تقدير المتوسط'],
        ['الوسيط', fx(d.median,2)+'%', 'أقل تأثرًا بالقيم المتطرفة من المتوسط'],
        ['الانحراف المعياري', fx(d.sd,2), 'تشتّت الأداء حول المتوسط'],
        ['معامل الاختلاف', fx(d.cv,2)+'%', d.cv>30? 'تجانس منخفض — الفجوة بين الطلاب واسعة' : 'تجانس مقبول للمجموعة'],
        ['الربيع الأول / الثالث', fx(d.q1,2)+'% / '+fx(d.q3,2)+'%', 'المدى الربيعي: '+fx(d.iqr,2)+' نقطة'],
        ['أدنى / أعلى درجة', fx(d.min,2)+'% / '+fx(d.max,2)+'%', 'المدى: '+fx(d.range,2)+' نقطة'],
        ['معامل الالتواء', fx(d.skew,3), d.skew<-0.5? 'تركّز في الدرجات المرتفعة' : (d.skew>0.5? 'تركّز في الدرجات المنخفضة' : 'توزيع شبه متماثل')],
        ['معامل التفرطح', fx(d.kurt,3), Math.abs(d.kurt)<1? 'قريب من الاعتدالي' : (d.kurt>0? 'تجمّع حاد حول المركز' : 'توزيع مفلطح')],
      ], {title:'الإحصاء الوصفي التفصيلي'}));

    /* --- التوزيع --- */
    const cardHist = h('div',{class:'card', style:'margin-top:16px'});
    cardHist.appendChild(h('div',{style:'font-weight:800;margin-bottom:10px'},'توزيع الدرجات على الفئات'));
    cardHist.appendChild(h('div',{html: svgHistogram(A.bands)}));
    body.appendChild(cardHist);

    body.appendChild(dataTable(
      ['فئة الدرجة','عدد الطلاب','النسبة','التصنيف'],
      A.bands.map(b=>[b.label, b.count, fx(b.pct,1)+'%',
        b.lo>=t.ready ? 'ضمن الجاهزية' : (b.lo>=t.partial ? 'شبه جاهز' : 'دون حد التمكّن')]),
      {title:'جدول التوزيع التكراري'}));

    /* --- فئات القرار --- */
    body.appendChild(h('div',{class:'kpi-grid', style:'margin-top:16px'},
      kpi(A.counts.ready, 'جاهز (≥ '+t.ready+'%)'),
      kpi(A.counts.partial, 'شبه جاهز ('+t.partial+'–'+(t.ready-0.1).toFixed(1)+'%)'),
      kpi(A.counts.notReady, 'غير جاهز (< '+t.partial+'%)'),
      kpi(fx(A.weightedMastery,2)+'%', 'الإتقان المرجّح بأوزان ETEC'),
    ));

    /* --- جودة الأداة --- */
    if(A.item){
      const rl = reliabilityLabel(A.item.kr20);
      const relCard = h('div',{class:'card', style:'margin-top:16px'});
      relCard.appendChild(h('div',{style:'font-weight:800;margin-bottom:10px'},'جودة أداة القياس (القياس النفسي)'));
      relCard.appendChild(h('div',{class:'kpi-grid'},
        kpi(fx(A.item.kr20,3), 'معامل الثبات KR-20'),
        kpi('± '+fx(A.item.sem,2), 'الخطأ المعياري للقياس (درجة)'),
        kpi('± '+fx(A.item.semPct,2)+'%', 'الخطأ المعياري كنسبة'),
        kpi(fx(A.item.meanP,3), 'متوسط معامل السهولة'),
        kpi(fx(A.item.meanD,3), 'متوسط معامل التمييز'),
        kpi(A.item.k, 'عدد المفردات'),
      ));
      relCard.appendChild(h('div',{style:'margin-top:12px'},
        h('span',{class:'badge badge-'+rl.cls}, 'تفسير الثبات: '+rl.text)));
      relCard.appendChild(h('div',{class:'mini-note', style:'margin-top:10px'},
        'يُقرأ الخطأ المعياري للقياس هكذا: درجة الطالب الحقيقية تقع — باحتمال 95% — ضمن نطاق ± '
        + fx(A.item.semPct*1.96,2) + '% حول درجته الظاهرة. ولذلك لا يُتخذ قرار فردي حاسم بفارق أصغر من هذا النطاق.'));
      body.appendChild(relCard);

      /* --- تحليل المفردات --- */
      const flagged = A.item.items.filter(i=>i.flags.length);
      const itemsSorted = A.item.items.slice().sort((a,b)=>(a.D===null?9:a.D)-(b.D===null?9:b.D));
      body.appendChild(dataTable(
        ['#','المقرر','نص المفردة','السهولة p','التمييز D','الارتباط الثنائي r','مؤشرات'],
        itemsSorted.map(i=>[
          i.no,
          (unitOfElement(i.q.elementId)||{}).code || '—',
          String(i.q.text).slice(0,60)+(String(i.q.text).length>60?'…':''),
          fx(i.p,3), fx(i.D,3), fx(i.rpb,3),
          i.flags.length ? h('div',{}, ...i.flags.map(flagChip)) : h('span',{class:'flag ok'},'سليمة')
        ]),
        {title:'تحليل المفردات — مرتّبة تصاعديًا بمعامل التمييز ('+flagged.length+' مفردة تحتاج مراجعة من أصل '+A.item.k+')'}));

      /* --- تحليل المموّهات --- */
      const distractorCard = h('div',{class:'card', style:'margin-top:16px'});
      distractorCard.appendChild(h('div',{style:'font-weight:800;margin-bottom:6px'},'تحليل المموّهات للمفردات المُعلّمة'));
      distractorCard.appendChild(h('div',{class:'mini-note', style:'margin-bottom:12px'},
        'المموّه غير الفاعل هو خيار خاطئ اختاره أقل من 5% من الطلاب؛ وجوده يجعل السؤال أسهل مما يبدو ويضعف تمييزه.'));
      if(!flagged.length) distractorCard.appendChild(h('div',{class:'empty-state'},'لا توجد مفردات مُعلّمة في هذا الاختبار.'));
      flagged.slice(0,20).forEach(i=>{
        const box = h('div',{style:'border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px'});
        box.appendChild(h('div',{style:'font-weight:700;font-size:13px;margin-bottom:6px'}, 'س'+i.no+' — '+String(i.q.text).slice(0,90)));

          box.appendChild(h('div',{class:'elem-row'},
            h('div',{class:'er-name', style: isKey?'font-weight:800':''}, (isKey?'✔ ':'') + String(opt).slice(0,54)),
            h('div',{class:'er-bar'}, pctBar(share)),
            h('div',{class:'er-pct'}, fx(share,1)+'%')));
        });
        if(i.blank) box.appendChild(h('div',{class:'mini-note'},'متروك دون إجابة: '+i.blank+' طالب'));
        distractorCard.appendChild(box);
      });
      body.appendChild(distractorCard);
    } else {
      body.appendChild(h('div',{class:'card mini-note', style:'margin-top:16px'},
        'تحليل المفردات ومعامل الثبات يتطلبان اختيار اختبار محدّد وتوفّر ثلاث محاولات فأكثر عليه.'));
    }

    unitCard.appendChild(h('div',{html: svgUnitBars(A.units, t.ready)}));
    body.appendChild(unitCard);

    body.appendChild(dataTable(
      ['الترتيب','الرمز','المقرر','النوع','الوزن','الوزن النسبي','الإتقان','الفجوة','مؤشر الأولوية','عدد الملاحظات'],
      A.units.map((u,i)=>[
        i+1, u.code, u.name, u.kind, u.weight, fx(u.weightShare,2)+'%',
        h('span',{class:'badge badge-'+decisionClass(u.mastery)}, fx(u.mastery,2)+'%'),
        fx(u.gap,2), fx(u.priority,3), u.observations
      ]),
      {title:'مصفوفة أولويات التدخل — مؤشر الأولوية = الوزن النسبي × الفجوة عن حد الجاهزية'}));

    const mapCard = h('div',{class:'card', style:'margin-top:16px'});
    mapCard.appendChild(h('div',{style:'font-weight:800;margin-bottom:10px'},'خريطة الأولوية: الوزن مقابل الإتقان'));
    mapCard.appendChild(h('div',{html: svgPriorityMap(A.units, t.ready)}));
    mapCard.appendChild(h('div',{class:'mini-note'},'تُسمّى أعلى خمسة مقررات أولويةً فقط تفاديًا لتزاحم التسميات؛ التفاصيل الكاملة في الجدول أعلاه.'));
    body.appendChild(mapCard);

    /* --- أضعف العناصر --- */
    body.appendChild(dataTable(
      ['المقرر','الموضوع التفصيلي','الإتقان','عدد الملاحظات'],
      A.elements.slice(0,15).map(e=>[e.unit, e.name,
        h('span',{class:'badge badge-'+decisionClass(e.mastery)}, fx(e.mastery,2)+'%'), e.observations]),
      {title:'أضعف خمسة عشر موضوعًا تفصيليًا'}));

    /* --- الطلاب --- */
    body.appendChild(dataTable(
      ['الرتبة','الرقم الجامعي','الطالب','الدرجة','الدرجة المعيارية z','الرتبة المئينية','القرار','الزمن (د)','تاريخ التسليم'],
      A.students.map(s=>[
        s.rank, maskUid(s.student), maskName(s.student),
        h('span',{class:'badge badge-'+decisionClass(s.pct)}, fx(s.pct,2)+'%'),
        fx(s.z,2), fx(s.percentile,1), s.decision,
        s.minutes!==null? fx(s.minutes,1) : '—',
        new Date(s.submittedAt).toLocaleString('ar-SA')
      ]),
      {title:'ترتيب الطلاب ومواقعهم النسبية'}));

    if(A.timeDesc.n){
      body.appendChild(h('div',{class:'card mini-note', style:'margin-top:16px'},
        'زمن الأداء: المتوسط '+fx(A.timeDesc.mean,1)+' دقيقة (الوسيط '+fx(A.timeDesc.median,1)+
        '، المدى '+fx(A.timeDesc.min,1)+'–'+fx(A.timeDesc.max,1)+'). '+
        (A.exam ? 'المدة المقرّرة '+A.exam.duration+' دقيقة، أي أن المتوسط يمثل '+fx((A.timeDesc.mean/A.exam.duration)*100,1)+'% منها.' : '')));
    }

    /* --- أدوات التصدير --- */
    const tools = h('div',{class:'toolbar no-print', style:'margin-top:16px'});
    const btns = h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'});
    btns.appendChild(h('button',{class:'btn btn-gold btn-sm', onclick:()=>{
      if(!requirePerm('result.export')) return;
      exportAnalyticsWorkbook(A);
      logAction('تصدير تحليل احترافي', A.scope);
    }},'⭱ تصدير التحليل الكامل Excel'));
    btns.appendChild(h('button',{class:'btn btn-outline btn-sm', onclick:()=>{
      if(!requirePerm('report.supervisor')) return;
      go('doctor',{view:'supervisor-report'});
    }},'📄 توليد تقرير المسؤول المباشر'));
    tools.appendChild(btns);
    body.appendChild(tools);
  }
  selExam.addEventListener('change', draw);
  selPolicy.addEventListener('change', draw);
  draw();
  wrap.appendChild(body);
  return wrap;
}

/* =================== تصدير التحليل إلى Excel =================== */
function exportAnalyticsWorkbook(A){
  const d = A.desc, t = A.thresholds;
  const summary = [
    {المؤشر:'نطاق التحليل', القيمة:A.scope},
    {المؤشر:'سياسة احتساب المحاولات', القيمة:A.policyLabel},
    {المؤشر:'عدد المحاولات المحلّلة', القيمة:A.counts.analyzed},
    {المؤشر:'عدد الطلاب المختلفين', القيمة:A.counts.distinctStudents},
    {المؤشر:'المتوسط الحسابي %', القيمة:rnd(d.mean,2)},
    {المؤشر:'الانحراف المعياري', القيمة:rnd(d.sd,2)},
    {المؤشر:'الخطأ المعياري للمتوسط', القيمة:rnd(d.se,3)},
    {المؤشر:'الحد الأدنى لفاصل الثقة 95%', القيمة:rnd(d.ci95[0],2)},
    {المؤشر:'الحد الأعلى لفاصل الثقة 95%', القيمة:rnd(d.ci95[1],2)},
    {المؤشر:'الوسيط %', القيمة:rnd(d.median,2)},
    {المؤشر:'الربيع الأول %', القيمة:rnd(d.q1,2)},
    {المؤشر:'الربيع الثالث %', القيمة:rnd(d.q3,2)},
    {المؤشر:'المدى الربيعي', القيمة:rnd(d.iqr,2)},
    {المؤشر:'أدنى درجة %', القيمة:rnd(d.min,2)},
    {المؤشر:'أعلى درجة %', القيمة:rnd(d.max,2)},
    {المؤشر:'معامل الاختلاف %', القيمة:rnd(d.cv,2)},
    {المؤشر:'معامل الالتواء', القيمة:rnd(d.skew,3)},
    {المؤشر:'معامل التفرطح', القيمة:rnd(d.kurt,3)},
    {المؤشر:'حد الجاهزية المعتمد %', القيمة:t.ready},
    {المؤشر:'نسبة بالغي حد الجاهزية %', القيمة:rnd(A.readyRate,2)},
    {المؤشر:'الإتقان المرجّح بأوزان ETEC %', القيمة:rnd(A.weightedMastery,2)},
    {المؤشر:'تاريخ إصدار التحليل', القيمة:new Date().toLocaleString('ar-SA')},
    {المؤشر:'إصدار النظام', القيمة:DB.meta.version},
  ];
  const sheets = [
    ['الملخص الإحصائي', summary],
    ['التوزيع التكراري', A.bands.map(b=>({الفئة:b.label, العدد:b.count, النسبة_المئوية:rnd(b.pct,2)}))],
    ['نتائج الطلاب', A.students.map(s=>({
      الرتبة:s.rank, الرقم_الجامعي:maskUid(s.student), الطالب:maskName(s.student),
      الاختبار:s.examName, الدرجة_المئوية:rnd(s.pct,2),
      الإجابات_الصحيحة:s.result.correct, عدد_الأسئلة:s.result.total,
      الدرجة_المعيارية:rnd(s.z,3), الرتبة_المئينية:rnd(s.percentile,2),
      القرار:s.decision, الزمن_بالدقائق: s.minutes!==null? rnd(s.minutes,2):'',
      تاريخ_التسليم:new Date(s.submittedAt).toLocaleString('ar-SA')
    }))],
    ['إتقان المقررات', A.units.map((u,i)=>({
      الترتيب:i+1, الرمز:u.code, المقرر:u.name, النوع:u.kind,
      الوزن:u.weight, الوزن_النسبي:rnd(u.weightShare,2),
      الإتقان:rnd(u.mastery,2), الفجوة:rnd(u.gap,2),
      مؤشر_الأولوية:rnd(u.priority,3), عدد_الملاحظات:u.observations
    }))],
    ['إتقان الموضوعات', A.elements.map(e=>({
      المقرر:e.unit, الموضوع:e.name, الإتقان:rnd(e.mastery,2), عدد_الملاحظات:e.observations
    }))],
  ];
  if(A.item){
    sheets.push(['مؤشرات الثبات', [{
      معامل_الثبات_KR20: rnd(A.item.kr20,4),
      التفسير: reliabilityLabel(A.item.kr20).text,
      الخطأ_المعياري_للقياس_درجة: rnd(A.item.sem,3),
      الخطأ_المعياري_نسبة: rnd(A.item.semPct,3),
      نطاق_الثقة_95_للدرجة_الفردية: '± '+fx(A.item.semPct*1.96,2)+'%',
      عدد_المفردات: A.item.k,
      عدد_المستجيبين: A.item.n,
      متوسط_السهولة: rnd(A.item.meanP,3),
      متوسط_التمييز: rnd(A.item.meanD,3),
    }]]);
    sheets.push(['تحليل المفردات', A.item.items.map(i=>({
      رقم_المفردة:i.no,
      المقرر:(unitOfElement(i.q.elementId)||{}).code||'',
      الموضوع:(elementOf(i.q.elementId)||{}).name||'',
      نص_المفردة:i.q.text,
      معامل_السهولة:rnd(i.p,3),
      معامل_التمييز:rnd(i.D,3),
      الارتباط_الثنائي:rnd(i.rpb,3),
      عدد_المموهات_غير_الفاعلة:i.dead,
      متروك_دون_إجابة:i.blank,
      المؤشرات:i.flags.join(' | ') || 'سليمة',
      القرار_المقترح: i.flags.some(f=>/سالب/.test(f)) ? 'حذف أو إعادة صياغة'
                      : (i.flags.length ? 'مراجعة' : 'إبقاء')
    }))]);
    const dist = [];
    A.item.items.forEach(i=>{
      (i.q.options||[]).forEach((opt,idx)=>{
        dist.push({
          رقم_المفردة:i.no, الخيار:['أ','ب','ج','د','هـ','و'][idx]||String(idx+1),
          نص_الخيار:opt, هل_هو_المفتاح: idx===Number(i.q.correct)?'نعم':'لا',
          عدد_المختارين:i.counts[idx],
          النسبة: rnd(A.item.n? (i.counts[idx]/A.item.n)*100 : 0, 2)
        });
      });
      dist.push({رقم_المفردة:i.no, الخيار:'—', نص_الخيار:'متروك دون إجابة', هل_هو_المفتاح:'لا',
                 عدد_المختارين:i.blank, النسبة: rnd(A.item.n? (i.blank/A.item.n)*100:0,2)});
    });
    sheets.push(['تحليل المموهات', dist]);
  }
  writeWorkbook(sheets, 'التحليل_الاحترافي_'+stamp()+'.xlsx');
}

function viewAudit(){
  const wrap = h('div',{});
  wrap.appendChild(topbar('سجل العمليات', 'كل إجراء مؤثّر في النظام مسجّل بالفاعل والوقت — حصريًا لمالك النظام'));
  const search = h('input',{class:'search-input', placeholder:'بحث في الإجراء أو الفاعل...'});
  const tools = h('div',{class:'toolbar'},
    search,
    h('div',{style:'display:flex;gap:8px'},
      h('button',{class:'btn btn-outline btn-sm', onclick:()=>{
        writeWorkbook([['سجل العمليات', (DB.audit||[]).slice().reverse().map(l=>({
          التاريخ:new Date(l.at).toLocaleString('ar-SA'), الفاعل:l.actor, الدور:l.role,
          الإجراء:l.action, التفاصيل:l.detail
        }))]], 'سجل_العمليات_'+stamp()+'.xlsx');
      }},'⭱ تصدير السجل'),
      h('button',{class:'btn btn-danger btn-sm', onclick:async()=>{
        if(!confirm('مسح سجل العمليات بالكامل؟ لا يمكن التراجع.')) return;
        DB.audit = []; await persist(); render();
      }},'مسح السجل')));
  wrap.appendChild(tools);
  const box = h('div',{});
  function draw(){
    box.innerHTML='';
    const q = search.value.trim();
    const rows = (DB.audit||[]).slice().reverse()
      .filter(l=> !q || (l.action+' '+l.actor+' '+l.detail).indexOf(q)>=0)
      .slice(0,400);
    box.appendChild(dataTable(['التاريخ والوقت','الفاعل','الدور','الإجراء','التفاصيل'],
      rows.map(l=>[new Date(l.at).toLocaleString('ar-SA'), l.actor,
        l.role==='owner'?'مالك':'دكتور', l.action, l.detail]),
      {title:'آخر '+rows.length+' عملية'}));
  }
  search.addEventListener('input', draw);
  draw();
  wrap.appendChild(box);
  return wrap;
}

function hijri(dt){
  try{ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',
    {day:'numeric', month:'long', year:'numeric'}).format(dt); }
  catch(e){ return ''; }
}
function greg(dt){
  try{ return new Intl.DateTimeFormat('ar-EG',{day:'2-digit', month:'long', year:'numeric'}).format(dt); }
  catch(e){ return dt.toLocaleDateString(); }
}
function nextReportNo(){
  const n = (DB.meta.reportSeq || 0) + 1;
  return n;
}
function narrativeFindings(A){
  const d = A.desc, t = A.thresholds, out = [];
  out.push('شمل القياس '+A.counts.analyzed+' محاولة اختبارية لعدد '+A.counts.distinctStudents+
    ' طالبًا موزّعة على '+A.counts.exams+' اختبار، واحتُسبت وفق سياسة «'+A.policyLabel+'».'+
    (A.period ? ' وامتدت فترة القياس من '+greg(new Date(A.period.from))+' إلى '+greg(new Date(A.period.to))+'.' : ''));
  out.push('بلغ متوسط الأداء العام '+fx(d.mean,2)+'% بانحراف معياري قدره '+fx(d.sd,2)+
    ' ووسيط '+fx(d.median,2)+'%، ويقع متوسط المجتمع الطلابي — بثقة 95% — بين '+
    fx(d.ci95[0],2)+'% و'+fx(d.ci95[1],2)+'%.');
  out.push('بلغ معامل الاختلاف '+fx(d.cv,2)+'%، وهو ما يشير إلى '+
    (d.cv>30? 'تشتّت مرتفع في مستويات الطلاب يستدعي معالجة تعليمية متمايزة بدل المعالجة الموحّدة'
            : 'تجانس مقبول في مستوى المجموعة يسمح بمعالجة تعليمية موحّدة')+'.');
  out.push('حقّق '+A.counts.ready+' طالبًا حدَّ الجاهزية المعتمد ('+t.ready+'%) بنسبة '+
    fx(A.readyRate,2)+'% من المقيسين، فيما وقع '+A.counts.partial+' طالبًا في النطاق شبه الجاهز و'+
    A.counts.notReady+' طالبًا دون حد التمكّن الأدنى ('+t.partial+'%).');
  out.push('وباحتساب الإتقان مرجّحًا بأوزان الوحدات المعرفية المعتمدة في وثيقة مخرجات التعلم، بلغ مؤشر الإتقان المرجّح '+
    fx(A.weightedMastery,2)+'%، '+(A.weightedMastery>=t.ready? 'وهو ضمن النطاق المستهدف'
      : 'أي بفجوة قدرها '+fx(t.ready-A.weightedMastery,2)+' نقطة عن المستهدف')+'.');
  if(A.item){
    const rl = reliabilityLabel(A.item.kr20);
    out.push('على مستوى جودة الأداة، بلغ معامل الثبات (KR-20) قيمة '+fx(A.item.kr20,3)+
      ' وهو مستوى '+rl.text+'، بخطأ معياري للقياس مقداره '+fx(A.item.semPct,2)+
      '% من الدرجة الكلية؛ ما يعني أن أي فارق بين طالبين أقل من '+fx(A.item.semPct*1.96,2)+
      '% لا يُعدّ فارقًا حقيقيًا دالًّا.');
    const bad = A.item.items.filter(i=>i.flags.length).length;
    out.push('وأظهر تحليل المفردات أن '+bad+' مفردة من أصل '+A.item.k+' ('+
      fx((bad/A.item.k)*100,1)+'%) تحتاج مراجعة فنية، منها '+
      A.item.items.filter(i=>i.flags.some(f=>/سالب/.test(f))).length+
      ' مفردة ذات تمييز سالب يوصى بسحبها من البنك فورًا.');
  }
  const worst = A.units.slice(0,3);
  if(worst.length){
    out.push('وتتصدّر أولويات التدخّل المقررات التالية بحسب مؤشر الأولوية (الوزن النسبي × الفجوة): '+
      worst.map(u=>u.code+' «'+u.name+'» بإتقان '+fx(u.mastery,1)+'% وفجوة '+fx(u.gap,1)+' نقطة').join('، ')+'.');
  }
  return out;
}
function narrativeRecommendations(A){
  const t = A.thresholds, recs = [];
  A.units.filter(u=>u.gap>0).slice(0,4).forEach(u=>{
    recs.push('تخصيص برنامج تقوية مركّز في مقرر '+u.code+' — '+u.name+
      ' (الإتقان الحالي '+fx(u.mastery,1)+'%)، يستهدف رفعه إلى '+t.ready+
      '% خلال فصل دراسي، مع قياس بعدي على نفس مفردات البلوبرنت للتحقق من الأثر.');
  });
  const weakElems = A.elements.filter(e=>e.mastery < t.partial).slice(0,5);
  if(weakElems.length){
    recs.push('إعادة تدريس الموضوعات التفصيلية الأدنى إتقانًا وهي: '+
      weakElems.map(e=>'«'+e.name+'» ('+fx(e.mastery,1)+'%)').join('، ')+
      '، لأنها تقع دون حد التمكّن الأدنى وتؤثر مباشرة في الأداء الكلي.');
  }
  if(A.counts.notReady){
    recs.push('إدراج '+A.counts.notReady+' طالبًا من فئة «غير جاهز» في خطة إرشاد أكاديمي فردية، '+
      'وربط إعادة الاختبار بإنهاء الخطة، مع متابعة الفارق بين المحاولتين إحصائيًا.');
  }
  if(A.item){
    const bad = A.item.items.filter(i=>i.flags.length).length;
    if(bad) recs.push('عرض المفردات المُعلّمة ('+bad+' مفردة) على لجنة بنك الأسئلة لمراجعة الصياغة والمموّهات، '+
      'وحذف المفردات ذات التمييز السالب قبل الدورة القادمة.');
    if(A.item.kr20!==null && A.item.kr20 < 0.70)
      recs.push('رفع عدد مفردات الاختبار وتحسين تمييزها لبلوغ معامل ثبات لا يقل عن 0.70 قبل بناء أي قرار فردي على نتائجه.');
  }
  if(A.desc.cv > 30)
    recs.push('اعتماد مسارين تعليميين متمايزين (مسار تقوية ومسار إتقان متقدّم) نظرًا لاتساع التشتّت بين الطلاب.');
  recs.push('اعتماد قياس دوري كل فصل دراسي بنفس الأداة والأوزان لبناء سلسلة زمنية تسمح بقياس أثر التدخلات لا وصف الحالة فقط.');
  return recs;
}

function printReport(){
  const doc = document.querySelector('.report-doc');
  if(!doc){ alert('ولّد التقرير أولًا ثم اطبعه.'); return; }
  document.body.classList.add('printing-report');
  const clean = ()=>{ document.body.classList.remove('printing-report');
                      window.removeEventListener('afterprint', clean); };
  window.addEventListener('afterprint', clean);
  setTimeout(()=>{ try{ window.print(); } finally { setTimeout(clean, 1200); } }, 60);
}

      const A = buildAnalysis({examId:fExam.value||null, policy:fPolicy.value});
      if(!A.counts.analyzed){ alert('لا توجد نتائج ضمن هذا النطاق لإرسالها.'); return; }
      window.open(waLink(phone, supervisorBrief(A)), '_blank');
      logAction('إرسال ملخص للمسؤول عبر واتساب', A.scope);
    }},'📤 ملخص واتساب للمسؤول')));
  wrap.appendChild(cfgCard);
  wrap.appendChild(out);
  return wrap;
}

function supervisorBrief(A){
  const d = A.desc, t = A.thresholds;
  let m = 'تقرير موجز — '+DB.settings.university+'\n';
  m += A.scope+'\n';
  m += 'التاريخ: '+new Date().toLocaleDateString('ar-SA')+'\n\n';
  m += 'المقيسون: '+A.counts.distinctStudents+' طالبًا ('+A.counts.analyzed+' محاولة)\n';
  m += 'المتوسط: '+fx(d.mean,2)+'% ± '+fx(d.sd,2)+'\n';
  m += 'الوسيط: '+fx(d.median,2)+'%\n';
  m += 'نسبة الجاهزية (≥'+t.ready+'%): '+fx(A.readyRate,1)+'%\n';
  m += 'الإتقان المرجّح: '+fx(A.weightedMastery,2)+'%\n';
  if(A.item) m += 'ثبات الأداة KR-20: '+fx(A.item.kr20,3)+'\n';
  m += '\nأولويات التدخّل:\n';
  A.units.slice(0,3).forEach((u,i)=>{ m += (i+1)+'. '+u.code+' '+u.name+' — إتقان '+fx(u.mastery,1)+'%\n'; });
  m += '\nالتقرير التفصيلي مرفق.';
  return m;
}

  const sheets = [
    ['غلاف التقرير', [
      {البند:'الجهة', القيمة:DB.settings.university},
      {البند:'موضوع التقرير', القيمة:'قياس جاهزية الطلاب — '+A.scope},

      {البند:'مُعِدّ التقرير', القيمة:actorLabel()},
      {البند:'تاريخ الإصدار', القيمة:new Date().toLocaleString('ar-SA')},
      {البند:'إصدار النظام', القيمة:DB.meta.version},
      {البند:'سياسة احتساب المحاولات', القيمة:A.policyLabel},
      {البند:'حد الجاهزية %', القيمة:t.ready},
      {البند:'حد التمكّن الأدنى %', القيمة:t.partial},
    ]],
    ['المؤشرات التنفيذية', [{
      عدد_الطلاب:A.counts.distinctStudents, عدد_المحاولات:A.counts.analyzed,
      المتوسط:rnd(d.mean,2), الوسيط:rnd(d.median,2), الانحراف_المعياري:rnd(d.sd,2),
      معامل_الاختلاف:rnd(d.cv,2), أدنى:rnd(d.min,2), أعلى:rnd(d.max,2),
      نسبة_الجاهزية:rnd(A.readyRate,2), الإتقان_المرجح:rnd(A.weightedMastery,2),
      جاهز:A.counts.ready, شبه_جاهز:A.counts.partial, غير_جاهز:A.counts.notReady,
      ثبات_KR20: A.item? rnd(A.item.kr20,4):'', الخطأ_المعياري_للقياس: A.item? rnd(A.item.semPct,3):''
    }]],
    ['التوزيع', A.bands.map(b=>({الفئة:b.label, العدد:b.count, النسبة:rnd(b.pct,2)}))],
    ['أولويات التدخل', A.units.map((u,i)=>({
      الترتيب:i+1, الرمز:u.code, المقرر:u.name, الوزن_النسبي:rnd(u.weightShare,2),
      الإتقان:rnd(u.mastery,2), الفجوة:rnd(u.gap,2), مؤشر_الأولوية:rnd(u.priority,3),
      الأثر_المتوقع_عند_بلوغ_الحد:rnd(u.priority,2)
    }))],
    ['الموضوعات الأضعف', A.elements.map(e=>({
      المقرر:e.unit, الموضوع:e.name, الإتقان:rnd(e.mastery,2), عدد_الملاحظات:e.observations}))],
    ['نتائج الطلاب', A.students.map(s=>({
      الرتبة:s.rank, الرقم_الجامعي:maskUid(s.student), الطالب:maskName(s.student),
      الاختبار:s.examName, الدرجة:rnd(s.pct,2), الصحيحة:s.result.correct, من:s.result.total,
      z:rnd(s.z,3), المئين:rnd(s.percentile,2), القرار:s.decision,
      الزمن_دقيقة: s.minutes!==null?rnd(s.minutes,2):'',
      تاريخ_التسليم:new Date(s.submittedAt).toLocaleString('ar-SA')}))],
    ['النتائج والتوصيات',
      narrativeFindings(A).map((x,i)=>({النوع:'نتيجة', رقم:i+1, النص:x}))
      .concat(narrativeRecommendations(A).map((x,i)=>({النوع:'توصية', رقم:i+1, النص:x})))],
  ];
  if(A.item){
    sheets.push(['تحليل المفردات', A.item.items.map(i=>({
      رقم:i.no, المقرر:(unitOfElement(i.q.elementId)||{}).code||'',
      السهولة:rnd(i.p,3), التمييز:rnd(i.D,3), الارتباط:rnd(i.rpb,3),
      الحالة:i.flags.join(' | ')||'سليمة',
      القرار:i.flags.some(f=>/سالب/.test(f))?'حذف أو إعادة صياغة':(i.flags.length?'مراجعة':'إبقاء')}))]);
  }
  writeWorkbook(sheets, 'تقرير_المسؤول_المباشر_'+stamp()+'.xlsx');
}

function cardDoctorAccounts(){
  const card = h('div',{class:'card', style:'max-width:760px;margin-top:16px'});
  card.appendChild(h('div',{style:'font-weight:800;margin-bottom:6px'},'حسابات الدكاترة'));
  card.appendChild(h('div',{class:'mini-note', style:'margin-bottom:12px'},
    'لكل دكتور حساب مستقل باسم مستخدم وكلمة مرور خاصة به، ويمكن إيقافه دون المساس بالبقية. '+
    'الحساب المُوقَف يُمنع من الدخول فورًا، وتبقى الاختبارات والنتائج التي أنشأها محفوظة.'));
  const list = h('div',{});
  function draw(){
    list.innerHTML='';
    const docs = DB.doctors || [];
    if(!docs.length) list.appendChild(h('div',{class:'empty-state'},'لا توجد حسابات دكاترة بعد.'));
    docs.forEach(dr=>{
      const overrides = dr.overrides || {};
      const restricted = Object.keys(overrides).filter(k=>overrides[k]===false).length;
      const row = h('div',{class:'elem-row', style:'align-items:center'},
        h('div',{class:'er-name'},
          h('div',{style:'font-weight:700'}, dr.name || dr.username),
          h('div',{style:'font-size:11.5px;color:var(--muted)'},
            'المستخدم: '+dr.username+(dr.phone? ' · '+dr.phone : '')+
            (restricted? ' · قيود خاصة: '+restricted : ''))),
        h('div',{style:'display:flex;gap:6px;flex-wrap:wrap'},
          h('span',{class:'badge badge-'+(dr.active!==false?'green':'gray')}, dr.active!==false?'مفعّل':'موقوف'),
          h('button',{class:'btn btn-outline btn-sm', onclick:()=>openDoctorModal(dr, draw)},'تعديل'),
          h('button',{class:'btn btn-outline btn-sm', onclick:async()=>{
            dr.active = !(dr.active!==false);
            await persist(); logAction(dr.active?'تفعيل حساب دكتور':'إيقاف حساب دكتور', dr.username); draw();
          }}, dr.active!==false?'إيقاف':'تفعيل'),
          h('button',{class:'btn btn-danger btn-sm', onclick:async()=>{
            if(!confirm('حذف حساب «'+(dr.name||dr.username)+'» نهائيًا؟')) return;
            DB.doctors = DB.doctors.filter(x=>x.id!==dr.id);
            await persist(); logAction('حذف حساب دكتور', dr.username); draw();
          }},'حذف')));
      list.appendChild(row);
    });
  }
  draw();
  card.appendChild(list);
  card.appendChild(h('button',{class:'btn btn-gold btn-sm', style:'margin-top:12px', onclick:()=>openDoctorModal(null, draw)},'+ حساب دكتور جديد'));
  return card;

  const fPass = h('input',{value:data.password, placeholder:'كلمة المرور'});

    h('div',{class:'field'}, h('label',{},'رقم الجوال'), fPhone)));

  const boxes = {};
  const grid = h('div',{style:'display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px;max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:10px'});

  });

    h('button',{class:'btn btn-outline', onclick:()=>overlay.remove()},'إلغاء'),
    h('button',{class:'btn btn-primary', onclick:async()=>{
      if(!fName.value.trim() || !fUser.value.trim() || !fPass.value.trim()){ alert('الاسم واسم المستخدم وكلمة المرور مطلوبة.'); return; }
      const uname = fUser.value.trim();
      const clash = (DB.doctors||[]).some(x=>x.id!==data.id && x.username===uname) ||
                    (DB.ownerAuth && DB.ownerAuth.username===uname);
      if(clash){ alert('اسم المستخدم مستخدم بالفعل، اختر اسمًا آخر.'); return; }
      const overrides = {};
      Object.keys(boxes).forEach(k=>{ if(!boxes[k].checked) overrides[k] = false; });
      const rec = {id:data.id, name:fName.value.trim(), username:uname, password:fPass.value,
                   phone: normalizePhone(fPhone.value), active: data.active!==false, overrides};
      if(!Array.isArray(DB.doctors)) DB.doctors = [];
      const idx = DB.doctors.findIndex(x=>x.id===rec.id);
      if(idx>=0) DB.doctors[idx] = rec; else DB.doctors.push(rec);
      await persist();
      logAction(dr? 'تعديل حساب دكتور':'إنشاء حساب دكتور', rec.username);
      overlay.remove(); if(onDone) onDone();
    }},'حفظ')));
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

/* ============================= RENDER ROOT ============================= */
async function boot(){
  if(!DB) await loadDB();
  const saved = loadSavedAttempt();
  if(saved){
    const exam = DB.exams.find(e=>e.id===saved.examId);
    const student = DB.students.find(st=>st.id===saved.studentId);
    const left = Math.max(0, Math.round(((saved.endsAt||0) - Date.now())/1000));
    const answered = Object.keys(saved.answers||{}).length;
    if(left > 0){
      if(confirm('توجد محاولة اختبار لم تُسلَّم:\n'+exam.name+' — '+student.name+
                 '\nالمجاب عنه: '+answered+' سؤال، والوقت المتبقي: '+fmtTime(left)+
                 '\n\nهل تريد استئنافها الآن؟')){
        await resumeAttempt(saved);
        return;
      }
      clearAttempt();
    }else{
      /* انتهى الوقت والصفحة مغلقة: تُسلَّم المحاولة بما أُجيب عنه بدل ضياعها */
      EXAM_ATTEMPT = saved;
      await submitExam(true);
      return;
    }
  }
  render();
}
function render(){
  const app = el('#app');
  app.innerHTML = '';
  if(ROUTE.screen==='doctor' && ROUTE.role!=='owner' && isLicenseExpired()){
    ROUTE = {...ROUTE, screen:'login'};
  }
  if(ROUTE.screen==='login') app.appendChild(renderLogin());
  else if(ROUTE.screen==='doctor') app.appendChild(renderDoctorShell());
  else if(ROUTE.screen==='student-login') app.appendChild(renderStudentLogin());
  else if(ROUTE.screen==='student-instructions') app.appendChild(renderStudentInstructions());
  else if(ROUTE.screen==='student-exam') app.appendChild(renderStudentExam());
  else if(ROUTE.screen==='student-report') app.appendChild(renderStudentReport());
}
function go(screen, patch={}){ ROUTE = {...ROUTE, screen, ...patch}; render(); }

function renderLogin(){

  function draw(){
    wrap.innerHTML='';
    const card = h('div',{class:'login-card'});
    card.appendChild(h('div',{class:'brand'},

      h('div',{class:'brand-text'}, h('h1',{},DB.settings.systemName), h('p',{},DB.settings.university))

      h('button',{class:'role-tab'+(mode==='owner'?' active':''), onclick:()=>{mode='owner';draw();}},'مالك النظام'),
      h('button',{class:'role-tab'+(mode==='doctor'?' active':''), onclick:()=>{mode='doctor';draw();}},'دكتور'),
      h('button',{class:'role-tab'+(mode==='student'?' active':''), onclick:()=>{mode='student';draw();}},'طالب')
    );
    card.appendChild(tabs);
    const errBox = h('div',{class:'err', style:'display:none'});

    if(mode==='owner'){
      const uInput = h('input',{type:'text', placeholder:'اسم المستخدم'});
      const pInput = h('input',{type:'password', placeholder:'كلمة المرور'});
      card.appendChild(h('div',{class:'field'}, h('label',{},'اسم المستخدم'), uInput));
      card.appendChild(h('div',{class:'field'}, h('label',{},'كلمة المرور'), pInput));
      card.appendChild(h('button',{class:'btn btn-primary', onclick:()=>{
        if(uInput.value.trim()===DB.ownerAuth.username && pInput.value===DB.ownerAuth.password){
          CURRENT_USER = {role:'owner', id:'OWNER', name:DB.ownerAuth.username, username:DB.ownerAuth.username};
          logAction('تسجيل دخول', 'مالك النظام');
          go('doctor', {role:'owner', view:'overview'});
        }else{
          errBox.textContent = 'بيانات الدخول غير صحيحة';
          errBox.style.display='block';
        }
      }},'تسجيل الدخول'));
      card.appendChild(errBox);
      card.appendChild(h('div',{class:'hint'}, DB.meta.showDemoCredentials!==false
        ? '⚙️ حساب مالك النظام له كل الصلاحيات، ويتحكم بصلاحيات الدكتور والطالب. بيانات تجريبية: المستخدم «'+DB.ownerAuth.username+'» — كلمة المرور «'+DB.ownerAuth.password+'»'
        : '⚙️ حساب مالك النظام له كل الصلاحيات، ويتحكم بصلاحيات الدكتور والطالب.'));
    }else if(mode==='doctor'){
      const uInput = h('input',{type:'text', placeholder:'اسم المستخدم'});
      const pInput = h('input',{type:'password', placeholder:'كلمة المرور'});
      card.appendChild(h('div',{class:'field'}, h('label',{},'اسم المستخدم'), uInput));
      card.appendChild(h('div',{class:'field'}, h('label',{},'كلمة المرور'), pInput));
      card.appendChild(h('button',{class:'btn btn-primary', onclick:()=>{
        const uname = uInput.value.trim();
        let acc = (DB.doctors||[]).find(d=>d.username===uname && d.password===pInput.value);
        if(!acc && uname===DB.doctorAuth.username && pInput.value===DB.doctorAuth.password){
          acc = {id:'D-legacy', name:DB.doctorAuth.username, username:DB.doctorAuth.username, active:true, overrides:{}};
        }
        if(!acc){
          errBox.textContent = 'بيانات الدخول غير صحيحة';
          errBox.style.display='block';
          return;
        }
        if(acc.active===false){
          errBox.textContent = 'هذا الحساب موقوف حاليًا. الرجاء التواصل مع مالك النظام.';
          errBox.style.display='block';
          return;
        }
        if(DB.meta && DB.meta.locked){
          errBox.textContent = DB.meta.lockMessage || 'النظام مغلق مؤقتًا بقرار من مالك النظام.';
          errBox.style.display='block';
          return;
        }
        if(isLicenseExpired()){
          errBox.textContent = 'انتهت صلاحية استخدام هذا الملف بتاريخ '+DB.meta.licenseExpiry+'. الرجاء التواصل مع مالك النظام لتجديدها.';
          errBox.style.display='block';
          return;
        }
        CURRENT_USER = {role:'doctor', id:acc.id, name:acc.name, username:acc.username};
        logAction('تسجيل دخول', 'الدكتور: '+acc.username);
        go('doctor', {role:'doctor', view:'overview'});
      }},'تسجيل الدخول'));
      card.appendChild(errBox);
      if(DB.meta.showDemoCredentials!==false){
        card.appendChild(h('div',{class:'hint'}, '⚙️ بيانات تجريبية: المستخدم «'+DB.doctorAuth.username+'» — كلمة المرور «'+DB.doctorAuth.password+'»'));
      }
    }else{
      const btn = h('button',{class:'btn btn-primary', onclick:()=>{
        if(DB.meta && DB.meta.locked){
          errBox.textContent = DB.meta.lockMessage || 'النظام مغلق مؤقتًا. الرجاء مراجعة الدكتور.';
          errBox.style.display='block';
          return;
        }
        if(isLicenseExpired()){
          errBox.textContent = 'انتهت صلاحية استخدام هذا الملف. الرجاء التواصل مع الدكتور أو مالك النظام لتجديدها.';
          errBox.style.display='block';
          return;
        }
        go('student-login');
      }},'المتابعة إلى دخول الاختبار');
      card.appendChild(h('div',{style:'font-size:13.5px;color:var(--muted);line-height:1.9;margin:6px 0 18px;'},
        'يدخل الطالب برقمه الجامعي والرمز السري الذي يزوده به الدكتور داخل القاعة قبيل بداية الاختبار.'));
      card.appendChild(btn);
      card.appendChild(errBox);
    }
    wrap.appendChild(card);
  }
  draw();
  return wrap;
}

/* ---- Excel import/export لبنك الأسئلة (SheetJS) ---- */
function readWorkbook(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        resolve(rows);
      }catch(err){ reject(err); }
    };
    reader.onerror = ()=>reject(new Error('فشلت قراءة الملف'));
    reader.readAsArrayBuffer(file);
  });
}
function pick(row, keys){
  for(const k of keys){
    for(const rk in row){
      if(rk.trim().toLowerCase()===k.toLowerCase()) return row[rk];
    }
  }
  return undefined;
}
async function importQuestionsFromExcel(file){
  const rows = await readWorkbook(file);
  let added=0, skipped=0, newElements=0;
  rows.forEach(row=>{
    const unitCode = String(pick(row,['الوحدة','Unit','unit'])||'').trim();
    const elementName = String(pick(row,['العنصر','الموضوع','Element','Topic'])||'').trim();
    const text = String(pick(row,['السؤال','Question','question'])||'').trim();
    const a = String(pick(row,['A','a'])||'').trim();
    const b = String(pick(row,['B','b'])||'').trim();
    const c = String(pick(row,['C','c'])||'').trim();
    const d = String(pick(row,['D','d'])||'').trim();
    let correctRaw = pick(row,['Correct','correct','الإجابة الصحيحة','الإجابة_الصحيحة']);
    const difficulty = String(pick(row,['Difficulty','difficulty','الصعوبة'])||'متوسط').trim() || 'متوسط';
    const explanation = String(pick(row,['Explanation','explanation','شرح الإجابة','شرح_الإجابة'])||'').trim();
    const lo = String(pick(row,['LO','lo','ناتج التعلم','ناتج_التعلم'])||'').trim();
    if(!unitCode || !text || !a || !b || !c || !d || correctRaw===undefined || correctRaw===''){ skipped++; return; }
    const unit = DB.units.find(u=>u.code.toLowerCase()===unitCode.toLowerCase());
    if(!unit){ skipped++; return; }
    let topic = topicsOfUnit(unit.id)[0];
    if(!topic){ topic = {id:unit.id+'-T', unitId:unit.id, name:unit.name}; DB.topics.push(topic); }
    let element = DB.elements.find(e=>e.topicId===topic.id && e.name.trim().toLowerCase()===elementName.toLowerCase());
    if(!element && elementName){
      element = {id: uid(unit.id+'-X'), topicId: topic.id, name: elementName};
      DB.elements.push(element);
      newElements++;
    }
    if(!element){ skipped++; return; }
    let correctIdx;
    const letterMap = {A:0,B:1,C:2,D:3};
    const cs = String(correctRaw).trim().toUpperCase();
    if(letterMap[cs]!==undefined) correctIdx = letterMap[cs];
    else if(!isNaN(Number(cs))){
      const n = Number(cs);
      correctIdx = n>=1 && n<=4 ? n-1 : n; // يدعم 1-4 أو 0-3
    }
    if(correctIdx===undefined || correctIdx<0 || correctIdx>3){ skipped++; return; }
    DB.questions.push(mkQ(element.id, text, [a,b,c,d], correctIdx, explanation, ['سهل','متوسط','صعب'].includes(difficulty)?difficulty:'متوسط'));
    if(lo){ DB.questions[DB.questions.length-1].lo = lo; }
    added++;
  });
  await persist();
  return {added, skipped, newElements};
}
function exportQuestionsToExcel(){
  const rows = DB.questions.map(q=>({
    المعرف:q.id, الوحدة: (elementOf(q.elementId)? DB.units.find(u=>topicsOfUnit(u.id)[0]?.id===elementOf(q.elementId).topicId)?.code : '') || '',
    العنصر: elementOf(q.elementId)?.name||'', السؤال:q.text, A:q.options[0], B:q.options[1], C:q.options[2], D:q.options[3],
    الإجابة_الصحيحة: ['A','B','C','D'][q.correct], الصعوبة:q.difficulty, شرح_الإجابة:q.explanation||'', ناتج_التعلم:q.lo||'', الحالة: q.status==='active'?'فعال':(q.status==='inactive'?'غير فعال':q.status),
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'بنك الأسئلة');
  XLSX.writeFile(wb, 'بنك_الأسئلة.xlsx');
}

function statusBadge(status){
  const map = {'مسودة':'badge-gray','تحت المراجعة':'badge-amber','معتمد':'badge-green','active':'badge-green','inactive':'badge-gray'};
  const label = status==='active'?'فعال':(status==='inactive'?'غير فعال':status);
  return h('span',{class:'badge '+(map[status]||'badge-gray')}, label);
}
function openQuestionModal(question){
  const isEdit=!!question;
  const data = question?{...question, options:[...question.options]}:{
    id:uid('Q'), text:'', options:['','','',''], correct:0, explanation:'',
    elementId:DB.elements[0]?.id, difficulty:'متوسط', klo:'', lo:'', skill:'تطبيق', source:'', status:'active'
  };
  const overlay = h('div',{class:'modal-overlay', onclick:(e)=>{if(e.target===overlay)overlay.remove();}});
  const fText = h('textarea',{rows:3, style:'width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;background:var(--surface-2)'}, data.text);
  const optionInputs = data.options.map((o,i)=>h('input',{value:o, placeholder:'الخيار '+['A','B','C','D'][i]}));
  const fCorrect = h('select',{}, ...['A','B','C','D'].map((l,i)=>h('option',{value:i, selected:i===data.correct}, l)));
  const fElement = h('select',{}, ...DB.elements.map(e=>h('option',{value:e.id, selected:e.id===data.elementId}, elementLabel(e.id))));
  const fDiff = h('select',{}, ...['سهل','متوسط','صعب'].map(d=>h('option',{value:d, selected:d===data.difficulty}, d)));
  const fStatus = h('select',{}, ...[['active','معتمد وفعال'],['مسودة','مسودة'],['تحت المراجعة','تحت المراجعة'],['inactive','غير فعال']].map(([v,l])=>h('option',{value:v, selected:v===data.status}, l)));
  const fExpl = h('textarea',{rows:2, style:'width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);font-size:13.5px;background:var(--surface-2)'}, data.explanation);
  const fSkill = h('input',{value:data.skill});
  const fSource = h('input',{value:data.source});

  const modal = h('div',{class:'modal', style:'max-width:640px'},
    h('h3',{}, isEdit?'تعديل سؤال':'إضافة سؤال جديد'),
    h('div',{class:'field'}, h('label',{},'نص السؤال'), fText),
    h('div',{class:'form-row'},
      optionInputs.map((inp,i)=>h('div',{class:'field'}, h('label',{},'الخيار '+['A','B','C','D'][i]), inp))
    ),
    h('div',{class:'form-row'},
      h('div',{class:'field'}, h('label',{},'الإجابة الصحيحة'), fCorrect),
      h('div',{class:'field'}, h('label',{},'مستوى الصعوبة'), fDiff),
    ),
    h('div',{class:'field'}, h('label',{},'العنصر التفصيلي'), fElement),
    h('div',{class:'field'}, h('label',{},'شرح الإجابة'), fExpl),
    h('div',{class:'form-row'},
      h('div',{class:'field'}, h('label',{},'المهارة'), fSkill),
      h('div',{class:'field'}, h('label',{},'مصدر السؤال'), fSource),
    ),
    h('div',{class:'field'}, h('label',{},'حالة السؤال'), fStatus),
    h('div',{class:'modal-actions'},
      h('button',{class:'btn btn-outline', onclick:()=>overlay.remove()},'إلغاء'),
      h('button',{class:'btn btn-primary',style:'width:auto', onclick:async()=>{
        if(!fText.value.trim() || optionInputs.some(i=>!i.value.trim())) return;
        const rec = {
          id:data.id, text:fText.value.trim(), options:optionInputs.map(i=>i.value.trim()),
          correct:Number(fCorrect.value), elementId:fElement.value, difficulty:fDiff.value,
          explanation:fExpl.value.trim(), skill:fSkill.value, source:fSource.value, status:fStatus.value,
          klo:data.klo, lo:data.lo,
        };
        const idx = DB.questions.findIndex(x=>x.id===data.id);
        if(idx>=0) DB.questions[idx]=rec; else DB.questions.push(rec);
        await persist(); overlay.remove(); render();
      }},'حفظ')
    )
  );
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

/* ---- Blueprint & Weights ---- */
function viewBlueprint(){
  const wrap = h('div',{});
  wrap.appendChild(topbar('Blueprint والأوزان', 'تحديد وزن كل عنصر تفصيلي في الاختبار'));
  const toolbar = h('div',{class:'toolbar'});
  const selectBp = h('select',{class:'search-input', style:'width:260px'}, ...DB.blueprints.map(b=>h('option',{value:b.id}, b.name)));
  toolbar.appendChild(selectBp);
  toolbar.appendChild(h('button',{class:'btn btn-gold btn-sm', onclick:async()=>{
    const name = prompt('اسم Blueprint الجديد:');
    if(!name) return;
    const weights={}; DB.elements.forEach(e=>weights[e.id]=0);
    DB.blueprints.push({id:uid('B'), name, weights});
    await persist(); render();
  }},'+ إنشاء Blueprint جديد'));
  wrap.appendChild(toolbar);

  const card = h('div',{class:'card'});
  function draw(){
    card.innerHTML='';
    const bp = DB.blueprints.find(b=>b.id===selectBp.value) || DB.blueprints[0];
    if(!bp){ card.appendChild(h('div',{class:'empty-state'},'لا يوجد Blueprint بعد.')); return; }
    let total = 0;
    const rowsByTopic = {};
    DB.elements.forEach(e=>{ (rowsByTopic[e.topicId] = rowsByTopic[e.topicId]||[]).push(e); });
    const totalLabel = h('div',{style:'font-weight:800;font-size:15px;margin-bottom:14px'});
    function updateTotal(){
      total = Object.values(bp.weights).reduce((s,v)=>s+Number(v||0),0);
      const shown = Math.round(total*100)/100;
      const balanced = Math.abs(total-100) < 0.5;
      totalLabel.textContent = 'إجمالي الأوزان: '+shown+'%'+(balanced?' ✓ متوازن':' — يجب أن يساوي 100%');
      totalLabel.style.color = balanced ? 'var(--green)' : 'var(--red)';
    }
    card.appendChild(totalLabel);
    Object.entries(rowsByTopic).forEach(([topicId, elems])=>{
      card.appendChild(h('div',{style:'font-weight:700;color:var(--ink-3);margin:14px 0 6px;font-size:13.5px'}, topicOf(topicId)?.name));
      elems.forEach(e=>{
        const inp = h('input',{type:'number', min:'0', max:'100', step:'0.01', value:bp.weights[e.id]||0, style:'width:80px;padding:8px;border-radius:8px;border:1.5px solid var(--border);text-align:center'});
        inp.addEventListener('input', async ()=>{
          bp.weights[e.id] = Number(inp.value||0);
          updateTotal();
          await persist();
        });
        card.appendChild(h('div',{class:'elem-row'}, h('div',{class:'er-name'}, e.name), inp, h('span',{style:'margin-right:8px;color:var(--muted);font-size:12.5px'},'%')));
      });
    });
    updateTotal();
  }
  selectBp.addEventListener('change', draw);
  draw();
  wrap.appendChild(card);
  return wrap;
}

      secretCode: genCode(), status:'مغلق', questionIds: questions.map(q=>q.id),
      createdAt: new Date().toISOString(),
    };
    DB.exams.push(exam);
    await persist();
    resultBox.innerHTML='';
    resultBox.appendChild(h('div',{class:'card', style:'margin-top:18px;text-align:center;background:var(--surface-2)'},
      h('div',{style:'font-weight:700;margin-bottom:10px'}, 'تم إنشاء الاختبار «'+exam.name+'» بنجاح — يحتوي على '+exam.count+' سؤال'),

      h('div',{class:'tag-code'}, exam.secretCode),
      shortage.length ? h('div',{style:'margin-top:14px;color:var(--red);font-size:12.5px'},

    ));
  }},'إنشاء الاختبار'));
  wrap.appendChild(card);
  wrap.appendChild(resultBox);
  return wrap;
}

/* ---- Exams list ---- */
function viewExams(){
  const wrap = h('div',{});
  wrap.appendChild(topbar('الاختبارات', DB.exams.length+' اختبار'));
  const tableWrap = h('div',{class:'table-wrap card'});
  function draw(){
    tableWrap.innerHTML='';
    const table = h('table',{});
    table.appendChild(h('thead',{}, h('tr',{},
      h('th',{},'الاسم'), h('th',{},'التاريخ'), h('th',{},'عدد الأسئلة'), h('th',{},'المدة'),
      h('th',{},'الرمز السري'), h('th',{},'الحالة'), h('th',{},'المستلمون'), h('th',{},'')
    )));
    const tbody = h('tbody',{});
    if(!DB.exams.length) tbody.appendChild(h('tr',{}, h('td',{colspan:'8'}, h('div',{class:'empty-state'}, h('div',{class:'em-icon'},'🗒️'),'لم تُنشأ أي اختبارات بعد'))));
    [...DB.exams].reverse().forEach(ex=>{
      const submissions = DB.results.filter(r=>r.examId===ex.id).length;
      tbody.appendChild(h('tr',{},
        h('td',{style:'font-weight:700'}, ex.name), h('td',{}, ex.date||'—'),
        h('td',{}, ex.count), h('td',{}, ex.duration+' د'),
        h('td',{class:'mono'}, ex.secretCode),
        h('td',{}, h('span',{class:'badge '+(ex.status==='مفتوح'?'badge-green':'badge-gray')}, ex.status)),
        h('td',{}, submissions+' / '+DB.students.length),
        h('td',{}, h('button',{class:'btn btn-sm '+(ex.status==='مفتوح'?'btn-danger':'btn-gold'), onclick:async()=>{
          if(!requirePerm('exam.status')) return;
          const wasOpen = ex.status==='مفتوح';
          logAction(wasOpen?'إغلاق اختبار':'فتح اختبار', ex.name);
          ex.status = wasOpen ? 'مغلق' : 'مفتوح';
          await persist(); draw();
          // عند إغلاق (إنهاء) اختبار فيه نتائج، نقترح إرسال ملخص فوري للجنة الجاهزية عبر واتساب
          if(wasOpen && DB.results.some(r=>r.examId===ex.id)){
            if(confirm('تم إنهاء الاختبار. هل تريد إرسال ملخص النتائج للجنة الجاهزية الآن عبر واتساب؟')){
              sendExamSummaryToCommittee(ex);
            }
          }
        }}, ex.status==='مفتوح'?'إغلاق':'فتح'),
        ' ',
        h('button',{class:'btn btn-outline btn-sm', onclick:async()=>{
          if(!requirePerm('exam.status')) return;
          ex.secretCode = genCode(); await persist();
          logAction('توليد رمز سري جديد', ex.name); draw();
        }},'رمز جديد'),
        ' ',
        h('button',{class:'btn btn-outline btn-sm', onclick:()=>{
          if(!requirePerm('exam.package')) return;
          try{ exportStudentFile(ex); }catch(err){ alert(err.message); }
        }},'🛡️ نسخة الطالب'),
        ' ',
        h('button',{class:'btn btn-outline btn-sm', onclick:()=>sendExamSummaryToCommittee(ex)},'📤 للجنة'))
      ));
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
  }
  draw();
  wrap.appendChild(tableWrap);
  return wrap;
}

/* ---- Results & Reports ---- */
function viewResults(){
  const wrap = h('div',{});
  wrap.appendChild(topbar('النتائج والتقارير', 'اختر اختبارًا لعرض نتائج الطلاب وتحليل الأداء'));
  const selectExam = h('select',{class:'search-input', style:'width:280px;margin-bottom:16px'},
    h('option',{value:''},'اختر اختبارًا...'), ...DB.exams.map(e=>h('option',{value:e.id}, e.name)));
  wrap.appendChild(selectExam);
  const content = h('div',{});
  function draw(){
    content.innerHTML='';
    const examId = selectExam.value;
    if(!examId){ content.appendChild(h('div',{class:'card empty-state'},'اختر اختبارًا من القائمة أعلاه لعرض تقاريره.')); return; }
    const exam = DB.exams.find(e=>e.id===examId);
    const results = DB.results.filter(r=>r.examId===examId);
    const avg = results.length ? Math.round(results.reduce((s,r)=>s+r.score,0)/results.length) : 0;
    const max = results.length ? Math.max(...results.map(r=>r.score)) : 0;
    const min = results.length ? Math.min(...results.map(r=>r.score)) : 0;
    content.appendChild(h('div',{class:'grid grid-3'},
      statCard(results.length+' / '+DB.students.length,'عدد المستلمين'),
      statCard(avg+'%','متوسط الأداء العام'),
      statCard(max+'% / '+min+'%','أعلى / أدنى درجة'),
    ));

    // element-level averages for this exam
    const elemAgg={};
    results.forEach(r=>Object.entries(r.elementScores||{}).forEach(([eid,pct])=>{
      (elemAgg[eid]=elemAgg[eid]||[]).push(pct);
    }));
    const elemAvgCard = h('div',{class:'card', style:'margin-top:16px'});
    elemAvgCard.appendChild(h('div',{style:'font-weight:800;margin-bottom:12px'},'متوسط الأداء حسب العنصر التفصيلي'));
    const elemEntries = Object.entries(elemAgg).map(([eid,arr])=>({eid, avg:Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)})).sort((a,b)=>a.avg-b.avg);
    if(!elemEntries.length) elemAvgCard.appendChild(h('div',{class:'empty-state'},'لا توجد نتائج بعد لهذا الاختبار'));
    elemEntries.forEach(e=>{
      elemAvgCard.appendChild(h('div',{class:'elem-row'},
        h('div',{class:'er-name'}, elementOf(e.eid)?.name||e.eid),
        h('div',{class:'er-bar'}, pctBar(e.avg)),
        h('div',{class:'er-pct'}, e.avg+'%')
      ));
    });
    content.appendChild(elemAvgCard);

    const tableCard = h('div',{class:'table-wrap card', style:'margin-top:16px'});
    tableCard.appendChild(h('div',{style:'font-weight:800;margin-bottom:12px'},'نتائج الطلاب'));
    const table = h('table',{});
    table.appendChild(h('thead',{}, h('tr',{}, h('th',{},'الرقم الجامعي'), h('th',{},'الطالب'), h('th',{},'الدرجة'), h('th',{},''))));
    const tbody = h('tbody',{});
    if(!results.length) tbody.appendChild(h('tr',{}, h('td',{colspan:'4'}, h('div',{class:'empty-state'},'لم يقدّم أي طالب هذا الاختبار بعد'))));
    results.forEach(r=>{
      const st = DB.students.find(s=>s.id===r.studentId);
      tbody.appendChild(h('tr',{},
        h('td',{class:'mono'}, st?.uid||'—'), h('td',{}, st?.name||'—'),
        h('td',{}, pctBadge(r.score)),
        h('td',{}, h('button',{class:'link-btn', onclick:()=>openStudentDrilldown(r, exam)},'عرض التفاصيل'))
      ));
    });
    table.appendChild(tbody);

function exportCsv(exam, results){
  let csv = 'الرقم الجامعي,اسم الطالب,الدرجة العامة\n';
  results.forEach(r=>{
    const st = DB.students.find(s=>s.id===r.studentId);
    csv += (st?.uid||'')+','+(st?.name||'')+','+r.score+'\n';
  });
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'نتائج_'+exam.name+'.csv'; a.click();
  URL.revokeObjectURL(url);
}

  ]]], 'نموذج_جهات_اتصال.xlsx');
}
async function importContactsFromExcel(file){
  const rows = await readWorkbook(file);
  DB.contacts = DB.contacts || [];
  let added=0, updated=0, skipped=0;
  rows.forEach(row=>{
    const name = String(pick(row,['الاسم','Name','name'])||'').trim();
    const phoneRaw = String(pick(row,['الجوال','الهاتف','Phone','phone'])||'').trim();
    if(!name || !phoneRaw){ skipped++; return; }
    const rec = {
      name,
      role: String(pick(row,['الصفة','الجهة','Role','role'])||'').trim(),
      phone: normalizePhone(phoneRaw),
      note: String(pick(row,['ملاحظة','Note','note'])||'').trim(),
    };
    const ex = DB.contacts.find(c=>c.name===name);
    if(ex){ Object.assign(ex, rec); updated++; }
    else { DB.contacts.push({id: uid('C'), ...rec}); added++; }
  });
  await persist();
  return {added, updated, skipped};
}

      }},'حفظ'),
    )
  );

/* صف رقم قابل للتحرير مباشرة: يحفظ عند الخروج من الحقل ويوحّد الصيغة تلقائيًا */
function phoneField(current, onSave){
  const inp = h('input',{value:current||'', placeholder:'05XXXXXXXX', class:'mono',
    style:'width:170px;padding:7px 10px;border-radius:8px;border:1.5px solid var(--border);text-align:left;direction:ltr'});
  let last = current||'';
  const commit = async ()=>{
    const v = normalizePhone(inp.value);
    if(v === last) { inp.value = v; return; }
    last = v; inp.value = v;
    await onSave(v);
  };
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
  return inp;
}

function normalizeDigits(str){
  const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
               '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  return String(str||'').replace(/[٠-٩۰-۹]/g, d=>map[d]).trim();
}

let timerHandle = null;
/* المؤقّت يعتمد على وقت انتهاء مطلق (endsAt) بدل إنقاص عدّاد كل ثانية.
   الطريقة السابقة كانت تتوقف فعليًا إذا نام الجهاز أو خُفّض التبويب، فيكسب الطالب وقتًا إضافيًا. */
function remainingSeconds(){
  if(!EXAM_ATTEMPT || !EXAM_ATTEMPT.endsAt) return 0;
  return Math.max(0, Math.round((EXAM_ATTEMPT.endsAt - Date.now())/1000));
}
function startTimer(){
  if(timerHandle) clearInterval(timerHandle);
  const tick = ()=>{
    if(!EXAM_ATTEMPT){ clearInterval(timerHandle); return; }
    EXAM_ATTEMPT.secondsLeft = remainingSeconds();
    const timerEl = document.getElementById('exam-timer');
    if(timerEl){
      timerEl.textContent = fmtTime(EXAM_ATTEMPT.secondsLeft);
      timerEl.classList.toggle('low', EXAM_ATTEMPT.secondsLeft<300);
    }
    if(EXAM_ATTEMPT.secondsLeft<=0){
      clearInterval(timerHandle);
      submitExam(true);
    }
  };
  tick();
  timerHandle = setInterval(tick, 1000);
}

/* ===================================================================
   خلط الأسئلة والخيارات لكل طالب على حدة
   البذرة مشتقة من (رقم الاختبار + معرّف الطالب) فتكون النتيجة ثابتة
   عند تحديث الصفحة، ومختلفة بين طالب وآخر.
   =================================================================== */
function hashStr(str){
  let hIdx = 2166136261 >>> 0;
  for(let i=0;i<str.length;i++){ hIdx ^= str.charCodeAt(i); hIdx = Math.imul(hIdx, 16777619) >>> 0; }
  return hIdx >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rnd){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
const VIEW_CACHE = {};
function attemptView(exam, studentId){
  const key = exam.id+'|'+studentId;
  if(VIEW_CACHE[key]) return VIEW_CACHE[key];
  const rnd = mulberry32(hashStr(key));
  const shuffleQ = DB.settings.shuffleQuestions !== false;
  const shuffleO = DB.settings.shuffleOptions !== false;
  const order = shuffleQ ? seededShuffle(exam.questionIds, rnd) : exam.questionIds.slice();
  const optMap = {};
  order.forEach(qid=>{
    const q = DB.questions.find(x=>x.id===qid);
    if(!q) return;
    const idxs = q.options.map((_,i)=>i);
    optMap[qid] = shuffleO ? seededShuffle(idxs, rnd) : idxs;
  });
  const v = {order, optMap};
  VIEW_CACHE[key] = v;
  return v;
}

/* ===================================================================
   حفظ المحاولة الجارية واستئنافها
   كانت المحاولة في الذاكرة فقط، فأي تحديث للصفحة أو نفاد بطارية
   يمحو كل الإجابات ويعيد الطالب إلى الصفر بوقت كامل.
   =================================================================== */
const ATTEMPT_KEY = 'academia:attempt';
function saveAttempt(){
  try{
    if(!EXAM_ATTEMPT) return;
    localStorage.setItem(ATTEMPT_KEY, JSON.stringify(EXAM_ATTEMPT));
  }catch(e){ /* التخزين ممتلئ أو محظور */ }
}
function clearAttempt(){
  try{ localStorage.removeItem(ATTEMPT_KEY); }catch(e){}
}
function loadSavedAttempt(){
  try{
    const raw = localStorage.getItem(ATTEMPT_KEY);
    if(!raw) return null;
    const a = JSON.parse(raw);
    if(!a || !a.examId || !a.studentId) return null;
    const exam = DB.exams.find(e=>e.id===a.examId);
    const student = DB.students.find(s=>s.id===a.studentId);
    if(!exam || !student) return null;
    if(DB.results.some(r=>r.examId===a.examId && r.studentId===a.studentId)) return null;
    return a;
  }catch(e){ return null; }
}
async function resumeAttempt(a){
  EXAM_ATTEMPT = a;
  EXAM_ATTEMPT.secondsLeft = remainingSeconds();
  if(EXAM_ATTEMPT.secondsLeft <= 0){ await submitExam(true); return; }
  go('student-exam');
  startTimer();
}

/* ===================================================================
   أدوات مشتركة للتصدير والاستيراد
   =================================================================== */
function stamp(){ return new Date().toISOString().slice(0,10); }
function downloadBlob(content, filename, mime){
  const blob = content instanceof Blob ? content : new Blob([content], {type: mime||'application/json;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function downloadJson(obj, filename){
  downloadBlob('\uFEFF'+JSON.stringify(obj, null, 2), filename, 'application/json;charset=utf-8;');
}
function writeWorkbook(sheets, filename){
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, rows])=>{
    const data = (rows && rows.length) ? rows : [{'ملاحظة':'لا توجد بيانات'}];
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, String(name).replace(/[\\/?*\[\]:]/g,' ').slice(0,31));
  });
  XLSX.writeFile(wb, filename);
}
function pickFile(accept, handler){
  const input = h('input',{type:'file', accept, style:'display:none'});
  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    input.value = '';
    if(!file) return;
    try{ await handler(file); }
    catch(err){ alert('تعذّر تنفيذ العملية: '+(err && err.message ? err.message : err)); }
  });
  document.body.appendChild(input);
  input.click();
  setTimeout(()=>input.remove(), 60000);
}
