  }]]], 'نموذج_استيراد_الطلاب.xlsx');
}
async function importStudentsFromExcel(file){
  const rows = await readWorkbook(file);
  let added=0, updated=0, skipped=0;
  rows.forEach(row=>{
    const uidVal = normalizeDigits(String(pick(row,['الرقم_الجامعي','الرقم الجامعي','uid','ID'])||'').trim());
    const name = String(pick(row,['الاسم','Name','name'])||'').trim();
    if(!uidVal || !name){ skipped++; return; }
    const phoneRaw = String(pick(row,['الجوال','الهاتف','Phone','phone','Mobile'])||'').trim();
    const statusRaw = String(pick(row,['الحالة','Status','status'])||'فعال').trim();
    const rec = {
      uid: uidVal, name,
      program: String(pick(row,['البرنامج','Program'])||'بكالوريوس محاسبة').trim(),
      level: String(pick(row,['المستوى','Level'])||'').trim(),
      batch: String(pick(row,['الدفعة','Batch'])||'').trim(),
      email: String(pick(row,['البريد_الإلكتروني','البريد الإلكتروني','Email','email'])||'').trim(),
      phone: phoneRaw ? normalizePhone(phoneRaw) : '',
      active: !(statusRaw==='غير فعال' || statusRaw.toLowerCase()==='inactive' || statusRaw==='0'),
    };
    const existing = DB.students.find(s=>s.uid===uidVal);
    if(existing){
      Object.assign(existing, rec, {id: existing.id});
      if(!rec.phone) existing.phone = existing.phone || '';
      updated++;
    }else{
      DB.students.push({id: uid('S'), ...rec});
      added++;
    }
  });
  await persist();
  return {added, updated, skipped};
}

async function importPhonesFromExcel(file){

  let updated=0, notFound=0, empty=0;
  const missing = [];
  rows.forEach(row=>{
    const uidVal = normalizeDigits(String(pick(row,['الرقم_الجامعي','الرقم الجامعي','uid','ID'])||'').trim());
    const phoneRaw = String(pick(row,['الجوال','الهاتف','Phone','phone','Mobile'])||'').trim();

      الرقم_الجامعي: st?.uid||'', اسم_الطالب: st?.name||'', الدفعة: st?.batch||'',
      الدرجة_المئوية: r.score, إجابات_صحيحة: r.correct, عدد_الأسئلة: r.total,
      التقدير: r.score>=80?'جاهز':(r.score>=60?'يحتاج تحسين':'غير جاهز'),
      تاريخ_التسليم: new Date(r.submittedAt).toLocaleString('ar-SA'),
      طريقة_التسليم: r.auto ? 'تلقائي (انتهاء الوقت)' : 'يدوي',
      الجوال: st?.phone||'',
    };
  });
}
function elementRowsForExam(exam){
  const out = [];
  DB.results.filter(r=>r.examId===exam.id).forEach(r=>{
    const st = DB.students.find(s=>s.id===r.studentId);
    Object.entries(r.elementScores||{}).forEach(([eid,pct])=>{
      out.push({
        الاختبار: exam.name, الرقم_الجامعي: st?.uid||'', اسم_الطالب: st?.name||'',
        المقرر: unitOfElement(eid)?.code || '', العنصر: elementOf(eid)?.name || eid,
        النسبة: pct, التقييم: pct>=80?'قوة':(pct>=60?'متوسط':'ضعف'),
      });
    });
  });
  return out;
}
function examSummaryRows(){
  return DB.exams.map(ex=>{
    const rs = DB.results.filter(r=>r.examId===ex.id);
    const scores = rs.map(r=>r.score);
    return {
      الاختبار: ex.name, الحالة: ex.status, الرمز_السري: ex.secretCode,
      عدد_الأسئلة: ex.count, المدة_بالدقائق: ex.duration,
      عدد_المسلّمين: rs.length,
      المتوسط: scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : '',
      الأعلى: scores.length ? Math.max(...scores) : '',
      الأدنى: scores.length ? Math.min(...scores) : '',
      نسبة_الجاهزين: scores.length ? Math.round(scores.filter(x=>x>=80).length/scores.length*100)+'%' : '',
      تاريخ_الإنشاء: new Date(ex.createdAt).toLocaleDateString('ar-SA'),
    };
  });
}
function exportAllResultsToExcel(){

/* ===================================================================
   4) حزمة النتائج (JSON) — لنقل نتائج طالب أدّى الاختبار على جهازه
      إلى جهاز الدكتور، وهو البديل العملي عن قاعدة بيانات مشتركة.
   =================================================================== */
function buildResultsBundle(results){
  const ids = new Set(results.map(r=>r.studentId));
  return {
    type: 'accounting-readiness-results',
    exportedAt: new Date().toISOString(),
    university: DB.settings.university,
    results: JSON.parse(JSON.stringify(results)),
    students: DB.students.filter(s=>ids.has(s.id)).map(s=>({id:s.id, uid:s.uid, name:s.name, batch:s.batch, phone:s.phone||''})),
    exams: DB.exams.filter(e=>results.some(r=>r.examId===e.id)).map(e=>({id:e.id, name:e.name, count:e.count, duration:e.duration})),
  };
}
function exportResultsBundle(){
  downloadJson(buildResultsBundle(DB.results), 'حزمة_نتائج_'+stamp()+'.json');
}
async function importResultsBundle(file){
  const text = await file.text();
  const pkg = JSON.parse(text.replace(/^\uFEFF/,''));
  if(!pkg || !Array.isArray(pkg.results)) throw new Error('هذا الملف ليس حزمة نتائج صالحة.');
  let addedResults=0, skipped=0, addedStudents=0;
  (pkg.students||[]).forEach(ps=>{
    if(!DB.students.some(s=>s.uid===ps.uid || s.id===ps.id)){
      DB.students.push({id:ps.id||uid('S'), uid:ps.uid, name:ps.name, program:'بكالوريوس محاسبة',
        level:'', batch:ps.batch||'', email:'', phone:ps.phone||'', active:true});
      addedStudents++;
    }
  });
  pkg.results.forEach(r=>{
    const dup = DB.results.some(x=> x.id===r.id || (x.examId===r.examId && x.studentId===r.studentId));
    if(dup){ skipped++; return; }
    if(!DB.exams.some(e=>e.id===r.examId)){ skipped++; return; }
    DB.results.push(r);
    addedResults++;
  });
  await persist();
  return {addedResults, skipped, addedStudents};
}

/* ===================================================================
   5) المقررات والأوزان (Blueprint)
   =================================================================== */
function exportBlueprintToExcel(){
  const bp = DB.blueprints.find(b=>b.id==='B1') || DB.blueprints[0];
  const rows = DB.elements.map(e=>({
    المقرر: unitOfElement(e.id)?.code||'', اسم_المقرر: unitOfElement(e.id)?.name||'',
    العنصر: e.name, معرّف_العنصر: e.id,
    الوزن: bp ? (bp.weights[e.id]||0) : 0,
    عدد_الأسئلة_المتاحة: DB.questions.filter(q=>q.elementId===e.id && q.status==='active').length,
  }));
  const units = DB.units.map(u=>({
    الرمز:u.code, المقرر:u.name, النوع:u.kind, وزن_المقرر:u.weight,
    عدد_الموضوعات: DB.elements.filter(e=>unitOfElement(e.id)?.id===u.id).length,
    أسئلة_البنك: DB.questions.filter(q=>unitOfElement(q.elementId)?.id===u.id && q.status==='active').length,
  }));
  writeWorkbook([['المقررات', units], ['أوزان العناصر', rows]], 'المقررات_والأوزان_'+stamp()+'.xlsx');
}
async function importBlueprintFromExcel(file){
  const rows = await readWorkbook(file);
  const bp = DB.blueprints.find(b=>b.id==='B1') || DB.blueprints[0];
  if(!bp) throw new Error('لا يوجد Blueprint لتحديثه.');
  let updated=0, skipped=0;
  rows.forEach(row=>{
    const eid = String(pick(row,['معرّف_العنصر','معرف_العنصر','معرّف العنصر','ElementId'])||'').trim();
    const w = pick(row,['الوزن','Weight','weight']);
    if(!eid || w===undefined || w===''){ skipped++; return; }
    if(!DB.elements.some(e=>e.id===eid)){ skipped++; return; }
    bp.weights[eid] = Number(w)||0;
    updated++;
  });
  await persist();
  const total = Object.values(bp.weights).reduce((a,b)=>a+Number(b||0),0);
  return {updated, skipped, total: Math.round(total*100)/100};
}

/* ===================================================================
   6) حزمة تحديث البرنامج — محتوى فقط (أسئلة/مقررات/أوزان/إعدادات)
      دون طلاب أو نتائج، ليستوردها الآخرون بلا فقدان بياناتهم.
   =================================================================== */
function buildUpdatePackage(note){
  return {
    type: 'accounting-readiness-update',
    version: DB.meta.version,
    note: note || '',
    exportedAt: new Date().toISOString(),
    designer: DB.meta.designer || '',
    payload: {
      units: DB.units, topics: DB.topics, elements: DB.elements,
      questions: DB.questions, blueprints: DB.blueprints,
      settings: DB.settings,
    },
  };
}
function exportUpdatePackage(note){
  const pkg = buildUpdatePackage(note);
  downloadJson(pkg, 'تحديث_النظام_v'+DB.meta.version+'_'+stamp()+'.json');
}
async function importUpdatePackage(file){
  const text = await file.text();
  const pkg = JSON.parse(text.replace(/^\uFEFF/,''));
  if(!pkg || pkg.type!=='accounting-readiness-update' || !pkg.payload) throw new Error('هذا الملف ليس حزمة تحديث صالحة.');
  const p = pkg.payload;
  DB.units = p.units || DB.units;
  DB.topics = p.topics || DB.topics;
  DB.elements = p.elements || DB.elements;
  DB.questions = p.questions || DB.questions;
  DB.blueprints = p.blueprints || DB.blueprints;
  if(p.settings){
    DB.settings = {...DB.settings, ...p.settings,
      systemName: DB.settings.systemName, university: DB.settings.university};
  }
  DB.meta.version = pkg.version || DB.meta.version;
  DB.meta.lastUpdated = new Date().toISOString();
  DB.meta.changelog = DB.meta.changelog || [];
  DB.meta.changelog.push({version: DB.meta.version, date: stamp(),
    note: 'استيراد حزمة تحديث: ' + (pkg.note || 'بدون وصف')});
  migrateDB(DB);
  await persist();
  return {version: DB.meta.version, questions: DB.questions.length, units: DB.units.length};
}

function exportCommitteeReport(){
  const overall = DB.results.map(r=>r.score);
  const summary = [{
    الجامعة: DB.settings.university, النظام: DB.settings.systemName,
    نسخة_البرنامج: DB.meta.version, تاريخ_التقرير: new Date().toLocaleString('ar-SA'),
    عدد_الطلاب_الفعالين: DB.students.filter(s=>s.active).length,
    عدد_الاختبارات: DB.exams.length, عدد_المحاولات: DB.results.length,
    المتوسط_العام: overall.length ? Math.round(overall.reduce((a,b)=>a+b,0)/overall.length) : '',
    نسبة_الجاهزية: overall.length ? Math.round(overall.filter(x=>x>=80).length/overall.length*100)+'%' : '',
  }];
  const elemAgg = {};
  DB.results.forEach(r=>Object.entries(r.elementScores||{}).forEach(([eid,pct])=>{
    (elemAgg[eid] = elemAgg[eid]||[]).push(pct);
  }));
  const weak = Object.entries(elemAgg).map(([eid,arr])=>({
    المقرر: unitOfElement(eid)?.code||'', العنصر: elementOf(eid)?.name||eid,
    المتوسط: Math.round(arr.reduce((a,b)=>a+b,0)/arr.length), عدد_القياسات: arr.length,
  })).sort((a,b)=>a.المتوسط-b.المتوسط);
  writeWorkbook([
    ['الملخص التنفيذي', summary],
    ['ملخص الاختبارات', examSummaryRows()],
    ['العناصر مرتبة بالضعف', weak],
  ], 'تقرير_لجنة_الجاهزية_'+stamp()+'.xlsx');
}
function committeeMessage(){
  const overall = DB.results.map(r=>r.score);
  const avg = overall.length ? Math.round(overall.reduce((a,b)=>a+b,0)/overall.length) : 0;
  const ready = overall.length ? Math.round(overall.filter(x=>x>=80).length/overall.length*100) : 0;
  const elemAgg = {};
  DB.results.forEach(r=>Object.entries(r.elementScores||{}).forEach(([eid,pct])=>{
    (elemAgg[eid] = elemAgg[eid]||[]).push(pct);
  }));
  const weak = Object.entries(elemAgg).map(([eid,arr])=>({eid, avg: Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)}))
    .sort((a,b)=>a.avg-b.avg).slice(0,5);
  let msg = 'تقرير جاهزية عام — '+DB.settings.university+'\n';
  msg += 'نسخة البرنامج: '+DB.meta.version+'\n';
  msg += 'التاريخ: '+new Date().toLocaleDateString('ar-SA')+'\n\n';
  msg += 'الطلاب الفعالون: '+DB.students.filter(s=>s.active).length+'\n';
  msg += 'عدد الاختبارات: '+DB.exams.length+'\n';
  msg += 'عدد المحاولات: '+DB.results.length+'\n';
  msg += 'المتوسط العام: '+avg+'%\n';
  msg += 'نسبة من بلغوا حد الجاهزية (80%): '+ready+'%\n';
  if(weak.length){
    msg += '\nأضعف العناصر:\n';
    weak.forEach((w,i)=>{ msg += (i+1)+'. '+(elementOf(w.eid)?.name||w.eid)+' — '+w.avg+'%\n'; });
  }
  return msg;
}
function sendCommitteeSummary(){
  if(!DB.committee.phone){
    alert('لم يُسجَّل رقم جوال للجنة الجاهزية. سجّله أولًا من صفحة «دليل الهاتف».');
    return;
  }
  if(!DB.results.length){
    alert('لا توجد نتائج لإرسالها بعد.');
    return;
  }
  window.open(waLink(DB.committee.phone, committeeMessage()), '_blank');
}

    icon:'⬆️', title:'تحديث نسخة البرنامج',
    desc:'حزمة التحديث تنقل المحتوى فقط: بنك الأسئلة والمقررات والأوزان وإعدادات الاختبار — بلا طلاب ولا نتائج ولا كلمات مرور. فيستطيع من يستوردها الحصول على آخر نسخة من المحتوى دون أن يفقد بيانات طلابه ودرجاتهم.',
    buttons:[
      {label:'⭱ تصدير حزمة تحديث (النسخة '+DB.meta.version+')', kind:'btn-gold', onclick:()=>exportUpdatePackage(noteInput.value.trim())},
      {label:'⭳ استيراد حزمة تحديث', onclick:()=>pickFile('.json', async (f)=>{
        if(!confirm('سيتم استبدال بنك الأسئلة والمقررات والأوزان بمحتوى الحزمة. بيانات الطلاب والنتائج والاختبارات لن تُمَس. متابعة؟')) return;
        const r = await importUpdatePackage(f);
        alert('تم التحديث إلى النسخة '+r.version+'.\nعدد الأسئلة: '+r.questions+'\nعدد المقررات: '+r.units);
        render();
      })},
    ],
  });
  updCard.insertBefore(h('div',{class:'field', style:'margin-top:4px'}, h('label',{},'وصف التحديث'), noteInput),
                       updCard.lastElementChild);
  wrap.appendChild(updCard);

  /* --- اللجنة --- */
  wrap.appendChild(ioCard({
    icon:'🏛️', title:'تقرير لجنة الجاهزية',
    desc:'تقرير تنفيذي شامل للّجنة: مؤشرات عامة، وملخص كل اختبار، وقائمة العناصر مرتّبة من الأضعف إلى الأقوى لتوجيه الخطة العلاجية. ويمكن إرسال الملخص نصًا عبر واتساب مباشرة.',
    buttons:[
      {label:'⭱ تصدير تقرير اللجنة Excel', kind:'btn-gold', onclick:()=>exportCommitteeReport()},
      {label:'📤 إرسال الملخص للجنة عبر واتساب', kind:'btn-primary', onclick:()=>sendCommitteeSummary()},
      {label:'معاينة نص الرسالة', onclick:()=>alert(committeeMessage())},
    ],
    footer: DB.committee.phone ? ('سيُرسل إلى: '+(DB.committee.name||'اللجنة')+' — '+DB.committee.phone)
                               : '⚠ لم يُسجَّل رقم جوال للجنة بعد. سجّله من صفحة «دليل الهاتف».',
  }));

  /* --- النسخة الكاملة --- */
  wrap.appendChild(ioCard({
    icon:'💾', title:'نسخة احتياطية كاملة',
    desc:'كل شيء في ملف واحد: الطلاب، بنك الأسئلة، المقررات، الاختبارات ورموزها السرية، النتائج، الصلاحيات والإعدادات. استخدمها للنسخ الاحتياطي الدوري ولنقل النظام كاملًا إلى جهاز آخر. الاستيراد يستبدل كل بيانات هذا الجهاز.',
    buttons:[
      {label:'⭱ تصدير نسخة كاملة', kind:'btn-gold', onclick:()=>exportFullBackup()},
      {label:'⭳ استيراد نسخة كاملة (تستبدل الكل)', kind:'btn-danger', onclick:()=>pickFile('.json', async (f)=>{
        const ok = await importFullBackup(f);
        if(ok){ alert('تم استيراد البيانات بنجاح.'); render(); }
      })},
    ],
    footer:'نصيحة: صدّر نسخة كاملة قبل كل اختبار وبعده مباشرة — فالبيانات محفوظة في متصفح هذا الجهاز، وأي مسح لبيانات التصفح يمحوها.',
  }));

  return wrap;
}

/* ============================= INIT ============================= */
boot();
</script>
</body>
</html>
