<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>نظام جاهزية طلاب المحاسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F5F2EA;
  --surface:#FFFFFF;
  --surface-2:#FBF9F4;
  --ink:#152B35;
  --ink-2:#1F3F4D;
  --ink-3:#2C5A6D;
  --muted:#6B7680;
  --border:#E4DFD1;
  --gold:#C08A2E;
  --gold-light:#E8D3A5;
  --green:#2F7D4F;
  --green-bg:#E6F2EA;
  --amber:#B9791C;
  --amber-bg:#FBEFDA;
  --red:#B3462C;
  --red-bg:#FBE7E0;
  --radius:14px;
  --shadow:0 2px 10px rgba(21,43,53,.06), 0 1px 2px rgba(21,43,53,.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  direction:rtl;
}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;}
#app{min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 15% 20%, rgba(192,138,46,.08), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(44,90,109,.10), transparent 45%),
    var(--bg);
  padding:24px;
}
.login-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:40px 36px;
  width:100%;max-width:420px;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.brand-mark{
  width:44px;height:44px;border-radius:10px;
  background:linear-gradient(160deg,var(--ink-3),var(--ink));
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-light);font-weight:800;font-size:18px;flex-shrink:0;
}
.brand-text h1{font-size:17px;margin:0;font-weight:800;color:var(--ink);}
.brand-text p{font-size:12px;margin:2px 0 0;color:var(--muted);}
.role-tabs{display:flex;gap:8px;margin:24px 0 18px;background:var(--surface-2);padding:5px;border-radius:12px;border:1px solid var(--border);}
.role-tab{flex:1;text-align:center;padding:10px;border-radius:9px;border:none;background:transparent;font-weight:700;font-size:14px;color:var(--muted);transition:.15s;}
.role-tab.active{background:var(--ink);color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-3);margin-bottom:6px;}
.field input,.field select{
  width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--border);
  font-size:14.5px;background:var(--surface-2);color:var(--ink);outline:none;transition:.15s;
}
.field input:focus,.field select:focus{border-color:var(--ink-3);background:#fff;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 18px;border-radius:10px;border:none;font-weight:700;font-size:14px;
  transition:.15s;
}
.btn-primary{background:var(--ink);color:#fff;width:100%;padding:13px;font-size:15px;}
.btn-primary:hover{background:var(--ink-2);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:#a67623;}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink-3);}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.8;background:var(--surface-2);border:1px dashed var(--border);padding:10px 12px;border-radius:10px;}
.err{color:var(--red);font-size:13px;margin-top:8px;font-weight:700;}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex-shrink:0;background:var(--ink);color:#EAF0F2;
  display:flex;flex-direction:column;padding:22px 16px;
}
.sidebar .brand{color:#fff;margin-bottom:26px;padding:0 4px;}
.sidebar .brand-text h1{color:#fff;font-size:15px;}
.sidebar .brand-text p{color:#9FB6BF;}
.nav-group-title{font-size:11px;color:#7C97A0;font-weight:700;margin:16px 8px 6px;letter-spacing:.5px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;
  color:#CFE0E5;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;
  border:none;background:transparent;width:100%;text-align:right;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--gold);color:#fff;}
.nav-icon{width:18px;text-align:center;flex-shrink:0;font-size:14px;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}
.userchip{display:flex;align-items:center;justify-content:space-between;padding:8px;font-size:12.5px;color:#B9CBD1;}

.main{flex:1;min-width:0;padding:26px 34px;overflow-y:auto;max-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.topbar h2{margin:0;font-size:21px;font-weight:800;}
.topbar p{margin:3px 0 0;color:var(--muted);font-size:13px;}

.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1000px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.stat-card{}
.stat-card .num{font-size:26px;font-weight:800;color:var(--ink);}
.stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:right;color:var(--muted);font-weight:700;font-size:12px;padding:10px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:700;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-gray{background:#EEECE4;color:var(--muted);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot-green{background:var(--green);} .dot-amber{background:var(--amber);} .dot-red{background:var(--red);}

.bar-bg{background:#EEECE4;border-radius:100px;height:8px;overflow:hidden;}
.bar-fill{height:100%;border-radius:100px;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.search-input{padding:9px 14px;border-radius:9px;border:1.5px solid var(--border);width:240px;background:var(--surface-2);font-size:13.5px;}

.modal-overlay{position:fixed;inset:0;background:rgba(21,43,53,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:16px;padding:26px 28px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.modal h3{margin:0 0 18px;font-size:17px;font-weight:800;}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.pill-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1.5px solid var(--border);}
.pill-tab{padding:9px 16px;border:none;background:transparent;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1.5px;}
.pill-tab.active{color:var(--ink);border-color:var(--gold);}

.tree-unit{margin-bottom:10px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;}
.tree-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface-2);cursor:pointer;font-weight:700;font-size:14px;}
.tree-body{padding:6px 16px 12px;display:none;}
.tree-body.open{display:block;}
.topic-row{padding:10px 6px;border-bottom:1px dashed var(--border);}
.topic-row:last-child{border-bottom:none;}
.topic-title{font-weight:700;font-size:13.5px;color:var(--ink-3);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.element-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);padding:5px 11px;border-radius:100px;font-size:12.5px;margin:3px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .em-icon{font-size:34px;margin-bottom:10px;}

/* ---------- Exam taking ---------- */
.exam-shell{min-height:100vh;background:var(--bg);}
.exam-top{position:sticky;top:0;background:var(--ink);color:#fff;padding:14px 26px;display:flex;justify-content:space-between;align-items:center;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.15);}
.exam-top .et-left{font-weight:700;font-size:14px;}
.exam-top .et-left span{color:#9FB6BF;font-weight:500;font-size:12.5px;display:block;margin-top:2px;}
.timer{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;background:rgba(255,255,255,.1);padding:8px 16px;border-radius:10px;}
.timer.low{background:var(--red);color:#fff;}
.exam-body{max-width:840px;margin:26px auto;padding:0 20px;}
.q-card{background:#fff;border-radius:16px;border:1px solid var(--border);padding:26px 28px;box-shadow:var(--shadow);}
.q-meta{font-size:12px;color:var(--muted);margin-bottom:10px;font-weight:700;}
.q-text{font-size:16.5px;font-weight:700;line-height:1.9;margin-bottom:20px;}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--border);border-radius:11px;margin-bottom:10px;cursor:pointer;transition:.12s;}
.opt:hover{border-color:var(--ink-3);}
.opt.selected{border-color:var(--gold);background:var(--amber-bg);}
.opt .opt-letter{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;}
.opt.selected .opt-letter{background:var(--gold);color:#fff;border-color:var(--gold);}
.exam-nav{display:flex;justify-content:space-between;margin-top:20px;}
.qgrid{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0;background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;}
.qnum{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);}
.qnum.answered{background:var(--green-bg);border-color:var(--green);color:var(--green);}
.qnum.current{border-color:var(--ink);background:var(--ink);color:#fff;}

/* ---------- Report ---------- */
.report-hero{background:linear-gradient(135deg,var(--ink),var(--ink-3));color:#fff;border-radius:18px;padding:30px 32px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.report-hero .rh-score{font-size:44px;font-weight:900;}
.report-hero .rh-label{font-size:13px;color:#B9CBD1;margin-top:4px;}
.elem-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--border);border-radius:11px;margin-bottom:8px;background:#fff;}
.elem-row .er-name{font-weight:700;font-size:13.5px;flex:1;}
.elem-row .er-bar{width:140px;margin:0 16px;}
.elem-row .er-pct{width:46px;text-align:left;font-weight:800;font-size:13.5px;}

.link-btn{background:none;border:none;color:var(--ink-3);font-weight:700;font-size:13px;text-decoration:underline;padding:0;}
.tag-code{background:var(--ink);color:var(--gold-light);font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:700;letter-spacing:4px;padding:14px 22px;border-radius:12px;display:inline-block;}

/* ==========================================================
   طبقة الجوال (مضافة) — تصميم متجاوب
   لا تُعدّل أي قاعدة أعلاه؛ تعمل فقط على الشاشات الصغيرة.
   ========================================================== */

/* منع أي عنصر عريض من دفع الصفحة أفقيًا */
html,body{max-width:100%;overflow-x:hidden;}
h1,h2,h3,p,td,th,label,button,span,div{overflow-wrap:anywhere;word-break:break-word;}

@media (max-width:820px){

  /* ---------- الهيكل العام: الشريط الجانبي يصير شريطًا علويًا ---------- */
  .shell{flex-direction:column;min-height:100vh;}
  .sidebar{
    width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;
    gap:6px;padding:10px 12px;position:sticky;top:0;z-index:40;
    box-shadow:0 2px 10px rgba(21,43,53,.18);
  }
  .sidebar .brand{margin:0 0 6px;width:100%;}
  .sidebar .brand-mark{width:34px;height:34px;font-size:15px;}
  .sidebar .brand-text h1{font-size:13.5px;}
  .sidebar .brand-text p{font-size:11px;}
  /* عناوين المجموعات تختفي على الجوال حتى لا تقطع الشريط */
  .sidebar .nav-group-title{display:none;}
  .nav-item{
    width:auto;flex:0 0 auto;margin:0;padding:8px 11px;
    font-size:12.5px;border-radius:100px;background:rgba(255,255,255,.07);
    white-space:nowrap;
  }
  .nav-item.active{background:var(--gold);}
  .sidebar-footer{
    margin-top:6px;width:100%;padding-top:8px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  }
  .sidebar-footer .userchip{padding:2px 0;font-size:11.5px;}
  .sidebar-footer>div:last-child{font-size:10px;}

  /* المحتوى: إلغاء التمرير الداخلي المتداخل الذي يخفي أسفل الصفحة على الجوال */
  .main{padding:16px 14px 40px;max-height:none;overflow-y:visible;}

  /* ---------- العناوين والأشرطة العلوية ---------- */
  .topbar{flex-wrap:wrap;gap:10px;align-items:flex-start;margin-bottom:16px;}
  .topbar h2{font-size:18px;line-height:1.5;}
  .topbar p{font-size:12px;}
  .topbar>*{min-width:0;}

  /* التبويبات: تمرير أفقي بدل التراكب فوق النص */
  .pill-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:2px;}
  .pill-tabs::-webkit-scrollbar{display:none;}
  .pill-tab{white-space:nowrap;flex:0 0 auto;padding:9px 12px;font-size:12.5px;}

  .role-tabs{margin:18px 0 14px;}
  .role-tab{font-size:13px;padding:9px 6px;}

  /* ---------- الشبكات والبطاقات ---------- */
  .grid{gap:12px;}
  .grid-2,.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}
  .card{padding:15px 15px;}
  .stat-card .num{font-size:21px;}
  .stat-card .lbl{font-size:11.5px;}

  /* ---------- أشرطة الأدوات والبحث ---------- */
  .toolbar{flex-direction:column;align-items:stretch;gap:8px;}
  .toolbar>div{display:flex;flex-wrap:wrap;gap:8px;}
  .search-input{width:100%;}
  .btn{padding:10px 14px;}

  /* ---------- الجداول ---------- */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -15px;padding:0 15px;}
  table{font-size:12.5px;}
  th,td{padding:9px 8px;}

  /* ---------- صفوف العناصر (كانت أسماء العناصر تُسحق بجانب الشريط) ---------- */
  .elem-row{flex-wrap:wrap;padding:11px 12px;}
  .elem-row .er-name{flex:1 1 100%;margin-bottom:8px;font-size:13px;}
  .elem-row .er-bar{width:auto;flex:1 1 auto;margin:0 0 0 12px;}
  .elem-row .er-pct{width:auto;flex:0 0 auto;}

  /* ---------- النوافذ المنبثقة ---------- */
  .modal-overlay{padding:12px;align-items:flex-start;padding-top:24px;}
  .modal{padding:20px 18px;max-height:90vh;}
  .modal h3{font-size:15.5px;}
  .form-row{grid-template-columns:1fr;}
  .modal-actions{flex-wrap:wrap;}
  .modal-actions .btn{flex:1 1 auto;}

  /* ---------- شاشة الدخول ---------- */
  .login-wrap{padding:16px;align-items:flex-start;padding-top:32px;}
  .login-card{padding:26px 20px;border-radius:16px;}

  /* ---------- الشجرة والموضوعات ---------- */
  .tree-head{flex-wrap:wrap;gap:6px;padding:11px 13px;font-size:13px;}
  .tree-body{padding:6px 13px 12px;}
  .topic-title{flex-wrap:wrap;gap:6px;}

  /* ---------- شاشة أداء الاختبار ---------- */
  /* الشريط العلوي كان يغطي بداية السؤال عند التمرير على الجوال */
  .exam-top{padding:10px 14px;gap:8px;flex-wrap:wrap;}
  .exam-top .et-left{font-size:12.5px;line-height:1.6;flex:1 1 60%;min-width:0;}
  .exam-top .et-left span{font-size:11px;}
  .timer{font-size:16px;padding:6px 12px;flex:0 0 auto;}
  .exam-body{margin:16px auto 40px;padding:0 12px;}
  .q-card{padding:18px 16px;border-radius:14px;}
  .q-text{font-size:15.5px;line-height:1.85;margin-bottom:16px;}
  .opt{align-items:flex-start;padding:12px 13px;gap:10px;line-height:1.7;}
  .opt .opt-letter{margin-top:1px;}
  .exam-nav{gap:10px;}
  .exam-nav .btn{flex:1 1 0;}
  .qgrid{padding:12px;gap:6px;}
  .qnum{width:36px;height:36px;}

  /* ---------- التقرير ---------- */
  .report-hero{flex-direction:column;align-items:flex-start;padding:22px 18px;gap:10px;}
  .report-hero .rh-score{font-size:34px;}
  .tag-code{font-size:20px;letter-spacing:2px;padding:12px 16px;}

  /* منع تكبير iOS التلقائي عند لمس أي حقل (كان يُظهر الصفحة مقصوصة) */
  .field input,.field select,.search-input,input,select,textarea{font-size:16px;}
}

@media (max-width:520px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
  .main{padding:14px 12px 40px;}
  .topbar h2{font-size:17px;}
  .nav-item{font-size:12px;padding:7px 10px;}
  .exam-top{position:sticky;}
  .timer{font-size:15px;}
  .qnum{width:34px;height:34px;}
  .modal-actions{flex-direction:column-reverse;}
  .modal-actions .btn{width:100%;}
}

/* ================= إضافات الإصدار 1.3.0 ================= */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:14px 0;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.kpi b{display:block;font-size:19px;font-weight:800;color:var(--ink);line-height:1.4;}
.kpi span{font-size:11.5px;color:var(--muted);}
.flag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--red-bg);color:var(--red);margin:0 3px 3px 0;font-weight:700;}
.flag.warn{background:var(--amber-bg);color:var(--amber);}
.flag.ok{background:var(--green-bg);color:var(--green);}
.mini-note{font-size:12px;color:var(--muted);line-height:1.9;}

/* ---- وثيقة التقرير الرسمي ---- */
.report-doc{background:#fff;color:#12181d;border:1px solid var(--border);border-radius:14px;
  padding:30px 32px;max-width:920px;margin:0 auto;box-shadow:var(--shadow);}
.report-doc .kpi-grid{display:block;margin:12px 0 16px;}
.report-doc .kpi{display:inline-block;width:31.6%;margin:0 0.8% 9px;vertical-align:top;border-color:#DCD7C9;}
.report-doc .kpi b{font-size:17px;}
.report-doc table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 14px;}
.report-doc th{background:#F2EFE6;border:1px solid #DCD7C9;padding:6px 8px;font-weight:700;text-align:right;}
.report-doc td{border:1px solid #E4DFD1;padding:6px 8px;}
.report-doc .table-wrap{overflow:visible;}
.rep-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2.5px solid var(--ink);padding-bottom:12px;flex-wrap:wrap;}
.rep-meta{font-size:11.5px;color:#444;line-height:1.9;text-align:left;}
.rep-title{text-align:center;font-size:19px;font-weight:800;margin:20px 0 6px;}

.rep-h{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;margin:22px 0 8px;
  padding-bottom:5px;border-bottom:1.5px solid var(--gold-light);}
.rep-no{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 6px;
  border-radius:6px;background:var(--ink);color:#fff;font-size:12px;}

.rep-foot{margin-top:26px;padding-top:10px;border-top:1px dashed var(--border);font-size:10.5px;color:#777;text-align:center;line-height:1.8;}
.rep-break{page-break-before:always;break-before:page;}

/* ---- الطباعة ---- */
@media print{
  @page{size:A4;margin:14mm 12mm;}
  html,body{background:#fff !important;}
  .sidebar, .no-print{display:none !important;}
  .main{padding:0 !important;}
  .shell{display:block !important;}
  .card{box-shadow:none;}
  .rep-h, .rep-fig, .report-doc table{break-inside:avoid;page-break-inside:avoid;}
  .report-doc table{font-size:10px;}
  .report-doc .rep-p, .report-doc .rep-list{font-size:11.5px;line-height:1.85;}
  /* عند طباعة التقرير الرسمي: لا يُطبع سواه */
  body.printing-report *{visibility:hidden !important;}
  body.printing-report .report-doc, body.printing-report .report-doc *{visibility:visible !important;}
  body.printing-report .report-doc{position:absolute;top:0;right:0;left:0;width:100%;max-width:none;
    border:0;border-radius:0;box-shadow:none;padding:0;margin:0;}
}

<script type="text/template" id="studentTemplate"><!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">

<title>اختبار الجاهزية — نسخة الطالب</title>
<style>
:root{
  --bg:#F5F2EA; --surface:#FFFFFF; --surface-2:#FBF9F4;
  --ink:#152B35; --ink-2:#1F3F4D; --muted:#6B7680; --border:#E4DFD1;
  --gold:#C08A2E; --green:#2F7D4F; --amber:#B9791C; --red:#B3462C;
  --shadow:0 2px 10px rgba(21,43,53,.06), 0 1px 2px rgba(21,43,53,.08);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); direction:rtl;
  font-family:'Tajawal','Segoe UI',Tahoma,sans-serif; min-height:100vh;
  -webkit-tap-highlight-color:rgba(21,43,53,.08);

}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;font-size:16px;}
.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;letter-spacing:.5px;}

.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.brand-mark{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none;}
.brand h1{font-size:17px;margin:0;font-weight:800;}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);}
h2{font-size:16px;margin:0 0 12px;font-weight:800;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--ink-2);}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);}
.field input:focus{outline:2px solid var(--gold);outline-offset:1px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;
  padding:12px 18px;font-weight:700;font-size:14px;min-height:46px;}
.btn-primary{background:var(--ink);color:#fff;width:100%;}
.btn-gold{background:var(--gold);color:#fff;}

.btn:disabled{opacity:.45;}

.note{color:var(--muted);font-size:12.5px;line-height:1.95;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
.kv:last-child{border-bottom:0;}
.kv b{font-weight:700;}

/* شاشة الاختبار */
.exam-top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding-top:calc(12px + env(safe-area-inset-top));}
.exam-top .t-name{font-size:13.5px;font-weight:700;}
.exam-top .t-sub{font-size:11.5px;color:#B9CBD1;}
.timer{font-size:19px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;}
.timer.warn{color:#FFD08A;}
.timer.danger{color:#FF9F86;}
.progress{height:4px;background:rgba(255,255,255,.18);width:100%;}
.progress i{display:block;height:100%;background:var(--gold);transition:width .25s;}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);}
.q-meta{font-size:12px;color:var(--muted);margin-bottom:10px;}
.q-text{font-size:15.5px;font-weight:700;line-height:2;margin-bottom:16px;}
.opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--border);border-radius:11px;
  padding:13px 14px;margin-bottom:10px;font-size:14px;line-height:1.85;background:var(--surface-2);}
.opt:active{transform:scale(.995);}
.opt.selected{border-color:var(--gold);background:#FDF6E9;}
.opt-letter{width:26px;height:26px;flex:none;border-radius:7px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.opt.selected .opt-letter{background:var(--gold);}
.exam-nav{display:flex;gap:10px;margin-top:18px;}
.exam-nav .btn{flex:1;}
.qgrid{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0;}
.qnum{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  font-weight:700;font-size:12.5px;color:var(--muted);}
.qnum.answered{background:#E7F2EC;border-color:#9CC7AE;color:var(--green);}
.qnum.current{outline:2px solid var(--gold);outline-offset:1px;color:var(--ink);}
.receipt{background:var(--ink);color:#fff;border-radius:14px;padding:22px;text-align:center;margin-bottom:16px;}
.receipt .code{font-size:27px;font-weight:800;letter-spacing:3px;margin:10px 0;font-family:ui-monospace,monospace;}
.receipt .lbl{font-size:12px;color:#B9CBD1;}
.badge{display:inline-block;background:#E7F2EC;color:var(--green);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700;}
.hidden{display:none !important;}
</style>

<div id="app"></div>

<!-- حزمة الاختبار: يستبدلها النظام عند التصدير -->
<script id="pkg" type="application/json">__EXAM_PACKAGE__<\/script>

<script>
'use strict';
/* ===================================================================
   نسخة الطالب — تطبيق أداء الاختبار فقط.
   لا يحتوي هذا الملف على مفاتيح الإجابات ولا على أي حساب إداري.
   يسجّل إجابات الطالب الخام ويُخرجها في «مظروف» يُصحَّح على جهاز الدكتور.
   =================================================================== */

var PKG = null, ATTEMPT = null, TIMER = null, ROUTE = 'boot';
var app = document.getElementById('app');

/* ---------- أدوات ---------- */
function h(tag, attrs, ...kids){
  var n = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k === 'class') n.className = attrs[k];
    else if(k.slice(0,2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else if(k === 'html') n.innerHTML = attrs[k];
    else if(attrs[k] !== false && attrs[k] !== null) n.setAttribute(k, attrs[k]);
  }
  kids.flat().forEach(function(c){
    if(c === null || c === undefined || c === false) return;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  });
  return n;
}
function fmtTime(sec){
  var s = Math.max(0, Math.floor(sec));
  var p = function(v){ return String(v).padStart(2,'0'); };
  return p(Math.floor(s/3600)) + ':' + p(Math.floor((s%3600)/60)) + ':' + p(s%60);
}
function hashStr(str){
  var x = 2166136261 >>> 0;
  for(var i=0;i<str.length;i++){ x ^= str.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; }
  return x >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, rnd){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j = Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* بصمة المظروف: تكشف التعديل اليدوي بعد التسليم */
function fingerprint(env, salt){
  var keys = Object.keys(env.answers).sort();
  var canon = env.examId + '|' + env.student.uid + '|' + env.startedAt + '|' + env.submittedAt + '|' +
              keys.map(function(k){ return k + ':' + env.answers[k]; }).join(',') + '|' + (salt||'');
  var a = hashStr(canon), b = hashStr(canon.split('').reverse().join('') + a);
  return (a.toString(16).padStart(8,'0') + b.toString(16).padStart(8,'0')).toUpperCase();
}
function receiptOf(fp){ return fp.slice(0,4) + '-' + fp.slice(4,8); }
function storeKey(){ return 'readiness:attempt:' + (PKG ? PKG.exam.id : 'x'); }
function envKey(){ return 'readiness:envelope:' + (PKG ? PKG.exam.id : 'x'); }
function download(text, filename){
  var blob = new Blob([text], {type:'application/json;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* ---------- تحميل حزمة الاختبار ---------- */
function validPackage(p){
  return p && p.kind === 'exam-package' && p.exam && Array.isArray(p.questions) && p.questions.length > 0;
}
function loadPackage(){
  var raw = (document.getElementById('pkg').textContent || '').trim();
  if(raw && raw.indexOf('__EXAM') !== 0){
    try{ var p = JSON.parse(raw); if(validPackage(p)) return Promise.resolve(p); }catch(e){}
  }
  return fetch('./exam.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(p){ return validPackage(p) ? p : null; })
    .catch(function(){ return null; });
}

/* ---------- الشاشات ---------- */
function render(){
  app.innerHTML = '';
  if(ROUTE === 'nopkg')   app.appendChild(screenNoPackage());
  else if(ROUTE === 'login')  app.appendChild(screenLogin());
  else if(ROUTE === 'brief')  app.appendChild(screenBrief());
  else if(ROUTE === 'exam')   app.appendChild(screenExam());
  else if(ROUTE === 'done')   app.appendChild(screenDone());
  else app.appendChild(h('div',{class:'wrap'}, h('div',{class:'card'}, 'جارٍ التحميل...')));
  window.scrollTo(0,0);
}
function brandBlock(){
  var s = PKG ? PKG.org : {};
  return h('div',{class:'brand'},
    h('div',{class:'brand-mark'},'م'),
    h('div',{},
      h('h1',{}, (s && s.systemName) || 'نظام جاهزية طلاب المحاسبة'),
      h('p',{}, (s && s.university) || '')));
}

function screenNoPackage(){
  var wrap = h('div',{class:'wrap'});
  var card = h('div',{class:'card'});
  card.appendChild(brandBlock());
  card.appendChild(h('h2',{},'لم يُحمَّل ملف الاختبار'));
  card.appendChild(h('div',{class:'note'},
    'هذا الملف نسخة الطالب، ويحتاج حزمة الاختبار التي يزوّدك بها الدكتور. اختر ملف الحزمة (بامتداد ‎.json‎) لبدء الاختبار.'));
  var inp = h('input',{type:'file', accept:'.json', style:'margin-top:14px'});
  inp.addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var p = JSON.parse(r.result);
        if(!validPackage(p)) throw new Error('الملف ليس حزمة اختبار صالحة');
        PKG = p; ROUTE = 'login'; render();
      }catch(err){ alert('تعذّرت قراءة الملف: ' + err.message); }
    };
    r.readAsText(f);
  });
  card.appendChild(inp);
  wrap.appendChild(card);
  return wrap;
}

function screenLogin(){
  var wrap = h('div',{class:'wrap'});
  var card = h('div',{class:'card'});
  card.appendChild(brandBlock());
  card.appendChild(h('h2',{}, PKG.exam.name));
  card.appendChild(h('div',{class:'note', style:'margin-bottom:16px'},
    'أدخل رقمك الجامعي والرمز السري الذي يعلنه الدكتور في القاعة.'));

  var fUid  = h('input',{type:'text', inputmode:'numeric', placeholder:'مثال: 441000123', autocomplete:'off'});
  var fCode = h('input',{type:'text', inputmode:'numeric', placeholder:'الرمز المكوّن من ستة أرقام', autocomplete:'off'});
  var fName = h('input',{type:'text', placeholder:'الاسم الثلاثي'});
  var hasRoster = Array.isArray(PKG.roster) && PKG.roster.length > 0;

  card.appendChild(h('div',{class:'field'}, h('label',{},'الرقم الجامعي'), fUid));
  if(!hasRoster) card.appendChild(h('div',{class:'field'}, h('label',{},'الاسم'), fName));
  card.appendChild(h('div',{class:'field'}, h('label',{},'الرمز السري للاختبار'), fCode));

  var err = h('div',{class:'err hidden'});
  card.appendChild(h('button',{class:'btn btn-primary', onclick:function(){
    var uid = fUid.value.trim();
    var code = fCode.value.trim();
    function stop(m){ err.textContent = m; err.classList.remove('hidden'); }
    if(!uid) return stop('أدخل رقمك الجامعي.');
    if(String(code) !== String(PKG.exam.secretCode)) return stop('الرمز السري غير صحيح.');
    var name = fName.value.trim();
    if(hasRoster){
      var rec = PKG.roster.find(function(s){ return String(s.uid) === uid; });
      if(!rec) return stop('هذا الرقم الجامعي غير مسجّل في كشف هذا الاختبار. راجع الدكتور.');
      name = rec.name || uid;
    }else if(!name){
      return stop('أدخل اسمك.');
    }
    var saved = null;
    try{ saved = JSON.parse(localStorage.getItem(envKey()) || 'null'); }catch(e){}
    if(saved && String(saved.student.uid) === uid){
      ATTEMPT = null; window.__ENV = saved; ROUTE = 'done'; render(); return;
    }
    ATTEMPT = {uid:uid, name:name, answers:{}, idx:0, startedAt:null, endsAt:null};
    var resume = null;
    try{ resume = JSON.parse(localStorage.getItem(storeKey()) || 'null'); }catch(e){}
    if(resume && String(resume.uid) === uid && resume.endsAt && new Date(resume.endsAt) > new Date()){
      ATTEMPT = resume;
      ROUTE = 'exam'; startTimer(); render(); return;
    }
    ROUTE = 'brief'; render();
  }},'الدخول إلى الاختبار'));
  card.appendChild(err);
  card.appendChild(h('div',{class:'note', style:'margin-top:14px'},
    'ملاحظة: هذه النسخة لا تعرض الدرجة فور التسليم؛ تُصحَّح إجاباتك على جهاز الدكتور.'));
  wrap.appendChild(card);
  return wrap;
}

function screenBrief(){
  var wrap = h('div',{class:'wrap'});
  var card = h('div',{class:'card'});
  card.appendChild(brandBlock());
  card.appendChild(h('h2',{},'تعليمات الاختبار'));
  [['الاختبار', PKG.exam.name],
   ['الطالب', ATTEMPT.name + ' — ' + ATTEMPT.uid],
   ['عدد الأسئلة', String(PKG.questions.length)],
   ['المدة', PKG.exam.duration + ' دقيقة'],
   ['نوع الأسئلة', 'اختيار من متعدد — إجابة واحدة صحيحة']
  ].forEach(function(r){
    card.appendChild(h('div',{class:'kv'}, h('span',{}, r[0]), h('b',{}, r[1])));
  });
  card.appendChild(h('div',{class:'note', style:'margin:16px 0'},
    'يبدأ العدّ فور الضغط على «ابدأ». إن انقطع الاتصال أو أُغلق الجهاز فستُستأنف المحاولة من موضعها بما تبقّى من الوقت. '+
    'وعند انتهاء الوقت يُسلَّم الاختبار تلقائيًا بما أجبت عنه. لا تُحتسب الأسئلة المتروكة.'));
  card.appendChild(h('button',{class:'btn btn-primary', onclick:function(){
    var now = new Date();
    ATTEMPT.startedAt = now.toISOString();
    ATTEMPT.endsAt = new Date(now.getTime() + PKG.exam.duration*60000).toISOString();
    saveAttempt(); startTimer(); ROUTE = 'exam'; render();
  }},'ابدأ الاختبار'));
  wrap.appendChild(card);
  return wrap;
}

function viewOrder(){
  var key = PKG.exam.id + '|' + ATTEMPT.uid;
  if(window.__VIEW && window.__VIEW.key === key) return window.__VIEW;
  var rnd = mulberry32(hashStr(key));
  var ids = PKG.questions.map(function(q){ return q.id; });
  var order = PKG.shuffleQuestions !== false ? seededShuffle(ids, rnd) : ids;
  var optMap = {};
  order.forEach(function(qid){
    var q = PKG.questions.find(function(x){ return x.id === qid; });
    if(!q) return;
    var idxs = q.options.map(function(_, i){ return i; });
    optMap[qid] = PKG.shuffleOptions !== false ? seededShuffle(idxs, rnd) : idxs;
  });
  window.__VIEW = {key:key, order:order, optMap:optMap};
  return window.__VIEW;
}
function remainingSeconds(){
  if(!ATTEMPT || !ATTEMPT.endsAt) return 0;
  return Math.max(0, Math.round((new Date(ATTEMPT.endsAt) - new Date())/1000));
}
function startTimer(){
  if(TIMER) clearInterval(TIMER);
  TIMER = setInterval(function(){
    var s = remainingSeconds();
    var el = document.getElementById('timer');
    if(el){
      el.textContent = fmtTime(s);
      el.className = 'timer' + (s <= 60 ? ' danger' : (s <= 300 ? ' warn' : ''));
    }
    if(s <= 0){ clearInterval(TIMER); submit(true); }
  }, 1000);
}
function saveAttempt(){
  try{ localStorage.setItem(storeKey(), JSON.stringify(ATTEMPT)); }catch(e){}
}

function screenExam(){
  var v = viewOrder();
  var questions = v.order.map(function(id){
    return PKG.questions.find(function(q){ return q.id === id; });
  }).filter(Boolean);

  var shell = h('div',{});
  var bar = h('i',{style:'width:0%'});
  shell.appendChild(h('div',{class:'exam-top'},
    h('div',{},
      h('div',{class:'t-name'}, PKG.exam.name),
      h('div',{class:'t-sub'}, ATTEMPT.name + ' — ' + ATTEMPT.uid)),
    h('div',{id:'timer', class:'timer'}, fmtTime(remainingSeconds()))));
  shell.appendChild(h('div',{class:'progress'}, bar));

  var wrap = h('div',{class:'wrap'});
  var qArea = h('div',{});
  var grid = h('div',{class:'qgrid'});
  var counter = h('div',{class:'note', style:'text-align:center;margin-bottom:8px'});

  function answeredCount(){
    return questions.filter(function(q){ return ATTEMPT.answers[q.id] !== undefined; }).length;
  }
  function drawGrid(){
    grid.innerHTML = '';
    questions.forEach(function(q, i){
      grid.appendChild(h('button',{
        class:'qnum' + (ATTEMPT.answers[q.id]!==undefined ? ' answered':'') + (i===ATTEMPT.idx ? ' current':''),
        onclick:function(){ ATTEMPT.idx = i; drawQ(); drawGrid(); }
      }, i+1));
    });
    var n = answeredCount();
    counter.textContent = 'تمت الإجابة عن ' + n + ' من ' + questions.length +
                          (n < questions.length ? ' — متبقٍ ' + (questions.length - n) : ' — اكتملت جميع الأسئلة');
    bar.style.width = (questions.length ? (n/questions.length)*100 : 0) + '%';
  }
  function drawQ(){
    qArea.innerHTML = '';
    saveAttempt();
    var i = ATTEMPT.idx, q = questions[i];
    var letters = ['أ','ب','ج','د','هـ','و'];
    var card = h('div',{class:'q-card'});
    card.appendChild(h('div',{class:'q-meta'}, 'السؤال ' + (i+1) + ' من ' + questions.length));
    card.appendChild(h('div',{class:'q-text'}, q.text));
    (v.optMap[q.id] || q.options.map(function(_,k){ return k; })).forEach(function(orig, oi){
      card.appendChild(h('div',{
        class:'opt' + (ATTEMPT.answers[q.id] === orig ? ' selected':''),
        onclick:function(){
          if(ATTEMPT.answers[q.id] === orig) delete ATTEMPT.answers[q.id];
          else ATTEMPT.answers[q.id] = orig;
          saveAttempt(); drawQ(); drawGrid();
        }
      }, h('span',{class:'opt-letter'}, letters[oi]), h('span',{}, q.options[orig])));
    });
    card.appendChild(h('div',{class:'exam-nav'},
      h('button',{class:'btn btn-outline', disabled: i===0, onclick:function(){ ATTEMPT.idx--; drawQ(); drawGrid(); }},'السابق'),
      i < questions.length-1
        ? h('button',{class:'btn btn-outline', onclick:function(){ ATTEMPT.idx++; drawQ(); drawGrid(); }},'التالي')
        : h('button',{class:'btn btn-gold', onclick:function(){ confirmSubmit(questions); }},'إنهاء وتسليم')));
    qArea.appendChild(card);
  }

  wrap.appendChild(qArea);
  wrap.appendChild(counter);
  wrap.appendChild(grid);
  wrap.appendChild(h('div',{style:'text-align:center'},
    h('button',{class:'btn btn-danger', onclick:function(){ confirmSubmit(questions); }},'تسليم الاختبار الآن')));
  shell.appendChild(wrap);
  drawQ(); drawGrid();
  return shell;
}

function confirmSubmit(questions){
  var blank = questions.filter(function(q){ return ATTEMPT.answers[q.id] === undefined; });
  var msg = blank.length
    ? 'لديك ' + blank.length + ' سؤالًا دون إجابة. التسليم الآن يعني احتسابها خطأً.\nهل تريد التسليم؟'
    : 'أجبت عن جميع الأسئلة. هل تريد تسليم الاختبار الآن؟';
  if(confirm(msg)) submit(false);
}

function submit(auto){
  if(TIMER) clearInterval(TIMER);
  if(!ATTEMPT || window.__ENV) return;
  var now = new Date();
  var env = {
    kind:'answer-envelope', v:1,
    examId: PKG.exam.id, examName: PKG.exam.name,
    packageIssuedAt: PKG.issuedAt || null,
    student:{uid: ATTEMPT.uid, name: ATTEMPT.name},
    startedAt: ATTEMPT.startedAt,
    submittedAt: now.toISOString(),
    durationUsed: ATTEMPT.startedAt ? Math.round((now - new Date(ATTEMPT.startedAt))/1000) : null,
    auto: !!auto,
    answers: ATTEMPT.answers,
    answered: Object.keys(ATTEMPT.answers).length,
    total: PKG.questions.length
  };
  env.fingerprint = fingerprint(env, PKG.salt);
  env.receipt = receiptOf(env.fingerprint);
  window.__ENV = env;
  try{
    localStorage.setItem(envKey(), JSON.stringify(env));
    localStorage.removeItem(storeKey());
  }catch(e){}
  ROUTE = 'done'; render();
}

/* توزيع وزن على n عنصرًا بحيث يبقى المجموع مطابقًا تمامًا ولا ينتج وزن صفري أو سالب.
   الطريقة السابقة كانت تقرّب لأقرب عدد صحيح ثم تُصحّح الفرق كله على العنصر الأخير،
   فكان العنصر الأخير في المقررات كثيرة الموضوعات ينتهي بوزن صفر أو سالب فيُستبعد من كل اختبار. */
function splitWeight(total, n){
  if(n<=0) return [];
  const each = Math.round((total/n)*100)/100;
  const w = new Array(n).fill(each);
  const diff = Math.round((total - each*n)*100)/100;
  if(diff!==0){
    w[n-1] = Math.round((w[n-1]+diff)*100)/100;
    if(w[n-1] <= 0){                       // حارس: لا نسمح بوزن غير موجب مهما كان
      const floorW = Math.round((total/n)*100)/100;
      for(let i=0;i<n;i++) w[i] = floorW;
      w[n-1] = Math.round((total - floorW*(n-1))*100)/100;
      if(w[n-1] <= 0) w[n-1] = 0.01;
    }
  }
  return w;
}
function buildStructureFromDefs(){
  const units=[], topics=[], elements=[], blueprintWeights={};
  UNIT_DEFS.forEach(u=>{
    units.push({id:u.code, code:u.code, name:u.name, kind:u.kind, weight:u.weight});
    const topicId = u.code+'-T';
    topics.push({id:topicId, unitId:u.code, name:u.name});
    const ws = splitWeight(u.weight, u.topics.length);
    u.topics.forEach((name,i)=>{
      const eid = u.code+'-'+(i+1);
      elements.push({id:eid, topicId, name});
      blueprintWeights[eid] = ws[i];
    });
  });
  return {units, topics, elements, blueprintWeights};
}
/* بلوبرنت مستقل لكل مقرر بمفرده: يوزّع 100% على عناصر ذلك المقرر فقط — يُستخدم لإنشاء "اختبار المقرر" الفردي */
function buildPerCourseBlueprints(){
  return UNIT_DEFS.map(u=>{
    const weights = {};
    const ws = splitWeight(100, u.topics.length);
    u.topics.forEach((name,i)=>{ weights[u.code+'-'+(i+1)] = ws[i]; });
    return {id:'BP-'+u.code, name:'اختبار مقرر: '+u.code+' — '+u.name, weights};
  });
}

async function loadDB(){
  try{
    if(window.storage){
      const res = await window.storage.get(STORE_KEY, true);
      DB = res && res.value ? JSON.parse(res.value) : null;
    }
  }catch(e){ DB = null; }
  if(!DB){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      DB = raw ? JSON.parse(raw) : null;
    }catch(e){ DB = null; }
  }
  if(!DB){
    DB = seedData();
    await persist();
  }else{
    if(migrateDB(DB)) await persist();
  }
}
/* ترقية أي بيانات محفوظة بصيغة قديمة (قبل إضافة حساب مالك النظام والصلاحيات) دون فقدان بيانات المستخدم */
function migrateDB(db){
  let changed = false;
  if(!db.ownerAuth){ db.ownerAuth = {username:'مالك', password:'0000'}; changed = true; }
  if(db.ownerAuth && db.ownerAuth.phone===undefined){ db.ownerAuth.phone=''; changed = true; }
  if(db.doctorAuth && db.doctorAuth.phone===undefined){ db.doctorAuth.phone=''; changed = true; }
  if(!db.permissions){
    db.permissions = {
      doctorNav:{students:true, units:true, bank:true, blueprint:true, 'create-exam':true, exams:true, results:true, compare:true, settings:true},
      student:{
        showResultToStudent: db.settings?.showResultToStudent ?? true,
        showAnswersToStudent: db.settings?.showAnswersToStudent ?? false,
        showElementAnalysis: db.settings?.showElementAnalysis ?? true,
      },
    };
    changed = true;
  }
  if(db.settings){
    ['showResultToStudent','showAnswersToStudent','showElementAnalysis'].forEach(k=>{
      if(k in db.settings){ delete db.settings[k]; changed = true; }
    });
  }
  if(!db.committee){ db.committee = {name:'لجنة الجاهزية', phone:''}; changed = true; }
  if(!db.meta){
    db.meta = {
      version:'1.0.0', lastUpdated:new Date().toISOString(),
      changelog:[{version:'1.0.0', date:new Date().toISOString().slice(0,10), note:'الإصدار الأول من النظام'}],
      designer:'د. حكيم محمد براضية', licenseExpiry:null,
    };
    changed = true;
  }
  if(Array.isArray(db.students)){
    db.students.forEach(s=>{ if(s.phone===undefined){ s.phone=''; changed = true; } });
  }
  /* إصلاح أوزان المخططات المولّدة آليًا التي أنتجتها النسخة السابقة بقيم صفرية أو سالبة.
     المخططات التي أنشأها الدكتور بنفسه لا تُمَس. */
  if(Array.isArray(db.blueprints) && Array.isArray(db.elements)){
    const auto = db.blueprints.filter(b=> b.id==='B1' || String(b.id).startsWith('BP-'));
    const broken = auto.some(b=> Object.values(b.weights||{}).some(v=> Number(v) <= 0));
    if(broken){
      const fresh = buildStructureFromDefs();
      const perCourse = buildPerCourseBlueprints();
      db.blueprints.forEach(b=>{
        if(b.id==='B1'){ b.weights = {...fresh.blueprintWeights}; }
        else if(String(b.id).startsWith('BP-')){
          const src = perCourse.find(x=>x.id===b.id);
          if(src) b.weights = {...src.weights};
        }
      });
      changed = true;
      if(db.meta && Array.isArray(db.meta.changelog)){
        db.meta.changelog.push({version: db.meta.version||'1.0.0', date:new Date().toISOString().slice(0,10),
          note:'إصلاح تلقائي: أوزان Blueprint كانت تُخرج بعض الموضوعات من الاختبار (وزن صفري أو سالب).'});
      }
    }
  }
  if(db.permissions && db.permissions.doctorNav && db.permissions.doctorNav['data-center']===undefined){
    db.permissions.doctorNav['data-center'] = true; changed = true;
  }
  if(db.settings){
    if(db.settings.shuffleQuestions===undefined){ db.settings.shuffleQuestions = true; changed = true; }
    if(db.settings.shuffleOptions===undefined){ db.settings.shuffleOptions = true; changed = true; }
    if(db.settings.countryCode===undefined){ db.settings.countryCode = '966'; changed = true; }
  }
  if(db.meta && db.meta.showDemoCredentials===undefined){ db.meta.showDemoCredentials = true; changed = true; }
  if(!Array.isArray(db.contacts)){ db.contacts = []; changed = true; }
  /* ---- ترقية 1.3.0 ---- */
  if(!Array.isArray(db.doctors)){
    db.doctors = [];
    if(db.doctorAuth && db.doctorAuth.username){
      db.doctors.push({id:'D-legacy', name:db.doctorAuth.username, username:db.doctorAuth.username,
        password:db.doctorAuth.password, phone:db.doctorAuth.phone||'', active:true, overrides:{}});
    }
    changed = true;
  }
  if(!Array.isArray(db.audit)){ db.audit = []; changed = true; }
  if(!db.supervisor){ db.supervisor = {name:'', title:'رئيس قسم المحاسبة', entity:(db.settings&&db.settings.university)||'', phone:'', email:''}; changed = true; }
  if(db.settings && !db.settings.thresholds){ db.settings.thresholds = {ready:80, partial:60}; changed = true; }
  if(db.permissions && !db.permissions.doctorActions){ db.permissions.doctorActions = defaultActionPerms(); changed = true; }
  if(db.permissions && db.permissions.doctorActions){
    ['exam.package','result.import'].forEach(k=>{
      if(db.permissions.doctorActions[k]===undefined){ db.permissions.doctorActions[k] = true; changed = true; }
    });
  }
  if(db.settings && db.settings.packageRoster===undefined){ db.settings.packageRoster = true; changed = true; }
  if(db.permissions && db.permissions.doctorNav){
    if(db.permissions.doctorNav.analytics===undefined){ db.permissions.doctorNav.analytics = true; changed = true; }
    if(db.permissions.doctorNav['student-build']===undefined){ db.permissions.doctorNav['student-build'] = true; changed = true; }
    if(db.permissions.doctorNav['supervisor-report']===undefined){ db.permissions.doctorNav['supervisor-report'] = true; changed = true; }
  }
  if(db.meta){
    if(db.meta.locked===undefined){ db.meta.locked = false; changed = true; }
    if(db.meta.lockMessage===undefined){ db.meta.lockMessage = ''; changed = true; }
    if(db.meta.reportSeq===undefined){ db.meta.reportSeq = 0; changed = true; }
  }
  if(db.meta && ['1.0.0','1.1.0','1.2.0','1.3.0'].indexOf(db.meta.version)>=0){
    db.meta.version = '1.4.0';
    db.meta.lastUpdated = new Date().toISOString();
    (db.meta.changelog = db.meta.changelog||[]).push({version:'1.4.0', date:new Date().toISOString().slice(0,10),
      note:'نسخة طالب مستقلة بلا مفاتيح إجابات: توليد ملف اختبار للطالب، مظروف إجابات موقّع ببصمة، تصحيح على جهاز الدكتور، وفحص تشابه أنماط الإجابة. مع نسخة جوال قابلة للتثبيت تعمل دون اتصال.'});
    changed = true;
  }
  if(db.meta && (db.meta.version==='1.0.0' || db.meta.version==='1.1.0')){
    db.meta.version = '1.2.0';
    db.meta.lastUpdated = new Date().toISOString();
    (db.meta.changelog = db.meta.changelog||[]).push({version:'1.2.0', date:new Date().toISOString().slice(0,10),
      note:'مركز التصدير والاستيراد، دليل هاتف قابل للتعديل الكامل مع جهات اتصال إضافية، خلط الأسئلة لكل طالب، مؤقّت مبني على وقت الانتهاء، استئناف المحاولة المنقطعة، توحيد صيغة أرقام الجوال، وإصلاح توزيع أوزان الـ Blueprint.'});
    changed = true;
  }
  return changed;
}
async function persist(){
  /* الطريقة السابقة كانت ترجع فورًا إذا صادفت عملية حفظ جارية، فتضيع الكتابة بصمت
     (مثلًا نتيجة طالب سلّم في نفس اللحظة). الآن نضع الطلب في طابور بدل إسقاطه. */
  if(saving){ pendingSave = true; return; }
  saving = true;
  let cloudOk = false;
  try{
    if(window.storage){
      await window.storage.set(STORE_KEY, JSON.stringify(DB), true);
      cloudOk = true;
    }
  }catch(e){ /* لا يوجد جسر تخزين سحابي متاح في هذه البيئة */ }
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){ console.error('local storage error', e); }
  if(!cloudOk && !window.__storageWarned){
    window.__storageWarned = true;
    console.warn('تنبيه: لا يوجد تخزين سحابي مشترك بين الأجهزة في هذه البيئة — البيانات محفوظة محليًا في هذا المتصفح فقط.');
  }
  saving = false;
  if(pendingSave){ pendingSave = false; await persist(); }
}

function h(tag, attrs={}, ...children){
  const node = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') node.className = attrs[k];
    else if(k.startsWith('on')) node.addEventListener(k.slice(2), attrs[k]);
    else if(k==='html') node.innerHTML = attrs[k];
    else node.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==='string'||typeof c==='number') node.appendChild(document.createTextNode(c));
    else node.appendChild(c);
  });
  return node;
}
function pctClass(pct){
  var t = (DB && DB.settings && DB.settings.thresholds) ? DB.settings.thresholds : {ready:80, partial:60};
  return pct>=t.ready?'green':(pct>=t.partial?'amber':'red');
}
function pctBadge(pct){
  const c = pctClass(pct);
  return h('span',{class:'badge badge-'+c}, h('span',{class:'dot dot-'+c}), pct+'%');
}
function pctBar(pct){
  const c = pctClass(pct);
  const colorVar = c==='green'?'var(--green)':(c==='amber'?'var(--amber)':'var(--red)');
  const bar = h('div',{class:'bar-bg'}, h('div',{class:'bar-fill', style:`width:${Math.min(100,pct)}%; background:${colorVar}`}));
  return bar;
}
function fmtTime(sec){
  const s = Math.max(0,sec);
  const hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = s%60;
  return [hh,mm,ss].map(v=>String(v).padStart(2,'0')).join(':');
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function genCode(){ return String(Math.floor(100000+Math.random()*900000)); }

function isLicenseExpired(){
  if(!DB.meta || !DB.meta.licenseExpiry) return false;
  const today = new Date(new Date().toDateString());
  const exp = new Date(DB.meta.licenseExpiry);
  return exp < today;

/* توليد رابط واتساب برسالة جاهزة — بديل عملي عن إرسال رسائل SMS/Push حقيقية التي تتطلب خادمًا وخدمة مدفوعة */
function normalizePhone(phone){
  /* كشوف الشؤون الأكاديمية تأتي عادةً بصيغة محلية (05…) أو (‎+966…) أو (00966…)
     وواتساب يحتاج الرقم بالصيغة الدولية بلا صفر ولا علامة زائد. نوحّدها هنا. */
  const cc = String((typeof DB!=='undefined' && DB && DB.settings && DB.settings.countryCode) || '966').replace(/\D/g,'');
  let d = normalizeDigits(String(phone||'')).replace(/[^\d]/g,'');
  if(!d) return '';
  if(d.startsWith('00')) d = d.slice(2);
  if(cc && d.startsWith(cc)) return d;
  if(d.startsWith('0')) return cc + d.replace(/^0+/,'');
  if(d.length === 9 && d.startsWith('5')) return cc + d;
  return d;
}
function waLink(phone, text){
  const p = normalizePhone(phone);
  if(!p) return null;
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(text);
}

/* بناء رسالة ملخص نتائج اختبار لإرسالها للجنة الجاهزية، وفتح رابط واتساب الجاهز */
function buildExamSummaryMessage(exam){
  const results = DB.results.filter(r=>r.examId===exam.id);
  const activeCount = DB.students.filter(s=>s.active).length;
  const submittedCount = results.length;
  const avg = submittedCount ? Math.round(results.reduce((s,r)=>s+r.score,0)/submittedCount) : 0;
  const max = submittedCount ? Math.max(...results.map(r=>r.score)) : 0;
  const min = submittedCount ? Math.min(...results.map(r=>r.score)) : 0;

  const elemAgg = {};
  results.forEach(r=>Object.entries(r.elementScores||{}).forEach(([eid,pct])=>{ (elemAgg[eid]=elemAgg[eid]||[]).push(pct); }));
  const weakest = Object.entries(elemAgg).map(([eid,arr])=>({eid, avg:Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)}))
    .sort((a,b)=>a.avg-b.avg).slice(0,3)
    .map(e=> (elementOf(e.eid)?.name||e.eid)+' ('+e.avg+'%)');

  let msg = 'تقرير نتائج اختبار — '+DB.settings.university+'\n';
  msg += 'الاختبار: '+exam.name+'\n';
  if(exam.date) msg += 'التاريخ: '+exam.date+(exam.start?(' الساعة '+exam.start):'')+'\n';
  msg += 'عدد المستلمين: '+submittedCount+' من '+activeCount+' طالب فعال\n';
  msg += 'المتوسط العام: '+avg+'%\n';
  msg += 'أعلى درجة: '+max+'% — أدنى درجة: '+min+'%\n';
  if(weakest.length) msg += 'أكثر العناصر ضعفًا: '+weakest.join('، ')+'\n';
  msg += '\nمُرسل تلقائيًا من '+DB.settings.systemName;
  return msg;
}

function buildExamQuestionsFromPool(blueprint, totalCount, pool, elementsList){
  const entries = Object.entries(blueprint.weights).filter(([,w])=>Number(w)>0);
  const totalW = entries.reduce((s,[,w])=>s+Number(w),0) || 1;
  let allocation = entries.map(([eid,w])=>({eid, count: Math.round(totalCount*(Number(w)/totalW))}));
  let diff = totalCount - allocation.reduce((s,a)=>s+a.count,0);
  allocation.sort((a,b)=>b.count-a.count);
  let i=0;
  while(diff!==0 && allocation.length && i<2000){
    const idx = i % allocation.length;
    if(diff>0){ allocation[idx].count++; diff--; }
    else if(allocation[idx].count>0){ allocation[idx].count--; diff++; }
    i++;
  }
  let selected = [];
  let shortage = [];
  allocation.forEach(a=>{
    const elName = elementsList ? (elementsList.find(e=>e.id===a.eid)?.name||a.eid) : a.eid;
    const candidatePool = shuffle(pool.filter(q=>q.elementId===a.eid && q.status==='active'));
    const picked = candidatePool.slice(0, a.count);
    if(picked.length < a.count) shortage.push({element: elName, need:a.count, got:picked.length});
    selected.push(...picked);
  });
  return {questions: shuffle(selected), shortage};
}
function buildExamQuestions(blueprint, totalCount){
  return buildExamQuestionsFromPool(blueprint, totalCount, DB.questions, DB.elements);
}
function gradeAttempt(exam, answers){
  const qs = exam.questionIds.map(id=>DB.questions.find(q=>q.id===id)).filter(Boolean);
  let correct=0;
  const byElement = {};
  qs.forEach(q=>{
    const ans = answers[q.id];
    const isCorrect = ans!==undefined && Number(ans)===Number(q.correct);
    if(isCorrect) correct++;
    if(!byElement[q.elementId]) byElement[q.elementId] = {correct:0,total:0};
    byElement[q.elementId].total++;
    if(isCorrect) byElement[q.elementId].correct++;
  });
  const elementScores = {};
  Object.entries(byElement).forEach(([eid,v])=>{ elementScores[eid] = Math.round((v.correct/v.total)*100); });
  const score = qs.length ? Math.round((correct/qs.length)*100) : 0;
  return {score, correct, total: qs.length, elementScores};
}

/* ===================================================================
   نسخة الطالب: تصدير حزمة اختبار خالية من مفاتيح الإجابات،
   ثم استيراد مظاريف الإجابات وتصحيحها على جهاز الدكتور.
   =================================================================== */

/* البصمة نفسها المستعملة في نسخة الطالب — أي اختلاف يكشف تعديلًا يدويًا */
function envelopeFingerprint(env, salt){
  const keys = Object.keys(env.answers||{}).sort();
  const canon = env.examId + '|' + env.student.uid + '|' + env.startedAt + '|' + env.submittedAt + '|' +
    keys.map(k=>k+':'+env.answers[k]).join(',') + '|' + (salt||'');
  const a = hashStr(canon), b = hashStr(canon.split('').reverse().join('') + a);
  return (a.toString(16).padStart(8,'0') + b.toString(16).padStart(8,'0')).toUpperCase();
}

/* ---------- بناء حزمة الاختبار ---------- */
function buildExamPackage(exam, opts){
  opts = opts || {};
  const qs = (exam.questionIds||[]).map(id=>DB.questions.find(q=>q.id===id)).filter(Boolean);
  if(!qs.length) throw new Error('هذا الاختبار لا يحتوي على أسئلة صالحة.');
  /* لا يُنسخ من السؤال إلا ما يلزم لعرضه: بلا مفتاح الإجابة وبلا الشرح */
  const questions = qs.map(q=>({ id:q.id, text:q.text, options:q.options.slice() }));
  const pkg = {
    kind:'exam-package', v:1,
    issuedAt: new Date().toISOString(),
    issuedBy: actorLabel(),
    salt: uid('S') + Math.random().toString(36).slice(2,10),
    org:{ systemName: DB.settings.systemName, university: DB.settings.university },
    exam:{
      id: exam.id, name: exam.name,
      duration: exam.duration, count: questions.length,
      secretCode: String(exam.secretCode)
    },
    shuffleQuestions: DB.settings.shuffleQuestions !== false,
    shuffleOptions: DB.settings.shuffleOptions !== false,
    questions
  };
  if(opts.withRoster !== false){
    pkg.roster = DB.students.filter(s=>s.active!==false).map(s=>({uid:String(s.uid), name:s.name}));
  }
  return pkg;
}
function assertNoAnswerKey(pkg){
  const leak = pkg.questions.some(q=>
    'correct' in q || 'explanation' in q || 'elementId' in q || 'difficulty' in q);
  if(leak) throw new Error('توقّف التصدير: الحزمة تحتوي حقولًا لا يجوز أن تصل إلى الطالب.');
  return true;
}

function exportExamPackage(exam){
  const pkg = buildExamPackage(exam, {withRoster: DB.settings.packageRoster !== false});
  assertNoAnswerKey(pkg);
  downloadBlob(JSON.stringify(pkg), 'حزمة_اختبار_'+exam.id+'_'+stamp()+'.json', 'application/json;charset=utf-8');
  logAction('تصدير حزمة اختبار للطلاب', exam.name);
}

/* ملف HTML واحد جاهز للطالب: القالب + الحزمة بداخله */

/* ---------- استيراد المظاريف وتصحيحها ---------- */
function gradeEnvelope(env){
  const exam = DB.exams.find(e=>e.id===env.examId);
  if(!exam) return {error:'لا يوجد اختبار بهذا المعرّف في النظام'};
  const student = DB.students.find(s=>String(s.uid)===String(env.student.uid));
  if(!student) return {error:'الرقم الجامعي غير مسجّل: '+env.student.uid};
  const dup = DB.results.some(r=>r.examId===env.examId && r.studentId===student.id && r.submittedAt===env.submittedAt);
  if(dup) return {error:'مظروف مكرّر — سبق استيراده'};
  const graded = gradeAttempt(exam, env.answers||{});
  return {
    result:{
      id: uid('R'), examId: exam.id, studentId: student.id,
      answers: env.answers||{}, score: graded.score, correct: graded.correct, total: graded.total,
      elementScores: graded.elementScores,
      submittedAt: env.submittedAt, auto: !!env.auto,
      startedAt: env.startedAt || null, durationUsed: env.durationUsed || null,
      source:'envelope', receipt: env.receipt || null
    },
    student, exam, env
  };
}

/* تشابه أنماط الإجابات: مؤشر تواطؤ يُعتمد فيه على الأخطاء المشتركة لا الإجابات الصحيحة */
function collusionScan(exam, envs){
  const qs = (exam.questionIds||[]).map(id=>DB.questions.find(q=>q.id===id)).filter(Boolean);
  const pairs = [];
  for(let i=0;i<envs.length;i++){
    for(let j=i+1;j<envs.length;j++){
      const a = envs[i], b = envs[j];
      let sharedWrong = 0, wrongBoth = 0;
      qs.forEach(q=>{
        const x = a.answers[q.id], y = b.answers[q.id];
        if(x===undefined || y===undefined) return;
        const xw = Number(x)!==Number(q.correct), yw = Number(y)!==Number(q.correct);
        if(xw && yw){ wrongBoth++; if(Number(x)===Number(y)) sharedWrong++; }
      });
      if(wrongBoth >= 5){
        const idx = sharedWrong/wrongBoth;
        if(idx >= 0.75) pairs.push({
          a:a.student.uid, b:b.student.uid, sharedWrong, wrongBoth, index: idx
        });
      }
    }
  }
  return pairs.sort((x,y)=>y.index-x.index);
}

async function importAnswerEnvelopes(files){
  const report = {added:0, errors:[], tampered:[], imported:[], flags:[]};
  const parsed = [];
  for(const f of files){
    let env;
    try{ env = JSON.parse(await f.text()); }
    catch(e){ report.errors.push(f.name+': ليس ملف JSON صالحًا'); continue; }
    if(!env || env.kind!=='answer-envelope' || !env.student || !env.answers){
      report.errors.push(f.name+': ليس مظروف إجابات'); continue;
    }
    parsed.push(env);
  }
  parsed.forEach(env=>{
    const g = gradeEnvelope(env);
    if(g.error){ report.errors.push((env.student && env.student.uid ? env.student.uid : '؟')+': '+g.error); return; }
    DB.results.push(g.result);
    report.added++;
    report.imported.push({uid:env.student.uid, name:g.student.name, score:g.result.score, env});
    /* البصمة تُحسب دون الملح لأن الملح خاص بكل حزمة؛ نقارنها بالمعلَنة إن كانت الحزمة معروفة */
    if(env.fingerprint && env.receipt && receiptMismatch(env)){
      report.tampered.push(env.student.uid);
    }
  });
  if(report.added){
    /* فحص التواطؤ داخل كل اختبار على حدة */
    const byExam = {};
    report.imported.forEach(i=>{ (byExam[i.env.examId] = byExam[i.env.examId]||[]).push(i.env); });
    Object.keys(byExam).forEach(exId=>{
      const exam = DB.exams.find(e=>e.id===exId);
      if(!exam || byExam[exId].length<2) return;
      collusionScan(exam, byExam[exId]).forEach(p=>report.flags.push(Object.assign({exam:exam.name}, p)));
    });
    await persist();
    logAction('استيراد مظاريف إجابات', report.added+' مظروفًا'+(report.flags.length?' — تنبيهات تشابه: '+report.flags.length:''));
  }
  return report;
}
function receiptMismatch(env){
  /* الرمز المعروض للطالب مشتق من البصمة؛ عدم تطابقهما دليل تعديل يدوي */
  const expected = env.fingerprint.slice(0,4)+'-'+env.fingerprint.slice(4,8);
  return expected !== env.receipt;
}
