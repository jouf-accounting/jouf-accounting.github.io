function checkAppUpdate(silent){if(!D.settings||!D.settings.firebaseUrl)return;var url=D.settings.firebaseUrl.replace(/\/$/,"")+"/app_update/version.json";fetch(url).then(function(r){return r.json()}).then(function(remoteVer){if(!remoteVer)return;if(String(remoteVer)>APP_VERSION){if(!silent)notify('🔄','يوجد تحديث جديد v'+remoteVer+' — جاري التحميل...','info');var htmlUrl=D.settings.firebaseUrl.replace(/\/$/,"")+"/app_update/html.json";fetch(htmlUrl).then(function(r){return r.json()}).then(function(htmlData){if(!htmlData)return;if(window.AppUpdater){try{AppUpdater.saveHtml(htmlData,String(remoteVer));notify('✅','تم تحميل التحديث v'+remoteVer+' — أعد فتح التطبيق','success')}catch(e){console.error('OTA save error:',e)}}else{try{localStorage.setItem('ota_html',htmlData);localStorage.setItem('ota_version',String(remoteVer));notify('✅','تم تحميل التحديث v'+remoteVer+' — أعد تحميل الصفحة','success')}catch(e){console.error('OTA localStorage error:',e)}}}).catch(function(e){if(!silent)notify('خطأ','فشل تحميل التحديث: '+e.message,'error')})}else{if(!silent)notify('✅','التطبيق محدّث — الإصدار الحالي v'+APP_VERSION,'success')}}).catch(function(e){if(!silent)notify('خطأ','فشل التحقق من التحديثات','error')})}

function pushAppUpdate(){if(!D.settings||!D.settings.firebaseUrl){notify('خطأ','فعّل Firebase أولاً','error');return}var inp=document.createElement('input');inp.type='file';inp.accept='.html';inp.onchange=function(ev){var file=ev.target.files[0];if(!file)return;notify('⏳','جاري رفع التحديث...','info');var reader=new FileReader();reader.onload=function(e){var htmlContent=e.target.result;var verMatch=htmlContent.match(/APP_VERSION\s*=\s*"([^"]+)"/);var newVer=verMatch?verMatch[1]:String(parseFloat(APP_VERSION)+0.1);var url=D.settings.firebaseUrl.replace(/\/$/,"")+"/app_update.json";fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:newVer,html:htmlContent,uploadedBy:CU?CU.name:'owner',uploadDate:new Date().toISOString()})}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(){notify('✅','تم رفع التحديث v'+newVer+' بنجاح! كل الأجهزة ستتحدث تلقائياً','success')}).catch(function(err){notify('خطأ','فشل الرفع: '+err.message,'error')})};reader.readAsText(file)};inp.click()}

function getOTAStatus(){if(!D.settings||!D.settings.firebaseUrl)return Promise.resolve(null);var url=D.settings.firebaseUrl.replace(/\/$/,"")+"/app_update/version.json";return fetch(url).then(function(r){return r.json()}).then(function(v){return v}).catch(function(){return null})}

function cloudPush(){if(!D.settings.firebaseUrl||SYNC_BUSY)return;SYNC_BUSY=true;var url=D.settings.firebaseUrl.replace(/\/$/,"")+"/data.json";var payload={examSchedule:D.examSchedule,monitors:D.monitors,phoneBook:D.phoneBook,departments:D.departments,attendance:D.attendance,examReceipts:D.examReceipts||[],settings:{collegeName:D.settings.collegeName,examPeriods:D.settings.examPeriods,lateThreshold:D.settings.lateThreshold,semester:D.settings.semester,headerLogo:D.settings.headerLogo},halls:D.halls||[],users:D.users,userStatus:D.userStatus||{},examCols:D.examCols,handovers:D.handovers||[],lastUpdate:new Date().toISOString(),updatedBy:CU?CU.name:"system"};fetch(url,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(){LAST_SYNC=new Date().toLocaleTimeString("ar-SA");SYNC_BUSY=false;updateSyncBadge()}).catch(function(e){SYNC_BUSY=false;console.error("Sync push error:",e)})}
function cloudPull(silent){if(!D.settings.firebaseUrl||SYNC_BUSY)return;SYNC_BUSY=true;var url=D.settings.firebaseUrl.replace(/\/$/,"")+"/data.json";fetch(url).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(val){SYNC_BUSY=false;if(!val){if(!silent)notify("تنبيه","لا توجد بيانات في السحابة","warning");return}if(val.examSchedule)D.examSchedule=val.examSchedule;if(val.monitors)D.monitors=val.monitors;if(val.phoneBook)D.phoneBook=val.phoneBook;if(val.departments)D.departments=val.departments;if(val.attendance)D.attendance=val.attendance;if(val.examReceipts)D.examReceipts=val.examReceipts;if(val.halls)D.halls=val.halls;if(val.users)D.users=val.users;if(val.userStatus)D.userStatus=val.userStatus;if(val.examCols)D.examCols=val.examCols;if(val.handovers)D.handovers=val.handovers;if(val.settings){if(val.settings.collegeName)D.settings.collegeName=val.settings.collegeName;if(val.settings.examPeriods)D.settings.examPeriods=val.settings.examPeriods;if(val.settings.lateThreshold)D.settings.lateThreshold=val.settings.lateThreshold;if(val.settings.semester)D.settings.semester=val.settings.semester;if(val.settings.headerLogo)D.settings.headerLogo=val.settings.headerLogo}sv();LAST_SYNC=new Date().toLocaleTimeString("ar-SA");updateSyncBadge();if(!silent){notify("تم","تم تحديث البيانات من السحابة ☁️","success");render()}}).catch(function(e){SYNC_BUSY=false;if(!silent)notify("خطأ","فشل الاتصال: "+e.message,"error")})}
function startAutoSync(){if(SYNC_TIMER)clearInterval(SYNC_TIMER);if(!D.settings.firebaseUrl)return;var interval=(D.settings.syncInterval||30)*1000;SYNC_TIMER=setInterval(function(){if(CU)cloudPull(true)},interval)}
function updateSyncBadge(){var el=document.getElementById("sync-status");if(el)el.textContent=LAST_SYNC?"☁️ "+LAST_SYNC:""}
var _origSv=typeof sv==="function"?sv:function(){};sv=function(){_origSv();if(D.settings&&D.settings.firebaseUrl&&CU){if(window._syncDeb)clearTimeout(window._syncDeb);window._syncDeb=setTimeout(function(){if(!CU)return;if(CU.role==="owner"||CU.role==="admin")cloudPush();else cloudPushPartial()},2000)}}
function cloudPushPartial(){if(!D.settings.firebaseUrl||SYNC_BUSY)return;SYNC_BUSY=true;var base=D.settings.firebaseUrl.replace(/\/$/,"");var ops=[fetch(base+"/data/attendance.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(D.attendance)}),fetch(base+"/data/handovers.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(D.handovers||[])}),fetch(base+"/data/examReceipts.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(D.examReceipts||[])}),fetch(base+"/data/lastUpdate.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(new Date().toISOString())})];Promise.all(ops).then(function(){LAST_SYNC=new Date().toLocaleTimeString("ar-SA");SYNC_BUSY=false;updateSyncBadge()}).catch(function(e){SYNC_BUSY=false;console.error("Partial sync error:",e)})}
function showSyncSetup(){var url=D.settings.firebaseUrl||'';var interval=D.settings.syncInterval||30;var o=document.createElement('div');o.className='mo';o.id='mol';o.onclick=function(ev){if(ev.target===o)o.remove()};var mc=document.createElement('div');mc.className='mc';mc.style.maxWidth='520px';mc.innerHTML='<h3 style="margin-bottom:16px;color:#ecf0f1">\u2601\ufe0f \u0625\u0639\u062f\u0627\u062f \u0627\u0644\u0645\u0632\u0627\u0645\u0646\u0629 \u0627\u0644\u0633\u062d\u0627\u0628\u064a\u0629</h3><div style="background:rgba(77,166,255,0.08);border:1px solid rgba(77,166,255,0.15);padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;color:var(--accent2);line-height:1.8"><strong>\u0627\u0644\u062e\u0637\u0648\u0627\u062a:</strong><br>1. \u0627\u062f\u062e\u0644 console.firebase.google.com<br>2. \u0623\u0646\u0634\u0626 \u0645\u0634\u0631\u0648\u0639 \u062c\u062f\u064a\u062f (Create Project)<br>3. \u0627\u0630\u0647\u0628 \u0644\u0640 Realtime Database \u2190 Create Database<br>4. \u0627\u062e\u062a\u0631 \u0645\u0646\u0637\u0642\u0629 \u062b\u0645 Next<br>5. \u0627\u062e\u062a\u0631 Start in test mode \u062b\u0645 Enable<br>6. \u0627\u0646\u0633\u062e \u0631\u0627\u0628\u0637 \u0627\u0644\u0642\u0627\u0639\u062f\u0629</div><div class="fg"><label>\u0631\u0627\u0628\u0637 Firebase Database</label><input type="text" class="fi" id="sync_url" value="'+url+'" dir="ltr" placeholder="https://your-project.firebaseio.com"></div><div class="fg"><label>\u0641\u062a\u0631\u0629 \u0627\u0644\u062a\u062d\u062f\u064a\u062b (\u062b\u0648\u0627\u0646\u064a)</label><input type="number" class="fi" id="sync_interval" value="'+interval+'" min="10" max="300"></div>';var btns=document.createElement('div');btns.style.cssText='display:flex;gap:8px;margin-top:16px;flex-wrap:wrap';var b1=document.createElement('button');b1.className='btn bp';b1.textContent='\ud83d\udcbe \u062d\u0641\u0638';b1.onclick=saveSyncConfig;var b2=document.createElement('button');b2.className='btn bok';b2.textContent='\u2b06\ufe0f \u0631\u0641\u0639 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a';b2.onclick=function(){cloudPush();notify('\u062a\u0645','\u062a\u0645 \u0631\u0641\u0639 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u2601\ufe0f','success')};var b3=document.createElement('button');b3.className='btn bo';b3.textContent='\u2b07\ufe0f \u062a\u062d\u0645\u064a\u0644 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a';b3.onclick=cloudPull;var b4=document.createElement('button');b4.className='btn bo';b4.textContent='\u0625\u0644\u063a\u0627\u0621';b4.onclick=function(){o.remove()};btns.appendChild(b1);btns.appendChild(b2);btns.appendChild(b3);btns.appendChild(b4);mc.appendChild(btns);o.appendChild(mc);document.body.appendChild(o)}
function saveSyncConfig(){var url=(document.getElementById("sync_url").value||"").trim();var interval=parseInt(document.getElementById("sync_interval").value)||30;if(url&&!url.startsWith("https://")){notify("خطأ","الرابط يجب أن يبدأ بـ https://","error");return}D.settings.firebaseUrl=url;D.settings.syncInterval=interval;_origSv();startAutoSync();document.getElementById("mol").remove();if(url){notify("تم","تم حفظ إعدادات المزامنة ☁️","success");cloudPush()}else{if(SYNC_TIMER)clearInterval(SYNC_TIMER);notify("تم","تم إيقاف المزامنة","info")}}

try{ld();if(D.examSchedule&&D.examSchedule.length>0)syncFromSchedule();render();if(D.settings&&D.settings.firebaseUrl){startAutoSync();setTimeout(function(){checkAppUpdate(true)},8000);if(!CU){var _aurl=D.settings.firebaseUrl.replace(/\/$/,"")+"/data.json";fetch(_aurl).then(function(r){return r.json()}).then(function(val){if(!val)return;if(val.users)D.users=val.users;if(val.userStatus)D.userStatus=val.userStatus;if(val.examSchedule)D.examSchedule=val.examSchedule;if(val.monitors)D.monitors=val.monitors;if(val.phoneBook)D.phoneBook=val.phoneBook;if(val.departments)D.departments=val.departments;if(val.attendance)D.attendance=val.attendance;if(val.examReceipts)D.examReceipts=val.examReceipts;if(val.handovers)D.handovers=val.handovers;if(val.halls)D.halls=val.halls;if(val.examCols)D.examCols=val.examCols;if(val.settings){if(val.settings.collegeName)D.settings.collegeName=val.settings.collegeName;if(val.settings.examPeriods)D.settings.examPeriods=val.settings.examPeriods;if(val.settings.lateThreshold)D.settings.lateThreshold=val.settings.lateThreshold;if(val.settings.semester)D.settings.semester=val.settings.semester;if(val.settings.headerLogo)D.settings.headerLogo=val.settings.headerLogo}sv();render();notify("☁️","تم تحميل البيانات من السحابة","success");setTimeout(function(){checkAppUpdate(true)},5000)}).catch(function(){})}}}catch(e){document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;direction:rtl;font-family:Arial,Tahoma,sans-serif;color:#ecf0f1"><h2 style="color:#e74c3c">⚠️ خطأ</h2><p>'+e.message+'</p><p style="font-size:12px;color:#95a5a6">Line: '+(e.lineNumber||e.line||'?')+'</p><button onclick="location.reload()" style="margin-top:20px;padding:12px 30px;font-size:16px;background:#3498db;color:white;border:none;border-radius:10px;cursor:pointer">🔄 إعادة تحميل</button></div>'}
</script>

<script>
// ══════════════════════════════════════════════════════════
//  صفحة استلام وتسليم المحاضرين — تصميم بسيط
//  عمليتان فقط لكل اختبار:
//  ① استلام من المحاضر/المنسق
//  ② إعادة التسليم للمحاضر/المنسق (مع إحصائيات من صفحة المراقبين)
// ══════════════════════════════════════════════════════════

function getR(eid){ if(!D.examReceipts)D.examReceipts=[];return D.examReceipts.find(function(r){return r.examId===eid;});}
function getHO2(eid,d){ if(!D.handovers)D.handovers=[];return D.handovers.find(function(h){return h.examId===eid&&h.date===d;});}
function nt(){var n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}

// ─────────────────────────────────────────────────────────
//  pgExamReceipt  — استلام وتسليم المحاضرين
// ─────────────────────────────────────────────────────────
function pgExamReceipt(){
  var vo=isViewOnly();
  if(!D.examReceipts)D.examReceipts=[];
  var allDates=[...new Set(D.examSchedule.map(function(e){return e.date;}).filter(Boolean))].sort();
  if(!window._selDate&&allDates.length>0){var td=gt();window._selDate=allDates.includes(td)?td:allDates[0];}
  var t=window._selDate||gt();
  var exams=D.examSchedule.filter(function(e){return e.date===t;}).sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});

  var got=exams.filter(function(e){return getR(e.id)&&getR(e.id).receivedFrom;}).length;
  var ret=exams.filter(function(e){return getR(e.id)&&getR(e.id).returnedTo;}).length;

  var dateOpts=allDates.map(function(d){
    var cnt=D.examSchedule.filter(function(e){return e.date===d;}).length;
    var dx=D.examSchedule.find(function(e){return e.date===d;});
    return '<option value="'+d+'" '+(d===t?'selected':'')+'>'+d+(dx&&dx.day?' - '+dx.day:'')+' ('+cnt+')</option>';
  }).join('');

  var dateSel='<div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;background:var(--card);padding:12px 16px;border-radius:12px;border:1px solid var(--brd)">'+
    '<span style="font-weight:700;font-size:14px;color:var(--txt2)">📅 اليوم:</span>'+
    '<select onchange="window._selDate=this.value;render()" style="flex:1;min-width:180px;padding:10px 14px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--txt);font-size:14px;font-weight:600">'+dateOpts+'</select>'+
    (!vo?'<button class="btn bok bx" onclick="rcptGetAll()">📥 استلام الكل</button>':'')+
    '<button class="btn bo bx" onclick="rcptExport()">📊 تصدير</button>'+
    '<button class="btn bo bx" onclick="rcptPrint()">🖨️ طباعة</button>'+
    '</div>';

  if(!exams.length) return '<div class="ph"><h1>📚 استلام من المنسق / إعادة للمحاضر</h1></div>'+dateSel+
    '<div style="text-align:center;padding:40px;color:var(--txt3)"><div style="font-size:48px">📭</div><p style="margin-top:12px">لا توجد اختبارات</p></div>';

  var cards=exams.map(function(ex,idx){
    var r=getR(ex.id)||{};
    var ho=getHO2(ex.id,t)||{};
    var gotIt=!!r.receivedFrom;
    var retIt=!!r.returnedTo;

    // ─ خلية الاستلام ─
    var cellA=gotIt?
      '<div class="rcpt-done">✅ تم الاستلام '+r.receiveTime+'</div>'+
      '<div class="rcpt-detail">من: '+r.receivedFrom+'<br>بواسطة: '+r.receivedBy+'</div>'+
      (!vo?'<div class="rcpt-btns">'+
        '<button class="btn bo bx" onclick="rcptEdit(\''+ex.id+'\',\'get\')">✏️ تعديل</button>'+
        (getMonPhone(r.receivedFrom)?'<button class="btn bo bx" onclick="rcptWA(\''+ex.id+'\',\'get\')">📱</button>':'')+
      '</div>':''):
      (!vo?'<button class="btn bp bx" style="width:100%" onclick="rcptGet(\''+ex.id+'\')">📥 استلام</button>':
       '<span class="rcpt-pending">لم يُستلم</span>');

    // ─ خلية الإعادة ─
    // إحصائيات من صفحة المراقبين
    var hasStats=ho.returned&&(ho.presentCount||ho.paperCount);
    var statsHtml=hasStats?'<div class="rcpt-stats">'+
      '<span class="rcpt-stat" style="color:var(--ok)">✅ '+ho.presentCount+' حضر</span>'+
      '<span class="rcpt-stat" style="color:var(--err)">❌ '+ho.absentCount+' غاب</span>'+
      (ho.withdrawnCount>0?'<span class="rcpt-stat" style="color:var(--warn)">🚪 '+ho.withdrawnCount+'</span>':'')+
      (ho.deprivedCount>0?'<span class="rcpt-stat" style="color:var(--err)">⛔ '+ho.deprivedCount+'</span>':'')+
      (ho.cheatingCount>0?'<span class="rcpt-stat" style="color:var(--warn)">⚠️ '+ho.cheatingCount+'</span>':'')+
      '<span class="rcpt-stat" style="color:var(--accent)">📄 '+ho.paperCount+' ورقة</span>'+
    '</div>':'';

    var cellB=retIt?
      '<div class="rcpt-done">✅ تم التسليم '+r.returnTime+'</div>'+
      '<div class="rcpt-detail">إلى: '+r.returnedTo+'<br>بواسطة: '+r.returnedBy+'</div>'+
      statsHtml+
      (!vo?'<div class="rcpt-btns">'+
        '<button class="btn bo bx" onclick="rcptEdit(\''+ex.id+'\',\'ret\')">✏️ تعديل</button>'+
        (getMonPhone(r.returnedTo)?'<button class="btn bo bx" onclick="rcptWA(\''+ex.id+'\',\'ret\')">📱</button>':'')+
      '</div>':''):
      (!vo&&gotIt?
        '<div style="margin-bottom:6px">'+statsHtml+'</div>'+
        '<button class="btn bp bx" style="width:100%" onclick="rcptRet(\''+ex.id+'\')">📤 إعادة التسليم</button>':
        '<span class="rcpt-pending">'+(gotIt?'انتظار التسليم':'—')+'</span>');

    return '<div class="rcpt-card" style="'+(retIt?'border-color:rgba(46,204,113,0.4)':'')+'">'+
      '<div class="rcpt-card-hdr">'+
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
          '<span style="font-size:14px;font-weight:700;color:var(--accent2);min-width:24px">'+(idx+1)+'</span>'+
          '<div style="flex:1;min-width:160px">'+
            '<div class="rcpt-card-title">'+(ex.course||'-')+'</div>'+
            '<div class="rcpt-card-sub">'+
              (ex.code?'📌 '+ex.code+' ':'')+
              (ex.section?'ش'+ex.section+' · ':'')+
              (ex.enrolled?ex.enrolled+' طالب · ':'')+
              (ex.hall?'🏢 '+ex.hall+' ':'')+
              (ex.time?'⏰ '+ex.time:'')+
            '</div>'+
            '<div class="rcpt-card-sub" style="color:var(--accent2)">'+
              (ex.coordinator?'📋 '+ex.coordinator:'')+
              (ex.lecturer&&ex.lecturer!==ex.coordinator?' | 👤 '+ex.lecturer:'')+
            '</div>'+
          '</div>'+
          '<span class="badge '+(retIt?'bok2':gotIt?'bw2':'bi')+'">'+(retIt?'✅ مكتمل':gotIt?'📥 مستلم':'⏳ لم يُستلم')+'</span>'+
        '</div>'+
      '</div>'+
      '<div class="rcpt-card-body">'+
        '<div class="rcpt-cell">'+
          '<div class="rcpt-cell-label">📥 استلام من المنسق</div>'+
          cellA+
        '</div>'+
        '<div class="rcpt-cell">'+
          '<div class="rcpt-cell-label">📤 إعادة التسليم للمحاضر</div>'+
          cellB+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');

  return '<div class="ph"><h1>📚 استلام وتسليم المحاضرين</h1>'+
    '<p style="font-size:12px;color:var(--txt3)">استلام من المنسق قبل الاختبار ← إعادة التسليم للمحاضر بعد الاختبار للتصحيح</p></div>'+
    dateSel+
    '<div class="sg">'+
      '<div class="sc bl"><div class="si">📝</div><div class="sv">'+exams.length+'</div><div class="sl">إجمالي</div></div>'+
      '<div class="sc gr"><div class="si">📥</div><div class="sv">'+got+'</div><div class="sl">استُلم</div></div>'+
      '<div class="sc pr"><div class="si">📤</div><div class="sv">'+ret+'</div><div class="sl">أُعيد تسليمه</div></div>'+
      '<div class="sc '+(ret===exams.length&&exams.length>0?'gr':'yl')+'"><div class="si">'+(ret===exams.length&&exams.length>0?'✅':'⏳')+'</div><div class="sv">'+(exams.length>0?Math.round(ret/exams.length*100)+'%':'—')+'</div><div class="sl">الإنجاز</div></div>'+
    '</div>'+
    cards;
}

// ─── نافذة: استلام من المحاضر ───
function rcptGet(eid){
  var ex=D.examSchedule.find(function(x){return x.id===eid;});if(!ex)return;
  var r=getR(eid)||{};
  var names=[ex.coordinator].filter(Boolean);  // الاستلام من المنسق فقط
  var opts='<option value="">-- اختر المنسق --</option>'+
    names.map(function(n){return '<option value="'+n+'" '+(r.receivedFrom===n?'selected':'')+'>'+n+'</option>';}).join('')+
    '<option value="__other">منسق آخر...</option>';
  var o=document.createElement('div');o.className='mo';o.id='mol';
  o.onclick=function(ev){if(ev.target===o)o.remove();};
  o.innerHTML='<div class="mc" style="max-width:400px">'+
    '<h3 style="margin-bottom:12px;color:#ecf0f1">📥 استلام من المنسق</h3>'+
    '<div style="background:rgba(77,166,255,0.08);padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px">'+
      '<strong>'+(ex.course||'-')+'</strong><br>'+
      '<span style="color:var(--txt3)">'+(ex.hall?'🏢 '+ex.hall+' | ':'')+''+(ex.time||'')+'</span>'+
    '</div>'+
    '<div class="fg"><label>استلمت من:</label>'+
    '<select class="fi" id="rg_from" onchange="document.getElementById(\'rg_oth_fg\').style.display=this.value===\'__other\'?\'block\':\'none\'">'+opts+'</select></div>'+
    '<div class="fg" id="rg_oth_fg" style="display:none"><label>الاسم</label><input type="text" class="fi" id="rg_oth" value="'+(names.indexOf(r.receivedFrom)<0?r.receivedFrom||'':'')+'"/></div>'+
    '<div class="fg"><label>ملاحظة (اختياري)</label><input type="text" class="fi" id="rg_note" value="'+(r.step1Notes||'')+'" placeholder="..."/></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
      '<button class="btn bp" style="flex:1" onclick="rcptSaveGet(\''+eid+'\')">✅ تأكيد</button>'+
      '<button class="btn bo" onclick="document.getElementById(\'mol\').remove()">إلغاء</button>'+
    '</div></div>';
  document.body.appendChild(o);
}
function rcptSaveGet(eid){
  var v=document.getElementById('rg_from').value;
  if(v==='__other')v=(document.getElementById('rg_oth').value||'').trim();
  if(!v){notify('خطأ','حدد المُسلِّم','error');return;}
  if(!D.examReceipts)D.examReceipts=[];
  var ex=D.examSchedule.find(function(x){return x.id===eid;});
  var ti=nt();
  var note=(document.getElementById('rg_note').value||'').trim();
  D.examReceipts=D.examReceipts.filter(function(r){return r.examId!==eid;});
  D.examReceipts.push({id:gid(),examId:eid,receivedFrom:v,receivedBy:CU.name,receiveTime:ti,receiveDate:gt(),examDate:(window._selDate||gt()),step1Notes:note});
  sv();document.getElementById('mol').remove();
  var phone=getMonPhone(v);
  var msg='السلام عليكم\nتم استلام اختبار من المنسق:\n✨ '+(ex&&ex.course||'-')+'\n• '+(ex&&ex.hall?'قاعة '+ex.hall+' | ':'')+''+(ex&&ex.time||'')+'\nالمنسق: '+v+'\nوقت الاستلام: '+ti+'\nبواسطة: '+CU.name+'\n'+D.settings.collegeName;
  notify('تم','✅ تم الاستلام من المنسق '+v,'success');
  if(phone&&confirm('إرسال إشعار لـ '+v+' عبر واتساب؟'))waMsg(phone,msg);
  render();
}

// ─── نافذة: إعادة التسليم للمحاضر ───
function rcptRet(eid){
  var r0=getR(eid);if(!r0){notify('خطأ','استلم الاختبار أولاً','error');return;}
  var ho0=getHO2(eid,r0.examDate||gt())||{};
  if(!ho0.returned){notify('تنبيه','⏳ انتظر استلام الأوراق من المراقب أولاً','warning');return;}
  var ex=D.examSchedule.find(function(x){return x.id===eid;});
  var r=getR(eid);var ho=getHO2(eid,window._selDate||gt())||{};
  if(!ex||!r)return;
  var names=[ex.lecturer].filter(Boolean);  // الإعادة للمحاضر فقط للتصحيح
  if(!names.length&&ex.coordinator)names=[ex.coordinator];  // fallback للمنسق إذا لا يوجد محاضر
  var opts='<option value="">-- اختر المحاضر --</option>'+
    names.map(function(n){return '<option value="'+n+'" '+(r.returnedTo===n?'selected':'')+'>'+n+'</option>';}).join('')+
    '<option value="__other">آخر...</option>';
  var statsHtml='';
  if(ho.returned){
    statsHtml='<div style="background:rgba(46,204,113,0.08);border:1px solid rgba(46,204,113,0.2);padding:10px;border-radius:8px;margin-bottom:12px">'+
      '<div style="font-weight:600;font-size:12px;color:var(--ok);margin-bottom:5px">📊 إحصائيات من صفحة المراقبين:</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:12px;text-align:center">'+
        '<div><strong style="color:var(--ok);font-size:16px">'+(ho.presentCount||0)+'</strong><br><span style="color:var(--txt3)">✅ حضر</span></div>'+
        '<div><strong style="color:var(--err);font-size:16px">'+(ho.absentCount||0)+'</strong><br><span style="color:var(--txt3)">❌ غاب</span></div>'+
        '<div><strong style="color:var(--accent);font-size:16px">'+(ho.paperCount||0)+'</strong><br><span style="color:var(--txt3)">📄 ورقة</span></div>'+
        (ho.withdrawnCount?'<div><strong style="color:var(--warn);font-size:14px">'+ho.withdrawnCount+'</strong><br><span style="color:var(--txt3)">🚪 منسحب</span></div>':'')+

  var ho=D.handovers.find(function(h){return h.examId===eid&&h.date===t;});
  var n=new Date(), ti=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  var onBehalf=(document.getElementById('rcv_onbehalf')||{}).value||'';
  var rcvNote=(document.getElementById('rcv_note')||{}).value||'';
  if(!ho){ho={id:gid(),examId:eid,date:t,received:true,receiveTime:ti,receivedBy:mon,receivedByCommittee:CU.name,receivedOnBehalf:onBehalf,receiveNote:rcvNote,returned:false};D.handovers.push(ho);}
  else{ho.received=true;ho.receiveTime=ti;ho.receivedBy=mon;ho.receivedByCommittee=CU.name;ho.receivedOnBehalf=onBehalf;ho.receiveNote=rcvNote;}
  sv(); document.getElementById('mol').remove();
  var ex=D.examSchedule.find(function(x){return x.id===eid;});
  var phone=getMonPhone(mon);
  var msg=buildWA('ho_receive', ex, {monitor:mon, by:CU.name, time:ti});
  notify('تم','📥 تم استلام الأوراق من '+mon,'success');
  if(phone&&confirm('📱 إرسال إشعار واتساب للمراقب '+mon+'؟')){waMsg(phone,msg);}
  render();
}

function doRet(eid){
  var t=window._selDate||gt();
  var ho=D.handovers.find(function(h){return h.examId===eid&&h.date===t;});
  if(!ho)return;
  ho.returned=true;
  var n=new Date(); ho.returnTime=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  ho.paperCount=document.getElementById('ho-papers').value;
  ho.presentCount=document.getElementById('ho-present').value;
  ho.absentCount=document.getElementById('ho-absent').value;
  ho.withdrawnCount=document.getElementById('ho-withdrawn').value;
  ho.deprivedCount=document.getElementById('ho-deprived').value;
  ho.cheatingCount=document.getElementById('ho-cheating').value;
  var rb=document.getElementById('ho-returnby').value;
  if(rb==='__other')rb=(document.getElementById('ho-returnby-other').value||'').trim();
  ho.returnedBy=rb; ho.returnedByCommittee=CU.name;
  ho.notes=(document.getElementById('ho-notes').value||'').trim();
  sv(); document.getElementById('mol').remove();
  var ex=D.examSchedule.find(function(x){return x.id===eid;});
  var phone=getMonPhone(rb);
  var msg=buildWA('ho_return', ex, {
    monitor:rb, by:CU.name, time:ho.returnTime,
    present:ho.presentCount, absent:ho.absentCount,
    withdrawn:ho.withdrawnCount, deprived:ho.deprivedCount,
    cheating:ho.cheatingCount, papers:ho.paperCount,
    notes:ho.notes
  });
  notify('تم','📦 تم توثيق التسليم من '+rb,'success');
  if(phone&&confirm('📱 إرسال إشعار واتساب للمراقب '+rb+'؟')){waMsg(phone,msg);}
  render();
}

// ─── 5) shareRet — إشعار واتساب من بطاقة المراقبين ───
function shareRet(eid){
  var t=window._selDate||gt();
  var ho=getHO(eid,t)||{};
  var ex=D.examSchedule.find(function(x){return x.id===eid;})||{};
  var mon=ho.returnedBy||'';
  var phone=getMonPhone(mon);
  var msg=buildWA('ho_return', ex, {
    monitor:mon, by:ho.returnedByCommittee||CU.name, time:ho.returnTime||'',
    present:ho.presentCount||0, absent:ho.absentCount||0,
    withdrawn:ho.withdrawnCount||0, deprived:ho.deprivedCount||0,
    cheating:ho.cheatingCount||0, papers:ho.paperCount||0,
    notes:ho.notes||''
  });
  if(!phone){
    // عرض قائمة لاختيار رقم
    var monitors=[ex.monitor1,ex.monitor2,ex.monitor3].filter(Boolean);
    var phones=monitors.map(function(m){return {name:m, phone:getMonPhone(m)};}).filter(function(x){return x.phone;});
    if(!phones.length){notify('تنبيه','لا يوجد رقم في الدليل','warning');return;}
    phone=phones[0].phone;
  }
  waMsg(phone,msg);
}

console.log('✅ قيود التاريخ + واتساب محسّن محمّلان');
</script>


<script>
// ══════════════════════════════════════════════════════
//  حارس عالمي — يمنع انهيار التطبيق عند CU===null
// ══════════════════════════════════════════════════════

// أ) حماية isViewOnly و isa من CU===null
// isViewOnly مُعاد تعريفها بشكل مباشر أعلاه — لا داعي لـ wrapper

// isa مُعرَّفة في الكود الرئيسي — نُعيد تعريفها هنا بشكل أكثر أماناً
function isa(u){ return u && ['head','vice','dean','owner'].includes(u.role); }
function isViewOnly(){ return CU && ['head','vice','dean'].includes(CU.role); }

// ب) لا نُلغّف render لتفادي stack overflow — الحماية مدمجة في الكود الرئيسي

// ج) sv محمي مباشرة في الكود الرئيسي

// د) اعتراض أي خطأ غير متوقع في الصفحة وإعادة التوجيه لتسجيل الدخول
window.addEventListener('error', function(ev){
  var msg = ev && ev.message ? ev.message : '';
  // فقط أخطاء CU===null أو Cannot read properties of null
  if(msg.indexOf('null') !== -1 && msg.indexOf('role') !== -1){
    console.warn('CU null guard triggered:', msg);
    if(!window.CU){
      var app = document.getElementById('app');
      if(app && typeof rLogin === 'function'){
        app.innerHTML = rLogin();
        return;
      }
    }
  }
});

// هـ) تأكد أن CU النسخ المحفوظة تُستعاد بأمان
(function(){
  try {
    var saved = sessionStorage.getItem('_cu_bak');
    if(saved && !window.CU){
      var parsed = JSON.parse(saved);
      if(parsed && parsed.role) window.CU = parsed;
    }
  } catch(e) {}
})();

// CU backup عبر event listener بدون render wrapping

console.log('✅ حارس CU===null مفعّل');
</script>

if(!window._repTab) window._repTab='summary';

// ── مساعدات مشتركة ──
function _repFilters(){
  return {
    day:   (document.getElementById('rf_day')   ||{}).value||'',
    course:(document.getElementById('rf_course')||{}).value||'',
    sec:   (document.getElementById('rf_sec')   ||{}).value||'',
    dept:  (document.getElementById('rf_dept')  ||{}).value||''
  };
}
function _filterExams(f){
  var ex=D.examSchedule.slice();
  if(f.day)    ex=ex.filter(function(e){return e.date===f.day;});
  if(f.course) ex=ex.filter(function(e){return(e.course||'').indexOf(f.course)>=0||(e.code||'').indexOf(f.course)>=0;});
  if(f.sec)    ex=ex.filter(function(e){return(e.section_type||'')===f.sec;});
  if(f.dept)   ex=ex.filter(function(e){return(e.department||e.dept||e.program||'')===f.dept;});
  return ex.sort(function(a,b){return(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||''));});
}
function _monSt(mn,date){
  if(!mn)return'';mn=mn.trim();
  var mid=typeof findMonitorId==='function'?findMonitorId(mn):null;
  var mo=mid?null:D.monitors.find(function(m){return m.name.trim()===mn;});
  var id=mid||(mo?mo.id:null);if(!id)return'<span class="rb rb-na">'+mn+'</span>';
  var att=D.attendance.find(function(a){return a.monitorId===id&&a.date===date;});
  var st=att?att.status:'none';
  var ic=st==='present'?'✅':st==='late'?'⏰':st==='absent'?'❌':'❓';
  var cl=st==='present'?'rb-ok':st==='late'?'rb-warn':st==='absent'?'rb-err':'rb-na';
  return'<span class="rb '+cl+'">'+ic+' '+mn+'</span>';
}
function _kpi(ic,val,lbl,col){
  return'<div class="rp-kpi"><div class="rp-kpi-ic">'+ic+'</div>'+
    '<div class="rp-kpi-val" style="color:'+col+'">'+val+'</div>'+
    '<div class="rp-kpi-lbl">'+lbl+'</div></div>';
}
function _byDayHeader(d,ex){
  var dx=ex[0];
  return'<tr><td class="rp-day" colspan="99">📅 '+d+(dx&&dx.day?' — '+dx.day:'')+' ('+ex.length+' اختبار)</td></tr>';
}
function _opt(arr,v,ph){
  return'<option value="">'+ph+'</option>'+arr.map(function(x){
    return'<option value="'+x+'" '+(x===v?'selected':'')+'>'+x+'</option>';
  }).join('');
}
function _filterBar(extra){
  var f=_repFilters();
  var allDays=[...new Set(D.examSchedule.map(function(e){return e.date;}).filter(Boolean))].sort();
  var allSecs=[...new Set(D.examSchedule.map(function(e){return e.section_type||'';}).filter(Boolean))].sort();
  var allDepts=[...new Set(D.examSchedule.map(function(e){return e.department||e.dept||e.program||'';}).filter(Boolean))].sort();
  return'<div class="rp-flt">'+
    '<select class="fi" id="rf_day"    onchange="render()" style="padding:7px;font-size:12px">'+_opt(allDays,f.day,'📅 كل الأيام')+'</select>'+
    '<input  class="fi" id="rf_course" oninput="render()" style="padding:7px;font-size:12px" placeholder="🔍 المقرر / الرمز" value="'+f.course+'"/>'+
    '<select class="fi" id="rf_sec"    onchange="render()" style="padding:7px;font-size:12px">'+_opt(allSecs,f.sec,'👥 طلاب / طالبات')+'</select>'+
    '<select class="fi" id="rf_dept"   onchange="render()" style="padding:7px;font-size:12px">'+_opt(allDepts,f.dept,'🎓 كل البرامج')+'</select>'+
    (extra||'')+
    '<button class="btn bo" onclick="document.getElementById(\'rf_day\').value=\'\';document.getElementById(\'rf_course\').value=\'\';document.getElementById(\'rf_sec\').value=\'\';document.getElementById(\'rf_dept\').value=\'\';render()" style="padding:7px;font-size:12px">🔄 مسح</button>'+
  '</div>';
}

// ════════════════════════════════════════════
//  الصفحة الرئيسية
// ════════════════════════════════════════════
function pgRep(){
  var tabs=[
    {id:'summary',  ic:'📊', lbl:'الملخص العام'},
    {id:'monitors', ic:'👮', lbl:'المراقبون'},
    {id:'handover', ic:'📦', lbl:'تسليم للمراقبين'},
    {id:'receipt',  ic:'📚', lbl:'استلام المنسق / إعادة المحاضر'},
  ];
  var tabBar='<div class="rp-tabs">'+tabs.map(function(t){
    return'<button class="rp-tab'+(window._repTab===t.id?' av':'')+'" onclick="window._repTab=\''+t.id+'\';render()">'+t.ic+'<br>'+t.lbl+'</button>';
  }).join('')+'</div>';

  var body='';
  if(window._repTab==='summary')  body=_tabSummary();
  else if(window._repTab==='monitors') body=_tabMonitors();
  else if(window._repTab==='handover') body=_tabHandover();
  else if(window._repTab==='receipt')  body=_tabReceipt();

  return'<div class="ph"><h1>📈 التقارير</h1>'+
    '<p style="font-size:12px;color:var(--txt3)">'+D.settings.collegeName+(D.settings.semester?' — '+D.settings.semester:'')+'</p></div>'+
    tabBar+body;
}

// ════════════════════════════════════════════
//  تبويب ١: الملخص العام
// ════════════════════════════════════════════
function _tabSummary(){
  var f=_repFilters();
  var exams=_filterExams(f);
  var totEnr=0,totPr=0,totAb=0,totPap=0,totHo=0,totRG=0,totRR=0;
  var mMap={};
  exams.forEach(function(e){
    var ho=(D.handovers||[]).find(function(h){return h.examId===e.id&&h.date===e.date;})||{};
    var rc=(D.examReceipts||[]).find(function(r){return r.examId===e.id;})||{};
    totEnr+=parseInt(e.enrolled)||0;
    if(ho.returned){totPr+=parseInt(ho.presentCount)||0;totAb+=parseInt(ho.absentCount)||0;totPap+=parseInt(ho.paperCount)||0;totHo++;}
    if(rc.receivedFrom)totRG++;if(rc.returnedTo)totRR++;
    [e.monitor1,e.monitor2,e.monitor3].filter(Boolean).forEach(function(mn){
      mn=mn.trim();var mid=typeof findMonitorId==='function'?findMonitorId(mn):null;
      var mo=mid?null:D.monitors.find(function(m){return m.name.trim()===mn;});
      var id=mid||(mo?mo.id:null);if(!id)return;
      var att=D.attendance.find(function(a){return a.monitorId===id&&a.date===e.date;});
      var st=att?att.status:'none';if(!mMap[mn]||st==='present')mMap[mn]=st;
    });
  });
  var mNames=Object.keys(mMap);
  var mPr=mNames.filter(function(n){return mMap[n]==='present';}).length;
  var mLt=mNames.filter(function(n){return mMap[n]==='late';}).length;
  var mAb=mNames.filter(function(n){return mMap[n]==='absent';}).length;
  var mNr=mNames.filter(function(n){return mMap[n]==='none';}).length;
  var mTot=mNames.length;
  var aRate=mTot>0?Math.round((mPr+mLt)/mTot*100):0;
  var prRate=totEnr>0?Math.round(totPr/totEnr*100):0;

  var kpis='<div class="rp-kpis">'+
    _kpi('📝',exams.length,'اختبار','var(--accent)')+
    _kpi('👥',totEnr,'مسجّل','var(--accent2)')+
    _kpi('✅',totPr,'حاضر','var(--ok)')+
    _kpi('❌',totAb,'غائب','var(--err)')+
    _kpi('📄',totPap,'ورقة','var(--accent)')+
    _kpi('👮',mTot,'مراقب','var(--purple)')+
    _kpi(aRate+'%',mPr+mLt+'/'+mTot,'حضور المراقبين',aRate>=80?'var(--ok)':aRate>=50?'var(--warn)':'var(--err)')+
    _kpi(prRate+'%',totPr+'/'+totEnr,'نسبة الحضور',prRate>=70?'var(--ok)':prRate>=50?'var(--warn)':'var(--err)')+
    _kpi('📦',totHo+'/'+exams.length,'تسليم للمراقب',totHo===exams.length&&exams.length>0?'var(--ok)':'var(--warn)')+
    _kpi('📥',totRG+'/'+exams.length,'استلام المحاضر',totRG===exams.length&&exams.length>0?'var(--ok)':'var(--warn)')+
    _kpi('📤',totRR+'/'+exams.length,'إعادة للمحاضر',totRR===exams.length&&exams.length>0?'var(--ok)':'var(--warn)')+
  '</div>';

  // ملخص حسب البرنامج
  var byProg={};
  exams.forEach(function(e){
    var p=e.program||e.department||e.dept||'غير محدد';
    if(!byProg[p])byProg[p]={exams:0,enr:0,pr:0,ab:0,pap:0,ho:0};
    var ho=(D.handovers||[]).find(function(h){return h.examId===e.id&&h.date===e.date;})||{};
    byProg[p].exams++;byProg[p].enr+=parseInt(e.enrolled)||0;
    if(ho.returned){byProg[p].pr+=parseInt(ho.presentCount)||0;byProg[p].ab+=parseInt(ho.absentCount)||0;byProg[p].pap+=parseInt(ho.paperCount)||0;byProg[p].ho++;}
  });
  var progRows=Object.keys(byProg).map(function(p,i){
    var d=byProg[p];var r=d.enr>0?Math.round(d.pr/d.enr*100):0;
    return'<tr><td>'+(i+1)+'</td><td style="text-align:right;font-weight:700">'+p+'</td>'+
      '<td>'+d.exams+'</td><td>'+d.enr+'</td>'+
      '<td style="color:var(--ok);font-weight:700">'+d.pr+'</td>'+
      '<td style="color:var(--err);font-weight:700">'+d.ab+'</td>'+
      '<td style="color:var(--accent);font-weight:700">'+d.pap+'</td>'+
      '<td><span class="rb '+(r>=70?'rb-ok':r>=50?'rb-warn':'rb-err')+'">'+r+'%</span></td>'+
      '<td style="color:var(--ok)">'+d.ho+'/'+d.exams+'</td></tr>';
  }).join('');

  var progTable=Object.keys(byProg).length===0?'':
    '<div class="rp-sec"><div class="rp-sec-hdr"><span class="rp-sec-ttl">📊 ملخص حسب البرنامج</span></div>'+
    '<div style="overflow-x:auto"><table class="rp-tbl"><thead><tr>'+
    '<th>#</th><th>البرنامج</th><th>اختبارات</th><th>مسجّل</th><th>✅ حضر</th><th>❌ غاب</th><th>📄 أوراق</th><th>نسبة</th><th>📦 تسليم</th>'+
    '</tr></thead><tbody>'+progRows+'</tbody></table></div></div>';

  var toolbar='<div class="toolbar" style="margin-bottom:12px">'+
    '<button class="btn bp bs" onclick="repExport()">📊 Excel</button>'+
    '<button class="btn bo bs" onclick="repPrint()">🖨️ طباعة</button></div>';

  return _filterBar()+kpis+toolbar+progTable;
}

// ════════════════════════════════════════════
//  تبويب ٢: المراقبون
// ════════════════════════════════════════════
function _tabMonitors(){
  var f=_repFilters();
  var exams=_filterExams(f);
  var mMap={};
  exams.forEach(function(e){
    [e.monitor1,e.monitor2,e.monitor3].filter(Boolean).forEach(function(mn){
      mn=mn.trim();if(!mMap[mn])mMap[mn]={exams:[],pr:0,lt:0,ab:0,nr:0};
      mMap[mn].exams.push(e);
      var mid=typeof findMonitorId==='function'?findMonitorId(mn):null;
      var mo=mid?null:D.monitors.find(function(m){return m.name.trim()===mn;});
      var id=mid||(mo?mo.id:null);if(!id){mMap[mn].nr++;return;}
      var att=D.attendance.find(function(a){return a.monitorId===id&&a.date===e.date;});
      var st=att?att.status:'none';
      if(st==='present')mMap[mn].pr++;else if(st==='late')mMap[mn].lt++;else if(st==='absent')mMap[mn].ab++;else mMap[mn].nr++;
    });
  });
  var mNames=Object.keys(mMap);
  var totPr =mNames.filter(function(n){return mMap[n].pr>0&&!mMap[n].lt&&!mMap[n].ab;}).length;
  var totLt =mNames.filter(function(n){return mMap[n].lt>0&&!mMap[n].pr;}).length;
  var totAb =mNames.filter(function(n){return mMap[n].ab>0&&!mMap[n].pr&&!mMap[n].lt;}).length;
  var totNr =mNames.filter(function(n){return mMap[n].pr===0&&mMap[n].lt===0&&mMap[n].ab===0;}).length;
  var kpis='<div class="rp-kpis">'+
    _kpi('👮',mNames.length,'إجمالي المراقبين','var(--purple)')+
    _kpi('✅',totPr,'حاضر','var(--ok)')+
    _kpi('⏰',totLt,'متأخر','var(--warn)')+
    _kpi('❌',totAb,'غائب','var(--err)')+
    _kpi('❓',totNr,'لم يسجّل','var(--txt3)')+
  '</div>';

  var rows=mNames.map(function(mn,i){

    var regTime='-';
    (function(){
      var mid2=typeof findMonitorId==='function'?findMonitorId(mn):null;
      if(!mid2){var mo2=D.monitors.find(function(m){return m.name.trim()===mn;});if(mo2)mid2=mo2.id;}
      if(!mid2)return;
      // آخر تسجيل حضور
      var recs2=D.attendance.filter(function(a){return a.monitorId===mid2;});
      recs2.sort(function(a,b){return (b.date+' '+(b.recordTime||'')).localeCompare(a.date+' '+(a.recordTime||''));});

      '<td><span class="rb '+(rate>=80?'rb-ok':rate>=50?'rb-warn':'rb-err')+'">'+rate+'%</span></td>'+
      '<td>'+exTot+'</td>'+
      '<td style="font-size:10px;color:var(--txt3)">'+regTime+'</td>'+
    '</tr>';
  }).join('');

  return _filterBar(
    '<button class="btn bok" onclick="repMonExport()" style="padding:7px;font-size:12px">📊 Excel</button>')+

      '<span class="rp-sec-ttl">👮 تفاصيل حضور المراقبين</span>'+
      '<span class="rp-chip" style="background:rgba(155,89,182,.12);color:var(--purple)">'+mNames.length+' مراقب</span>'+
    '</div>'+
    '<div style="overflow-x:auto"><table class="rp-tbl">'+
      '<thead><tr><th>#</th><th>المراقب</th><th>الحالة</th>'+
      '<th>✅ حاضر</th><th>⏰ متأخر</th><th>❌ غائب</th><th>❓ لم يسجل</th><th>نسبة الحضور</th><th>اختبارات</th><th>آخر تسجيل</th></tr></thead>'+

function logAudit(action, details, examId){
  if(!D.auditLog) D.auditLog = [];
  var n = new Date();
  var ti = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  var entry = {
    id:      gid(),
    date:    gt(),
    time:    ti,
    user:    CU ? CU.name : 'النظام',
    role:    CU ? CU.role : '',
    action:  action,
    details: details || '',
    examId:  examId || ''
  };
  D.auditLog.unshift(entry);          // أحدث أولاً
  if(D.auditLog.length > 500) D.auditLog = D.auditLog.slice(0,500); // حد أقصى 500
  sv();
}

      '<thead><tr style="background:rgba(30,41,59,.7)">'+
        '<th style="color:#e2e8f0;padding:8px 6px;text-align:center;font-size:10px">#</th>'+
        '<th style="color:#e2e8f0;padding:8px 6px;font-size:10px">التاريخ والوقت</th>'+

window._remindShownDate = '';

function checkSmartReminders(){
  var today = gt();
  if(window._remindShownDate === today) return; // مرة واحدة في اليوم
  if(!CU) return;

  var todayExams = D.examSchedule.filter(function(e){return e.date===today;});
  if(!todayExams.length) return;

  var reminders = [];

  // ① اختبارات لم يُستلم من منسقها
  var noRcpt = todayExams.filter(function(e){
    var r = getR(e.id);
    return !r || !r.receivedFrom;
  });
  if(noRcpt.length)
    reminders.push({ic:'📥', color:'var(--warn)', msg:'<strong>'+noRcpt.length+' اختبار</strong> لم يُستلم من المنسق بعد',
      btn:'عرض', action:"go('examreceipt')"});

  // ② اختبارات لم يُسلَّم للمراقب
  var noHO = todayExams.filter(function(e){
    var ho = getHO(e.id, today);
    return !ho || !ho.received;
  });
  if(noHO.length)
    reminders.push({ic:'📦', color:'var(--accent)', msg:'<strong>'+noHO.length+' اختبار</strong> لم يُسلَّم للمراقب',
      btn:'تسليم', action:"go('handover')"});

  // ③ مراقبون لم يُسجَّل حضورهم
  var monNames = new Set();
  todayExams.forEach(function(e){
    [e.monitor1,e.monitor2,e.monitor3].filter(Boolean).forEach(function(m){monNames.add(m.trim());});
  });
  var noAtt = [...monNames].filter(function(mn){
    var mid = typeof findMonitorId==='function' ? findMonitorId(mn) : null;
    if(!mid) return true;
    return !D.attendance.find(function(a){return a.monitorId===mid && a.date===today;});
  });
  if(noAtt.length)
    reminders.push({ic:'👮', color:'var(--err)', msg:'<strong>'+noAtt.length+' مراقب</strong> لم يُسجَّل حضورهم بعد',
      btn:'تسجيل', action:"go('rec')"});

  if(!reminders.length){ window._remindShownDate = today; return; }

  // عرض لوحة التذكيرات
  _showRemindPanel(today, reminders, todayExams);
}

function _showRemindPanel(today, reminders, todayExams){

  var panel = document.createElement('div');
  panel.id = 'remind-panel';

    'max-width:460px;width:calc(100% - 24px);background:var(--card);border:1px solid var(--brd);'+
    'border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);direction:rtl;overflow:hidden;animation:slideUp .3s ease';

  document.head.appendChild(style);

  var dayEx = todayExams[0];
  var dayLabel = today + (dayEx&&dayEx.day?' — '+dayEx.day:'');

  var items = reminders.map(function(r){
    return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--brd)">'+
      '<span style="font-size:20px">'+r.ic+'</span>'+
      '<div style="flex:1;font-size:13px;color:var(--txt)">'+r.msg+'</div>'+
      '<button class="btn bp bx" onclick="'+r.action+';document.getElementById(\'remind-panel\').remove()" style="font-size:11px;padding:4px 10px;white-space:nowrap">'+r.btn+'</button>'+
    '</div>';
  }).join('');

  panel.innerHTML =
    '<div style="padding:12px 16px;background:linear-gradient(135deg,rgba(243,156,18,.15),rgba(231,76,60,.1));display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--brd)">'+
      '<span style="font-size:18px">🔔</span>'+
      '<div style="flex:1"><div style="font-weight:800;font-size:14px;color:var(--txt)">تذكيرات اليوم</div>'+
        '<div style="font-size:11px;color:var(--txt3)">📅 '+dayLabel+' · '+todayExams.length+' اختبار</div></div>'+
      '<button onclick="document.getElementById(\'remind-panel\').remove();window._remindShownDate=\''+today+'\'" '+
        'style="background:none;border:none;color:var(--txt3);font-size:20px;cursor:pointer;padding:4px">✕</button>'+
    '</div>'+
    items+
    '<div style="padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn bok bx" onclick="remindAllMonitors(\''+today+'\')" style="font-size:12px;flex:1">📱 تذكير المراقبين</button>'+
      '<button class="btn bp bx" onclick="remindAllCoords(\''+today+'\')" style="font-size:12px;flex:1">📱 تذكير المنسقين</button>'+
      '<button class="btn bo bx" onclick="document.getElementById(\'remind-panel\').remove();window._remindShownDate=\''+today+'\'" style="font-size:12px">تجاهل</button>'+
    '</div>';

  document.body.appendChild(panel);
  window._remindShownDate = today;
}

// ── تذكير جماعي للمراقبين ──
function remindAllMonitors(date){
  date = date || gt();
  var exams = D.examSchedule.filter(function(e){return e.date===date;});
  var sent = 0, noPhone = [];
  var monSent = new Set();

  exams.forEach(function(e){
    [e.monitor1,e.monitor2,e.monitor3].filter(Boolean).forEach(function(mn){
      mn = mn.trim();
      if(monSent.has(mn)) return;
      monSent.add(mn);
      var phone = getMonPhone(mn);
      if(!phone){ noPhone.push(mn); return; }
      var msg = buildWA('ho_receive_reminder', e, {monitor:mn});
      waMsg(phone, msg);
      sent++;
    });
  });

  logAudit('تذكير جماعي للمراقبين', 'تم الإرسال لـ '+sent+' مراقب، بدون رقم: '+noPhone.join('، '), '');
  notify('تم','📱 تم إرسال التذكير لـ '+sent+' مراقب'+(noPhone.length?' — '+noPhone.length+' بدون رقم':''),'success');
  if(document.getElementById('remind-panel')) document.getElementById('remind-panel').remove();
}

// ── تذكير جماعي للمنسقين ──
function remindAllCoords(date){
  date = date || gt();
  var exams = D.examSchedule.filter(function(e){return e.date===date;});
  var sent = 0, noPhone = [], coordSent = {};

  exams.forEach(function(e){
    var r = getR(e.id);
    if(r && r.receivedFrom) return; // تم الاستلام مسبقاً
    var coord = e.coordinator || '';
    if(!coord) return;
    var phone = getMonPhone(coord);
    if(!phone){ if(!coordSent[coord]) noPhone.push(coord); coordSent[coord]=true; return; }
    if(coordSent[coord]) return;
    coordSent[coord] = true;
    var msg = buildWA('coord_reminder', e, {coord:coord});
    waMsg(phone, msg);
    sent++;
  });

  logAudit('تذكير المنسقين بتسليم الاختبارات', 'تم الإرسال لـ '+sent+' منسق', '');
  notify('تم','📱 تم إرسال التذكير لـ '+sent+' منسق'+(noPhone.length?' — '+noPhone.length+' بدون رقم':''),'success');
  if(document.getElementById('remind-panel')) document.getElementById('remind-panel').remove();
}

// ── زر تذكير المراقب المنفرد في صفحة الحضور ──
function remindSingleMonitor(monName, examId){
  var ex = D.examSchedule.find(function(e){return e.id===examId;})||{};
  var phone = getMonPhone(monName);
  if(!phone){ notify('تنبيه','لا يوجد رقم لـ '+monName,'warning'); return; }
  var msg = buildWA('ho_receive_reminder', ex, {monitor:monName});
  waMsg(phone, msg);
  logAudit('تذكير مراقب', 'المراقب: '+monName+' | '+(ex.course||''), examId);
  notify('تم','📱 تم إرسال التذكير لـ '+monName,'success');
}

// ──────────────────────────────────────────
//  ③ تحسينات واتساب — قوالب جديدة
// ──────────────────────────────────────────

// أضف قالبَي التذكير لـ buildWA
var _origBuildWA = window.buildWA;
window.buildWA = function(type, ex, extra){
  var col = D.settings.collegeName || 'كلية الأعمال';
  var sem = D.settings.semester || '';
  var border = '━━━━━━━━━━━━━━━━━━━━';
  ex = ex || {};
  extra = extra || {};

  if(type === 'ho_receive_reminder'){
    // تذكير مراقب بالحضور وتسليم الاختبارات
    return [
      '🎓 ' + col, sem?'📆 '+sem:'', border,
      '🔔 *تذكير — مراقبة الاختبار*', border,
      'سعادة الأستاذ/الدكتور: *' + (extra.monitor||'') + '*',
      'تحية طيبة وبعد،',
      '',
      'نُذكِّركم بمراقبة اختبار:',
      '📚 المقرر: *' + (ex.course||'-') + '*',
      ex.code   ? '🔖 الرمز: '    + ex.code   : '',
      ex.section? '📋 الشعبة: '   + ex.section : '',
      ex.hall   ? '🏢 القاعة: '   + ex.hall    : '',
      ex.time   ? '⏰ الوقت: '    + ex.time    : '',
      ex.date   ? '📅 التاريخ: '  + ex.date    : '',
      border,
      '⚠️ يرجى الحضور قبل الاختبار بـ *15 دقيقة*',
      'والتواصل مع لجنة الاختبارات عند الوصول',
      border,
      '🌹 شكراً لتعاونكم — ' + col
    ].filter(function(l){return l!=='';}).join('\n');
  }

  if(type === 'coord_reminder'){
    // تذكير منسق بتسليم الاختبارات للجنة
    return [
      '🎓 ' + col, sem?'📆 '+sem:'', border,
      '🔔 *تذكير — تسليم أوراق الاختبار*', border,
      'سعادة الأستاذ/الدكتور: *' + (extra.coord||'') + '*',
      'تحية طيبة وبعد،',
      '',
      'نُذكِّركم بتسليم أوراق اختبار:',
      '📚 المقرر: *' + (ex.course||'-') + '*',
      ex.code   ? '🔖 الرمز: '    + ex.code   : '',
      ex.section? '📋 الشعبة: '   + ex.section : '',
      ex.hall   ? '🏢 القاعة: '   + ex.hall    : '',
      ex.time   ? '⏰ الوقت: '    + ex.time    : '',
      ex.date   ? '📅 التاريخ: '  + ex.date    : '',
      border,
      '📌 يرجى تسليم الأوراق إلى لجنة الاختبارات',
      'قبل موعد الاختبار مباشرة',
      border,
      '🌹 شكراً لتعاونكم — ' + col
    ].filter(function(l){return l!=='';}).join('\n');
  }

  // fallback للقوالب الأصلية
  return _origBuildWA ? _origBuildWA(type, ex, extra) : '';
};

// ── أضف زر "تذكير المراقبين" في صفحة الاستلام والتسليم ──
var _origWaBulkRemind = window.waBulkRemind;
window.waBulkRemind = function(){
  remindAllMonitors(window._selDate || gt());
};

// ──────────────────────────────────────────
//  تشغيل التذكيرات عند فتح التطبيق
// ──────────────────────────────────────────
// يُشغَّل عند كل render إذا كان اليوم يختلف
var _origRenderForRemind = window.render;
window.render = function(){
  _origRenderForRemind && _origRenderForRemind();
  if(CU && CU.role !== 'owner') {
    setTimeout(checkSmartReminders, 800);
  }
};

console.log('✅ نظام الإشعارات والتدقيق والتذكيرات محمّل');
</script>


<script>

// ── دوال Queue الأساسية ──

function queueAdd(to, phone, msg, type, examId){
  if(!D.waQueue) D.waQueue = [];
  // تجنب التكرار
  var exists = D.waQueue.find(function(q){
    return q.phone===phone && q.status==='pending' && q.examId===examId && q.type===type;
  });
  if(exists) return;
  D.waQueue.push({
    id:      gid(),
    to:      to,
    phone:   formatPhone(phone),
    msg:     msg,
    type:    type,
    examId:  examId||'',
    status:  'pending',
    addedAt: gt()+' '+nt(),
    sentAt:  ''
  });
  sv();
  queueRenderBtn();
  logAudit('إضافة للقائمة', 'إلى: '+to+' | '+type, examId);
}

function queuePending(){
  return (D.waQueue||[]).filter(function(q){return q.status==='pending';});
}

function queueNext(){
  return queuePending()[0] || null;
}

function queueSend(id){
  var q = (D.waQueue||[]).find(function(x){return x.id===id;});
  if(!q || !q.phone) return;
  // افتح واتساب
  window.open('https://wa.me/'+q.phone+'?text='+encodeURIComponent(q.msg));
  // بعد ثانيتين اعتبرها مُرسلة
  setTimeout(function(){
    q.status = 'sent';
    q.sentAt = gt()+' '+nt();
    sv();
    logAudit('إرسال واتساب', 'إلى: '+q.to, q.examId);
    queueRenderPanel();
    queueRenderBtn();
  }, 1500);
}

function queueSkip(id){
  var q = (D.waQueue||[]).find(function(x){return x.id===id;});
  if(!q) return;
  q.status = 'skipped';
  sv();
  logAudit('تخطّي رسالة', 'إلى: '+q.to, q.examId);
  queueRenderPanel();
  queueRenderBtn();
}

function queueClear(){
  D.waQueue = (D.waQueue||[]).filter(function(q){return q.status==='pending';});
  sv();
  queueRenderPanel();
  queueRenderBtn();
}

function queueClearAll(){
  if(!confirm('حذف كل قائمة الرسائل (المُرسَلة والمعلقة)؟')) return;
  D.waQueue = [];
  sv();
  queueHidePanel();
  queueRenderBtn();
}

// ── زر عائم ──

function queueRenderBtn(){
  var pending = queuePending().length;
  var btn = document.getElementById('wa-queue-btn');
  if(!btn){
    btn = document.createElement('button');
    btn.id = 'wa-queue-btn';
    btn.title = 'قائمة رسائل واتساب';
    btn.onclick = function(){ queueTogglePanel(); };
    btn.innerHTML = '<span style="font-size:22px">📨</span><span id="wa-queue-badge" style="display:none"></span>';
    document.body.appendChild(btn);
  }
  var badge = document.getElementById('wa-queue-badge');
  if(badge){
    if(pending > 0){
      badge.textContent = pending > 99 ? '99+' : pending;
      badge.style.display = 'flex';
      // نبضة إذا فيه رسائل
      btn.style.animation = 'none';
      setTimeout(function(){ btn.style.animation = 'qPulse 2s ease infinite'; }, 50);
    } else {
      badge.style.display = 'none';
      btn.style.animation = 'none';
    }
  }
}

var _queuePanelOpen = false;
function queueTogglePanel(){
  _queuePanelOpen ? queueHidePanel() : queueShowPanel();
}

function queueHidePanel(){
  var p = document.getElementById('wa-queue-panel');
  if(p) p.remove();
  _queuePanelOpen = false;
}

function queueShowPanel(){
  queueHidePanel();
  _queuePanelOpen = true;
  queueRenderPanel();
}

function queueRenderPanel(){
  if(!_queuePanelOpen) return;
  var existing = document.getElementById('wa-queue-panel');
  if(existing) existing.remove();

  var pending  = queuePending();
  var all      = D.waQueue || [];
  var sent     = all.filter(function(q){return q.status==='sent';});
  var skipped  = all.filter(function(q){return q.status==='skipped';});
  var total    = pending.length + sent.length;
  var progress = total > 0 ? Math.round(sent.length / total * 100) : 0;
  var next     = pending[0];

  var typeLabel = {
    'reminder_monitor':  '🔔 تذكير مراقب',
    'reminder_coord':    '🔔 تذكير منسق',
    'receipt_get':       '📥 استلام من المنسق',
    'receipt_ret':       '📤 إعادة للمحاضر',
    'handover_rcv':      '📦 تسليم للمراقب',
    'handover_ret':      '✅ استلام من المراقب',
    'attendance':        '📝 إشعار حضور',
    'attendance_absent':  '❌ إشعار غياب',
    'attendance_late':    '⏰ استفسار تأخر',
    'attendance_thanks':  '🌹 شكر وتقدير',
    'schedule_notify':    '📋 إرسال جدول مراقبات',
    'general':           '📨 رسالة عامة'
  };

  // ── المحتوى الرئيسي ──
  var mainContent = '';

  if(!next && pending.length === 0){
    // كل الرسائل أُرسلت أو لا يوجد رسائل
    if(sent.length > 0){
      mainContent = '<div class="q-empty">'+
        '<div style="font-size:36px;margin-bottom:8px">✅</div>'+
        '<div style="font-weight:700;color:var(--ok)">تم إرسال جميع الرسائل!</div>'+
        '<div style="margin-top:4px">أُرسلت '+sent.length+' رسالة'+(skipped.length?' — تخطّي '+skipped.length:'')+'</div>'+
        '<button onclick="queueClearAll()" style="margin-top:12px;padding:6px 16px;background:var(--bg);border:1px solid var(--brd);border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit">🗑 مسح السجل</button>'+
      '</div>';
    } else {
      mainContent = '<div class="q-empty">'+
        '<div style="font-size:36px;margin-bottom:8px">📭</div>'+
        '<div>لا توجد رسائل في القائمة</div>'+
        '<div style="font-size:11px;color:var(--txt3);margin-top:4px">ستُضاف تلقائياً عند أي عملية</div>'+
      '</div>';
    }
  } else {
    // عرض الرسالة التالية
    var ex = next.examId ? D.examSchedule.find(function(e){return e.id===next.examId;}) : null;
    mainContent =
      '<div class="q-to">'+
        '<span>'+( typeLabel[next.type]||'📨')+'</span>'+
        '<span class="q-to-name">'+next.to+'</span>'+
        (pending.length > 1 ? '<span style="margin-right:auto;color:var(--accent2);font-weight:700">'+pending.length+' متبقي</span>' : '')+
      '</div>'+
      (ex ? '<div style="font-size:10px;color:var(--txt3);margin-bottom:6px">📚 '+(ex.course||'-')+' | 🏢 '+(ex.hall||'-')+'</div>' : '')+
      '<div class="q-msg-box">'+next.msg.replace(/\n/g,'<br>')+'</div>'+
      '<div class="q-actions">'+
        '<button class="q-send" onclick="queueSend(\''+next.id+'\')">'+
          '📱 إرسال عبر واتساب'+
        '</button>'+
        '<button class="q-skip" onclick="queueSkip(\''+next.id+'\')" title="تخطّي هذه الرسالة">⏭</button>'+
      '</div>';

    // قائمة الرسائل المتبقية
    if(pending.length > 1){
      mainContent += '<div style="margin-top:10px;max-height:100px;overflow-y:auto">'+
        pending.slice(1).map(function(q,i){
          return '<div class="q-sent-item">'+
            '<span style="color:var(--warn)">⏳</span>'+
            '<span style="font-weight:600;flex:1">'+q.to+'</span>'+
            '<span style="color:var(--txt3)">'+( typeLabel[q.type]||'')+'</span>'+
            '<button onclick="queueSkip(\''+q.id+'\')" style="background:none;border:none;color:var(--txt3);cursor:pointer;font-size:12px;padding:0 4px" title="تخطّي">✕</button>'+
          '</div>';
        }).join('')+
      '</div>';
    }
  }

  // ── سجل المُرسَل ──
  var sentLog = sent.length > 0 ?
    '<div style="margin-top:10px;border-top:1px solid var(--brd);padding-top:8px">'+
      '<div style="font-size:10px;color:var(--txt3);font-weight:700;margin-bottom:4px">✅ تم الإرسال ('+sent.length+')</div>'+
      '<div style="max-height:80px;overflow-y:auto">'+
      sent.slice(-5).reverse().map(function(q){
        return '<div class="q-sent-item">'+
          '<span style="color:var(--ok)">✅</span>'+
          '<span style="flex:1;font-weight:600">'+q.to+'</span>'+
          '<span style="color:var(--txt3)">'+q.sentAt+'</span>'+
        '</div>';
      }).join('')+
      '</div>'+
    '</div>' : '';

  var panel = document.createElement('div');
  panel.id = 'wa-queue-panel';
  panel.innerHTML =
    '<div class="q-hdr">'+
      '<span style="font-size:20px">📨</span>'+
      '<div class="q-hdr-title">قائمة رسائل واتساب</div>'+
      '<span style="font-size:11px;opacity:.85">'+sent.length+'/'+total+' أُرسل</span>'+
      '<button class="q-hdr-close" onclick="queueHidePanel()">✕</button>'+
    '</div>'+
    '<div class="q-progress"><div class="q-progress-fill" style="width:'+progress+'%"></div></div>'+
    '<div class="q-body">'+
      mainContent+
      sentLog+
    '</div>'+
    (total > 0 ?
    '<div class="q-footer">'+
      '<button onclick="queueClear()" style="background:none;border:none;cursor:pointer;color:var(--txt3);font-size:11px;padding:0;font-family:inherit">🗑 مسح المُكتمل</button>'+
      '<span>'+sent.length+' ✅ '+skipped.length+' ⏭</span>'+
    '</div>' : '');

  document.body.appendChild(panel);
}

// ── CSS نبضة ──
(function(){
  var s = document.createElement('style');
  s.textContent = '@keyframes qPulse{0%,100%{box-shadow:0 4px 16px rgba(0,0,0,.4)}50%{box-shadow:0 4px 24px rgba(37,211,102,.6)}}';
  document.head.appendChild(s);
})();

// ══════════════════════════════════════════════════════════════
//  ربط Queue بالعمليات الموجودة
// ══════════════════════════════════════════════════════════════

// ── استلام من المنسق → Queue ──
(function(){
  var _orig = window.rcptSaveGet;
  window.rcptSaveGet = function(eid){
    _orig && _orig(eid);
    setTimeout(function(){
      var r = getR(eid); var ex = D.examSchedule.find(function(e){return e.id===eid;})||{};
      if(r && r.receivedFrom){
        var phone = getMonPhone(r.receivedFrom);
        if(phone){
          var msg = buildWA('rcpt_get', ex, {from:r.receivedFrom, by:CU.name, time:r.receiveTime, note:r.step1Notes||''});
          queueAdd(r.receivedFrom, phone, msg, 'receipt_get', eid);
          notify('📨', 'أُضيف إشعار الاستلام لقائمة واتساب', 'info');
        }
      }
    }, 200);
  };
})();

// ── إعادة للمحاضر → Queue ──
(function(){
  var _orig = window.rcptSaveRet;
  window.rcptSaveRet = function(eid){
    _orig && _orig(eid);
    setTimeout(function(){
      var r = getR(eid); var ex = D.examSchedule.find(function(e){return e.id===eid;})||{};
      var ho = getHO2(eid, r?r.examDate||gt():gt())||{};
      if(r && r.returnedTo){
        var phone = getMonPhone(r.returnedTo);
        if(phone){
          var msg = buildWA('rcpt_ret', ex, {to:r.returnedTo, by:CU.name, time:r.returnTime,
            present:ho.presentCount||0, absent:ho.absentCount||0,
            withdrawn:ho.withdrawnCount||0, deprived:ho.deprivedCount||0,
            cheating:ho.cheatingCount||0, papers:ho.paperCount||0, notes:ho.notes||''});
          queueAdd(r.returnedTo, phone, msg, 'receipt_ret', eid);
          notify('📨', 'أُضيف إشعار الإعادة لقائمة واتساب', 'info');
        }
      }
    }, 200);
  };
})();

// ── تسليم للمراقب → Queue ──
(function(){
  var _orig = window.doRcvSave;
  window.doRcvSave = function(eid){
    _orig && _orig(eid);
    setTimeout(function(){
      var t = window._selDate||gt();
      var ho = getHO(eid,t)||{}; var ex = D.examSchedule.find(function(e){return e.id===eid;})||{};
      if(ho.received && ho.receivedBy){
        var phone = getMonPhone(ho.receivedBy);
        if(phone){
          var msg = buildWA('ho_receive', ex, {monitor:ho.receivedBy, by:CU.name, time:ho.receiveTime, onBehalf:ho.receivedOnBehalf||''});
          queueAdd(ho.receivedBy, phone, msg, 'handover_rcv', eid);
          notify('📨', 'أُضيف إشعار التسليم لقائمة واتساب', 'info');
        }
      }
    }, 200);
  };
})();

// ── استلام من المراقب → Queue ──
(function(){
  var _orig = window.doRet;
  window.doRet = function(eid){
    _orig && _orig(eid);
    setTimeout(function(){
      var t = window._selDate||gt();
      var ho = getHO(eid,t)||{}; var ex = D.examSchedule.find(function(e){return e.id===eid;})||{};
      if(ho.returned && ho.returnedBy){
        var phone = getMonPhone(ho.returnedBy);
        if(phone){
          var msg = buildWA('ho_return', ex, {monitor:ho.returnedBy, by:CU.name, time:ho.returnTime,
            present:ho.presentCount||0, absent:ho.absentCount||0,
            withdrawn:ho.withdrawnCount||0, deprived:ho.deprivedCount||0,
            cheating:ho.cheatingCount||0, papers:ho.paperCount||0, notes:ho.notes||''});
          queueAdd(ho.returnedBy, phone, msg, 'handover_ret', eid);
          notify('📨', 'أُضيف إشعار استلام الأوراق لقائمة واتساب', 'info');
        }
      }
    }, 200);
  };
})();

// ── تذكير المراقبين → Queue ──
(function(){
  var _orig = window.remindAllMonitors;
  window.remindAllMonitors = function(date){
    date = date || gt();
    var exams = D.examSchedule.filter(function(e){return e.date===date;});
    var added=0, noPhone=[];
    var monSent = new Set();
    exams.forEach(function(e){
      [e.monitor1,e.monitor2,e.monitor3].filter(Boolean).forEach(function(mn){
        mn=mn.trim(); if(monSent.has(mn)) return; monSent.add(mn);
        var phone=getMonPhone(mn);
        if(!phone){noPhone.push(mn);return;}
        var msg=buildWA('ho_receive_reminder',e,{monitor:mn});
        queueAdd(mn,phone,msg,'reminder_monitor',e.id);
        added++;
      });
    });
    logAudit('تذكير جماعي للمراقبين','تمت الإضافة لـ '+added+' مراقب','');
    notify('📨','أُضيف '+added+' تذكير لقائمة واتساب'+(noPhone.length?' — '+noPhone.length+' بدون رقم':''),'success');
    if(document.getElementById('remind-panel')) document.getElementById('remind-panel').remove();
    _queuePanelOpen=true; queueRenderPanel(); queueRenderBtn();
  };
})();

// ── تذكير المنسقين → Queue ──
(function(){
  var _orig = window.remindAllCoords;
  window.remindAllCoords = function(date){
    date = date || gt();
    var exams = D.examSchedule.filter(function(e){return e.date===date;});
    var added=0, noPhone=[], coordSent={};
    exams.forEach(function(e){
      var r=getR(e.id); if(r&&r.receivedFrom) return;
      var coord=e.coordinator||''; if(!coord) return;
      var phone=getMonPhone(coord);
      if(!phone){if(!coordSent[coord]) noPhone.push(coord); coordSent[coord]=true; return;}
      if(coordSent[coord]) return; coordSent[coord]=true;
      var msg=buildWA('coord_reminder',e,{coord:coord});
      queueAdd(coord,phone,msg,'reminder_coord',e.id);
      added++;
    });
    logAudit('تذكير المنسقين','تمت الإضافة لـ '+added+' منسق','');
    notify('📨','أُضيف '+added+' تذكير لقائمة واتساب','success');
    if(document.getElementById('remind-panel')) document.getElementById('remind-panel').remove();
    _queuePanelOpen=true; queueRenderPanel(); queueRenderBtn();
  };
})();

// ── تذكير مراقب منفرد → Queue ──
(function(){
  var _orig = window.remindSingleMonitor;
  window.remindSingleMonitor = function(monName, examId){
    var ex=D.examSchedule.find(function(e){return e.id===examId;})||{};
    var phone=getMonPhone(monName);
    if(!phone){notify('تنبيه','لا يوجد رقم لـ '+monName,'warning');return;}
    var msg=buildWA('ho_receive_reminder',ex,{monitor:monName});
    queueAdd(monName,phone,msg,'reminder_monitor',examId);
    logAudit('تذكير مراقب','المراقب: '+monName,examId);
    notify('📨','أُضيف تذكير لـ '+monName+' في القائمة','success');
    _queuePanelOpen=true; queueRenderPanel(); queueRenderBtn();
  };
})();

// ── تهيئة الزر عند التحميل ──
setTimeout(function(){
  queueRenderBtn();
  // إعادة فتح اللوحة إذا كانت مفتوحة
  if(_queuePanelOpen) queueRenderPanel();
}, 300);

// ── تحديث الزر عند كل render ──
(function(){
  var _origR = window.render;
  window.render = function(){
    _origR && _origR();
    setTimeout(queueRenderBtn, 200);
  };
})();

console.log('✅ نظام Queue الذكي محمّل');
</script>


<script>
// ════════════════════════════════════════════════════════════════
//  صفحة متابعة التأخرات والغيابات — لرئيس القسم والوكلاء والعميد
// ════════════════════════════════════════════════════════════════

function pgAbsences(){
  // ── فلتر اليوم ──
  if(!window._absDate) window._absDate = gt();
  var t = window._absDate;
  var allDates = [...new Set(D.examSchedule.map(function(e){return e.date;}).filter(Boolean))].sort();

  var dateOpts = allDates.map(function(d){
    var dx = D.examSchedule.find(function(e){return e.date===d;});
    var cnt = D.examSchedule.filter(function(e){return e.date===d;}).length;
    return '<option value="'+d+'" '+(d===t?'selected':'')+'>'+d+(dx&&dx.day?' - '+dx.day:'')+' ('+cnt+')</option>';
  }).join('');

  var dateSel = '<div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;background:var(--card);padding:12px 16px;border-radius:12px;border:1px solid var(--brd)">'+
    '<span style="font-weight:700;font-size:14px;color:var(--txt2)">📅 اليوم:</span>'+
    '<select onchange="window._absDate=this.value;render()" style="flex:1;min-width:180px;padding:10px 14px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--txt);font-size:14px;font-weight:600">'+dateOpts+'</select>'+
    '</div>';

  if(!allDates.length) return '<div class="ph"><h1>⚠️ متابعة التأخرات والغيابات</h1></div>'+
    '<div style="text-align:center;padding:40px;color:var(--txt3)"><div style="font-size:48px">📭</div><p style="margin-top:12px">لا توجد اختبارات</p></div>';

  // ── اجمع المراقبين المعيّنين لهذا اليوم ──
  var todayExams = D.examSchedule.filter(function(e){return e.date===t;});
  var monData = {}; // name → {exams:[], status, dept, time}

  todayExams.forEach(function(e){
    [e.monitor1,e.monitor2,e.monitor3].filter(Boolean).forEach(function(mn){
      mn = mn.trim();
      if(!monData[mn]) monData[mn] = {exams:[], status:'none', time:'', dept:'', examTime:e.time||''};
      monData[mn].exams.push(e);
      if(!monData[mn].dept) monData[mn].dept = typeof getMonDept==='function'?getMonDept(mn):'';
      // الوقت الأبكر للاختبار
      if(!monData[mn].examTime || (e.time||'') < monData[mn].examTime) monData[mn].examTime = e.time||'';
    });
  });

  // ── جلب حالة الحضور لكل مراقب ──
  Object.keys(monData).forEach(function(mn){
    var mid = typeof findMonitorId==='function' ? findMonitorId(mn) : null;
    if(!mid){ var mo = D.monitors.find(function(m){return m.name.trim()===mn;}); if(mo)mid=mo.id; }
    if(!mid){ monData[mn].status='unknown'; return; }
    var recs = D.attendance.filter(function(a){return a.monitorId===mid&&a.date===t;});
    if(!recs.length){ monData[mn].status='none'; return; }
    if(recs.some(function(a){return a.status==='present';})) monData[mn].status='present';
    else if(recs.some(function(a){return a.status==='late';})) monData[mn].status='late';
    else monData[mn].status='absent';
    var r0 = recs[0]; monData[mn].time = r0.recordTime||'';
  });

  var names = Object.keys(monData);
  var absent  = names.filter(function(n){return monData[n].status==='absent';});
  var late    = names.filter(function(n){return monData[n].status==='late';});
  var present = names.filter(function(n){return monData[n].status==='present';});
  var none    = names.filter(function(n){return monData[n].status==='none'||monData[n].status==='unknown';});

  // ── بطاقات الإحصاء ──
  var kpis = '<div class="sg">'+
    '<div class="sc bl"><div class="si">👥</div><div class="sv">'+names.length+'</div><div class="sl">إجمالي</div></div>'+
    '<div class="sc gr"><div class="si">✅</div><div class="sv">'+present.length+'</div><div class="sl">حاضر</div></div>'+
    '<div class="sc yl"><div class="si">⏰</div><div class="sv">'+late.length+'</div><div class="sl">متأخر</div></div>'+
    '<div class="sc rd"><div class="si">❌</div><div class="sv">'+absent.length+'</div><div class="sl">غائب</div></div>'+
    '<div class="sc pr"><div class="si">❓</div><div class="sv">'+none.length+'</div><div class="sl">لم يسجّل</div></div>'+
  '</div>';

  // ── شريط الأزرار الجماعية ──
  var bulkBar = '<div class="toolbar" style="margin-bottom:12px">'+
    '<button class="btn ber bs" onclick="absNotifyAll(\'absent\',\''+t+'\')" style="font-size:12px">❌ إشعار الغائبين ('+absent.length+')</button>'+
    '<button class="btn bw bs" onclick="absNotifyAll(\'late\',\''+t+'\')" style="font-size:12px">⏰ إشعار المتأخرين ('+late.length+')</button>'+
    '<button class="btn bok bs" onclick="absNotifyAll(\'none\',\''+t+'\')" style="font-size:12px">❓ تذكير من لم يسجّل ('+none.length+')</button>'+
    '<button class="btn bo bs" onclick="absExport(\''+t+'\')" style="font-size:12px">📊 تصدير</button>'+
    '<button class="btn bok bs" onclick="absThanksAll(\'\'+t+\'\')" style="font-size:12px">🌹 شكر الحاضرين ('+present.length+')</button>'+
  '</div>';

  // ── بناء قسم لكل حالة ──
  function buildSection(title, namesList, color, icon){
    if(!namesList.length) return '';
    var rows = namesList.map(function(mn){
      var d = monData[mn];
      var phone = getMonPhone(mn);
      var exNames = d.exams.map(function(e){return (e.course||'-')+' | '+(e.hall||'-');}).join('<br>');
      return '<tr>'+
        '<td style="font-weight:700;font-size:13px;text-align:right">'+mn+
          (d.dept?'<br><span class="badge bi" style="font-size:9px">'+d.dept+'</span>':'')+
        '</td>'+
        '<td style="font-size:11px;color:var(--txt2)">'+exNames+'</td>'+
        '<td style="font-size:12px;color:var(--txt3)">'+( d.examTime||'-')+'</td>'+
        '<td style="font-size:11px">'+(d.time||'-')+'</td>'+
        '<td>'+
          (phone?
            '<div style="display:flex;gap:4px;flex-wrap:wrap">'+
            '<button class="btn ber bx" onclick="absNotifyOne(\''+mn.replace(/'/g,"\\'")+'\')" style="font-size:10px;padding:3px 8px">❌ غياب</button>'+
            '<button class="btn bw bx" onclick="absTardyOne(\''+mn.replace(/'/g,"\\'")+'\')" style="font-size:10px;padding:3px 8px">⏰ تأخر</button>'+
            '<button class="btn bp bx" onclick="absRemindOne(\''+mn.replace(/'/g,"\\'")+'\',\''+t+'\')" style="font-size:10px;padding:3px 8px">🔔 تذكير</button>'+
            '</div>'
          :'<span style="font-size:10px;color:var(--txt3)">لا رقم</span>')+
        '</td>'+
      '</tr>';
    }).join('');
    return '<div class="rp-sec" style="margin-bottom:12px">'+
      '<div class="rp-sec-hdr">'+
        '<span style="font-size:16px">'+icon+'</span>'+
        '<span class="rp-sec-ttl" style="color:'+color+'">'+title+'</span>'+
        '<span class="rp-chip" style="background:rgba(0,0,0,.1);color:'+color+'">'+namesList.length+'</span>'+
      '</div>'+
      '<div style="overflow-x:auto"><table class="rp-tbl">'+
        '<thead><tr><th>المراقب</th><th>الاختبارات</th><th>وقت الاختبار</th><th>وقت التسجيل</th><th>الإجراء</th></tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table></div></div>';
  }

  var sections =
    buildSection('❌ الغائبون', absent, 'var(--err)', '❌')+
    buildSection('⏰ المتأخرون', late, 'var(--warn)', '⏰')+
    buildSection('❓ لم يسجّلوا', none, 'var(--txt3)', '❓')+
    buildSection('✅ الحاضرون', present, 'var(--ok)', '✅');

  var empty = names.length===0 ?
    '<div style="text-align:center;padding:40px;color:var(--txt3)"><div style="font-size:48px">📭</div><p style="margin-top:12px">لا يوجد مراقبون معيّنون في هذا اليوم</p></div>' : '';

  return '<div class="ph"><h1>⚠️ متابعة التأخرات والغيابات</h1>'+
    '<p style="font-size:12px;color:var(--txt3)">إرسال إشعارات واتساب للمراقبين الغائبين أو المتأخرين</p></div>'+
    dateSel + kpis + bulkBar + empty + sections;
}

  var senderName=CU?CU.name:'';

    'تحية طيبة وبعد،',
    'نود الاستفسار عن سبب غيابكم عن مراقبة اختبار:',

// ── إشعارات جماعية ──
function absNotifyAll(type,date){
  var todayExams=D.examSchedule.filter(function(e){return e.date===date;});
  var names=new Set();
  todayExams.forEach(function(e){[e.monitor1,e.monitor2,e.monitor3].filter(Boolean).forEach(function(mn){names.add(mn.trim());});});
  var count=0;
  names.forEach(function(mn){
    var mid=typeof findMonitorId==='function'?findMonitorId(mn):null;
    if(!mid){var mo=D.monitors.find(function(m){return m.name.trim()===mn;});if(mo)mid=mo.id;}
    var recs=mid?D.attendance.filter(function(a){return a.monitorId===mid&&a.date===date;}):[];
    var st='none';
    if(recs.length){if(recs.some(function(a){return a.status==='present';}))st='present';else if(recs.some(function(a){return a.status==='late';}))st='late';else st='absent';}
    if(type==='absent'&&st==='absent'){absNotifyOne(mn);count++;}
    else if(type==='late'&&st==='late'){absTardyOne(mn);count++;}
    else if(type==='none'&&st==='none'){absRemindOne(mn,date);count++;}
  });
  if(count===0) notify('تنبيه','لا يوجد مراقبون في هذه الحالة','warning');
  else{ notify('📨','أُضيف '+count+' إشعار للقائمة','success'); _queuePanelOpen=true;queueRenderPanel();queueRenderBtn(); }
}

  var todayExams=D.examSchedule.filter(function(e){return e.date===date;});
  var names=new Set();
  todayExams.forEach(function(e){[e.monitor1,e.monitor2,e.monitor3].filter(Boolean).forEach(function(mn){names.add(mn.trim());});});
  var count=0;
  names.forEach(function(mn){
    var mid=typeof findMonitorId==='function'?findMonitorId(mn):null;
