:root{--bg:#0f1923;--card:#182533;--hover:#1e3044;--accent:#4da6ff;--accent2:#7bbfff;--glow:rgba(77,166,255,0.12);--ok:#2ecc71;--okg:rgba(46,204,113,0.12);--warn:#f39c12;--err:#e74c3c;--txt:#ecf0f1;--txt2:#bdc3c7;--txt3:#95a5a6;--brd:#2c3e50;--brd2:#34495e;--gold:#f39c12;--purple:#9b59b6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal','Noto Sans Arabic','Noto Naskh Arabic','Droid Arabic Naskh','Segoe UI',Arial,Tahoma,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;letter-spacing:0.01em;line-height:1.7;font-size:15px}
.bgp{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 20% 50%,rgba(77,166,255,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(155,89,182,0.04) 0%,transparent 50%)}
.bgg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(77,166,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(77,166,255,0.03) 1px,transparent 1px);background-size:40px 40px}
.ls{display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;z-index:1;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%)}.ls .fi{background:#f8fafc!important;color:#1e293b!important;border-color:#d1d5db!important}
.lb{background:rgba(255,255,255,0.95);border:none;border-radius:24px;padding:48px 40px;width:440px;max-width:95vw;box-shadow:0 20px 50px rgba(0,0,0,0.2);animation:fu .6s;position:relative;overflow:hidden}
@keyframes fu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.lb::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--purple),var(--ok))}
.ll{text-align:center;margin-bottom:32px}.ll h1{color:#1e293b!important}.ll p{color:#475569!important}
.ll .ic{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px;box-shadow:0 8px 32px var(--glow)}
.ll h1{font-family:'Cairo','Tajawal','Noto Sans Arabic','Droid Arabic Naskh',Arial,Tahoma,sans-serif;font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ll p{color:var(--txt2);font-size:14px;margin-top:4px}
.fg{margin-bottom:20px}.fg label{color:#ecf0f1!important;font-weight:600}
.ls .btn.bp{background:linear-gradient(135deg,#3498db,#9b59b6);border:none;color:#fff;box-shadow:0 2px 12px rgba(52,152,219,0.4)}.ls .btn.bp:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(102,126,234,0.5)}

.fg label{display:block;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:8px}
.fi{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--brd2);background:#1a2d3d;color:#ecf0f1;font-family:'Tajawal','Noto Sans Arabic','Droid Arabic Naskh',Arial,Tahoma,sans-serif;font-size:15px;transition:all .3s}.fi:focus{border-color:#4da6ff;box-shadow:0 0 0 3px rgba(77,166,255,0.15);outline:none}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}

function gid(){return'i'+Date.now()+'_'+Math.random().toString(36).substr(2,5)}
function nw(){return new Date()}
function ft(d){return d.toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}
function fd(d){return d.toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function fds(s){return new Date(s).toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'})}
function getGregorianToday(){const d=nw();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getHijriToday(){try{const parts=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(nw());const y=parts.find(p=>p.type==='year').value;const m=parts.find(p=>p.type==='month').value;const d=parts.find(p=>p.type==='day').value;return y+'-'+m+'-'+d}catch(e){return''}}
function detectDateFormat(){const dates=(D.examSchedule||[]).map(e=>e.date).filter(d=>d&&d.trim());if(!dates.length)return'gregorian';const sample=dates[0].replace(/[^0-9]/g,'');const nums=dates[0].match(/\d+/g)||[];if(nums.length===0)return'gregorian';const maxNum=Math.max(...nums.map(Number));if(maxNum>1400&&maxNum<1500)return'hijri';if(maxNum>1900&&maxNum<2100)return'gregorian';return'auto'}
function normalizeDate(d){if(!d)return'';return d.replace(/[\/\.]/g,'-').replace(/\s+/g,'').trim()}
function gt(){try{const fmt=detectDateFormat();if(fmt==='hijri'){const h=getHijriToday();const examDates=(D.examSchedule||[]).map(e=>normalizeDate(e.date)).filter(d=>d);const nh=normalizeDate(h);if(examDates.includes(nh))return nh;const parts=h.split('-');if(parts.length===3){const alt1=parts[2]+'-'+parts[1]+'-'+parts[0];if(examDates.includes(alt1))return alt1;const alt2=parts[0]+'/'+parts[1]+'/'+parts[2];const alt3=parts[2]+'/'+parts[1]+'/'+parts[0];for(const ed of examDates){const ned=normalizeDate(ed);if(ned===nh||ned===alt1)return ed}}for(const ed of examDates){const edNums=(ed.match(/\d+/g)||[]).map(Number);const hNums=parts.map(Number);if(edNums.length===3&&hNums.length===3){const edSet=new Set(edNums);const hSet=new Set(hNums);if([...hSet].every(n=>edSet.has(n)))return ed}}return h}return getGregorianToday()}catch(e){console.log('gt error:',e);return getGregorianToday()}}
function isDateToday(dateStr){try{if(!dateStr)return false;const nd=normalizeDate(dateStr);const todayG=normalizeDate(getGregorianToday());const todayH=normalizeDate(getHijriToday());if(nd===todayG||nd===todayH)return true;const dNums=(dateStr.match(/\d+/g)||[]).map(Number).sort((a,b)=>a-b);const gNums=todayG.match(/\d+/g).map(Number).sort((a,b)=>a-b);const hNums=todayH.match(/\d+/g).map(Number).sort((a,b)=>a-b);if(JSON.stringify(dNums)===JSON.stringify(gNums))return true;if(JSON.stringify(dNums)===JSON.stringify(hNums))return true;return false}catch(e){return false}}

unction(v,ci){var val=String(v!==undefined&&v!==null?v:'');var st='background:'+bg+';color:#1a1a2e;font-size:13px;padding:8px 12px;border:1px solid #d1d9e6;text-align:right;font-family:Sakkal Majalla,Simplified Arabic,Arial';if(ci===0)st='background:#eef2f7;color:#4a5568;font-size:13px;padding:8px 10px;border:1px solid #d1d9e6;text-align:center;font-weight:700';if(val.includes('حاضر')||val==='✅'||val==='present')st='background:#dcfce7;color:#166534;font-weight:700;font-size:13px;padding:8px 12px;border:1px solid #86efac;text-align:center';else if(val.includes('متأخر')||val==='⏰'||val==='late')st='background:#fef3c7;color:#92400e;font-weight:700;font-size:13px;padding:8px 12px;border:1px solid #fcd34d;text-align:center';else if(val.includes('غائب')||val==='❌'||val==='absent')st='background:#fee2e2;color:#991b1b;font-weight:700;font-size:13px;padding:8px 12px;border:1px solid #fca5a5;text-align:center';else if(val.includes('تم الاستلام'))st='background:#dcfce7;color:#166534;font-weight:700;font-size:13px;padding:8px 12px;border:1px solid #86efac;text-align:center';else if(val.includes('لم يستلم')||val.includes('لم يسجل'))st='background:#fee2e2;color:#991b1b;font-weight:700;font-size:13px;padding:8px 12px;border:1px solid #fca5a5;text-align:center';html+='<td style="'+st+'">'+val+'</td>'});html+='</tr>'});html+='<tr style="height:6px"><td colspan="'+nc+'" style="border:none;padding:0"></td></tr>';html+='<tr><td colspan="'+nc+'" style="background:#1a365d;color:#ffffff;font-size:12px;text-align:center;padding:8px;border:1px solid #1a365d;font-family:Sakkal Majalla,Simplified Arabic,Arial">'+D.settings.collegeName+' — إعداد وتصميم: د. حكيم محمد براضية</td></tr>';html+='</table></body></html>';var b=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn+'.xls';a.click();if(navigator.share&&navigator.canShare){var file=new File([b],fn+'.xls',{type:'application/vnd.ms-excel'});if(navigator.canShare({files:[file]})){setTimeout(function(){navigator.share({files:[file],title:title||fn}).catch(function(){})},500)}}notify('تم','تم التصدير كملف Excel 📊','success')}

function getMonPhone(name){const n=(name||'').trim();if(!n)return'';function norm(s){return(s||'').trim().replace(/^(د\.\s*|أ\.د\.\s*|أ\.\s*|م\.\s*|الدكتور\s*|الأستاذ\s*|دكتور\s*|أستاذ\s*)/,'').replace(/[أإآ]/g,'ا').replace(/[ؤ]/g,'و').replace(/[ئ]/g,'ي').replace(/[ة]/g,'ه').replace(/\s+/g,' ').trim()}var nn=norm(n);if(!D.phoneBook||!D.phoneBook.length){var exams=D.examSchedule||[];for(var ei=0;ei<exams.length;ei++){var ex=exams[ei];if(!ex.monitorPhones)continue;var mons=[ex.monitor1,ex.monitor2,ex.monitor3,ex.monitor4].filter(Boolean);for(var mi=0;mi<mons.length;mi++){if(mons[mi]===n||norm(mons[mi])===nn){var phones=(ex.monitorPhones||'').split(/[,،\s]+/).filter(Boolean);if(phones[mi])return phones[mi]}}}return''}var exact=D.phoneBook.find(function(f){return f.name===n});if(exact&&exact.phone)return exact.phone;var normMatch=D.phoneBook.find(function(f){return norm(f.name)===nn});if(normMatch&&normMatch.phone)return normMatch.phone;var nnWords=nn.split(' ').filter(function(w){return w.length>1});var bestMatch=null;var bestScore=0;for(var i=0;i<D.phoneBook.length;i++){var f=D.phoneBook[i];if(!f.phone)continue;var fn=norm(f.name);var fnWords=fn.split(' ').filter(function(w){return w.length>1});var score=0;if(nnWords.length>0&&fnWords.length>0&&nnWords[0]===fnWords[0])score+=10;if(nnWords.length>1&&fnWords.length>1&&nnWords[nnWords.length-1]===fnWords[fnWords.length-1])score+=5;for(var wi=0;wi<nnWords.length;wi++){for(var wj=0;wj<fnWords.length;wj++){if(nnWords[wi]===fnWords[wj])score+=2}}if(nn.length>3&&fn.includes(nn))score+=8;if(fn.length>3&&nn.includes(fn))score+=8;if(score>bestScore){bestScore=score;bestMatch=f}}if(bestMatch&&bestScore>=4)return bestMatch.phone;return''}
function getMonDept(name){const n=(name||'').trim();if(!n||!D.phoneBook)return'';const nn=n.replace(/^(د\.\s*|أ\.د\.\s*|أ\.\s*|م\.\s*)/,'').replace(/[أإآ]/g,'ا').replace(/[ة]/g,'ه').replace(/\s+/g,' ').trim();for(var i=0;i<D.phoneBook.length;i++){var f=D.phoneBook[i];if(!f.dept)continue;if(f.name===n)return f.dept;var fn=f.name.replace(/^(د\.\s*|أ\.د\.\s*|أ\.\s*|م\.\s*)/,'').replace(/[أإآ]/g,'ا').replace(/[ة]/g,'ه').replace(/\s+/g,' ').trim();if(fn===nn)return f.dept;if(nn.includes(fn)||fn.includes(nn))return f.dept;var w=nn.split(' ').filter(function(x){return x.length>2});if(w.length>=2&&w.filter(function(x){return fn.includes(x)}).length>=2)return f.dept}return''}

function formatPhone(p){if(!p)return'';p=String(p).trim().replace(/[^0-9+]/g,'');if(!p||p.length<7)return'';if(p.startsWith('00'))p=p.substring(2);if(p.startsWith('+'))p=p.substring(1);if(p.startsWith('05')&&p.length===10)p='966'+p.substring(1);if(p.startsWith('5')&&p.length===9)p='966'+p;if(!p.startsWith('966')&&p.length>=9)p='966'+p;return p}

    '━━━━━━━━━━━━━━━━━━━━',

function autoStatusByTime(examTime,selDate){const s=D.settings;const threshold=s.lateThreshold||10;if(!examTime)return'present';if(selDate&&!isDateToday(selDate))return'present';let t=(examTime+'').trim();const isPM=/[مm]/i.test(t)||t.toUpperCase().includes('PM');const isAM=/[صa]/i.test(t)||t.toUpperCase().includes('AM');t=t.replace(/[^0-9:]/g,'').trim();if(!t)return'present';const parts=t.split(':');let eh=parseInt(parts[0]);let em=parseInt(parts[1])||0;if(isNaN(eh))return'present';if(isPM&&eh<12)eh+=12;if(isAM&&eh===12)eh=0;const examMin=eh*60+em;const now2=nw();const nowMin=now2.getHours()*60+now2.getMinutes();console.log('AutoStatus:','exam='+examTime,'parsed='+eh+':'+em+'('+examMin+'min)','now='+nowMin+'min','threshold='+threshold,'result='+(nowMin<=examMin-threshold?'present':'late'));if(nowMin<=examMin-threshold)return'present';return'late'}

)</td></tr><tr><th>#</th><th>الاسم</th><th>القسم</th><th>المصدر</th><th>اختبارات</th><th>حضور</th><th>غياب</th><th>تأخر</th></tr>';D.monitors.forEach((m,i)=>{const ec=D.examSchedule.filter(e=>(e.monitor1||'').trim()===m.name||(e.monitor2||'').trim()===m.name||(e.monitor3||'').trim()===m.name).length;const pr=D.attendance.filter(a=>a.monitorId===m.id&&a.status==='present').length;const ab=D.attendance.filter(a=>a.monitorId===m.id&&a.status==='absent').length;const lt=D.attendance.filter(a=>a.monitorId===m.id&&a.status==='late').length;html+='<tr><td>'+(i+1)+'</td><td>'+m.name+'</td><td>'+(m.dept||'-')+'</td><td>'+(m.source||'يدوي')+'</td><td>'+ec+'</td><td class="ok">'+pr+'</td><td class="absent">'+ab+'</td><td class="late">'+lt+'</td></tr>'});html+='</table><br>';if(D.handovers&&D.handovers.length){html+='<table><tr><td class="sec" colspan="15">📦 الاستلام والتسليم ('+D.handovers.length+')</td></tr><tr><th>#</th><th>التاريخ</th><th>المقرر</th><th>الرمز</th><th>القاعة</th><th>استلام</th><th>وقت الاستلام</th><th>المستلم</th><th>تسليم</th><th>وقت التسليم</th><th>الحضور</th><th>الغياب</th><th>الأوراق</th><th>المسلّم</th><th>ملاحظات</th></tr>';D.handovers.forEach((ho,i)=>{const e=D.examSchedule.find(x=>x.id===ho.examId)||{};html+='<tr><td>'+(i+1)+'</td><td>'+(ho.date||'-')+'</td><td>'+(e.course||'-')+'</td><td>'+(e.code||'-')+'</td><td>'+(e.hall||'-')+'</td><td>'+(ho.received?'✅':'❌')+'</td><td>'+(ho.receiveTime||'-')+'</td><td>'+(ho.receivedBy||'-')+'</td><td>'+(ho.returned?'✅':'❌')+'</td><td>'+(ho.returnTime||'-')+'</td><td>'+(ho.presentCount||'-')+'</td><td>'+(ho.absentCount||'-')+'</td><td>'+(ho.paperCount||'-')+'</td><td>'+(ho.returnedBy||'-')+'</td><td>'+(ho.notes||'-')+'</td></tr>'});html+='</table>'}html+='</body></html>';const b=new Blob(['\uFEFF'+html],{type:'application/vnd.ms-excel;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='تقرير_شامل_'+gt()+'.xls';a.click();notify('تم','تم تصدير التقرير الشامل 📊','success')}

// ═══ SUMMARY ═══
function pgSum(){
  // ── اختيار التاريخ (مستقل عن _selDate المشترك) ──
  if(!window._sumDate){window._sumDate=gt();}
  const t=window._sumDate;
  const allDates=[...new Set(D.examSchedule.map(e=>e.date).filter(Boolean))].sort();

  // ── فلتر التاريخ ──
  let dateOpts='';
  allDates.forEach(function(d){
    const dx=D.examSchedule.find(function(e){return e.date===d;});
    const dy=dx&&dx.day?dx.day:'';
    const cnt=D.examSchedule.filter(function(e){return e.date===d;}).length;
    dateOpts+='<option value="'+d+'" '+(d===t?'selected':'')+'>'+d+(dy?' - '+dy:'')+' ('+cnt+')</option>';
  });
  const dateSel='<div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;background:var(--card);padding:12px 16px;border-radius:12px;border:1px solid var(--brd)">'+
    '<span style="font-weight:700;font-size:14px;color:var(--txt2)">📅 اليوم:</span>'+
    '<select onchange="window._sumDate=this.value;render()" style="flex:1;min-width:180px;padding:10px 14px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--txt);font-size:14px;font-weight:600">'+dateOpts+'</select>'+
    '</div>';

  // ── المراقبون المعيّنون لهذا اليوم (من جدول الاختبارات) ──
  const todayExams=D.examSchedule.filter(function(e){return e.date===t;});
  const assignedNames=[...new Set(
    todayExams.flatMap(function(e){return [e.monitor1,e.monitor2,e.monitor3].filter(Boolean).map(function(n){return n.trim();});})
  )].filter(Boolean);

  // ── جلب حالة كل مراقب باستخدام findMonitorId (نفس منطق pgRec) ──
  function getMonSt(nm){
    const mid=typeof findMonitorId==='function'?findMonitorId(nm):null;
    if(!mid){
      // fallback: بحث مباشر
      const mo=D.monitors.find(function(m){return m.name.trim()===nm;});
      if(!mo)return null;
      const recs=D.attendance.filter(function(a){return a.monitorId===mo.id&&a.date===t;});
      if(!recs.length)return null;
      if(recs.some(function(r){return r.status==='present';}))return'present';
      if(recs.some(function(r){return r.status==='late';}))return'late';
      return'absent';
    }
    const recs=D.attendance.filter(function(a){return a.monitorId===mid&&a.date===t;});
    if(!recs.length)return null;
    if(recs.some(function(r){return r.status==='present';}))return'present';
    if(recs.some(function(r){return r.status==='late';}))return'late';
    return'absent';
  }

  const pr=assignedNames.filter(function(n){return getMonSt(n)==='present';});
  const lt=assignedNames.filter(function(n){return getMonSt(n)==='late';});
  const ab=assignedNames.filter(function(n){return getMonSt(n)==='absent';});
  const nr=assignedNames.filter(function(n){return !getMonSt(n);});
  const total=assignedNames.length;

  // ── إحصائيات الاختبارات والتسليم ──
  const hoCount=todayExams.filter(function(e){const h=getHO(e.id,t);return h&&h.returned;}).length;
  const rcptCount=todayExams.filter(function(e){const r=getR(e.id);return r&&r.receivedFrom;}).length;

  // ── بناء قوائم المراقبين ──
  function mkList(names,color){
    if(!names.length)return'<p style="color:var(--txt3);font-size:13px;padding:8px">-</p>';
    return names.map(function(nm){
      const mo=D.monitors.find(function(m){return m.name.trim()===nm;});
      const dept=mo?mo.dept||'':typeof getMonDept==='function'?getMonDept(nm):'';
      const att=D.attendance.filter(function(a){
        const mid=typeof findMonitorId==='function'?findMonitorId(nm):(mo?mo.id:null);
        return mid&&a.monitorId===mid&&a.date===t;
      })[0];
      const ti=att&&att.recordTime?att.recordTime:'';
      return'<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--brd)">'+
        '<div style="flex:1;font-size:13px;font-weight:600;color:var(--txt)">'+nm+'</div>'+
        (dept?'<span class="badge bi" style="font-size:10px">'+dept+'</span>':'')+
        (ti?'<span style="font-size:11px;color:var(--txt3)">'+ti+'</span>':'')+
      '</div>';
    }).join('');
  }

  if(allDates.length===0) return'<div class="ph"><h1>📊 ملخص اليوم</h1></div>'+
    '<div style="text-align:center;padding:40px;color:var(--txt3)"><div style="font-size:48px">📭</div><p style="margin-top:12px">لا توجد اختبارات في النظام</p></div>';

  return'<div class="ph"><h1>📊 ملخص اليوم</h1>'+
    '<p style="font-size:12px;color:var(--txt3)">'+fd(new Date(t.replace(/-/g,'/')))+
    (total>0?' — '+total+' مراقب معيّن':'')+'</p></div>'+
    dateSel+
    '<div class="toolbar"><button class="btn bok bs" onclick="shareReport()">📱 واتساب</button>'+
    '<button class="btn bp bs" onclick="window.print()">🖨️ طباعة</button>'+
    '<button class="btn bo bs" onclick="exportAtt(D.attendance.filter(function(a){return a.date===\''+t+'\';}),\'حضور_'+t+'\')">📥 تصدير</button></div>'+
    (total===0?
      '<div style="text-align:center;padding:30px;background:var(--card);border-radius:12px;border:1px solid var(--brd);margin-bottom:16px">'+
        '<div style="font-size:32px;margin-bottom:8px">📭</div>'+
        '<p style="color:var(--txt3)">لا يوجد مراقبون معيّنون في جدول هذا اليوم</p>'+
      '</div>':
      '<div class="sg">'+
        '<div class="sc gr"><div class="si">✅</div><div class="sv">'+pr.length+'</div><div class="sl">حاضر</div></div>'+
        '<div class="sc yl"><div class="si">⏰</div><div class="sv">'+lt.length+'</div><div class="sl">متأخر</div></div>'+
        '<div class="sc rd"><div class="si">❌</div><div class="sv">'+ab.length+'</div><div class="sl">غائب</div></div>'+
        '<div class="sc bl"><div class="si">❓</div><div class="sv">'+nr.length+'</div><div class="sl">لم يسجل</div></div>'+
      '</div>'
    )+
    '<div class="sg" style="margin-bottom:16px">'+
      '<div class="sc bl"><div class="si">📝</div><div class="sv">'+todayExams.length+'</div><div class="sl">اختبارات</div></div>'+
      '<div class="sc gr"><div class="si">📦</div><div class="sv">'+hoCount+'</div><div class="sl">سُلّم للمراقب</div></div>'+
      '<div class="sc pr"><div class="si">📚</div><div class="sv">'+rcptCount+'</div><div class="sl">من المحاضر</div></div>'+
    '</div>'+
    (total>0?
      '<div class="rg">'+
        '<div class="rc"><h4>✅ الحاضرون ('+pr.length+')</h4>'+mkList(pr)+'</div>'+
        '<div class="rc"><h4>⏰ المتأخرون ('+lt.length+')</h4>'+mkList(lt)+'</div>'+
        '<div class="rc"><h4>❌ الغائبون ('+ab.length+')</h4>'+mkList(ab)+'</div>'+
        '<div class="rc"><h4>❓ لم يسجل ('+nr.length+')</h4>'+
          (nr.length?mkList(nr):'<p style="color:var(--ok);font-size:13px;padding:8px">✅ جميع المعيّنين سجّلوا</p>')+
        '</div>'+
      '</div>':''
    );
}

function pgDash(){const t=gt(),att=D.attendance.filter(a=>a.date===t);let ms=D.monitors;if(CU.role==='head')ms=ms.filter(m=>m.dept===CU.dept);const fa=att.filter(a=>ms.find(m=>m.id===a.monitorId));const p=fa.filter(a=>a.status==='present').length,l=fa.filter(a=>a.status==='late').length,ab=fa.filter(a=>a.status==='absent').length;
return`<div class="ph"><h1>📊 لوحة التحكم</h1><p>${fd(nw())} ${CU.role==='head'?'- '+CU.dept:''}</p></div>${CU.role==='owner'||CU.role==='admin'?'<div style="background:linear-gradient(135deg,rgba(77,166,255,0.1),rgba(155,89,182,0.1));border:1px solid rgba(77,166,255,0.2);border-radius:14px;padding:14px 18px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font-size:14px;font-weight:700;color:var(--accent2);flex:1">🔄 مزامنة البيانات مع الزملاء</span><button class="btn bp bx" onclick="shareSync()" style="font-size:12px;padding:8px 14px">📤 نشر</button><button class="btn bo bx" onclick="showPasteSync()" style="font-size:12px;padding:8px 14px">📥 استيراد</button></div>':''}<div class="toolbar"><button class="btn bok bs" onclick="shareReport()">📱 واتساب</button><button class="btn bp bs" onclick="window.print()">🖨️ طباعة</button><button class="btn bo bs" onclick="exportAtt(D.attendance.filter(a=>a.date===gt()),'حضور_اليوم')">📥 تصدير</button></div>
<div class="td2" id="clk" style="font-size:36px;margin-bottom:20px">${ft(nw())}</div>
<div class="sg"><div class="sc bl"><div class="si">👥</div><div class="sv">${ms.length}</div><div class="sl">المراقبين</div></div><div class="sc gr"><div class="si">✅</div><div class="sv">${p}</div><div class="sl">حاضر</div></div><div class="sc yl"><div class="si">⏰</div><div class="sv">${l}</div><div class="sl">متأخر</div></div><div class="sc rd"><div class="si">❌</div><div class="sv">${ab}</div><div class="sl">غائب</div></div><div class="sc pr"><div class="si">📈</div><div class="sv">${ms.length>0?Math.round(((p+l)/ms.length)*100):0}%</div><div class="sl">الحضور</div></div></div>
<div class="rg"><div class="rc"><h4>📊 الأقسام</h4>${D.departments.map(d=>{if(CU.role==='head'&&CU.dept!==d)return'';const dm=D.monitors.filter(m=>m.dept===d);const da=att.filter(a=>dm.find(m=>m.id===a.monitorId));const dp=da.filter(a=>a.status==='present'||a.status==='late').length;const r=dm.length>0?Math.round((dp/dm.length)*100):0;return`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${d}</span><span style="font-weight:700;color:${r>=80?'var(--ok)':r>=50?'var(--warn)':'var(--err)'}">${dp}/${dm.length} (${r}%)</span></div><div class="pb"><div class="pf ${r>=80?'g':r>=50?'y':'r'}" style="width:${r}%"></div></div></div>`}).join('')}</div></div>`}

function pgAttL(){const t=gt();return`<div class="ph"><h1>✅ سجل الحضور</h1></div><div class="fr"><input type="date" id="fdt" value="${t}" onchange="render()"/><select id="fdp" onchange="render()"><option value="">كل الأقسام</option>${D.departments.map(d=>`<option value="${d}" ${CU.role==='head'&&CU.dept===d?'selected':''}>${d}</option>`).join('')}</select><select id="fst" onchange="render()"><option value="">الكل</option><option value="present">حاضر</option><option value="late">متأخر</option><option value="absent">غائب</option><option value="none">لم يسجل</option></select><button class="btn bok bs" onclick="expF()">📥 تصدير</button></div><div class="tw"><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>المراقب</th><th>القسم</th><th>الفترة</th><th>الحالة</th><th>الوقت</th><th>المسجِّل</th></tr></thead><tbody>${attRows()}</tbody></table></div>`}
function attRows(){const dt=(document.getElementById('fdt')||{}).value||gt(),dp=(document.getElementById('fdp')||{}).value||(CU.role==='head'?CU.dept:''),sf=(document.getElementById('fst')||{}).value||'';let ms=D.monitors;if(dp)ms=ms.filter(m=>m.dept===dp);if(CU.role==='head')ms=ms.filter(m=>m.dept===CU.dept);const da=D.attendance.filter(a=>a.date===dt);let recs=ms.map(m=>{const a=da.find(x=>x.monitorId===m.id);const s=gas(a);const u=a?D.users.find(x=>x.id===a.recordedBy):null;return{m,a,s,u}});if(sf==='present')recs=recs.filter(r=>(r.a||{}).status==='present');if(sf==='late')recs=recs.filter(r=>(r.a||{}).status==='late');if(sf==='absent')recs=recs.filter(r=>(r.a||{}).status==='absent');if(sf==='none')recs=recs.filter(r=>!r.a);if(!recs.length)return'<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--txt3)">لا توجد</td></tr>';return recs.map((r,i)=>`<tr><td>${i+1}</td><td style="font-weight:600;color:var(--txt)">${r.m.name}</td><td><span class="badge bi">${r.m.dept}</span></td><td>${(r.a||{}).period||'-'}</td><td><span class="badge b${r.s.c}2">${r.s.s}</span></td><td style="font-weight:700">${(r.a||{}).recordTime||'---'}</td><td style="font-size:12px">${((r.u||{}).name||'').split(' ').slice(0,2).join(' ')||'-'}</td></tr>`).join('')}
function expF(){const d=(document.getElementById('fdt')||{}).value||gt();let r=D.attendance.filter(a=>a.date===d);if(CU.role==='head'){const ids=D.monitors.filter(m=>m.dept===CU.dept).map(m=>m.id);r=r.filter(x=>ids.includes(x.monitorId))}exportAtt(r,`حضور_${d}`)}

// ═══ REPORTS ═══
function pgRep(){return`<div class="ph"><h1>📈 التقارير</h1></div><div class="tabs"><button class="tab ${RT==='dept'?'av':''}" onclick="RT='dept';render()">📊 أقسام</button><button class="tab ${RT==='daily'?'av':''}" onclick="RT='daily';render()">📅 يومي</button><button class="tab ${RT==='indiv'?'av':''}" onclick="RT='indiv';render()">👤 فردي</button></div>${{dept:rDR,daily:rDyR,indiv:rIR}[RT]()}<div class="toolbar" style="margin-top:16px"><button class="btn bok" onclick="exportAtt(D.attendance,'تقرير_كامل')">📥 تصدير حضور</button><button class="btn bo" onclick="exportAllHandovers()">📥 تصدير استلام/تسليم</button><button class="btn bo" onclick="exportAllData()">📥 تصدير كامل</button><button class="btn bp" onclick="window.print()">🖨️ طباعة</button></div>`}
function rDR(){const ds=CU.role==='head'?[CU.dept]:D.departments;return`<div class="rg">${ds.map(d=>{const dm=D.monitors.filter(m=>m.dept===d);const da=D.attendance.filter(a=>dm.find(m=>m.id===a.monitorId));const p=da.filter(a=>a.status==='present').length,l=da.filter(a=>a.status==='late').length,ab=da.filter(a=>a.status==='absent').length;const r=da.length>0?Math.round(((p+l)/da.length)*100):0;return`<div class="rc"><h4>🏢 ${d}</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px"><div style="background:var(--bg);padding:12px;border-radius:10px;text-align:center"><div style="font-size:24px;font-weight:900;color:var(--accent2)">${dm.length}</div><div style="font-size:11px;color:var(--txt3)">مراقب</div></div><div style="background:var(--bg);padding:12px;border-radius:10px;text-align:center"><div style="font-size:24px;font-weight:900;color:var(--ok)">${r}%</div><div style="font-size:11px;color:var(--txt3)">حضور</div></div></div><div style="font-size:12px;color:var(--txt2)">حاضر:${p} متأخر:${l} غائب:${ab}</div><div class="pb" style="margin-top:8px"><div class="pf ${r>=80?'g':r>=50?'y':'r'}" style="width:${r}%"></div></div></div>`}).join('')}</div>`}
function rDyR(){const dates=[...new Set(D.attendance.map(a=>a.date))].sort().reverse();let ms=D.monitors;if(CU.role==='head')ms=ms.filter(m=>m.dept===CU.dept);return`<div class="tw"><div style="overflow-x:auto"><table><thead><tr><th>التاريخ</th><th>حاضر</th><th>متأخر</th><th>غائب</th><th>النسبة</th></tr></thead><tbody>${!dates.length?'<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--txt3)">-</td></tr>':dates.map(d=>{const da=D.attendance.filter(a=>a.date===d&&ms.find(m=>m.id===a.monitorId));const p=da.filter(a=>a.status==='present').length,l=da.filter(a=>a.status==='late').length,ab=da.filter(a=>a.status==='absent').length,t=p+l+ab;const r=t>0?Math.round(((p+l)/t)*100):0;return`<tr><td style="font-weight:600">${fds(d)}</td><td style="color:var(--ok);font-weight:700">${p}</td><td style="color:var(--warn);font-weight:700">${l}</td><td style="color:var(--err);font-weight:700">${ab}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="pb" style="flex:1;height:6px"><div class="pf ${r>=80?'g':r>=50?'y':'r'}" style="width:${r}%"></div></div><span style="font-weight:700;font-size:12px">${r}%</span></div></td></tr>`}).join('')}</tbody></table></div>`}
function rIR(){let ms=D.monitors;if(CU.role==='head')ms=ms.filter(m=>m.dept===CU.dept);const days=[...new Set(D.attendance.map(a=>a.date))].length||1;return`<div class="tw"><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>المراقب</th><th>القسم</th><th>حاضر</th><th>متأخر</th><th>غائب</th><th>%</th></tr></thead><tbody>${ms.map((m,i)=>{const a=D.attendance.filter(x=>x.monitorId===m.id);const p=a.filter(x=>x.status==='present').length,l=a.filter(x=>x.status==='late').length,ab=a.filter(x=>x.status==='absent').length;const r=days>0?Math.round(((p+l)/days)*100):0;return`<tr><td>${i+1}</td><td style="font-weight:600;color:var(--txt)">${m.name}</td><td><span class="badge bi">${m.dept}</span></td><td style="color:var(--ok);font-weight:700">${p}</td><td style="color:var(--warn);font-weight:700">${l}</td><td style="color:var(--err);font-weight:700">${ab}</td><td><span style="font-weight:700">${r}%</span></td></tr>`}).join('')}</tbody></table></div>`}

// ═══ SCHEDULE ═══
function pgSch(){if(!D.examCols||D.examCols.length===0)D.examCols=DD.examCols;const cols=D.examCols.filter(c=>c.show);const exams=D.examSchedule.sort((a,b)=>(a.date||'').localeCompare(b.date||''));return`<div class="ph"><h1>📅 جدول الاختبارات</h1></div>
${isa(CU)&&!isViewOnly()?`<div class="toolbar"><button class="btn bp bs" onclick="showAddEx()">➕ إضافة</button><button class="btn bok bs" onclick="showPasteEx()">📋 لصق من Excel</button><button class="btn bo bs" onclick="exportSch()">📥 تصدير</button><button class="btn bw bs" onclick="window.print()">🖨️ طباعة</button><button class="btn bo bs" onclick="showManageCols()">⚙️ الأعمدة</button><button class="btn ber bs" onclick="if(confirm('حذف الكل؟')){D.examSchedule=[];sv();render()}">🗑 حذف الكل</button></div>`:`<div class="toolbar"><button class="btn bo bs" onclick="exportSch()">📥 تصدير</button></div>`}
<div style="margin-bottom:12px"><span style="font-size:13px;color:var(--txt2)">📊 ${exams.length} اختبار · ${[...new Set(exams.map(e=>e.hall).filter(Boolean))].length} قاعة · ${[...new Set(exams.flatMap(e=>[e.monitor1,e.monitor2]).filter(Boolean))].length} مراقب</span>${exams.length>0&&!exams[0].monitor1?'<div style="background:rgba(220,38,38,0.08);border:1px solid rgba(220,38,38,0.15);padding:10px 14px;border-radius:8px;margin-top:8px;font-size:13px;color:var(--err)">⚠️ <strong>لا توجد بيانات مراقبين!</strong> تأكد أن عمود 14 (المراقب الأول) وعمود 15 (المراقب الثاني) موجودة في Excel. اعمل <strong>إعادة تعيين</strong> من الإعدادات ثم الصق الجدول من جديد.</div>':''}</div>
<div class="tw"><div style="overflow-x:auto"><table><thead><tr><th>#</th>${cols.map(c=>`<th${c.key==='monitor1'||c.key==='monitor2'||c.key==='monitor3'?' style="background:rgba(34,197,94,0.15);color:var(--ok);font-weight:700"':''}>${c.label}</th>`).join('')}${isa(CU)&&!isViewOnly()?'<th>إجراء</th>':''}</tr></thead><tbody>${exams.map((e,i)=>`<tr><td>${i+1}</td>${cols.map(c=>`<td${c.key==='course'?' style="font-weight:600;color:var(--txt)"':c.key==='monitor1'||c.key==='monitor2'||c.key==='monitor3'?' style="background:rgba(34,197,94,0.06);font-weight:600;color:var(--ok)"':''}>${e[c.key]||'-'}</td>`).join('')}${isa(CU)&&!isViewOnly()?`<td><button class="btn bo bx" onclick="showEditEx('${e.id}')">✏️</button> <button class="btn ber bx" onclick="D.examSchedule=D.examSchedule.filter(x=>x.id!=='${e.id}');sv();render()">🗑</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}

function showAddEx(editId){if(!D.examCols||D.examCols.length===0)D.examCols=DD.examCols;const ex=editId?D.examSchedule.find(x=>x.id===editId):null;const o=document.createElement('div');o.className='mo';o.id='mol';o.onclick=e=>{if(e.target===o)o.remove()};let fields='';D.examCols.forEach(c=>{const v=ex?ex[c.key]||'':'';if(c.key==='date')fields+=`<div class="fg"><label>${c.label}</label><input type="date" class="fi" id="exf_${c.key}" value="${v}"/></div>`;else if(c.key==='time')fields+=`<div class="fg"><label>${c.label}</label><input type="time" class="fi" id="exf_${c.key}" value="${v||'08:00'}"/></div>`;else fields+=`<div class="fg"><label>${c.label}</label><input type="text" class="fi" id="exf_${c.key}" value="${v}" placeholder="${c.label}"/></div>`});o.innerHTML=`<div class="modal"><h2>${editId?'✏️ تعديل':'➕ إضافة'} اختبار <button class="mcl" onclick="document.getElementById('mol').remove()">✕</button></h2>${fields}<button class="btn bp" onclick="saveEx('${editId||''}')">${editId?'✅ حفظ':'✅ إضافة'}</button></div>`;document.body.appendChild(o)}
function showEditEx(id){showAddEx(id)}
function saveEx(editId){const obj=editId?D.examSchedule.find(x=>x.id===editId):{id:gid()};D.examCols.forEach(c=>{const el=document.getElementById('exf_'+c.key);if(el)obj[c.key]=el.value.trim()});if(!editId)D.examSchedule.push(obj);sv();document.getElementById('mol').remove();syncFromSchedule();notify('تم',editId?'تم التعديل':'تم الإضافة','success');render()}

function showPasteEx(){if(!D.examCols||D.examCols.length===0)D.examCols=DD.examCols;const cols=D.examCols;const o=document.createElement('div');o.className='mo';o.id='mol';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML=`<div class="modal"><h2>📋 لصق جدول اختبارات من Excel <button class="mcl" onclick="document.getElementById('mol').remove()">✕</button></h2><p style="color:var(--txt2);font-size:13px;margin-bottom:8px">انسخ من Excel والصق هنا. ترتيب الأعمدة:</p><div style="background:var(--bg);padding:10px;border-radius:8px;font-size:11px;color:var(--accent2);margin-bottom:8px;line-height:1.8">${cols.map((c,i)=>`<span style="background:rgba(77,166,255,0.15);padding:2px 6px;border-radius:4px;margin:2px">${i+1}. ${c.label}</span>`).join(' ')}</div><p style="font-size:11px;color:var(--warn);margin-bottom:8px">⚠️ تأكد أن ترتيب الأعمدة في Excel يطابق الترتيب أعلاه (${cols.length} عمود). آخر عمودين هما المراقب الأول والثاني</p><div class="fg"><label>هل الصف الأول عناوين؟</label><select class="fi" id="pex_header"><option value="yes">نعم - تخطي الصف الأول</option><option value="no">لا - كل الصفوف بيانات</option></select></div><div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn bo" style="flex:1;padding:12px" onclick="document.getElementById('pex_file').click()">📂 اختر ملف CSV/TXT</button><input type="file" id="pex_file" accept=".csv,.tsv,.txt" style="display:none" onchange="loadFileToTextarea(this,'pex')"></div><textarea class="pa" id="pex" placeholder="الصق هنا من Excel... (Ctrl+V) أو اختر ملف من الزر أعلاه" style="min-height:150px"></textarea><p style="font-size:11px;color:var(--txt3);margin:6px 0"><span style="color:var(--ok)">💡</span> من الجوال: صدّر Excel كـ CSV ثم ارفعه من الزر أعلاه</p><div class="fg"><label>الطريقة</label><select class="fi" id="pex_mode"><option value="add">إضافة للجدول الحالي</option><option value="replace">استبدال الجدول بالكامل</option></select></div><div class="fg"><button class="btn bw bs" onclick="previewPaste()" style="width:100%">👁️ معاينة قبل الاستيراد</button></div><div id="paste-preview" style="display:none;margin-bottom:12px"></div><button class="btn bp" onclick="pasteEx()">✅ استيراد</button></div>`;document.body.appendChild(o)}
function previewPaste(){const rows=pep(document.getElementById('pex').value);const header=document.getElementById('pex_header').value==='yes';if(!rows.length){document.getElementById('paste-preview').innerHTML='<p style="color:var(--err)">لا توجد بيانات</p>';document.getElementById('paste-preview').style.display='block';return}
const dataRows=header?rows.slice(1):rows;const maxCols=Math.max(...dataRows.map(r=>r.length));
let html=`<div style="background:var(--bg);padding:12px;border-radius:8px;font-size:12px"><p style="font-weight:700;margin-bottom:8px">📊 ${dataRows.length} صف · ${maxCols} عمود</p>`;
if(header){const hdr=rows[0];html+='<p style="font-weight:700;color:var(--accent2);margin-bottom:4px">📋 أعمدة Excel المكتشفة:</p>';hdr.forEach((h,i)=>{const v=(dataRows[0]||[])[i]||'';const isMon=(h||'').includes('مراقب');html+=`<div style="display:flex;gap:8px;padding:2px 0${isMon?';background:rgba(34,197,94,0.1);padding:4px 6px;border-radius:4px':''}"><span style="color:var(--txt3);min-width:30px">${i+1}.</span><span style="font-weight:600;min-width:120px;color:${isMon?'var(--ok)':'var(--txt)'}">${h||'<فارغ>'}</span><span style="color:var(--txt3)">← ${v}</span></div>`})}else{const cols=D.examCols||DD.examCols;const first=dataRows[0]||[];cols.forEach((c,i)=>{const v=i<first.length?first[i]:'<فارغ>';html+=`<div style="display:flex;gap:8px;padding:2px 0"><span style="color:var(--txt3);min-width:30px">${i+1}.</span><span style="font-weight:600;min-width:120px">${c.label}</span><span style="color:${i<first.length?'var(--txt)':'var(--err)'}">${v}</span></div>`})}
html+='</div>';document.getElementById('paste-preview').innerHTML=html;document.getElementById('paste-preview').style.display='block'}
function pasteEx(){const raw=document.getElementById('pex').value;if(!raw||!raw.trim()){notify('خطأ','لا توجد بيانات - الصق من Excel أولاً','error');return}const rows=raw.trim().split('\n').map(l=>l.split('\t').map(c=>c.trim())).filter(r=>r.some(c=>c));if(!rows.length){notify('خطأ','لا توجد بيانات','error');return}const header=document.getElementById('pex_header').value==='yes';const mode=document.getElementById('pex_mode').value;D.examCols=JSON.parse(JSON.stringify(DD.examCols));const cols=D.examCols;const dataRows=header?rows.slice(1):rows;const firstRow=dataRows[0]||[];alert('عدد أعمدة Excel: '+firstRow.length+'\nعدد أعمدة النظام: '+cols.length+'\nأول خلية: '+firstRow[0]+'\nآخر خليتين: '+firstRow[firstRow.length-2]+' | '+firstRow[firstRow.length-1]);if(mode==='replace')D.examSchedule=[];let n=0;dataRows.forEach(r=>{if(r.length>=1&&r.some(c=>c)){const obj={id:gid()};cols.forEach((c,i)=>{if(i<r.length)obj[c.key]=(r[i]||'').trim()});if(obj.course||obj.code||obj.campus||r[0]){D.examSchedule.push(obj);n++}}});sv();syncFromSchedule();sv();document.getElementById('mol').remove();const m1=D.examSchedule.filter(e=>e.monitor1&&e.monitor1.trim()).length;const m2=D.examSchedule.filter(e=>e.monitor2&&e.monitor2.trim()).length;const m3=D.examSchedule.filter(e=>e.monitor3&&e.monitor3.trim()).length;notify('تم الاستيراد',n+' اختبار · مراقب1: '+m1+' · مراقب2: '+m2+' · مراقب3: '+m3+' · المراقبين: '+D.monitors.length,'success');render()}

// ═══ MONITORS ═══
function pgMon(){let ms=D.monitors;if(CU.role==='head')ms=ms.filter(m=>m.dept===CU.dept);const schMonitors=new Set();D.examSchedule.forEach(e=>{if(e.monitor1)schMonitors.add(e.monitor1.trim());if(e.monitor2)schMonitors.add(e.monitor2.trim())});return`<div class="ph"><h1>👥 المراقبين</h1><p>يتم استخراج المراقبين تلقائياً من جدول الاختبارات · القسم يُجلب من الدليل</p></div>
${isa(CU)&&!isViewOnly()?`<div class="toolbar"><button class="btn bp bs" onclick="syncFromSchedule();autoFillDepts();" >🔄 مزامنة من الجدول</button><button class="btn bok bs" onclick="autoFillDepts()">📋 تعبئة الأقسام من الدليل</button><button class="btn bo bs" onclick="showPasteMon()">📋 لصق من Excel</button><button class="btn bo bs" onclick="showAddMon()">➕ إضافة يدوي</button><button class="btn bo bs" onclick="exportMon()">📥 تصدير المراقبين</button></div>`:``}
<div style="background:rgba(77,166,255,0.08);border:1px solid rgba(77,166,255,0.15);padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;color:var(--accent2)">💡 <strong>ملاحظة:</strong> عند لصق جدول الاختبارات، يتم استخراج المراقبين تلقائياً من أعمدة "المراقب الأول" و "المراقب الثاني"</div>
<input type="text" class="sinp" placeholder="🔍 بحث..." value="${SQ}" oninput="SQ=this.value;render()"/>
<div class="tw"><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>الاسم</th><th>القسم</th><th>المصدر</th><th>اختبارات مسندة</th>${isa(CU)&&!isViewOnly()?'<th>إجراء</th>':''}</tr></thead><tbody>${ms.filter(m=>!SQ||m.name.includes(SQ)||(m.dept||'').includes(SQ)).map((m,i)=>{const exCount=D.examSchedule.filter(e=>(e.monitor1||'').trim()===m.name||(e.monitor2||'').trim()===m.name||(e.monitor3||'').trim()===m.name).length;const dept=(function(){var pb=getDeptFromPB(m.name);return (pb&&pb!=='-')?pb:(m.dept||'');})();return`<tr><td>${i+1}</td><td style="font-weight:600;color:var(--txt)">${m.name}</td><td><span class="badge bi">${dept&&dept!=='-'?dept:'-'}</span></td><td><span class="badge ${m.source==='schedule'?'bok2':'bpu2'}">${m.source==='schedule'?'📅 من الجدول':'✏️ يدوي'}</span></td><td><span class="badge ${exCount>0?'bok2':'bi'}">${exCount} اختبار</span></td>${isa(CU)&&!isViewOnly()?`<td><button class="btn bo bx" onclick="showEditMon2('${m.id}')">✏️</button> <button class="btn ber bx" onclick="if(confirm('حذف ${m.name}؟')){D.monitors=D.monitors.filter(x=>x.id!=='${m.id}');sv();render()}">🗑</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`}

function showAddMon(){const o=document.createElement('div');o.className='mo';o.id='mol';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML=`<div class="modal"><h2>➕ إضافة مراقب <button class="mcl" onclick="document.getElementById('mol').remove()">✕</button></h2><div class="fg"><label>الاسم</label><input type="text" class="fi" id="nm-name" placeholder="اسم المراقب"/></div><div class="fg"><label>القسم</label><select class="fi" id="nm-dept">${D.departments.map(d=>`<option value="${d}">${d}</option>`).join('')}</select></div><button class="btn bp" onclick="const n=document.getElementById('nm-name').value.trim(),d=document.getElementById('nm-dept').value;if(!n){notify('خطأ','أدخل الاسم','error');return}if(D.monitors.find(m=>m.name===n)){notify('خطأ','موجود','error');return}D.monitors.push({id:gid(),name:n,dept:d,source:'manual'});sv();document.getElementById('mol').remove();notify('تم','تم الإضافة','success');render()">✅ إضافة</button></div>`;document.body.appendChild(o)}

function autoFillDepts(){var count=0;D.monitors.forEach(function(m){var d=getDeptFromPB(m.name);if(d&&d!=='-'&&d!==m.dept){m.dept=d;count++}});sv();render();notify('تم','تم تحديث القسم لـ '+count+' مراقب من الدليل 📖','success')}

function showEditMon2(id){const m=D.monitors.find(x=>x.id===id);if(!m)return;const curDept=m.dept||getDeptFromPB(m.name);const o=document.createElement('div');o.className='mo';o.id='mol';o.onclick=e=>{if(e.target===o)o.remove()};o.innerHTML=`<div class="modal"><h2>✏️ تعديل مراقب <button class="mcl" onclick="document.getElementById('mol').remove()">✕</button></h2><div class="fg"><label>الاسم</label><input type="text" class="fi" id="em-name" value="${m.name}"/></div><div class="fg"><label>القسم</label><input type="text" class="fi" id="em-dept" value="${curDept&&curDept!=='-'?curDept:''}" list="dept-list" placeholder="اكتب أو اختر القسم"/><datalist id="dept-list">${D.departments.map(d=>`<option value="${d}">`).join('')}</datalist></div><button class="btn bp" onclick="const mm=D.monitors.find(x=>x.id==='${id}');if(mm){mm.name=document.getElementById('em-name').value.trim();mm.dept=document.getElementById('em-dept').value.trim();sv();document.getElementById('mol').remove();notify('تم','تم حفظ التعديل','success');render()}">✅ حفظ</button></div>`;document.body.appendChild(o)}

function pgHalls(){return`<div class="ph"><h1>🏢 القاعات</h1><p>يتم استخراج القاعات تلقائياً من جدول الاختبارات</p></div>
<div class="toolbar"><button class="btn bp bs" onclick="syncFromSchedule();render();notify('تم','تم المزامنة','success')">🔄 مزامنة من الجدول</button><button class="btn bo bs" onclick="const n=prompt('اسم القاعة:');if(n&&!D.halls.includes(n)){D.halls.push(n);sv();render()}">➕ إضافة يدوي</button><button class="btn bo bs" onclick="exportHalls()">📥 تصدير</button></div>
<div style="background:rgba(77,166,255,0.08);border:1px solid rgba(77,166,255,0.15);padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13px;color:var(--accent2)">💡 عند لصق جدول الاختبارات، يتم استخراج القاعات تلقائياً من عمود "القاعة"</div>

function exportPhoneBook(){const rows=[['#','الاسم','القسم','رقم الجوال','الايميل']];D.phoneBook.forEach(function(f,i){rows.push([i+1,f.name,f.dept||'-',f.phone||'-',f.email||'-'])});toCSV(rows,'دليل_الهاتف','📞 دليل أعضاء هيئة التدريس')}
function exportPBVcf(){
  var vcf=D.phoneBook.map(function(f){
    var p=formatPhone(f.phone||'');
    return'BEGIN:VCARD\nVERSION:3.0\nFN:'+f.name+(f.dept?' ('+f.dept+')':'')+'\n'+
      (p?'TEL;TYPE=CELL:+'+p+'\n':'')+
      (f.email?'EMAIL:'+f.email+'\n':'')+
      'ORG:'+( D.settings.collegeName||'')+'\n'+
      'END:VCARD';
  }).join('\n');
  var b=new Blob([vcf],{type:'text/vcard;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='دليل_هيئة_التدريس_'+gt()+'.vcf';a.click();
  notify('تم','تم تصدير '+D.phoneBook.length+' جهة اتصال كـ VCF','success');
}
function shareRcv(eid){const t=window._selDate||gt();const ho=getHO(eid,t);const e=D.examSchedule.find(x=>x.id===eid);if(!ho||!e)return;const msg='📥 تم استلام أوراق الاختبار\n'+'✨ المقرر: '+(e.course||'-')+'\n'+'• الرمز: '+(e.code||'-')+'\n'+'• القاعة: '+(e.hall||'-')+'\n'+'⏰ الوقت: '+(e.time||'-')+'\n'+'👤 المستلم: '+(ho.receivedBy||'-')+'\n'+'🕐 وقت الاستلام: '+(ho.receiveTime||'-');shareWA(msg)}
function shareRet(eid){const t=window._selDate||gt();const ho=getHO(eid,t);const e=D.examSchedule.find(x=>x.id===eid);if(!ho||!e)return;const msg='📤 تم تسليم أوراق الاختبار\n'+'✨ المقرر: '+(e.course||'-')+'\n'+'• الرمز: '+(e.code||'-')+'\n'+'• القاعة: '+(e.hall||'-')+'\n'+'👤 المسلّم: '+(ho.returnedBy||'-')+'\n'+'📊 الإحصائيات:\n'+'  ✅ حاضر: '+(ho.presentCount||0)+'\n'+'  ❌ غائب: '+(ho.absentCount||0)+'\n'+'  🚪 منسحب: '+(ho.withdrawnCount||0)+'\n'+'  ⛔ محروم: '+(ho.deprivedCount||0)+'\n'+'  ⚠️ غش: '+(ho.cheatingCount||0)+'\n'+'  📄 أوراق: '+(ho.paperCount||0)+(ho.notes?'\n📝 '+ho.notes:'')+'\n'+'🕐 التسليم: '+(ho.returnTime||'-');shareWA(msg)}
function shareHandoverReport(){const t=window._selDate||gt();const exams=D.examSchedule.filter(e=>e.date===t);const total=exams.length;const rcvd=exams.filter(e=>{const h=getHO(e.id,t);return h&&h.received}).length;const retd=exams.filter(e=>{const h=getHO(e.id,t);return h&&h.returned}).length;let msg='📊 تقرير الاستلام والتسليم\n'+'• التاريخ: '+t+'\n'+'📝 إجمالي الاختبارات: '+total+'\n'+'📥 تم الاستلام: '+rcvd+'/'+total+'\n'+'📤 تم التسليم: '+retd+'/'+total+'\n';const pending=exams.filter(e=>{const h=getHO(e.id,t);return !h||!h.received});if(pending.length){msg+='\n⏳ لم يتم استلامها:\n';pending.forEach(e=>{msg+='• '+(e.course||'-')+' | '+(e.hall||'-')+'\n'})}const notRet=exams.filter(e=>{const h=getHO(e.id,t);return h&&h.received&&!h.returned});if(notRet.length){msg+='\n⏳ لم يتم تسليمها:\n';notRet.forEach(e=>{msg+='• '+(e.course||'-')+' | '+(e.hall||'-')+'\n'})}msg+='\n'+D.settings.collegeName;shareWA(msg)}

function pgExamReceipt(){const vo=isViewOnly();const allDates=[...new Set(D.examSchedule.map(e=>e.date).filter(d=>d))].sort();if(!window._selDate&&allDates.length>0){const today=gt();window._selDate=allDates.includes(today)?today:allDates[0]}const t=window._selDate||gt();const exams=D.examSchedule.filter(e=>e.date===t).sort((a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00'));if(!D.examReceipts)D.examReceipts=[];const rcvd=exams.filter(e=>D.examReceipts.find(r=>r.examId===e.id)).length;let dateOpts='';allDates.forEach(d=>{const dayEx=D.examSchedule.find(e=>e.date===d);const dayName=dayEx&&dayEx.day?dayEx.day:'';const exCount=D.examSchedule.filter(e=>e.date===d).length;dateOpts+=`<option value="${d}" ${d===t?'selected':''}>${d} ${dayName?' - '+dayName:''} (${exCount} اختبار)</option>`});let rows='';exams.forEach((e,idx)=>{const rcpt=D.examReceipts.find(r=>r.examId===e.id);const isRcv=!!rcpt;const coordPhone=getMonPhone(e.coordinator||'');const lecPhone=getMonPhone(e.lecturer||'');const statusHTML=isRcv?`<span style="color:var(--ok);font-weight:700">✅ تم الاستلام</span><br><span style="font-size:11px;color:var(--txt3)">${rcpt.receivedBy||''}<br>${rcpt.receiveDate||''} - ${rcpt.receiveTime||''}</span>`:(vo?'':`<button class="btn bp bx" onclick="rcvExam('${e.id}')" style="font-size:12px;padding:6px 14px">📥 استلام</button>`);const waHTML=isRcv?`<button class="btn bo bx" onclick="waExamRcvNotify('${e.id}')" style="font-size:11px;padding:4px 10px" title="إشعار واتساب">📱 إشعار</button>${vo?'':` <button class="btn bo bx" onclick="undoRcvExam('${e.id}')" style="font-size:11px;padding:4px 10px;color:var(--err)" title="تراجع">↩️</button>`}`:'';rows+=`<tr style="${isRcv?'background:rgba(16,185,129,0.05)':''}"><td>${idx+1}</td><td style="font-weight:700">${e.course||'-'}</td><td>${e.code||'-'}</td><td>${e.section||'-'}</td><td>${e.enrolled||'-'}</td><td>${e.coordinator||'-'}</td><td>${e.lecturer||'-'}</td><td>${e.hall||'-'}</td><td>${e.time||'-'}</td><td>${statusHTML}</td><td>${waHTML}</td></tr>`});const dateSel=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;background:var(--card);padding:12px 16px;border-radius:12px;border:1px solid var(--brd)"><span style="font-weight:700;font-size:14px;color:var(--txt2)">📅 اليوم:</span><select onchange="window._selDate=this.value;render()" style="flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1px solid var(--brd);background:var(--bg);color:var(--txt);font-size:14px;font-weight:600">${dateOpts}</select><button class="btn bo" onclick="exportRcptXls()" style="font-size:13px;padding:8px 14px">📊 تصدير Excel</button></div>`;return`<div class="ph"><h1>📥 استلام الاختبارات من أعضاء هيئة التدريس</h1></div>${dateSel}<div class="sg"><div class="sc bl"><div class="si">📝</div><div class="sv">${exams.length}</div><div class="sl">إجمالي</div></div><div class="sc gr"><div class="si">✅</div><div class="sv">${rcvd}</div><div class="sl">تم الاستلام</div></div><div class="sc rd"><div class="si">⏳</div><div class="sv">${exams.length-rcvd}</div><div class="sl">لم يستلم</div></div></div>${exams.length===0?'<div style="text-align:center;padding:40px;color:var(--txt3)"><div style="font-size:40px;margin-bottom:12px">📭</div><p>لا توجد اختبارات في هذا اليوم</p></div>':`<div class="tw"><table><thead><tr><th>#</th><th>اسم المقرر</th><th>الرمز</th><th>الشعبة</th><th>المسجلين</th><th>المنسق</th><th>المحاضر</th><th>القاعة</th><th>التوقيت</th><th>حالة الاستلام</th><th>إجراءات</th></tr></thead><tbody>${rows}</tbody></table>`}`}
function rcvExam(eid){const e=D.examSchedule.find(x=>x.id===eid);if(!e)return;if(!D.examReceipts)D.examReceipts=[];const existing=D.examReceipts.find(r=>r.examId===eid);if(existing){notify('تنبيه','تم استلام هذا الاختبار مسبقاً','warning');return}const n=nw(),ti=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');D.examReceipts.push({id:gid(),examId:eid,receivedBy:CU.name,receiveTime:ti,receiveDate:gt(),examDate:(window._selDate||gt()),deliveredBy:e.coordinator||e.lecturer||''});sv();notify('تم','تم استلام اختبار: '+(e.course||'-'),'success');render()}
function undoRcvExam(eid){if(!confirm('التراجع عن استلام هذا الاختبار؟'))return;D.examReceipts=D.examReceipts.filter(r=>r.examId!==eid);sv();notify('تم','تم التراجع','success');render()}
function waExamRcvNotify(eid){const e=D.examSchedule.find(x=>x.id===eid);if(!e)return;const rcpt=D.examReceipts.find(r=>r.examId===eid);const coord=e.coordinator||'';const lect=e.lecturer||'';const coordPhone=getMonPhone(coord);const lectPhone=getMonPhone(lect);const previewLines=['السلام عليكم ورحمة الله وبركاته','نفيدكم بأنه تم استلام اختبار:','','✨ المقرر: '+(e.course||'-'),'• الرمز: '+(e.code||'-'),'• الشعبة: '+(e.section||'-'),'• المسجلين: '+(e.enrolled||'-'),'• التاريخ: '+(e.date||'-')+' '+(e.day||''),'• التوقيت: '+(e.time||'-'),'• القاعة: '+(e.hall||'-'),'','✅ تم الاستلام بتاريخ '+(rcpt&&rcpt.receiveDate?rcpt.receiveDate:e.date||'')+' والساعة '+(rcpt?rcpt.receiveTime:'')+' بواسطة: '+(rcpt?rcpt.receivedBy:''),'','كلية الأعمال - جامعة الجوف'];const previewHTML=previewLines.join('<br>');const o=document.createElement('div');o.className='mo';o.id='mol';o.onclick=function(ev){if(ev.target===o)o.remove()};let btns='';if(coordPhone)btns+='<button class="btn bp" style="width:100%" onclick="sendExamWA(\''+coordPhone+'\',\''+eid+'\');document.getElementById(\'mol\').remove()">📱 إرسال للمنسق: '+coord+'</button>';if(lectPhone&&lect!==coord)btns+='<button class="btn bo" style="width:100%;margin-top:8px" onclick="sendExamWA(\''+lectPhone+'\',\''+eid+'\');document.getElementById(\'mol\').remove()">📱 إرسال للمحاضر: '+lect+'</button>';if(!btns)btns='<p style="color:var(--err);text-align:center">لا يوجد رقم جوال في دليل الهاتف</p>';o.innerHTML='<div class="mc" style="max-width:480px"><h3 style="margin-bottom:16px;color:#ecf0f1">📱 إشعار واتساب بالاستلام</h3><div style="background:var(--bg);padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px;line-height:1.8;color:var(--txt)">'+previewHTML+'</div>'+btns+'<button class="btn bo" style="width:100%;margin-top:8px" onclick="document.getElementById(\'mol\').remove()">إلغاء</button></div>';document.body.appendChild(o)}

function sendExamWA(phone,eid){const e=D.examSchedule.find(x=>x.id===eid);if(!e)return;const rcpt=(D.examReceipts||[]).find(r=>r.examId===eid);const p=formatPhone(phone);if(!p)return;const lines=['السلام عليكم ورحمة الله وبركاته','نفيدكم بأنه تم استلام اختبار:','','✨ المقرر: '+(e.course||'-'),'• الرمز: '+(e.code||'-'),'• الشعبة: '+(e.section||'-'),'• المسجلين: '+(e.enrolled||'-'),'• التاريخ: '+(e.date||'-')+' '+(e.day||''),'• التوقيت: '+(e.time||'-'),'• القاعة: '+(e.hall||'-'),'','✅ تم الاستلام بتاريخ '+(rcpt?rcpt.receiveDate||e.date||'':'')+' والساعة '+(rcpt?rcpt.receiveTime:''),'المستلم: '+(rcpt?rcpt.receivedBy:''),'','كلية الأعمال - جامعة الجوف'];window.open('https://wa.me/'+p+'?text='+encodeURIComponent(lines.join('\n')))}

    var esc=function(s){return (s||'').replace(/'/g,"\\'");};

      '<td style="font-weight:600;font-size:13px">'+f.name+'</td>'+

    '<input type="text" class="fi" id="pb_search" placeholder="🔍 بحث بالاسم أو القسم أو الجوال..." oninput="pbFilter(this.value)" style="padding:10px 14px;margin:0"/>'+

      '<button class="btn bok bx" onclick="pasteFaculty()" style="font-size:12px;padding:8px 14px">📋 لصق / Excel</button>'+
      '<button class="btn ber bx" onclick="pbDeleteAll()" style="font-size:12px;padding:8px 14px">🗑 حذف الكل</button>'
    :'')+
    '<button class="btn bo bx" onclick="exportPhoneBook()" style="font-size:12px;padding:8px 14px">📊 تصدير Excel</button>'+
    '<button class="btn bo bx" onclick="exportPBVcf()" style="font-size:12px;padding:8px 14px">📇 تصدير VCF</button>'+
  '</div>';

function doPasteFaculty(mode){
  mode = mode||'add';
  var raw=document.getElementById('f_paste').value;
  var skip=document.getElementById('f_skip').checked;
  if(!raw.trim()){notify('خطأ','الصق البيانات أو اختر ملف','error');return;}
  if(mode==='replace'&&D.phoneBook.length>0){
    if(!confirm('⚠️ سيتم حذف الدليل الحالي ('+D.phoneBook.length+' عضو) واستبداله بالبيانات الجديدة.\nهل أنت متأكد؟'))return;
    D.phoneBook=[];
  }
  var rows=pep(raw);
  var data=skip?rows.slice(1):rows;
  var added=0,updated=0;
  data.forEach(function(r){
    if(!r.length||!r[0].trim())return;
    var name=r[0].trim();
    var dept='',phone='',email='';
    // تحليل ذكي للأعمدة
    if(r.length>=4){
      dept  = r[1].trim();
      phone = r[2].replace(/[^\d]/g,'').trim();
      email = r[3].trim();
    } else if(r.length===3){
      var c1=r[1].trim(), c2=r[2].trim();
      if(/^\d/.test(c1)){phone=c1.replace(/[^\d]/g,'');email=c2;}
      else{dept=c1; if(/^\d/.test(c2))phone=c2.replace(/[^\d]/g,''); else email=c2;}
    } else if(r.length===2){
      var c1=r[1].trim();
      if(/^\d/.test(c1))phone=c1.replace(/[^\d]/g,'');
      else if(c1.includes('@'))email=c1;
      else dept=c1;
    }
    var exists=D.phoneBook.find(function(f){return f.name===name;});
    if(exists){
      if(dept)exists.dept=dept;
      if(phone)exists.phone=phone;
      if(email)exists.email=email;
      updated++;
    } else {
      D.phoneBook.push({id:gid(),name:name,dept:dept,phone:phone,email:email});
      added++;
    }
  });
  D.phoneBook.forEach(function(f){
    if(f.dept&&!D.departments.includes(f.dept))D.departments.push(f.dept);
  });
  sv();
  document.getElementById('mol').remove();
  logAudit('استيراد الدليل','أُضيف: '+added+' | حُدِّث: '+updated+(mode==='replace'?' (استبدال)':' (إضافة)'),'');
  notify('تم','✅ أُضيف: '+added+' | حُدِّث: '+updated+' | الإجمالي: '+D.phoneBook.length,'success');
  render();
}

html+='<ol class="duty-list"><li>يجب أن يتواجد المراقب في قاعة الاختبار قبل بدء الاختبار بربع ساعة على الأقل، وبعد أن يقوم بالتوقيع في الكشف المخصص لحضور المراقبين.</li><li>يتولى مشرف القاعة استلام مظروف الأسئلة ودفاتر الإجابة وكشف حضور الطلبة من وحدة الاختبارات (أو ما يناظرها) قبل بدء الاختبار، حيث يقوم كل من مشرف القاعة وعضو وحدة الاختبارات بالتوقيع على نموذج محضر تسليم واستلام مظروف الأسئلة.</li><li>يتولى المراقبون حصر الطلبة المحرومين ومتابعة الأسماء لضمان عدم دخول الطالب اختبار المادة وهو محروم.</li><li>يتولى المراقب التأكد من انتظام جميع الطلبة داخل القاعة قبل بدء وقت الاختبار.</li><li>يتولى المراقب التحقق من التزام الطلبة بالزي السعودي، (ما لم يكن التخصص مستثنى من ذلك).</li><li>يتولى مشرف القاعة تقسيم العمل داخل القاعة من خلال توزيع المراقبين بشكل مناسب، مع تجنب تمركزهم في مكان واحد، لضمان سير أعمال المراقبة بشكل منظم.</li><li>يقوم المراقب بالتنبيه على الطلبة بعدم حمل أجهزة الجوال والساعات الذكية وسماعات البلوتوث أو ما شابه ذلك داخل قاعة الاختبار وفي حالة ضبط أيًا من تلك الأجهزة بحوزة الطالب تعتبر محاولة غش.</li><li>يقوم المراقب بتوزيع أوراق أسئلة الاختبار ودفاتر الإجابة في الوقت المحدد لبداية الاختبار.</li><li>يتأكد المراقب من أن كل طالب يحمل بطاقة التعريف الجامعي.</li><li>يقوم المراقب بمراجعة البيانات المعبئة من قبل الطالب على دفتر الإجابة كالاسم والرقم الجامعي ونموذج الاختبار — في حالة تعدد النماذج — للتأكد من صحتها ومطابقتها لبطاقته الجامعية وورقة الأسئلة.</li><li>يتأكد المراقبون من أن كل الطلبة قد وقعوا بالحضور في الكشف المخصص لذلك.</li><li>يتجنب المراقب الانشغال بأي أمر (مثل استخدام الهاتف الجوال) أثناء المراقبة مما قد يؤثر على سير أعمال المراقبة بشكل سليم.</li><li>يتجول المراقبون بالتناوب بين الطلبة داخل قاعة الاختبار خلال فترة الاختبار بأكملها.</li><li>يقوم المراقبون على فترات بتذكير الطلبة بالوقت المتبقي من زمن الاختبار.</li><li>لا يَسمح المراقب للطالب بدخول الاختبار النهائي بعد مضي نصف ساعة من بدايته، كما لا يُسمح للطالب بالخروج من الاختبار قبل مضي نصف مدة الاختبار المعتمدة.</li><li>يلتزم عضو هيئة التدريس بالحضور أثناء عقد اختبار المقرر الذي يتولى تدريسه وعلى مشرف القاعة طلب حضور أستاذ المقرر إلى قاعة الاختبار إذا اقتضت الضرورة وذلك للإجابة على استفسارات الطلبة، وأن يكون التوضيح علناً لجميع الطلبة بعد أخذ جميع الاستفسارات من الطلبة.</li><li>المراقبون مسؤولون عن الحفاظ على الهدوء داخل القاعة.</li><li>في حال ضبط الطالب متلبساً بالغش أثناء الاختبار، أو إخلاله بالهدوء والنظام الواجب توافرهما بقاعة الاختبار، فعلى المراقب (بالتنسيق مع المشرف على القاعة) سحب دفتر الاجابة من الطالب وإخراج الطالب المخالف من قاعة الاختبار، وتحرير محضر تفصيلي بالواقعة وتسليمه مع المستندات التوثيقية لرئيس اللجنة الفرعية للانضباط السلوكي بالكلية، وبالنسبة لدفتر إجابة الطالب، يتم تسليمه إلى وحدة الاختبارات (أو ما يناظرها).</li><li>يقوم المراقب بتسليم كل دفاتر الإجابة مع كشف الحضور إلى المشرف على القاعة الذي بدوره يقوم بالتأكد من عدد أوراق الأسئلة وعدد دفاتر الإجابة، طبقاً لأعداد الحضور قبل تسليمها إلى وحدة الاختبارات (أو ما يناظرها) ويقوم كل من مشرف القاعة وعضو وحدة الاختبارات بالتوقيع على نموذج محضر تسليم واستلام دفاتر الإجابة.</li><li>يقوم المراقب بتسليم أوراق أسئلة الاختبار الزائدة (غير المستخدمة والمعيبة والمتلفة) إلى المشرف على القاعة قبل نهاية الاختبار، والذي بدوره يقوم بتسليمها إلى وحدة الاختبارات (أو ما يناظرها).</li><li>في حالة رصد المراقب لحالات غير عادية أو استثنائية قد تؤثر على سير الاختبارات، عليه إبلاغها لوحدة الاختبارات التي ترفعها بدورها للمشرف على الاختبارات بالكلية.</li><li>يمكن لكل كلية إضافة أي تعليمات أخرى تتعلق بأعمال المراقبة، شريطة ألا تتعارض مع الضوابط والأنظمة المعتمدة ذات الصلة في الجامعة.</li></ol>';

// ═══ AUTO-SYNC FROM SCHEDULE ═══
function normName(s){if(!s)return'';return s.trim().replace(/\s+/g,' ').replace(/[\u0610-\u061A\u064B-\u065F\u0670]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')}
function getDeptFromPB(name){if(!D.phoneBook||!name)return'-';var n=normName(name);var pb=D.phoneBook.find(function(p){return p.dept&&p.dept.trim()&&p.name&&normName(p.name)===n});if(pb)return pb.dept.trim();var words=n.split(' ');if(words.length>=3){pb=D.phoneBook.find(function(p){if(!p.dept||!p.dept.trim()||!p.name)return false;var pn=normName(p.name);var pw=pn.split(' ');if(pw.length<3)return false;return pw[0]===words[0]&&pw[pw.length-1]===words[words.length-1]});if(pb)return pb.dept.trim()}return'-'}
function getMonDept(m){if(m.dept)return m.dept;var d=getDeptFromPB(m.name);return d!=='-'?d:'-'}
function findDept(name){var d=getDeptFromPB(name);return d==='-'?'':d;}
function syncFromSchedule(){
if(!D.handovers)D.handovers=[];
const names=new Set();
D.examSchedule.forEach(e=>{
const m1=(e.monitor1||'').trim();
const m2=(e.monitor2||'').trim();
const m3=(e.monitor3||'').trim();
if(m1)names.add(m1);
if(m2)names.add(m2);
if(m3)names.add(m3);
const h=(e.hall||'').trim();
if(h&&!D.halls.includes(h))D.halls.push(h);
const d=(e.dept||e.program||'').trim();
if(d&&!D.departments.includes(d))D.departments.push(d);
});

let added=0;
names.forEach(name=>{
if(!name)return;
var existing=D.monitors.find(m=>m.name===name);
if(!existing){
D.monitors.push({id:gid(),name:name,dept:findDept(name),source:'schedule'});
added++;
}else if(!existing.dept||!existing.dept.trim()){

function addNewCol(){const key=document.getElementById('new-col-key').value.trim().replace(/\s/g,'_');const label=document.getElementById('new-col-label').value.trim();if(!key||!label){notify('خطأ','أدخل المعرّف والاسم','error');return}if(D.examCols.find(c=>c.key===key)){notify('خطأ','المعرّف موجود','error');return}D.examCols.push({key,label,show:true});sv();document.getElementById('mol').remove();showManageCols();notify('تم',`تم إضافة عمود: ${label}`,'success')}
