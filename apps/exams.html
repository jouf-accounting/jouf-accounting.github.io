// ── ① حساب دقائق التأخر بين وقت الاختبار ووقت التسجيل ──
function calcLateMins(examTime, recordTime){
  if(!examTime || !recordTime) return 0;
  function parseT(t){
    var s = (t+'').trim();
    var isPM = /[مm]/i.test(s) || s.toUpperCase().includes('PM');
    var isAM = /[صa]/i.test(s) || s.toUpperCase().includes('AM');
    s = s.replace(/[^0-9:]/g,'').trim();
    if(!s) return -1;
    var p = s.split(':');
    var h = parseInt(p[0]);
    var m = parseInt(p[1])||0;
    if(isNaN(h)) return -1;
    if(isPM && h<12) h+=12;
    if(isAM && h===12) h=0;
    return h*60+m;
  }
  var ex = parseT(examTime);
  var rc = parseT(recordTime);
  if(ex<0 || rc<0) return 0;
  return Math.max(0, rc - ex);
}

// ── ② بناء تقرير حضور المراقبين الشامل ──
function buildMonAttReport(date){
  var t = date || window._selDate || gt();
  var col = D.settings.collegeName || '';
  var sem = D.settings.semester || '';
  var border = '━━━━━━━━━━━━━━━━━━━━';
  var thr = D.settings.lateThreshold || 10;
  var dayName = '';
  var exams = D.examSchedule.filter(function(e){return e.date===t;});
  if(exams.length) dayName = exams[0].day || '';

  // اجمع المراقبين عبر كل اختبارات اليوم
  var allMons = {};
  exams.forEach(function(ex){
    [
      {n:ex.monitor1, r:'مشرف القاعة'},
      {n:ex.monitor2, r:'مراقب 2'},
      {n:ex.monitor3, r:'مراقب 3'}
    ].filter(function(x){return x.n && x.n.trim();}).forEach(function(x){
      var nm = x.n.trim();
      if(!allMons[nm]) allMons[nm] = [];
      var mid = (typeof findMonitorId === 'function') ? findMonitorId(nm) : null;
      var att = mid ? D.attendance.find(function(a){
        return a.monitorId===mid && a.date===t && a.examId===ex.id;
      }) : null;
      // fallback: سجل بدون examId
      if(!att && mid){
        att = D.attendance.find(function(a){
          return a.monitorId===mid && a.date===t && !a.examId;
        });
      }
      var lateMin = 0;
      if(att && att.status==='late'){
        lateMin = calcLateMins(ex.time, att.recordTime);
      }
      allMons[nm].push({
        ex: ex, role: x.r,
        status: att ? att.status : null,
        time: att ? (att.recordTime||'') : '',
        lateMin: lateMin
      });
    });
  });

  var names = Object.keys(allMons);
  var present = [], late = [], absent = [], notReg = [];
  names.forEach(function(nm){
    var recs = allMons[nm];
    var hasLate = recs.find(function(r){return r.status==='late';});
    var hasPres = recs.find(function(r){return r.status==='present';});
    var hasAb   = recs.find(function(r){return r.status==='absent';});
    var hasNone = recs.find(function(r){return !r.status;});
    if(hasPres)      present.push({name:nm, rec:hasPres});
    else if(hasLate) late.push({name:nm, rec:hasLate});
    else if(hasAb)   absent.push({name:nm, rec:hasAb});
    else             notReg.push({name:nm, rec:hasNone||recs[0]});
  });

  var lines = [
    '🎓 ' + col,
    sem ? '📆 ' + sem : '',
    border,
    '📋 *تقرير حضور المراقبين*',
    '📅 التاريخ: ' + t + (dayName?' — '+dayName:''),
    '🕐 وقت إعداد التقرير: ' + nt(),
    border,
    '📊 *الإحصائيات:*',
    '   👥 إجمالي المراقبين: ' + names.length,
    '   ✅ حاضر: '   + present.length,
    '   ⏰ متأخر: '  + late.length,
    '   ❌ غائب: '   + absent.length,
    '   ❓ لم يُسجَّل: ' + notReg.length,
    '   📝 عدد الاختبارات: ' + exams.length,
    border
  ];

  // الحاضرون مع وقت الوصول بالدقيقة
  if(present.length){
    lines.push('✅ *الحاضرون (' + present.length + '):*');
    present.forEach(function(p, i){
      var dp = (typeof getMonDept === 'function') ? getMonDept(p.name) : '';
      lines.push('   ' + (i+1) + '. ' + p.name +
        (p.rec.time ? ' — وصل ' + p.rec.time : '') +
        (dp && dp!=='-' ? ' [' + dp + ']' : ''));
    });
    lines.push('');
  }

  // المتأخرون مع دقائق التأخير
  if(late.length){
    lines.push('⏰ *المتأخرون (' + late.length + '):*');
    late.forEach(function(p, i){
      var dp = (typeof getMonDept === 'function') ? getMonDept(p.name) : '';
      var lm = p.rec.lateMin || 0;
      lines.push('   ' + (i+1) + '. ' + p.name +
        ' — وصل ' + (p.rec.time||'-') +
        ' (تأخر ' + lm + ' دقيقة)' +
        (dp && dp!=='-' ? ' [' + dp + ']' : ''));
    });
    lines.push('');
  }

  // الغائبون
  if(absent.length){
    lines.push('❌ *الغائبون (' + absent.length + '):*');
    absent.forEach(function(p, i){
      var dp = (typeof getMonDept === 'function') ? getMonDept(p.name) : '';
      lines.push('   ' + (i+1) + '. ' + p.name +
        (dp && dp!=='-' ? ' [' + dp + ']' : ''));
    });
    lines.push('');
  }

  // الذين لم يُسجَّل حضورهم
  if(notReg.length){
    lines.push('❓ *لم يُسجَّل حضورهم (' + notReg.length + '):*');
    notReg.forEach(function(p, i){
      var dp = (typeof getMonDept === 'function') ? getMonDept(p.name) : '';
      lines.push('   ' + (i+1) + '. ' + p.name +
        (dp && dp!=='-' ? ' [' + dp + ']' : ''));
    });
    lines.push('');
  }

  lines.push(border);
  lines.push('⚙️ حد التأخر المعتمد: ' + thr + ' دقيقة');
  lines.push('👤 أُعِدَّ بواسطة: ' + (CU?CU.name:'-') + ' — ' + (CU?(typeof grn==='function'?grn(CU.role):CU.role):''));
  lines.push(border);
  lines.push('🌹 ' + col);

  return lines.filter(function(l){return l!=='';}).join('\n');
}

function _fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';

  try{ document.execCommand('copy'); notify('📋 تم','نُسخ التقرير — '+nt(),'success'); }

window._swaActive = null;

function smartWAPrompt(opts){
  // إغلق أي نافذة سابقة
  if(window._swaActive){
    try{ window._swaActive.remove(); }catch(e){}
    window._swaActive = null;
  }
  var name  = opts.name  || '-';
  var phone = opts.phone || '';
  var msg   = opts.msg   || '';
  var type  = opts.type  || 'general';
  var examId= opts.examId|| '';
  var title = opts.title || '📱 إشعار واتساب جديد';
  var icon  = opts.icon  || '📱';
  var auto  = (typeof opts.autoMs === 'number') ? opts.autoMs : 12000;
  var autoAction = opts.autoAction || 'queue'; // 'queue' | 'skip' | 'send'

  if(!phone){
    // لا يوجد رقم — نتيف فقط
    notify('تنبيه','لا يوجد رقم لـ '+name+' في الدليل','warning');
    return;
  }

  var w = document.createElement('div');
  w.className = 'swa-wrap';
  w.innerHTML =
    '<div class="swa-hdr">'+
      '<span style="font-size:16px">'+icon+'</span>'+
      '<span>'+title+'</span>'+
      '<button class="swa-hdr-cls" onclick="_swaClose()">✕</button>'+
    '</div>'+
    '<div class="swa-body">'+
      '<div class="swa-to">إلى:</div>'+
      '<div class="swa-name">👤 '+name+' <span style="font-size:11px;color:var(--txt3);font-weight:400">— '+phone+'</span></div>'+
      '<div class="swa-msg" id="swaMsgBox"></div>'+
      '<div class="swa-actions">'+
        '<button class="swa-btn swa-send" onclick="_swaSend()">📱 إرسال الآن</button>'+
        '<button class="swa-btn swa-queue" onclick="_swaQueue()">📨 للقائمة</button>'+
        '<button class="swa-btn swa-skip" onclick="_swaSkip()">⏭️ تجاوز</button>'+
      '</div>'+
    '</div>'+
    '<div class="swa-timer"><div class="swa-timer-fill" id="swaTimerFill"></div></div>';
  document.body.appendChild(w);
  w.querySelector('#swaMsgBox').textContent = msg;

  var data = {w:w, phone:phone, msg:msg, name:name, type:type, examId:examId};
  window._swaActive = w;
  w._swaData = data;

  // مؤقت تلقائي
  var startTime = Date.now();
  var fill = w.querySelector('#swaTimerFill');
  var iv = setInterval(function(){
    var elapsed = Date.now() - startTime;
    var remaining = Math.max(0, auto - elapsed);
    if(fill) fill.style.width = (remaining/auto*100)+'%';
    if(remaining<=0){
      clearInterval(iv);
      if(window._swaActive === w){
        if(autoAction === 'send')      _swaSend();
        else if(autoAction === 'skip') _swaSkip();
        else                            _swaQueue();
      }
    }
  }, 100);
  w._swaInterval = iv;
}

function _swaClose(){
  var w = window._swaActive; if(!w) return;
  if(w._swaInterval) clearInterval(w._swaInterval);
  w.style.animation = 'swaOut .25s forwards';
  setTimeout(function(){ try{w.remove();}catch(e){} window._swaActive=null; }, 250);
}

function _swaSend(){
  var w = window._swaActive; if(!w || !w._swaData) return;
  var d = w._swaData;
  var p = (typeof formatPhone==='function') ? formatPhone(d.phone) : d.phone;
  if(p){
    window.open('https://wa.me/'+p+'?text='+encodeURIComponent(d.msg), '_blank');
    notify('📱 تم','أُرسل لـ '+d.name,'success');
    if(typeof logAudit==='function') logAudit('إرسال واتساب مباشر','إلى: '+d.name+' | '+d.type, d.examId);
  }
  _swaClose();
}

function _swaQueue(){
  var w = window._swaActive; if(!w || !w._swaData) return;
  var d = w._swaData;
  if(typeof queueAdd === 'function'){
    queueAdd(d.name, d.phone, d.msg, d.type, d.examId);
    notify('📨 تم','أُضيف لقائمة الإرسال — '+d.name,'success');
  }
  _swaClose();
}

function _swaSkip(){
  var w = window._swaActive; if(!w || !w._swaData) return;
  var d = w._swaData;
  if(typeof logAudit==='function') logAudit('تجاوز إشعار','إلى: '+d.name+' | '+d.type, d.examId);
  _swaClose();
}

// أعد تعريف regAttAuto — استخدم الـ original الأصلي قبل v17
(function(){
  // v17 خزّن الـ original في closure ولفّ regAttAuto
  // الآن نلفّ regAttAuto مرة أخرى — لكن نتجاوز منطق queueAdd الخاص بـ v17
  // عبر تخطّي الـ flag والاستفادة من الدالة الحالية ثم استبدال السلوك

  var current = window.regAttAuto;
  if(!current){ console.warn('regAttAuto not found - v18 hook skipped'); return; }

  // استبدال كامل — لا نستدعي v17 hook (لأنه يضيف للقائمة تلقائياً)
  // بدلاً نستدعي الـ logic الأصلي ونعرض smartWAPrompt
  window.regAttAuto = function(monName, examTime, examId){
    // استدعِ الـ chain القديم (الذي يُسجّل الحضور + يضيف v17 للقائمة)
    // ثم احذف الإضافة المكررة من القائمة وأظهر الـ prompt
    var beforeQueue = (D.waQueue||[]).length;
    current.apply(this, arguments);

    try{
      var t = window._selDate || gt();
      var n = (monName||'').trim();
      if(!n || typeof findMonitorId !== 'function') return;
      var mid = findMonitorId(n);
      if(!mid) return;
      var att = D.attendance.find(function(a){
        return a.monitorId===mid && a.date===t && a.examId===examId;
      });
      if(!att) return;
      var ex = D.examSchedule.find(function(e){return e.id===examId;}) || {};
      var phone = (typeof getMonPhone === 'function') ? getMonPhone(n) : '';

      // احذف آخر إضافة من القائمة لتجنب التكرار (v17 hook أضافها للتو)
      if((D.waQueue||[]).length > beforeQueue){
        // احذف فقط الآخر إذا كان attendance/attendance_late لهذا المراقب
        var last = D.waQueue[D.waQueue.length-1];
        if(last && (last.type==='attendance'||last.type==='attendance_late') &&
           last.examId===examId && last.to===n && last.status==='pending'){
          D.waQueue.pop();
          sv();
          if(typeof queueRenderBtn==='function') queueRenderBtn();
        }
      }

      if(!phone) return;
      var col = D.settings.collegeName || '';
      var border = '━━━━━━━━━━━━━━━━━━━━';
      var lines = [], qType = '', title = '', icon = '';

      if(att.status === 'present'){
        qType = 'attendance'; title = '✅ تأكيد حضور المراقب'; icon = '✅';
        lines = [
          '🎓 ' + col, border,
          '✅ *تأكيد تسجيل الحضور*', border,
          'سعادة الأستاذ/الدكتور: *' + n + '*',
          '',
          'نُؤكد لكم تسجيل حضوركم لمراقبة:',
          '📚 المقرر: ' + (ex.course||'-'),
          ex.code ? '🔖 الرمز: ' + ex.code : '',
          ex.hall ? '🏢 القاعة: ' + ex.hall : '',
          ex.time ? '⏰ وقت الاختبار: ' + ex.time : '',
          '🕐 *وقت تسجيل الحضور: ' + (att.recordTime||'-') + '*',
          '📅 التاريخ: ' + t,
          '👤 سُجِّل بواسطة: ' + (CU?CU.name:'-'),
          border, '🌹 شكراً لالتزامكم — ' + col
        ];
      } else if(att.status === 'late'){
        qType = 'attendance_late'; title = '⏰ إشعار تأخر مراقب'; icon = '⏰';
        var lm = (typeof calcLateMins==='function') ? calcLateMins(examTime || ex.time, att.recordTime) : 0;
        lines = [
          '🎓 ' + col, border,
          '⏰ *إشعار تأخر مراقب*', border,
          'سعادة الأستاذ/الدكتور: *' + n + '*',
          '',
          'نُحيطكم علماً أنه سُجِّل لكم *تأخر* عن مراقبة:',
          '📚 المقرر: ' + (ex.course||'-'),
          ex.hall ? '🏢 القاعة: ' + ex.hall : '',
          ex.time ? '⏰ وقت بداية الاختبار: ' + ex.time : '',
          '🕐 *وقت وصولكم: ' + (att.recordTime||'-') + '*',
          '⏱ *مدة التأخر: ' + lm + ' دقيقة*',
          '📅 التاريخ: ' + t,
          '👤 سُجِّل بواسطة: ' + (CU?CU.name:'-'),
          border,
          'يُرجى الالتزام بالحضور قبل الاختبار بـ 15 دقيقة',
          '🌹 ' + col
        ];
      }
      if(qType && lines.length){
        var msg = lines.filter(function(l){return l!=='';}).join('\n');
        smartWAPrompt({
          name:n, phone:phone, msg:msg, type:qType, examId:examId,
          title:title, icon:icon, autoAction:'queue'
        });
      }
    } catch(e){ console.warn('v18 attendance prompt error:', e); }
  };
})();

// helper: قص نص لطول معين
function _truncStr(s, n){
  s = (s||'').toString();
  if(s.length<=n) return s;
  return s.substring(0,n-1)+'…';
}

// helper: أيام الأسبوع المختصرة
function _shortDay(dayStr){
  if(!dayStr) return '';
  var map = {
    'الأحد':'أحد','الاحد':'أحد','الإثنين':'إثن','الاثنين':'إثن',
    'الثلاثاء':'ثلا','الأربعاء':'أرب','الاربعاء':'أرب',
    'الخميس':'خمس','الجمعة':'جمع','السبت':'سبت'
  };
  return map[dayStr.trim()] || dayStr.trim().substring(0,3);
}

// helper: تنسيق تاريخ مختصر يوم/شهر
function _shortDate(d){
  if(!d) return '-';
  var s = d.toString().replace(/\//g,'-');
  var p = s.split('-');
  if(p.length===3){
    // YYYY-MM-DD أو DD-MM-YYYY
    if(p[0].length===4) return p[2]+'/'+p[1];
    return p[0]+'/'+p[1];
  }
  return s.substring(0,5);
}

// helper: دور المراقب
function _monRole(name, ex){
  var n = (name||'').trim();
  if((ex.monitor1||'').trim()===n) return 'مشرف';
  if((ex.monitor2||'').trim()===n) return 'مراقب';
  if((ex.monitor3||'').trim()===n) return 'مراقب';
  return '-';
}

// النسخة المختصرة - شكل جدول مع monospace
function shareMonScheduleWA(){
  var sel = window._selMon;
  if(!sel){ notify('تنبيه','اختر مراقباً أولاً','warning'); return; }
  var phone = (typeof getMonPhone==='function') ? getMonPhone(sel) : '';
  var monExams = D.examSchedule.filter(function(e){
    return (e.monitor1||'').trim()===sel||(e.monitor2||'').trim()===sel||(e.monitor3||'').trim()===sel;
  }).sort(function(a,b){
    return (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||'');
  });
  if(!monExams.length){ notify('تنبيه','لا توجد اختبارات لهذا المراقب','warning'); return; }

  var col   = D.settings.collegeName || 'كلية الأعمال';
  var sem   = D.settings.semester    || '';
  var dept  = (typeof getMonDept==='function') ? getMonDept(sel) : '';
  var border= '━━━━━━━━━━━━━━━━━━━━';

  // ── تجميع الاختبارات حسب اليوم ──
  var byDay = {};
  monExams.forEach(function(e){
    var k = e.date||'-';
    if(!byDay[k]){ byDay[k] = { date:k, day:e.day||'', exams:[] }; }
    byDay[k].exams.push(e);
  });
  // فرز اختبارات كل يوم حسب الوقت
  Object.keys(byDay).forEach(function(k){
    byDay[k].exams.sort(function(a,b){return (a.time||'').localeCompare(b.time||'');});
  });
  var dayKeys = Object.keys(byDay).sort();

  // عدّ المشرف vs مراقب
  var supCount = monExams.filter(function(e){return _monRole(sel,e)==='مشرف';}).length;
  var monCount = monExams.length - supCount;

  // ── بناء سطور كل يوم ──
  var dayBlocks = [];
  dayKeys.forEach(function(k){
    var d = byDay[k];
    // عنوان اليوم
    var dayHdr = '📅 *' + (d.day ? d.day + ' ' : '') + d.date + '*';
    if(d.exams.length > 1) dayHdr += '  (' + d.exams.length + ' اختبارات)';
    var dayLines = [dayHdr];
    d.exams.forEach(function(e){
      var roleIcon = _monRole(sel, e) === 'مشرف' ? '👑' : '👤';
      var roleText = _monRole(sel, e) === 'مشرف' ? 'مشرف' : 'مراقب';
      var time     = e.time || '-';
      var course   = e.course || e.code || '-';
      var hall     = e.hall ? '(' + e.hall + ')' : '';
      // سطر رئيسي: الوقت + المقرر + القاعة + الدور
      dayLines.push('  • ' + time + ' — ' + course + ' ' + hall + ' ' + roleIcon + ' ' + roleText);
      // سطر إضافي للرمز/الشعبة إذا متوفر
      var extra = [];
      if(e.code && e.code !== course) extra.push('🔖 ' + e.code);
      if(e.section) extra.push('شعبة ' + e.section);
      if(e.enrolled) extra.push('👥 ' + e.enrolled);
      if(extra.length) dayLines.push('     ' + extra.join(' · '));
    });
    dayBlocks.push(dayLines.join('\n'));
  });

  var lines = [
    '🎓 *' + col + '*',
    sem ? '📆 ' + sem : '',
    border,
    '📋 *جدول مراقبات الاختبارات*',
    '',
    '👤 ' + sel,
    dept ? '🏢 ' + dept : '',
    border,
    ''
  ].filter(function(l){return l!==undefined && l!==null;});
  // أضف بلوكات الأيام مفصولة بسطر فارغ
  lines.push(dayBlocks.join('\n\n'));
  lines = lines.concat([
    '',
    border,
    '📊 *الملخص:*',
    '   📝 إجمالي الاختبارات: *' + monExams.length + '*',
    '   📅 عدد أيام المراقبة: *' + dayKeys.length + '*',
    '   👑 مشرف قاعة: ' + supCount,
    '   👤 مراقب: ' + monCount,
    border,
    '⚠️ يُرجى الحضور قبل كل اختبار بـ *15 دقيقة*',
    '📞 للاستفسار: تواصل مع لجنة الاختبارات',
    border,
    '🌹 ' + col
  ]);
  var msg = lines.join('\n');

  if(phone){
    smartWAPrompt({
      name: sel, phone: phone, msg: msg,
      type: 'schedule_notify', examId: '',
      title: '📋 جدول المراقبات', icon: '📋',
      autoAction: 'queue', autoMs: 15000
    });
    if(typeof logAudit==='function') logAudit('عرض جدول مراقبات', sel, '');
  } else {
    // لا يوجد رقم — نسخ يدوي
    _showCopyDialog('📋 جدول مراقبات '+sel, msg);
    notify('تنبيه','لا يوجد رقم لـ '+sel+' — يمكنك نسخ النص','warning');
  }
}

        '<button class="btn bp" style="flex:1;padding:10px" onclick="window.open(\'https://wa.me/?text=\'+encodeURIComponent('+JSON.stringify(msg)+'));document.getElementById(\'mol\').remove()">📱 فتح واتساب</button>'+

  document.body.appendChild(o);

// جـ) فحص اختبارات متأخرة في الاستلام — وعرض زر تذكير المنسقين
function checkLateReceiptExams(){
  var t = window._selDate || gt();
  var today = gt();
  if(t !== today) return []; // فقط لليوم الحالي
  var now = nw();
  var nowMin = now.getHours()*60 + now.getMinutes();
  var late = [];
  var exams = D.examSchedule.filter(function(e){return e.date===t;});
  exams.forEach(function(e){
    var rcpt = (D.examReceipts||[]).find(function(r){return r.examId===e.id;});
    if(rcpt) return; // مُستلم
    if(!e.time) return;
    // احسب وقت الاختبار
    var s = (e.time+'').trim();
    var isPM = /[مm]/i.test(s) || s.toUpperCase().includes('PM');
    var isAM = /[صa]/i.test(s) || s.toUpperCase().includes('AM');
    s = s.replace(/[^0-9:]/g,'').trim();
    var p = s.split(':');
    var h = parseInt(p[0]);
    var m = parseInt(p[1])||0;
    if(isNaN(h)) return;
    if(isPM && h<12) h+=12;
    if(isAM && h===12) h=0;
    var examMin = h*60+m;
    // إذا تبقى ≤ 60 دقيقة على الاختبار ولم يُستلم → متأخر
    var minsToExam = examMin - nowMin;
    if(minsToExam <= 60) {
      late.push({ ex:e, minsToExam:minsToExam });
    }
  });
  return late;
}

// إرسال تذكير للمنسق/المحاضر بضرورة تسليم الاختبار
function remindLateReceipt(eid){
  var ex = D.examSchedule.find(function(x){return x.id===eid;});
  if(!ex){ notify('خطأ','الاختبار غير موجود','error'); return; }
  var coord = ex.coordinator || '';
  var lect  = ex.lecturer    || '';
  var coordPhone = (typeof getMonPhone==='function') ? getMonPhone(coord) : '';
  var lectPhone  = (typeof getMonPhone==='function') ? getMonPhone(lect) : '';

  var col = D.settings.collegeName || '';
  var border = '━━━━━━━━━━━━━━━━━━━━';

  // احسب الوقت المتبقي
  var minsLeft = '-';
  try{
    var s = (ex.time+'').trim();
    var isPM = /[مm]/i.test(s)||s.toUpperCase().includes('PM');
    var isAM = /[صa]/i.test(s)||s.toUpperCase().includes('AM');
    s = s.replace(/[^0-9:]/g,'').trim();
    var p = s.split(':');
    var h = parseInt(p[0]); var m = parseInt(p[1])||0;
    if(isPM && h<12) h+=12; if(isAM && h===12) h=0;
    var em = h*60+m;
    var nm = nw().getHours()*60 + nw().getMinutes();
    minsLeft = em - nm;
    if(minsLeft<0) minsLeft = 'بدأ منذ ' + Math.abs(minsLeft) + ' دقيقة';
    else minsLeft = 'متبقّي ' + minsLeft + ' دقيقة';
  }catch(e){}

  var msg = [
    '🎓 ' + col, border,
    '⚠️ *تذكير عاجل — تسليم الاختبار*', border,
    'سعادة الأستاذ/الدكتور المحترم',
    '',
    'نُذكّركم بضرورة *تسليم أوراق اختبار* المقرر:',
    '📚 ' + (ex.course||'-'),
    ex.code ? '🔖 الرمز: '+ex.code : '',
    ex.section ? '📋 الشعبة: '+ex.section : '',
    ex.hall ? '🏢 القاعة: '+ex.hall : '',

    '🕐 وقت التذكير: ' + nt(),

    'يُرجى التكرّم بتسليم نسخة الاختبار للجنة الاختبارات في أقرب وقت',
    border,
    '📞 لجنة الاختبارات — ' + col,
    '🌹 شكراً لتعاونكم'
  ].filter(function(l){return l!=='';}).join('\n');

  // أرسل للمنسق أولاً
  var primaryName  = coord || lect;
  var primaryPhone = coordPhone || lectPhone;
  if(!primaryPhone){
    if(primaryName){
      notify('تنبيه','لا يوجد رقم لـ '+primaryName+' في الدليل','warning');
      _showCopyDialog('⚠️ تذكير تسليم — '+(ex.course||''), msg);
    } else {
      notify('تنبيه','لا يوجد منسق أو محاضر مسجّل لهذا الاختبار','warning');
    }
    return;
  }
  smartWAPrompt({
    name: primaryName, phone: primaryPhone, msg: msg,
    type: 'reminder_coord', examId: eid,
    title: '⚠️ تذكير عاجل بالتسليم', icon: '⚠️',

// تذكير جماعي — لكل اختبارات اليوم غير المُستلمة
function remindAllLateReceipts(){
  var late = checkLateReceiptExams();
  if(!late.length){

  }
  if(!confirm('سيتم إرسال '+late.length+' تذكير لمنسقي الاختبارات غير المُستلمة. متابعة؟')) return;
  var sent = 0;
  late.forEach(function(item, i){
    setTimeout(function(){
      var ex = item.ex;
      var coord = ex.coordinator || '';
      var lect  = ex.lecturer || '';
      var coordPhone = (typeof getMonPhone==='function') ? getMonPhone(coord) : '';
      var lectPhone  = (typeof getMonPhone==='function') ? getMonPhone(lect) : '';
      var phone = coordPhone || lectPhone;
      var name  = coord || lect;
      if(!phone) return;
      var col = D.settings.collegeName || '';
      var border = '━━━━━━━━━━━━━━━━━━━━';
      var msg = [
        '🎓 ' + col, border,
        '⚠️ *تذكير — تسليم اختبار*', border,
        'سعادة د. ' + name,
        '',
        '📚 ' + (ex.course||'-') + (ex.code?' ('+ex.code+')':''),
        ex.section ? '📋 الشعبة: '+ex.section : '',
        ex.hall ? '🏢 القاعة: '+ex.hall : '',
        ex.time ? '⏰ '+ex.time : '',
        border,
        '🚨 الاختبار لم يُستلَم بعد',
        '🕐 وقت التذكير: ' + nt(),
        '',
        'يُرجى تسليم الاختبار للجنة فوراً',
        '🌹 ' + col
      ].filter(function(l){return l!=='';}).join('\n');
      if(typeof queueAdd==='function'){
        queueAdd(name, phone, msg, 'reminder_coord', ex.id);
        sent++;
      }
      if(i === late.length-1){
        setTimeout(function(){
          notify('📨 تم','أُضيف '+sent+' تذكير لقائمة الإرسال','success');
          if(typeof logAudit==='function') logAudit('تذكير جماعي بالتسليم', sent+' اختبار', '');

(function(){

  window.pgExamReceipt = function(){
    var html = _orig.apply(this, arguments);
    var late = checkLateReceiptExams();

    // ① بانر تذكير جماعي + إجمالي
    var topBar =
      '<div style="background:linear-gradient(135deg,rgba(37,211,102,0.10),rgba(18,140,126,0.10));'+
      'border:1px solid rgba(37,211,102,0.3);border-radius:12px;padding:12px 16px;margin-bottom:14px;'+
      'display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
        '<div style="font-size:24px">📱</div>'+
        '<div style="flex:1;min-width:160px;font-size:12px;color:var(--txt2);line-height:1.6">'+
          '<strong style="color:var(--ok)">إشعارات تلقائية مفعّلة</strong> — يصلك إشعار واتساب لكل عملية استلام مع خيار الإرسال أو التجاوز'+
        '</div>'+
        (late.length>0 ?
          '<button class="btn bw bs" onclick="remindAllLateReceipts()" style="padding:9px 16px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--warn);color:#fff">⚠️ تذكير '+late.length+' محاضر متأخر</button>'
          : '<span style="color:var(--ok);font-size:12px;font-weight:700">✅ لا توجد اختبارات متأخرة</span>')+
      '</div>';

    // أدرج البانر بعد عنوان الصفحة
    html = html.replace(/(<div class="ph">[\s\S]*?<\/div>)/, '$1'+topBar);

    // ② أضف زر تذكير لكل صف فيه استلام متأخر
    if(late.length){
      var lateIds = {};
      late.forEach(function(item){ lateIds[item.ex.id] = item.minsToExam; });
      // ابحث عن الأزرار في الصفوف وأضف زر تذكير
      // النمط: <button class="btn bp bx" onclick="rcvExam('XYZ')...
      html = html.replace(
        /(<button class="btn bp bx" onclick="rcvExam\('([^']+)'\)[^>]*>📥 استلام<\/button>)/g,
        function(m, btn, eid){
          if(!lateIds.hasOwnProperty(eid)) return btn;
          var ml = lateIds[eid];
          var lbl = ml<0 ? 'بدأ' : (ml<=30?'عاجل':'قريب');
          var bg  = ml<=30 ? 'var(--err)' : 'var(--warn)';
          return btn + ' <button class="btn bx" onclick="remindLateReceipt(\''+eid+'\')" style="background:'+bg+';color:#fff;font-size:11px;padding:6px 10px;margin-right:4px" title="تذكير المحاضر بالتسليم">⚠️ تذكير '+lbl+'</button>';
        }
      );
    }
    return html;
  };
})();

        title: '✅ استلام أوراق من المراقب', icon: '✅',
        autoAction: 'queue'
      });
    } else if(!phone){
      notify('تنبيه','لا يوجد رقم لـ '+rb+' في الدليل','warning');
    }
    if(typeof render==='function') render();
  };
})();

// ╔═══════════════════════════════════════════════════════════════
// ║  ⑥ إعادة الرسم لتطبيق التحسينات

try{
  if(typeof render==='function' && document.getElementById('app') && CU){
    render();
  }
}catch(e){}

console.log('✅ v18 — إشعارات مباشرة + جدول مختصر + تقرير يومي + تذكير المحاضرين محمّل');
</script>

<script>
// ════════════════════════════════════════════════════════════════
//  v18.2 — صفحة "⚡ تحديث التطبيق" + تشغيل تلقائي للتحديثات المحفوظة
// ════════════════════════════════════════════════════════════════
//
//  الفكرة:
//   • صفحة جديدة في القائمة الجانبية: "⚡ تحديث التطبيق"
//   • فيها صندوق نص كبير، تلصق فيه أي كود تحديث جديد
//   • زر "تطبيق التحديث" يحفظه في localStorage
//   • عند كل فتح للتطبيق، يُشغَّل التحديث المحفوظ تلقائياً
//   • يدعم تحديثات متعددة (كل تحديث له اسم وتاريخ)
//   • يمكن حذف أو تعطيل أي تحديث
//
// ════════════════════════════════════════════════════════════════

(function(){
  // ── ① مفتاح التخزين ──
  var PATCH_KEY = 'examAttPatches_v1';

  // ── ② تحميل وحفظ التحديثات ──
  function loadPatches(){
    try {
      var raw = localStorage.getItem(PATCH_KEY);
      if(!raw) return [];
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch(e){ return []; }
  }
  function savePatches(arr){
    try {
      localStorage.setItem(PATCH_KEY, JSON.stringify(arr));
      return true;
    } catch(e){
      console.error('فشل حفظ التحديث:', e);
      return false;
    }
  }
  // اجعل الدوال متاحة عالمياً
  window._loadPatches = loadPatches;
  window._savePatches = savePatches;

  // ── ③ تشغيل التحديثات المحفوظة (في بداية تشغيل التطبيق) ──
  function runStoredPatches(){
    var patches = loadPatches();
    if(!patches.length) return;
    var ran = 0, failed = 0;
    patches.forEach(function(p){
      if(!p.enabled) return;
      try {
        // استخدم Function بدل eval — أنظف وأسرع
        (new Function(p.code))();
        ran++;
        p.lastRun = new Date().toISOString();
        p.lastError = '';
      } catch(e){
        failed++;
        p.lastError = e.message;
        console.error('خطأ في التحديث "'+p.name+'":', e);
      }
    });
    savePatches(patches);
    if(ran || failed){
      console.log('⚡ تحديثات: ' + ran + ' نجحت، ' + failed + ' فشلت');
    }
  }
  // شغّل التحديثات الآن (بعد ما باقي السكربتات حُمِّلت)
  runStoredPatches();

  // ── ④ صفحة "⚡ تحديث التطبيق" ──
  window.pgAppUpdate = function(){
    var patches = loadPatches();
    var rows = '';
    if(patches.length === 0){
      rows = '<div style="padding:30px 20px;text-align:center;color:var(--txt3);font-size:13px;background:var(--bg);border-radius:10px;border:1px dashed var(--brd)">'+
        '📭 لا توجد تحديثات محفوظة بعد<br><span style="font-size:11px">الصق كود التحديث أدناه واضغط "تطبيق التحديث"</span>'+
      '</div>';
    } else {
      rows = patches.map(function(p, i){
        var statusBadge;
        if(p.lastError){
          statusBadge = '<span style="background:rgba(231,76,60,.15);color:var(--err);padding:2px 8px;border-radius:6px;font-size:10px">⚠️ خطأ</span>';
        } else if(p.enabled){
          statusBadge = '<span style="background:rgba(46,204,113,.15);color:var(--ok);padding:2px 8px;border-radius:6px;font-size:10px">✅ مفعّل</span>';
        } else {
          statusBadge = '<span style="background:rgba(149,165,166,.15);color:var(--txt3);padding:2px 8px;border-radius:6px;font-size:10px">⏸ معطّل</span>';
        }
        var added = p.added ? new Date(p.added).toLocaleString('ar-SA') : '-';
        var sizeKb = p.code ? Math.round(p.code.length/1024*10)/10 : 0;
        var errBlock = p.lastError ?
          '<div style="background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.25);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:11px;color:var(--err);direction:ltr;text-align:left">⚠️ '+p.lastError+'</div>' : '';
        return '<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;margin-bottom:8px">'+
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">'+
            '<strong style="font-size:13px;color:var(--txt)">📦 '+(p.name||'تحديث #'+(i+1))+'</strong>'+
            statusBadge+
            '<span style="margin-right:auto"></span>'+
            '<button class="btn bo bx" onclick="_patchToggle('+i+')" style="padding:5px 9px;font-size:10px">'+(p.enabled?'⏸ تعطيل':'▶️ تفعيل')+'</button>'+
            '<button class="btn br bx" onclick="_patchDelete('+i+')" style="padding:5px 9px;font-size:10px;background:var(--err);color:#fff">🗑 حذف</button>'+
          '</div>'+
          '<div style="font-size:11px;color:var(--txt3);line-height:1.6">'+
            '📅 أُضيف: '+added+' · 📏 الحجم: '+sizeKb+' كيلوبايت'+
          '</div>'+
          errBlock+
        '</div>';
      }).join('');
    }

    return '<div class="ph"><h1>⚡ تحديث التطبيق</h1><p>الصق كود التحديث الذي يصلك من المطوّر — يُحفظ ويُشغَّل تلقائياً عند كل فتح</p></div>'+
      '<div style="background:linear-gradient(135deg,rgba(77,166,255,.10),rgba(77,166,255,.04));border:1px solid rgba(77,166,255,.3);border-radius:12px;padding:14px 16px;margin-bottom:16px">'+
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+
          '<span style="font-size:24px">💡</span>'+
          '<strong style="color:var(--accent);font-size:14px">كيف يعمل؟</strong>'+
        '</div>'+
        '<ol style="font-size:12px;color:var(--txt2);line-height:1.8;margin:0;padding-right:20px">'+
          '<li>عند وصول تحديث جديد، انسخ الكود من الرسالة</li>'+
          '<li>الصقه في الصندوق أدناه واضغط <strong>"تطبيق التحديث"</strong></li>'+
          '<li>التحديث يُحفظ في جوالك ويعمل تلقائياً عند كل فتح للتطبيق</li>'+
          '<li>لا تحتاج تنزيل ملف جديد أو إعادة تثبيت</li>'+
        '</ol>'+
      '</div>'+
      '<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px 16px;margin-bottom:14px">'+
        '<h3 style="margin:0 0 10px 0;font-size:14px;color:var(--txt)">➕ تطبيق تحديث جديد</h3>'+
        '<div style="margin-bottom:10px">'+
          '<label style="font-size:12px;color:var(--txt2);font-weight:600;display:block;margin-bottom:4px">📝 اسم التحديث (اختياري):</label>'+
          '<input type="text" id="patch_name" class="fi" placeholder="مثال: تعديل تنسيق الرسائل" style="font-size:13px"/>'+
        '</div>'+
        '<div style="margin-bottom:10px">'+
          '<label style="font-size:12px;color:var(--txt2);font-weight:600;display:block;margin-bottom:4px">💻 كود التحديث:</label>'+
          '<textarea id="patch_code" class="fi" style="font-family:monospace;font-size:11px;min-height:160px;direction:ltr;text-align:left;line-height:1.5;resize:vertical" placeholder="// الصق الكود هنا..."></textarea>'+
        '</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<button class="btn bok" style="flex:1;min-width:140px;padding:11px;font-size:13px;font-weight:700" onclick="_patchApply()">⚡ تطبيق التحديث</button>'+
          '<button class="btn bo" style="padding:11px 16px;font-size:13px" onclick="_patchTest()">🧪 اختبار فقط</button>'+
          '<button class="btn bo" style="padding:11px 16px;font-size:13px" onclick="document.getElementById(\'patch_code\').value=\'\';document.getElementById(\'patch_name\').value=\'\'">🧹 مسح</button>'+
        '</div>'+
      '</div>'+
      '<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px 16px;margin-bottom:14px">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">'+
          '<h3 style="margin:0;font-size:14px;color:var(--txt)">📦 التحديثات المحفوظة ('+patches.length+')</h3>'+
          (patches.length>0 ?
            '<div style="display:flex;gap:6px">'+
              '<button class="btn bo bx" onclick="_patchReloadAll()" style="padding:6px 12px;font-size:11px">🔄 إعادة تشغيل الكل</button>'+
              '<button class="btn br bx" onclick="_patchClearAll()" style="padding:6px 12px;font-size:11px;background:var(--err);color:#fff">🗑 حذف الكل</button>'+
            '</div>' : ''
          )+
        '</div>'+
        rows+
      '</div>'+
      '<div style="background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.3);border-radius:10px;padding:10px 14px;font-size:11px;color:var(--txt2);line-height:1.6">'+
        '⚠️ <strong>تنبيه:</strong> التحديثات تُخزَّن في هذا الجهاز فقط. لا تنطبق على Firebase. لتحديث جهاز آخر، طبّق نفس الكود فيه.'+
      '</div>';
  };

  // ── ⑤ دوال التحكم ──
  window._patchApply = function(){
    var name = (document.getElementById('patch_name').value||'').trim();
    var code = (document.getElementById('patch_code').value||'').trim();
    if(!code){ notify('خطأ','الصق كود التحديث أولاً','error'); return; }
    if(!name) name = 'تحديث ' + new Date().toLocaleDateString('ar-SA');
    // اختبر الكود قبل الحفظ
    try {
      (new Function(code))();
    } catch(e){
      if(!confirm('⚠️ الكود فيه خطأ:\n'+e.message+'\n\nهل تريد حفظه على أي حال؟')) return;
    }
    var patches = loadPatches();
    patches.push({
      id: Date.now(),
      name: name,
      code: code,
      enabled: true,
      added: new Date().toISOString(),
      lastRun: new Date().toISOString(),
      lastError: ''
    });
    if(savePatches(patches)){
      notify('✅ تم','حُفظ التحديث "'+name+'" وسيعمل عند كل فتح','success');
      document.getElementById('patch_code').value = '';
      document.getElementById('patch_name').value = '';
      if(typeof logAudit==='function') logAudit('تطبيق تحديث', name, '');
      setTimeout(function(){ if(typeof render==='function') render(); }, 500);
    } else {
      notify('خطأ','فشل حفظ التحديث - قد تكون الذاكرة ممتلئة','error');
    }
  };

  window._patchTest = function(){
    var code = (document.getElementById('patch_code').value||'').trim();
    if(!code){ notify('خطأ','الصق الكود أولاً','error'); return; }
    try {
      (new Function(code))();
      notify('✅ نجح الاختبار','الكود يعمل بدون أخطاء','success');
    } catch(e){
      notify('⚠️ خطأ','الكود فيه مشكلة: '+e.message,'error');
    }
  };

  window._patchToggle = function(i){
    var patches = loadPatches();
    if(!patches[i]) return;
    patches[i].enabled = !patches[i].enabled;
    savePatches(patches);
    notify('✅ تم', patches[i].enabled?'تم تفعيل التحديث':'تم تعطيل التحديث','success');
    if(typeof render==='function') render();
  };

  window._patchDelete = function(i){
    var patches = loadPatches();
    if(!patches[i]) return;
    if(!confirm('حذف التحديث "'+patches[i].name+'"؟')) return;
    var name = patches[i].name;
    patches.splice(i,1);
    savePatches(patches);
    notify('✅ تم','حُذف التحديث "'+name+'" — أعد تشغيل التطبيق ليُلغى أثره','success');
    if(typeof logAudit==='function') logAudit('حذف تحديث', name, '');
    if(typeof render==='function') render();
  };

  window._patchClearAll = function(){
    if(!confirm('⚠️ سيتم حذف جميع التحديثات المحفوظة!\n\nأعد تشغيل التطبيق بعدها.\n\nمتابعة؟')) return;
    savePatches([]);
    notify('✅ تم','حُذفت جميع التحديثات','success');
    if(typeof logAudit==='function') logAudit('حذف جميع التحديثات','','');
    if(typeof render==='function') render();
  };

  window._patchReloadAll = function(){
    runStoredPatches();
    notify('🔄 تم','أُعيد تشغيل جميع التحديثات','success');
    if(typeof render==='function') render();
  };

  // ── ⑥ تسجيل الصفحة في rPage ──
  (function(){
    var origRPage = window.rPage;
    if(!origRPage) return;
    window.rPage = function(){
      if(typeof CP !== 'undefined' && CP === 'appupdate'){
        return window.pgAppUpdate();
      }
      return origRPage.apply(this, arguments);
    };
  })();

  // ── ⑦ إضافة الزر في القائمة الجانبية ──
  (function(){
    var origRSidebar = window.rSidebar;
    if(!origRSidebar) return;
    window.rSidebar = function(){
      var html = origRSidebar.apply(this, arguments);
      // أضف زر "⚡ تحديث التطبيق" قبل زر "مزامنة البيانات"
      var patchCount = loadPatches().filter(function(p){return p.enabled;}).length;
      var badge = patchCount>0 ? '<span class="nbg" style="background:rgba(46,204,113,.2);color:var(--ok)">'+patchCount+'</span>' : '';
      var btn = '<button class="ni '+(typeof CP!=='undefined'&&CP==='appupdate'?'av':'')+'" onclick="go(\'appupdate\')"><span class="nic">⚡</span>تحديث التطبيق'+badge+'</button>';
      // أدرج الزر قبل زر المزامنة (يظهر لجميع الأدوار)
      if(html.indexOf("go('sync')") >= 0){
        html = html.replace(
          /(<button class="ni [^"]*" onclick="go\('sync'\)[^<]*<[^>]*>[^<]*<\/button>)/,
          btn + '$1'
        );
      } else {
        // fallback: أضف في النهاية
        html += btn;
      }
      return html;
    };
  })();

  // ── ⑧ أعد الرسم لإظهار الزر ──
  try {
    if(typeof render==='function' && document.getElementById('app') && typeof CU!=='undefined' && CU){
      render();
    }
  } catch(e){}

  console.log('✅ v18.2 — صفحة تحديث التطبيق مفعّلة (تحديثات محفوظة: '+loadPatches().length+')');
})();
</script>

<script>
// ════════════════════════════════════════════════════════════════
//  v18.4 — فلتر الشطر (طلاب/طالبات) في صفحة تسجيل الحضور
// ════════════════════════════════════════════════════════════════
//
//  الفكرة: نلفّ D.examSchedule بـ getter مؤقت يفلتر حسب الشطر،
//  فينطبق الفلتر على كل صفحة تسجيل الحضور (الإحصائيات + الكروت)
//  بدون تعديل الكود الأصلي.
//
// ════════════════════════════════════════════════════════════════

(function(){
  if(typeof window.pgRec !== 'function'){
    console.warn('pgRec not found — skipping section filter');
    return;
  }

  // اختيار الشطر الافتراضي: محفوظ في localStorage
  var SEC_KEY = 'examAtt_recSection_v1';
  function getSelectedSection(){
    try { return localStorage.getItem(SEC_KEY) || ''; }
    catch(e){ return ''; }
  }
  function setSelectedSection(v){
    try { localStorage.setItem(SEC_KEY, v||''); }
    catch(e){}
  }

  // متاح عالمياً عشان onchange في HTML يقدر يستدعيه
  window._setRecSection = function(v){
    setSelectedSection(v);
    if(typeof render === 'function') render();
  };

  // اللف على pgRec
  var _origPgRec = window.pgRec;
  window.pgRec = function(){
    var sec = getSelectedSection();

    // اجمع الأشطر المتوفرة فعلياً في البيانات
    var allSecs = [];
    var seen = {};
    (D.examSchedule||[]).forEach(function(e){
      var s = (e.section_type||'').trim();
      if(s && !seen[s]){ seen[s]=1; allSecs.push(s); }
    });
    allSecs.sort();

    var html;

    if(sec){
      // فلترة مؤقتة: نبدّل D.examSchedule بنسخة مفلترة، نولّد الصفحة، ثم نرجّعها
      var origSchedule = D.examSchedule;
      D.examSchedule = origSchedule.filter(function(e){
        return (e.section_type||'').trim() === sec;
      });
      try {
        html = _origPgRec.apply(this, arguments);
      } catch(err){
        D.examSchedule = origSchedule;
        throw err;
      }
      D.examSchedule = origSchedule;
    } else {
      // كل الأشطر
      html = _origPgRec.apply(this, arguments);
    }

    // ──────── بناء صف الفلتر ────────
    var opts = '<option value="">👥 كل الأشطر</option>';
    allSecs.forEach(function(s){
      var label = s;
      // أيقونات صغيرة للأشطر المعروفة
      if(s.indexOf('طالبات')!==-1)      label = '👩 ' + s;
      else if(s.indexOf('طلاب')!==-1)   label = '👨 ' + s;
      var selected = (s === sec) ? ' selected' : '';
      opts += '<option value="'+s.replace(/"/g,'&quot;')+'"'+selected+'>'+label+'</option>';
    });

    // عدد الاختبارات في الشطر المختار (أو الكل)
    var totalCount = (D.examSchedule||[]).filter(function(e){
      if(!sec) return true;
      return (e.section_type||'').trim() === sec;
    }).length;

    // شارة بصرية للشطر المختار
    var badge = '';
    if(sec){
      var badgeIcon = '👥', badgeColor = 'rgba(155,89,182,0.15)', badgeTxt = 'var(--purple)';
      if(sec.indexOf('طالبات')!==-1){
        badgeIcon = '👩'; badgeColor = 'rgba(236,72,153,0.18)'; badgeTxt = '#ec4899';
      } else if(sec.indexOf('طلاب')!==-1){
        badgeIcon = '👨'; badgeColor = 'rgba(59,130,246,0.18)'; badgeTxt = '#3b82f6';
      }
      badge = '<span style="background:'+badgeColor+';color:'+badgeTxt+';padding:4px 10px;border-radius:8px;font-weight:700;font-size:12px;white-space:nowrap">'+
              badgeIcon+' '+sec+' ('+totalCount+')'+
              '</span>';
    }

    var secFilter =
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;'+
        'background:var(--card);padding:12px 16px;border-radius:12px;border:1px solid var(--brd)">'+
        '<span style="font-weight:700;font-size:14px;color:var(--txt2)">👥 الشطر:</span>'+
        '<select onchange="_setRecSection(this.value)" '+
          'style="flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1px solid var(--brd);'+
          'background:var(--bg);color:var(--txt);font-size:14px;font-weight:600">'+
          opts+
        '</select>'+
        badge+
      '</div>';

    // ──────── إدراج الفلتر بعد فلتر التاريخ ────────
    // نبحث عن div فلتر التاريخ ونضع فلتر الشطر بعده مباشرة.
    // الـ div عنده النص "📅 اليوم:" ويبدأ بـ <div style="display:flex;...
    var dateMarker = '<span style="font-weight:700;font-size:14px;color:var(--txt2)">📅 اليوم:</span>';
    var idx = html.indexOf(dateMarker);
    if(idx === -1){
      // ما لقينا فلتر التاريخ (يمكن لا توجد اختبارات بعد) — نضيف الفلتر بعد الـ ph
      var phEnd = html.indexOf('</div>', html.indexOf('class="ph"'));
      if(phEnd !== -1 && allSecs.length > 0){
        html = html.substring(0, phEnd+6) + secFilter + html.substring(phEnd+6);
      }
    } else {
      // نلقى نهاية div فلتر التاريخ بمتابعة المؤشر للخارج
      // ندوّر على </div> اللي يقفل الـ wrapper
      var depth = 1;
      var i = html.indexOf('<div', idx); // بداية wrapper الفلتر
      // ارجع لورا للقى بداية الـ wrapper الحقيقية
      var wrapStart = html.lastIndexOf('<div', idx);
      var p = wrapStart + 4;
      depth = 1;
      while(p < html.length && depth > 0){
        var nextOpen  = html.indexOf('<div', p);
        var nextClose = html.indexOf('</div>', p);
        if(nextClose === -1) break;
        if(nextOpen !== -1 && nextOpen < nextClose){
          depth++;
          p = nextOpen + 4;
        } else {
          depth--;
          p = nextClose + 6;
        }
      }
      // p الآن بعد </div> اللي يقفل فلتر التاريخ
      if(allSecs.length > 0){
        html = html.substring(0, p) + secFilter + html.substring(p);
      }
    }

    return html;
  };

  console.log('✅ v18.4 — فلتر الشطر مفعّل في صفحة تسجيل الحضور');
})();
</script>

<script>
// ════════════════════════════════════════════════════════════════
//  v18.5 — زر "تحقق من التحديثات" متاح لكل المستخدمين
// ════════════════════════════════════════════════════════════════
//
//  السلوك السابق:
//  • زر التحقق من التحديثات كان داخل صفحة المزامنة فقط
//  • بعض الأدوار ما تشوفه بسهولة على الجوال
//
//  السلوك الجديد:
//  • صفحة كاملة "🔄 تحديث التطبيق" متاحة لكل المستخدمين (committee/owner/أي دور)
//  • زر بارز في القائمة الجانبية مع شارة "تحديث متوفر" تلقائية
//  • فحص دوري ذكي يعلم المستخدم لما يكون في تحديث جديد
//  • زر "رفع تحديث جديد" يبقى للمالك فقط
//
// ════════════════════════════════════════════════════════════════

(function(){
  // ── ① صفحة "تحديث التطبيق" المتاحة للجميع ──
  window.pgAppUpdateCheck = function(){
    var ver = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '?';
    var fbUrl = (D.settings && D.settings.firebaseUrl) ? D.settings.firebaseUrl : '';
    var hasFb = !!fbUrl;
    var isOwner = CU && CU.role === 'owner';

    // تحقق من وجود تحديث متاح (لو متصل بـ Firebase)
    var statusBlock = '';
    if(window._lastOTACheck){
      var d = window._lastOTACheck;
      if(d.available){
        statusBlock =
          '<div style="background:linear-gradient(135deg,rgba(46,204,113,.15),rgba(46,204,113,.05));'+
          'border:2px solid rgba(46,204,113,.5);border-radius:14px;padding:16px 20px;margin-bottom:16px;text-align:center">'+
            '<div style="font-size:34px;margin-bottom:8px">🆕</div>'+
            '<div style="font-size:16px;font-weight:800;color:var(--ok);margin-bottom:4px">يوجد تحديث جديد متاح!</div>'+
            '<div style="font-size:13px;color:var(--txt2);margin-bottom:12px">الإصدار الجديد: <strong>v'+d.remoteVer+'</strong></div>'+
            '<button class="btn bok bs" style="padding:12px 28px;font-size:14px;font-weight:700" '+
            'onclick="checkAppUpdate(false)">⬇️ تحميل وتثبيت التحديث</button>'+
          '</div>';
      }
    }

    return '<div class="ph"><h1>🔄 تحديث التطبيق</h1>'+
      '<p>تحقق من وجود إصدار جديد للتطبيق وحمّله تلقائياً</p></div>'+
      statusBlock+
      // كرت معلومات النسخة
      '<div style="background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:18px 20px;margin-bottom:14px">'+
        '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'+
          '<div style="font-size:32px">📱</div>'+
          '<div style="flex:1;min-width:160px">'+
            '<div style="font-size:12px;color:var(--txt3);margin-bottom:2px">الإصدار الحالي للتطبيق</div>'+
            '<div style="font-size:24px;font-weight:800;color:var(--accent)">v'+ver+'</div>'+
          '</div>'+
          (hasFb ?
            '<div style="font-size:11px;color:var(--ok);background:rgba(46,204,113,.1);padding:6px 12px;border-radius:8px;font-weight:700">☁️ متصل بالسحابة</div>' :
            '<div style="font-size:11px;color:var(--err);background:rgba(231,76,60,.1);padding:6px 12px;border-radius:8px;font-weight:700">⚠️ غير متصل بالسحابة</div>'
          )+
        '</div>'+
      '</div>'+
      // زر التحقق الكبير (للجميع)
      (hasFb ?
        '<button class="btn bp bs" style="width:100%;padding:18px;font-size:16px;font-weight:700;margin-bottom:12px" '+
        'onclick="checkAppUpdate(false)">🔍 التحقق من وجود تحديث جديد</button>'
        :
        '<div style="background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.3);border-radius:10px;padding:14px;text-align:center;color:var(--err);font-size:13px;margin-bottom:12px">⚠️ يجب الاتصال بالسحابة (Firebase) أولاً للتحقق من التحديثات</div>'
      )+
      // زر الرفع للمالك فقط
      (isOwner && hasFb ?
        '<button class="btn bok bs" style="width:100%;padding:14px;font-size:14px;font-weight:700;margin-bottom:12px;background:linear-gradient(135deg,#9b59b6,#6c3483);color:#fff" '+
        'onclick="pushAppUpdate()">⬆️ رفع تحديث جديد (للمالك فقط)</button>' : ''
      )+
      // إرشادات
      '<div style="background:rgba(77,166,255,.08);border:1px solid rgba(77,166,255,.3);border-radius:12px;padding:14px 18px;font-size:12px;color:var(--txt2);line-height:1.8">'+
        '<strong style="color:var(--accent);font-size:13px">💡 طريقة الاستخدام:</strong><br>'+
        '1. اضغط <strong>"التحقق من وجود تحديث"</strong> للبحث عن إصدار جديد<br>'+
        '2. لو لقي تحديث، يحمّله تلقائياً ويعطيك إشعار<br>'+
        '3. <strong>أغلق التطبيق وافتحه من جديد</strong> ليعمل التحديث<br>'+
        '4. ينصح بالتحقق من التحديث في بداية كل يوم اختبارات'+
      '</div>'+
      // معلومة فنية
      (window._lastOTACheck && window._lastOTACheck.checked ?
        '<div style="margin-top:12px;font-size:11px;color:var(--txt3);text-align:center">'+
          '🕐 آخر تحقق: '+new Date(window._lastOTACheck.checked).toLocaleString('ar-SA')+
        '</div>' : ''
      );
  };

  // ── ② تسجيل الصفحة في rPage ──
  (function(){
    var origRPage = window.rPage;
    if(!origRPage) return;
    window.rPage = function(){
      if(typeof CP !== 'undefined' && CP === 'updatecheck'){
        return window.pgAppUpdateCheck();
      }
      return origRPage.apply(this, arguments);
    };
  })();

  // ── ③ إضافة زر في القائمة الجانبية لكل المستخدمين ──
  (function(){
    var origRSidebar = window.rSidebar;
    if(!origRSidebar) return;
    window.rSidebar = function(){
      var html = origRSidebar.apply(this, arguments);
      // شارة تحديث متوفر
      var updateBadge = '';
      if(window._lastOTACheck && window._lastOTACheck.available){
        updateBadge = '<span class="nbg" style="background:#27ae60;color:#fff;animation:pulse 1.5s infinite">🆕</span>';
      }
      var isActive = (typeof CP !== 'undefined' && CP === 'updatecheck');
      var btn = '<button class="ni '+(isActive?'av':'')+'" onclick="go(\'updatecheck\')">'+
                  '<span class="nic">🔄</span>تحديث التطبيق'+updateBadge+
                '</button>';
      // أدرج الزر قبل زر "خروج" أو في نهاية الـ snav
      // أبسط طريقة: أضيف الزر قبل </div></div>...نهاية القائمة
      // بدّل قبل أول قسم نسف <div class="nsep">...</div> الأخير
      // أو أضفه بعد زر مزامنة البيانات إن وجد
      if(html.indexOf("go('sync')") !== -1){
        // أدرج بعد زر مزامنة البيانات
        html = html.replace(
          /(<button class="ni [^"]*" onclick="go\('sync'\)[^<]*<span[^>]*>[^<]*<\/span>[^<]*<\/button>)/,
          '$1' + btn
        );
      } else {
        // fallback: أضف قبل نهاية snav
        html = html.replace('</div><div class="sft"', btn+'</div><div class="sft"');
      }
      return html;
    };
  })();

  // ── ④ تتبع نتيجة التحقق من التحديث ──
  (function(){
    var origCheck = window.checkAppUpdate;
    if(!origCheck) return;
    window.checkAppUpdate = function(silent){
      if(!D.settings || !D.settings.firebaseUrl){
        if(!silent && typeof notify==='function') notify('خطأ','يجب تفعيل Firebase أولاً','error');
        return;
      }
      var url = D.settings.firebaseUrl.replace(/\/$/, "") + "/app_update/version.json";
      fetch(url).then(function(r){return r.json();}).then(function(remoteVer){
        var ver = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '0';
        if(remoteVer && String(remoteVer) > ver){
          // تحديث متاح
          window._lastOTACheck = {
            checked: new Date().toISOString(),
            available: true,
            remoteVer: String(remoteVer),
            localVer: ver
          };
        } else {
          window._lastOTACheck = {
            checked: new Date().toISOString(),
            available: false,
            remoteVer: remoteVer ? String(remoteVer) : '',
            localVer: ver
          };
        }
        // استدعِ الأصل ليكمل المنطق (تحميل التحديث، إلخ)
        return origCheck.call(this, silent);
      }).catch(function(){
        // الأصل بيتعامل مع الخطأ
        return origCheck.call(this, silent);
      });
    };
  })();

  // ── ⑤ فحص تلقائي عند فتح التطبيق ──
  setTimeout(function(){
    try {
      if(typeof checkAppUpdate === 'function' && D.settings && D.settings.firebaseUrl){
        // فحص صامت بعد 10 ثوان من الفتح
        var url = D.settings.firebaseUrl.replace(/\/$/, "") + "/app_update/version.json";
        fetch(url).then(function(r){return r.json();}).then(function(remoteVer){
          var ver = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '0';
          if(remoteVer && String(remoteVer) > ver){
            window._lastOTACheck = {
              checked: new Date().toISOString(),
              available: true,
              remoteVer: String(remoteVer),
              localVer: ver
            };
            // أعد رسم القائمة لإظهار الشارة
            if(typeof render==='function' && document.getElementById('app') && CU){
              render();
            }
          } else {
            window._lastOTACheck = {
              checked: new Date().toISOString(),
              available: false,
              remoteVer: remoteVer ? String(remoteVer) : '',
              localVer: ver
            };
          }
        }).catch(function(){});
      }
    } catch(e){}
  }, 10000);

  // ── ⑥ إضافة CSS للأنيميشن ──
  (function(){
    if(document.getElementById('v18-5-style')) return;
    var s = document.createElement('style');
    s.id = 'v18-5-style';
    s.textContent =
      '@keyframes pulse {'+
        '0%,100% { opacity: 1; transform: scale(1); }'+
        '50% { opacity: .7; transform: scale(1.05); }'+
      '}';
    document.head.appendChild(s);
  })();

  // ── ⑦ إعادة الرسم لتطبيق الزر الجديد ──
  try {
    if(typeof render==='function' && document.getElementById('app') && typeof CU!=='undefined' && CU){
      render();
    }
  } catch(e){}

  console.log('✅ v18.5 — صفحة تحديث التطبيق متاحة لجميع المستخدمين');
})();
</script>

<script>
// ════════════════════════════════════════════════════════════════
//  v18.6 — إصلاح آلية تطبيق التحديثات (OTA loader)
// ════════════════════════════════════════════════════════════════
//
//  المشكلة:
//  • checkAppUpdate يحفظ HTML الجديد في localStorage باسم ota_html
//  • لكن لا يوجد كود يقرأ ota_html ويطبّقه عند فتح التطبيق
//  • النتيجة: المستخدم يضغط "تحديث" ويرى "تم"، لكن النسخة القديمة تبقى
//
//  الحل:
//  • عند كل فتح: نتحقق من وجود ota_html محفوظ → نطبّقه فعلياً
//  • نضيف زر "🗑 مسح الكاش وإعادة التحميل" في صفحة التحديث
//  • نضيف رسالة بعد التحديث: "إعادة تحميل الآن"
//
// ════════════════════════════════════════════════════════════════

(function(){
  // ── ① تطبيق التحديث المحفوظ (إن وجد) فور تحميل الصفحة ──
  function applyStoredUpdateIfNeeded(){
    try {
      var pendingHtml = localStorage.getItem('ota_html');
      var pendingVer  = localStorage.getItem('ota_version');
      var currentVer  = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '0';

      if(!pendingHtml || !pendingVer) return false;

      // قارن: هل النسخة المحفوظة أحدث من اللي شغّالة؟
      if(String(pendingVer) <= currentVer){
        // لا حاجة، النسخة الشغّالة أحدث أو نفسها
        // نظّف التخزين لتفادي اللبس
        try {
          localStorage.removeItem('ota_html');
          localStorage.removeItem('ota_version');
        } catch(e){}
        return false;
      }

      // النسخة المحفوظة أحدث — استبدل المستند الحالي بها
      // امسح المفاتيح أولاً لتفادي حلقة لا نهائية
      localStorage.removeItem('ota_html');
      localStorage.removeItem('ota_version');

      // اكتب HTML الجديد فوق الصفحة الحالية
      document.open();
      document.write(pendingHtml);
      document.close();
      return true;
    } catch(e){
      console.warn('OTA apply error:', e);
      return false;
    }
  }

  // ⚠️ مهم: لا نطبّق التحديث الآن — لأننا حالياً داخل النسخة الجديدة فعلاً
  // التطبيق يحدث في المرة القادمة بعد reload
  // لكن نتأكد من الفحص في المرة القادمة عبر تشغيل دالة عند الفتح

  // إذا كانت النسخة المحفوظة == الحالية أو أقدم → نظّف
  try {
    var storedVer = localStorage.getItem('ota_version');
    var curVer = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '0';
    if(storedVer && String(storedVer) <= curVer){
      localStorage.removeItem('ota_html');
      localStorage.removeItem('ota_version');
      console.log('🧹 تنظيف التخزين: النسخة المحفوظة قديمة أو نفسها');
    }
  } catch(e){}

  // ── ② إصلاح checkAppUpdate ليطبّق التحديث فوراً بعد التحميل ──
  var origCheck = window.checkAppUpdate;
  if(origCheck){
    window.checkAppUpdate = function(silent){
      if(!D.settings || !D.settings.firebaseUrl){
        if(!silent && typeof notify==='function') notify('خطأ','يجب تفعيل Firebase أولاً','error');
        return;
      }
      var url = D.settings.firebaseUrl.replace(/\/$/, "") + "/app_update/version.json";
      fetch(url).then(function(r){return r.json();}).then(function(remoteVer){
        if(!remoteVer) return;
        var ver = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '0';
        if(String(remoteVer) > ver){
          if(!silent) notify('🔄','يوجد تحديث جديد v'+remoteVer+' — جاري التحميل...','info');
          var htmlUrl = D.settings.firebaseUrl.replace(/\/$/, "") + "/app_update/html.json";
          fetch(htmlUrl).then(function(r){return r.json();}).then(function(htmlData){
            if(!htmlData) return;
            try {
              localStorage.setItem('ota_html', htmlData);
              localStorage.setItem('ota_version', String(remoteVer));
              // ⭐ التغيير الجوهري: نطبّق التحديث الآن مباشرة
              if(!silent){
                _showOTASuccessDialog(String(remoteVer));
              } else {
                notify('✅','تم تحميل التحديث v'+remoteVer+' — أغلق التطبيق وافتحه','success');
              }
            } catch(e){
              console.error('OTA storage error:', e);
              notify('خطأ','فشل حفظ التحديث: '+e.message,'error');
            }
          }).catch(function(e){
            if(!silent) notify('خطأ','فشل تحميل التحديث: '+e.message,'error');
          });
        } else {
          window._lastOTACheck = {
            checked: new Date().toISOString(),
            available: false,
            remoteVer: String(remoteVer),
            localVer: ver
          };
          if(!silent) notify('✅','التطبيق محدّث — v'+ver,'success');
        }
      }).catch(function(e){
        if(!silent) notify('خطأ','فشل التحقق من التحديثات','error');
      });
    };
  }

  // ── ③ نافذة نجاح التحديث مع زر "تطبيق الآن" ──
  window._showOTASuccessDialog = function(newVer){
    var o = document.createElement('div');
    o.className = 'mo';
    o.id = 'ota-dlg';
    o.style.zIndex = '99999';
    o.innerHTML =
      '<div class="modal" style="max-width:440px;text-align:center;padding:24px">'+
        '<div style="font-size:54px;margin-bottom:12px">✅</div>'+
        '<h2 style="margin:0 0 10px 0;color:var(--ok)">تم تحميل التحديث بنجاح</h2>'+
        '<p style="font-size:14px;color:var(--txt2);margin-bottom:8px">الإصدار الجديد: <strong style="color:var(--accent);font-size:16px">v'+newVer+'</strong></p>'+
        '<p style="font-size:13px;color:var(--txt3);line-height:1.7;margin-bottom:18px">'+
          'لتطبيق التحديث، اضغط الزر أدناه — التطبيق سيُعاد تحميله بالنسخة الجديدة.'+
        '</p>'+
        '<button class="btn bok bs" style="width:100%;padding:14px;font-size:15px;font-weight:700;margin-bottom:8px" '+
          'onclick="_applyOTANow()">'+
          '⚡ تطبيق التحديث الآن'+
        '</button>'+
        '<button class="btn bo" style="width:100%;padding:11px;font-size:13px" '+
          'onclick="document.getElementById(\'ota-dlg\').remove()">'+
          'تطبيق لاحقاً (عند إعادة الفتح)'+
        '</button>'+
      '</div>';
    document.body.appendChild(o);
  };

  // ── ④ تطبيق التحديث المحفوظ فوراً ──
  window._applyOTANow = function(){
    try {
      var pendingHtml = localStorage.getItem('ota_html');
      if(!pendingHtml){
        notify('خطأ','لا يوجد تحديث محفوظ','error');
        return;
      }
      // الـ ota_html فيه النسخة الجديدة بكاملها
      // نتركه في localStorage عشان نضمن إنه ينطبق حتى لو reload فشل
      // لكن نضع علامة "applying" حتى ما نطبّقه مرتين
      localStorage.setItem('ota_applying', '1');

      // طريقة أكيدة: نكتب HTML على المستند الحالي
      document.open();
      document.write(pendingHtml);
      document.close();
    } catch(e){
      notify('خطأ','فشل تطبيق التحديث: '+e.message,'error');
    }
  };

  // ── ⑤ تنظيف بعد تطبيق التحديث ──
  // إذا كانت علامة applying موجودة، يعني الكود الجديد بدأ يشتغل بنجاح
  try {
    if(localStorage.getItem('ota_applying') === '1'){
      // التحديث طُبِّق بنجاح، نظّف
      localStorage.removeItem('ota_applying');
      localStorage.removeItem('ota_html');
      localStorage.removeItem('ota_version');
      console.log('✅ التحديث طُبِّق بنجاح — تم تنظيف التخزين');
    }
  } catch(e){}

  // ── ⑥ زر "مسح الكاش وإعادة التحميل" في صفحة تحديث التطبيق ──
  var origPgUpdate = window.pgAppUpdateCheck;
  if(origPgUpdate){
    window.pgAppUpdateCheck = function(){
      var html = origPgUpdate.apply(this, arguments);
      // أضف صندوق "مشاكل التحديث" في النهاية
      var troubleshoot =
        '<div style="background:rgba(243,156,18,.08);border:1px solid rgba(243,156,18,.3);border-radius:12px;padding:14px 18px;margin-top:14px">'+
          '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'+
            '<span style="font-size:22px">🔧</span>'+
            '<strong style="color:var(--warn);font-size:13px">تواجه مشاكل في التحديث؟</strong>'+
          '</div>'+
          '<p style="font-size:12px;color:var(--txt2);line-height:1.7;margin-bottom:10px">'+
            'إذا حمّلت التحديث لكن التطبيق ما زال يعرض النسخة القديمة، استخدم أحد الحلول:'+
          '</p>'+
          '<button class="btn bw bs" style="width:100%;padding:12px;font-size:13px;margin-bottom:8px" '+
            'onclick="_forceApplyStoredOTA()">'+
            '⚡ تطبيق التحديث المحفوظ الآن'+
          '</button>'+
          '<button class="btn bo bs" style="width:100%;padding:12px;font-size:13px;margin-bottom:8px" '+
            'onclick="_clearAllCache()">'+
            '🗑 مسح الكاش وإعادة التحميل'+
          '</button>'+
          '<div style="font-size:11px;color:var(--txt3);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--brd)">'+
            '<strong>إن لم ينفع الزرّان:</strong><br>'+
            '1. اضغط مطوّلاً على أيقونة التطبيق → معلومات التطبيق → التخزين → مسح الكاش<br>'+
            '2. لو لم ينفع: احذف الأيقونة من الشاشة وأضِفها من جديد من المتصفح'+
          '</div>'+
        '</div>';
      return html + troubleshoot;
    };
  }

  // ── ⑦ زر تطبيق التحديث المحفوظ (لو موجود) ──
  window._forceApplyStoredOTA = function(){
    var pendingHtml = localStorage.getItem('ota_html');
    var pendingVer  = localStorage.getItem('ota_version');
    if(!pendingHtml){
      notify('ℹ️','لا يوجد تحديث محفوظ — اضغط "التحقق من تحديث جديد" أولاً','info');
      return;
    }
    if(!confirm('سيتم تطبيق التحديث v'+(pendingVer||'?')+' الآن.\n\nالتطبيق سيُعاد تحميله. متابعة؟')) return;
    _applyOTANow();
  };

  // ── ⑧ زر مسح الكاش الكامل ──
  window._clearAllCache = function(){
    if(!confirm('سيتم:\n• مسح كل ذاكرة الكاش\n• إعادة تحميل التطبيق\n\nبياناتك في Firebase آمنة.\n\nمتابعة؟')) return;
    try {
      // امسح Service Workers إن وجدت
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(function(regs){
          regs.forEach(function(r){ r.unregister(); });
        });
      }
      // امسح Cache API
      if('caches' in window){
        caches.keys().then(function(names){
          names.forEach(function(n){ caches.delete(n); });
        });
      }
      // أعد التحميل بـ cache busting
      setTimeout(function(){
        var u = new URL(location.href);
        u.searchParams.set('_t', Date.now());
        location.replace(u.toString());
      }, 500);
    } catch(e){
      // fallback: reload عادي
      location.reload();
    }
  };

  console.log('✅ v18.6 — إصلاح OTA: تطبيق التحديث الفعلي + مسح الكاش');
})();
</script>
