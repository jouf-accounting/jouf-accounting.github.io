<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#4C3D8E">
<title>اختبار الجاهزية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --pri:#4C3D8E;--pri2:#6352B5;--pri3:#EFECF9;--teal:#1F9AA8;--orange:#E8833A;
  --ink:#1F1B33;--muted:#5D5A73;--bg:#F5F3FB;--card:#FFFFFF;--line:#E2DEF0;--alt:#F7F6FC;--field:#FFFFFF;
  --green:var(--pri);--green2:var(--pri2);--brass:var(--orange);--paper:var(--bg);
  --ok:#17804A;--okbg:#E2F4EA;--mid:#2F6FC9;--midbg:#EAF1FD;--bad:#B4233A;--badbg:#FCE8EB;--warm:#C76516;--warmbg:#FFF2E6;
  --shadow:0 1px 2px rgba(31,27,51,.05),0 6px 24px rgba(76,61,142,.06)}
@media (prefers-color-scheme:dark){:root{
  --pri:#A99BEF;--pri2:#BDB2F5;--pri3:#2B2747;--teal:#4CC3CF;--orange:#F2A15F;
  --ink:#ECEAF6;--muted:#AAA6C2;--bg:#141221;--card:#1E1B30;--line:#332F4D;--alt:#252139;--field:#191628;
  --ok:#5BD08F;--okbg:#173527;--mid:#7DAAF0;--midbg:#1B2740;--bad:#F17A8C;--badbg:#3A1C25;--warm:#F2A15F;--warmbg:#3A2716;
  --shadow:0 1px 2px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Naskh Arabic","Sakkal Majalla","Traditional Arabic","Segoe UI",Tahoma,serif;color:var(--ink);font-size:17px;line-height:1.8;min-height:100vh;
  background:var(--bg) radial-gradient(1200px 500px at 85% -10%,rgba(99,82,181,.13),transparent 60%) no-repeat,var(--bg) radial-gradient(900px 400px at 0% 0%,rgba(31,154,168,.08),transparent 60%) no-repeat;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
.wrap{max-width:800px;margin:0 auto;padding:20px 16px 48px}
/* الشريط العلوي */
.top{background:var(--card);border-bottom:1px solid var(--line);position:relative}
.top:after{content:"";position:absolute;inset:auto 0 -1px 0;height:3px;background:linear-gradient(90deg,var(--teal),var(--pri),var(--orange))}
.top .in{max-width:800px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .mk{width:44px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;padding:2px}
.top .mk img{width:100%;height:100%;object-fit:contain}
.top b{display:block;font-size:16px;color:var(--pri)}.top small{color:var(--muted);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
h1{font-size:25px;margin:0 0 6px;color:var(--ink)}h2{font-size:19px;margin:0 0 12px}
label{display:block;font-size:15px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink)}
input:focus{outline:3px solid rgba(99,82,181,.22);border-color:var(--pri2)}
.btn{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .05s}
@media (prefers-color-scheme:dark){.btn{color:#151225}}
.btn:hover{background:var(--pri2)}.btn:active{transform:translateY(1px)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%;margin-top:18px}
.btn.ghost{background:var(--card);color:var(--pri);border:1.5px solid var(--line)}.btn.ghost:hover{background:var(--pri3)}
.btn.gold{background:var(--orange);color:#fff}.btn.gold:hover{filter:brightness(1.06)}
.err{background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:600;font-size:14px}
.note{background:var(--alt);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.facts div{background:var(--pri3);border-radius:14px;padding:14px;text-align:center}
.facts b{display:block;font-size:26px;color:var(--pri)}.facts span{font-size:12.5px;color:var(--muted)}
ul.rules{margin:8px 0 0;padding-inline-start:20px}ul.rules li{margin-bottom:6px}ul.rules li::marker{color:var(--pri2)}
/* شاشة الدخول */
.login{display:grid;gap:16px;align-items:stretch;max-width:900px}
.brand{border-radius:20px;padding:26px;color:#fff;background:linear-gradient(140deg,#3B2F78 0%,#4C3D8E 45%,#6352B5 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.brand:before,.brand:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.brand:before{width:260px;height:260px;left:-80px;bottom:-90px}.brand:after{width:150px;height:150px;right:-40px;top:-50px;background:rgba(31,154,168,.25)}
.brand h2{font-size:24px;margin:0 0 6px;color:#fff;position:relative}.brand p{margin:0;opacity:.9;position:relative}
.brand ul{list-style:none;padding:0;margin:16px 0 0;position:relative}.brand li{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:14.5px}
.brand li span{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
@media (min-width:820px){.login{grid-template-columns:1fr 1fr;margin-top:24px}.login .card{margin:0;padding:30px}}
@media (max-width:819px){.brand{padding:18px 20px}.brand ul{display:none}.brand h2{font-size:19px}}
/* شاشة الاختبار */
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(31,27,51,.06)}
.bar .in{max-width:800px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;background:var(--pri3);color:var(--pri);border-radius:10px;padding:4px 10px;display:flex;align-items:center;gap:6px;flex:none}
.timer.warn{background:var(--badbg);color:var(--bad)}
.prog{flex:1;min-width:0}.prog .t{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .track{height:8px;background:var(--pri3);border-radius:999px;overflow:hidden}.prog .track i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pri2));border-radius:999px;transition:width .25s}
#fin,#svBtn{padding:9px 14px;flex:none}#svBtn{font-size:15px}
.sv{font-weight:600}.netbar{background:var(--warmbg);color:var(--warm);font-weight:600;font-size:15px;padding:7px 16px;text-align:center}.sv.ok{color:var(--ok)}.sv.wait{color:var(--muted)}.sv.off{color:var(--warm)}
@media (max-width:520px){#fin .lbl,#svBtn .lbl{display:none}#fin,#svBtn{padding:9px 11px}}
.qno{font-size:13px;color:var(--pri2);font-weight:700;margin-bottom:6px}
.qtext{font-size:19.5px;font-weight:700;margin:0 0 14px;line-height:1.95;white-space:pre-wrap}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:right;font:inherit;font-size:17.5px;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
@media (hover:hover){.opt:hover{border-color:var(--pri2)}}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--alt);display:grid;place-items:center;font-weight:700;flex:none;border:1px solid var(--line);color:var(--pri)}
.opt.on{border-color:var(--pri);background:var(--pri3)}.opt.on .l{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){.opt.on .l{color:#151225}}
.opt:focus-visible{outline:3px solid rgba(99,82,181,.35);outline-offset:2px}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
.nav .btn{min-width:120px}
@media (max-width:700px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(31,27,51,.08)}
  .nav .btn{flex:1;min-width:0}
  .examwrap{padding-bottom:96px}
  .card{padding:18px;border-radius:16px}
}
.qmap summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
.qmap summary::-webkit-details-marker{display:none}.qmap summary:after{content:"▾";color:var(--muted)}.qmap[open] summary:after{content:"▴"}
.qmap .grid{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.grid button{font:inherit;font-weight:700;font-size:13px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--field);cursor:pointer;color:var(--muted)}
.grid button.a{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){.grid button.a{color:#151225}}
.grid button.cur{outline:3px solid var(--orange);outline-offset:1px}
/* النتيجة */
.hero{color:#fff;border-radius:20px;padding:26px 22px;text-align:center;margin-bottom:14px;position:relative;overflow:hidden;background:linear-gradient(140deg,#3B2F78 0%,#4C3D8E 50%,#6352B5 100%)}
.hero:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.07);left:-90px;top:-120px}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(31,154,168,.22);right:-60px;bottom:-80px}
.hero>*{position:relative;z-index:1}
.hero .sc{font-size:58px;font-weight:700;line-height:1.1;margin:8px 0}
.hero .dec{display:inline-block;border-radius:999px;padding:4px 16px;font-weight:700;font-size:14px;background:#fff}
.dec.ready{color:var(--ok)}.dec.partial{color:var(--mid)}.dec.weak{color:var(--warm)}
.hero .sub{opacity:.9;font-size:14px;margin-top:8px}
.sent{display:flex;align-items:center;gap:8px;background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:14px}
.el{display:grid;grid-template-columns:1fr 120px 44px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.el:last-child{border-bottom:0}.el small{display:block;color:var(--muted);font-size:12px}
.eb{height:8px;background:var(--pri3);border-radius:999px;overflow:hidden}.eb i{display:block;height:100%;border-radius:999px}
.sg{border-radius:14px;padding:12px 14px;margin-bottom:10px;border-inline-start:4px solid}
.sg.weak{background:var(--warmbg);border-color:var(--orange)}.sg.mid{background:var(--midbg);border-color:var(--mid)}
.sg b{display:block}.sg span{font-size:14px}
.rv{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card)}
.rv.ok{border-inline-start:4px solid var(--ok)}.rv.no{border-inline-start:4px solid var(--bad)}
.rv .h{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;margin-bottom:6px}
.rv .h .ok{color:var(--ok)}.rv .h .no{color:var(--bad)}
.rv .o{padding:6px 10px;border-radius:8px;margin:4px 0;font-size:14.5px}
.rv .o.right{background:var(--okbg);color:var(--ok);font-weight:600}.rv .o.wrong{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.rv .x{background:var(--alt);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.rv .x b{color:var(--pri)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 15px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){.tabs button.on{color:#151225}}
.center{text-align:center}
.qtimer{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--muted)}
.qtimer .tr{flex:1;height:6px;background:var(--pri3);border-radius:999px;overflow:hidden}.qtimer .tr i{display:block;height:100%;background:var(--orange);border-radius:999px;transition:width 1s linear}
.qtimer.warn{color:var(--bad)}.qtimer.warn .tr i{background:var(--bad)}
.grid button[disabled]{cursor:default}
.need{font-size:13px;color:var(--warm);font-weight:600;margin-top:8px}
.warnbar{background:var(--badbg);color:var(--bad);font-weight:600;font-size:13.5px;padding:8px 16px;text-align:center}
body.nocopy .qtext,body.nocopy .opt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.spin{width:36px;height:36px;border:4px solid var(--pri3);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.qimg{margin:0 0 14px;text-align:center;background:var(--alt);border-radius:14px;padding:10px;cursor:zoom-in}
.qimg img{max-width:100%;max-height:420px;height:auto;border-radius:10px;display:block;margin:0 auto;background:#fff}
.qimg figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.zoom{position:fixed;inset:0;background:rgba(10,8,20,.88);z-index:50;display:grid;place-items:center;cursor:zoom-out;padding:10px}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:10px}
.mv{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 20px;font-weight:700;font-size:16px;background:#fff;color:#4C3D8E}
.mv i{font-style:normal;font-size:22px}
.hero .msg{max-width:520px;margin:10px auto 0;font-size:14.5px;opacity:.95;line-height:1.8}
.goal{display:inline-block;margin-top:12px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 14px;font-size:13px}
.rv .w{background:var(--badbg);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}.rv .w b{color:var(--bad)}
.rv details{margin-top:8px;font-size:13.5px}.rv summary{cursor:pointer;color:var(--pri);font-weight:600}
.rv details ul{margin:6px 0 0;padding-inline-start:18px}.rv details li{margin-bottom:4px}
.rv .qimg{max-width:420px;margin:6px 0 8px}
.oth{margin-top:8px;font-size:16px;background:var(--alt);border-radius:10px;padding:10px 12px}.oth b{color:var(--warm)}.oth ul{margin:6px 0 0;padding-inline-start:20px}.oth li{margin-bottom:4px}.oth li b{color:var(--ink)}
.sumhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
/* خط النسخ: تكبير النصوص الصغيرة لسهولة القراءة على الجوال */
.note,.sg span,.rv .x,.rv .w,.rv .o,.rv details,.el,.tabs button,.qno,.prog .t,.sent{font-size:16px}
@media screen{.sm{font-size:16px}.sm-p,.sm-x li,.sm-e,.sm-tp div,.sm-tb,.sm-in,.sm-f div{font-size:15.5px}.sm-p b,.sm-t{font-size:16.5px}.sm-hd h3{font-size:21px}.sm-f span{font-size:16px}.sm-cap{font-size:14.5px}}
input{font-family:inherit}#fCode,#fUid{font-family:"Segoe UI",Tahoma,Arial,sans-serif}.timer,.hero .sc,.facts b{font-family:"Segoe UI",Tahoma,Arial,sans-serif}
@media print{body.nocopy *{display:none!important}.top,.bar,.noprint,.nav{display:none!important}body{background:#fff;color:#000}.card,.rv{break-inside:avoid;box-shadow:none}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  if (s.intro) h += '<div class="sm-in">' + e(s.intro) + '</div>';
  var full = !!opt.full;
  var cap = function (a, n) { return full ? a : a.slice(0, n); };
  var P = cap(arr(s.points), 4);
  if (P.length) {
    h += '<div class="sm-t">🎯 أهم ما يجب أن تعرفه</div><div class="sm-g">';
    P.forEach(function (p, i) { h += '<div class="sm-p sm-c' + (i % 6) + '">' + (p.h ? '<b>' + e(p.h) + '</b>' : '') + e(p.t) + '</div>'; });
    h += '</div>';
  }
  var F = cap(arr(s.formulas), 4);
  if (F.length) {
    h += '<div class="sm-t">🧮 معادلات وقواعد للحفظ</div><div class="sm-f">';
    F.forEach(function (f) { h += '<div><b>' + e(f.n) + '</b><span>' + e(f.f) + '</span></div>'; });
    h += '</div>';
  }
  var TB = cap(arr(s.tables).filter(function (t) { return t.rows && t.rows.length; }), 1);
  if (TB.length) {
    h += '<div class="sm-t">📊 جداول المقارنة</div><div class="sm-tw">';
    TB.forEach(function (t) {
      h += '<div>' + (t.cap ? '<div class="sm-cap">' + e(t.cap) + '</div>' : '') +
        '<table class="sm-tb">' + (t.head && t.head.length ? '<thead><tr>' + t.head.map(function (c) { return '<th>' + e(c) + '</th>'; }).join('') + '</tr></thead>' : '') +
        '<tbody>' + t.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + e(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    });
    h += '</div>';
  }
  var M = cap(arr(s.mistakes), 4);
  if (M.length) {
    h += '<div class="sm-t">⚠️ أخطاء شائعة احذرها</div><ul class="sm-x">';
    M.forEach(function (m) { h += '<li><span>' + e(m) + '</span></li>'; });
    h += '</ul>';
  }
  var X = s.example;
  if (X && X.q) {
    h += '<div class="sm-t">✍️ مثال محلول</div><div class="sm-e"><div class="q">' + e(X.q) + '</div>';
    if (arr(X.steps).length) h += '<ol>' + cap(arr(X.steps), 3).map(function (x) { return '<li>' + e(x) + '</li>'; }).join('') + '</ol>';
    if (X.a) h += '<span class="a">الإجابة: ' + e(X.a) + '</span>';
    if (X.note) h += '<div class="n">' + e(X.note) + '</div>';
    h += '</div>';
  }
  var T = s.src === 'auto' ? [] : cap(arr(s.tips), 2);
  if (T.length) {
    h += '<div class="sm-t">💡 نصائح للمذاكرة</div><div class="sm-tp">';
    T.forEach(function (t) { h += '<div>' + e(t) + '</div>'; });
    h += '</div>';
  }
  h += '</div>' + (s.src === 'auto' ? '<div class="sm-ft">ملخص مولَّد من بنك الأسئلة</div>' : '') + '</div>';
  return h;
}

</script>
<script>
(function () {
  'use strict';
  var C = window.DMS_CONFIG || {};
  var app = document.getElementById('app');
  if (!window.supabase || !C.supabaseUrl) { app.innerHTML = '<div class="wrap"><div class="card err">تعذر تحميل الصفحة. تحقق من اتصالك بالإنترنت ثم أعد فتح الرابط.</div></div>'; return; }
  var sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey, { auth: { persistSession: false } });
  var params = new URLSearchParams(location.search);
  var S = { code: (params.get('c') || '').toUpperCase(), uid: '', name: '', exam: null, order: [], optOrder: {}, answers: {}, cur: 0,
            startedAt: null, endsAt: null, timer: null, result: null, submitting: false, qEnd: null, blur: 0, timedOut: 0, reason: '', warned: false };
  var LET = ['أ', 'ب', 'ج', 'د', 'هـ', 'و'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function digits(s) { return String(s || '').replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 1632; }).replace(/[۰-۹]/g, function (d) { return d.charCodeAt(0) - 1776; }); }
  function ic(n) { return '<svg class="ic"><use href="#i-' + n + '"/></svg>'; }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function hashStr(str) { var h = 2166136261 >>> 0; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffle(arr, r) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function key() { return 'oex:' + S.exam.id + ':' + S.uid; }
  function ckey() { return 'oexc:' + S.code + ':' + S.uid; }
  /* حفظ التقدم في الخادم (إضافة إلى الجهاز) — يعمل بصمت، ويُتجاهل إن لم تُفعَّل الخدمة بعد */
  function setSave(st, txt) { var el = document.getElementById('sv'); if (!el) return; el.className = 'sv ' + st; el.textContent = st === 'off' ? '📴 دون اتصال' : st === 'wait' ? '⏳ يُحفظ' : '💾 ' + (txt || 'محفوظ').replace(/^💾\s*/, '');
    var n = document.getElementById('net'); if (n) n.innerHTML = st === 'off' ? '<div class="netbar">انقطع الاتصال — تابع الحل، إجاباتك محفوظة على جهازك وتُرسل عند عودة الاتصال.</div>' : ''; }
  function remoteSave(cb) {
    if (!S.exam || !S.startedAt || S.result || S.submitting || S.noRemote) { if (cb) cb(false); return; }
    if (!navigator.onLine) { setSave('off', '📴 غير متصل — إجاباتك محفوظة على جهازك'); if (cb) cb(false); return; }
    setSave('wait', '⏳ جارٍ الحفظ…');
    sb.rpc('exam_progress_save', { p_code: S.code, p_uid: S.uid, p_answers: S.answers, p_cur: S.cur, p_started: S.startedAt, p_ends: new Date(S.endsAt).toISOString(), p_name: S.name || null })
      .then(function (r) {
        if (r.error) { if (/function|schema|PGRST2|404/i.test((r.error.message || '') + (r.error.code || ''))) S.noRemote = true; setSave('ok', '💾 محفوظ على جهازك'); if (cb) cb(false); return; }
        S.lastSave = Date.now(); setSave('ok', 'محفوظ ' + new Date().toLocaleTimeString('ar-SA', { hour: 'numeric', minute: '2-digit' })); if (cb) cb(true);
      }, function () { setSave('off', '📴 غير متصل — إجاباتك محفوظة على جهازك'); if (cb) cb(false); });
  }
  function persist() { try { if (S.startedAt) localStorage.setItem(ckey(), JSON.stringify({ startedAt: S.startedAt })); } catch (e) {}
    clearTimeout(S.saveT); if (S.startedAt && !S.result) S.saveT = setTimeout(remoteSave, 2500);
    try { localStorage.setItem(key(), JSON.stringify({ answers: S.answers, startedAt: S.startedAt, endsAt: S.endsAt, name: S.name, cur: S.cur, qEnd: S.qEnd, blur: S.blur, timedOut: S.timedOut })); } catch (e) {} }
  function locked() { return !!(S.exam && (S.exam.forwardOnly || S.exam.perQuestionSec > 0)); }
  function active() { return !!(S.exam && S.startedAt && !S.result && !S.submitting && document.getElementById('qcard')); }
  function setOrg(o) { if (o && o.systemName) document.getElementById('orgName').textContent = o.systemName; if (o && o.university) document.getElementById('orgSub').textContent = o.university; }

  function splitMark(s, m) { s = String(s == null ? '' : s); var i = s.indexOf(m); if (i < 0) return [s, null]; var j = null; try { j = JSON.parse(s.slice(i + m.length)); } catch (e) {} return [s.slice(0, i), j]; }
  var MOTIV = [
    { min: 90, e: '🏆', t: 'متميّز', m: 'أداء رائع يعكس استعدادًا قويًا. حافظ على هذا المستوى بمراجعة خفيفة ومنتظمة.' },
    { min: 80, e: '🌟', t: 'أداء ممتاز', m: 'أنت جاهز تقريبًا! راجع المحاور المقترحة لتنتقل من الممتاز إلى المتميّز.' },
    { min: 60, e: '🚀', t: 'على الطريق الصحيح', m: 'لديك أساس جيد. ركّز على ملخصات المحاور المقترحة وستلاحظ الفرق في المحاولة القادمة.' },
    { min: 0, e: '💪', t: 'بداية قوية تبدأ من هنا', m: 'كل متميّز بدأ من هذه النقطة. خطتك للمذاكرة جاهزة أدناه؛ ابدأ بملخص واحد اليوم.' }];
  function band(score) { var L = (S.exam && S.exam.org && S.exam.org.motiv && S.exam.org.motiv.length) ? S.exam.org.motiv : MOTIV;
    L = L.slice().sort(function (a, b) { return b.min - a.min; }); for (var i = 0; i < L.length; i++) if (score >= Number(L[i].min || 0)) return L[i]; return L[L.length - 1]; }
  function imgHTML(q, cap) { if (!q || !q.img) return ''; return '<figure class="qimg" data-z="' + esc(q.img) + '"><img src="' + esc(q.img) + '" alt="صورة توضيحية للسؤال" loading="lazy"' +
    (q.iw && q.ih ? ' width="' + q.iw + '" height="' + q.ih + '"' : '') + '>' + (cap ? '<figcaption>اضغط على الصورة لتكبيرها</figcaption>' : '') + '</figure>'; }
  function bindZoom(root) { (root || app).querySelectorAll('.qimg').forEach(function (f) { f.onclick = function () { var z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<img src="' + esc(f.getAttribute('data-z')) + '" alt="">'; z.onclick = function () { z.remove(); }; document.body.appendChild(z); }; }); }
  (function () { if (window.RD_SUM_CSS) { var st = document.createElement('style'); st.textContent = RD_SUM_CSS; document.head.appendChild(st); } })();

  /* ---------------- الدخول ---------------- */
  function screenLogin(msg) {
    app.innerHTML = '<div class="wrap login"><div class="brand"><h2>' + esc(document.getElementById('orgName').textContent || 'اختبار الجاهزية') + '</h2><p>' + esc(document.getElementById('orgSub').textContent || '') + '</p>' +
      '<ul><li><span>' + ic('clock') + '</span>اختبار محدد الوقت تُحفظ إجاباتك فيه أولًا بأول</li><li><span>' + ic('check') + '</span>نتيجتك تظهر فور التسليم مع شرح كل سؤال</li><li><span>' + ic('bulb') + '</span>خطة مذاكرة وملخصات للمحاور التي تحتاج تقويتها</li></ul></div>' +
      '<div class="card"><h1>الدخول إلى الاختبار</h1>' +
      '<p class="note" style="margin:6px 0 4px">اكتب رمز الاختبار الذي أرسله لك الدكتور، ورقمك الجامعي.</p>' +
      '<label for="fCode">رمز الاختبار</label><input id="fCode" autocomplete="off" dir="ltr" style="text-align:center;letter-spacing:4px;font-weight:700" value="' + esc(S.code) + '">' +
      '<label for="fUid">الرقم الجامعي</label><input id="fUid" inputmode="numeric" autocomplete="off" dir="ltr" style="text-align:center" value="' + esc(S.uid) + '">' +
      '<div id="nameBox" style="display:none"><label for="fName">الاسم الكامل</label><input id="fName" autocomplete="name"></div>' +
      (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
      '<button class="btn wide" id="go">دخول ' + ic('send') + '</button></div></div>';
    var go = document.getElementById('go');
    function submit() {
      S.code = digits(document.getElementById('fCode').value).trim().toUpperCase();
      S.uid = digits(document.getElementById('fUid').value).trim();
      var nm = document.getElementById('fName'); if (nm && nm.value) S.name = nm.value.trim();
      if (!S.code || !S.uid) { screenLogin('اكتب رمز الاختبار ورقمك الجامعي.'); return; }
      go.disabled = true; go.textContent = 'جارٍ التحقق…';
      sb.rpc('exam_open', { p_code: S.code, p_uid: S.uid }).then(function (r) {
        if (r.error) { screenLogin('تعذر الاتصال. تحقق من الإنترنت ثم حاول مرة أخرى.'); return; }
        var d = r.data;
        if (d && d.submitted) { recoverResult(d.error); return; }
        if (!d || !d.ok) { screenLogin((d && d.error) || 'تعذر فتح الاختبار.'); return; }
        S.exam = d.exam; S.uid = d.student.uid; if (d.student.name) S.name = d.student.name;
        setOrg(S.exam.org);
        var rnd = rng(hashStr(S.exam.id + '|' + S.uid));
        var ids = S.exam.questions.map(function (q) { return q.id; });
        S.order = S.exam.shuffleQuestions ? shuffle(ids, rnd) : ids;
        S.exam.questions.forEach(function (q) { var o = q.options.map(function (_, i) { return i; }); S.optOrder[q.id] = S.exam.shuffleOptions ? shuffle(o, rnd) : o; });
        var saved = null; try { saved = JSON.parse(localStorage.getItem(key()) || 'null'); } catch (e) {}
        if (saved && saved.endsAt) {
          S.answers = saved.answers || {}; S.startedAt = saved.startedAt; S.endsAt = saved.endsAt; S.cur = saved.cur || 0; if (saved.name) S.name = saved.name;
          S.qEnd = saved.qEnd || null; S.blur = saved.blur || 0; S.timedOut = saved.timedOut || 0;
          if (Date.now() >= S.endsAt) { doSubmit(true); return; }
          screenExam(); return;
        }
        /* لا يوجد حفظ على هذا الجهاز: نبحث عن تقدم محفوظ في الخادم (من جهاز آخر أو قبل تعطل الجهاز) */
        sb.rpc('exam_progress_get', { p_code: S.code, p_uid: S.uid }).then(function (g) {
          var P = g && !g.error && g.data && g.data.progress;
          if (P && P.started_at && P.ends_at) {
            S.answers = P.answers || {}; S.cur = Math.min(P.cur || 0, S.order.length - 1); S.startedAt = P.started_at; S.endsAt = new Date(P.ends_at).getTime(); if (P.name && !S.name) S.name = P.name;
            persist(); if (Date.now() >= S.endsAt) { doSubmit(true); return; } screenExam(); return;
          }
          screenBrief();
        }, function () { screenBrief(); });
      });
    }
    go.onclick = submit;
    ['fCode', 'fUid'].forEach(function (id) { document.getElementById(id).onkeydown = function (e) { if (e.key === 'Enter') submit(); }; });
    if (S.code && !S.uid) document.getElementById('fUid').focus();
  }

  /* ---------------- التعليمات ---------------- */
  function rulesHtml() {
    var E = S.exam, r = '';
    if (E.perQuestionSec > 0) r += '<li><b>لكل سؤال ' + E.perQuestionSec + ' ثانية</b>؛ عند انتهائها ينتقل الاختبار إلى السؤال التالي تلقائيًا.</li>';
    if (locked()) r += '<li><b>لا يمكن الرجوع إلى سؤال سابق</b> بعد الانتقال منه، فتأكد من إجابتك قبل الضغط على «التالي».</li>';
    else r += '<li>تستطيع التنقل بين الأسئلة وتغيير إجابتك قبل التسليم.</li>';
    if (E.requireAnswer) r += '<li><b>الإجابة إلزامية</b>: لا تنتقل إلى السؤال التالي ولا تسلّم قبل اختيار إجابة.</li>';
    if (E.noCopy) r += '<li>النسخ وتحديد النص معطّلان أثناء الاختبار.</li>';
    if (E.trackFocus) r += '<li><b>يُسجَّل خروجك من صفحة الاختبار</b> (فتح تطبيق أو تبويب آخر)، ويطّلع عليه الدكتور' +
      (E.maxBlur > 0 ? '، وإذا تجاوز ' + E.maxBlur + ' مرات يُسلَّم الاختبار تلقائيًا' : '') + '.</li>';
    return r;
  }
  function screenBrief() {
    var needName = S.exam.needName && !S.name;
    app.innerHTML = '<div class="wrap"><div class="card"><h1>' + esc(S.exam.title) + '</h1>' +
      (S.name ? '<p style="margin:0;color:var(--muted)">الطالب: <b style="color:var(--ink)">' + esc(S.name) + '</b> · ' + esc(S.uid) + '</p>' : '') +
      '<div class="facts"><div><b>' + S.exam.count + '</b><span>سؤالًا</span></div><div><b>' + S.exam.duration + '</b><span>دقيقة</span></div></div>' +
      '<ul class="rules"><li>يبدأ العدّاد عند الضغط على «ابدأ الاختبار»، ويُسلَّم الاختبار تلقائيًا عند انتهاء الوقت.</li>' +
      '<li>إجاباتك تُحفظ تلقائيًا على جهازك وفي الخادم أولًا بأول؛ إن انقطع الاتصال فأكمل الحل، وإن أُغلقت الصفحة أو تعطل الجهاز فافتح الرابط نفسه (ولو من جهاز آخر) لتكمل من حيث توقفت. وقت الاختبار مستمر.</li>' +
      rulesHtml() +
      '<li>بعد التسليم تظهر نتيجتك فورًا مع شرح الإجابات ومقترحات للتحسين، وتصل للدكتور مباشرة.</li></ul>' +
      (needName ? '<label for="fName2">الاسم الكامل (كما في سجلات الجامعة)</label><input id="fName2" autocomplete="name">' : '') +
      '<div id="bErr"></div><button class="btn wide gold" id="start">ابدأ الاختبار</button></div></div>';
    document.getElementById('start').onclick = function () {
      if (needName) {
        var v = (document.getElementById('fName2').value || '').trim();
        if (v.length < 3) { document.getElementById('bErr').innerHTML = '<div class="err">اكتب اسمك الكامل.</div>'; return; }
        S.name = v;
      }
      S.startedAt = new Date().toISOString();
      S.endsAt = Date.now() + S.exam.duration * 60000;
      if (S.exam.perQuestionSec > 0) S.qEnd = Date.now() + S.exam.perQuestionSec * 1000;
      if (S.exam.closes_at) S.endsAt = Math.min(S.endsAt, new Date(S.exam.closes_at).getTime());
      persist(); screenExam();
    };
  }

  /* ---------------- الاختبار ---------------- */
  function qById(id) { for (var i = 0; i < S.exam.questions.length; i++) if (S.exam.questions[i].id === id) return S.exam.questions[i]; return null; }
  function answered() { return Object.keys(S.answers).length; }
  function screenExam() {
    app.innerHTML = '<div class="bar"><div class="in"><span class="timer" id="tm">' + ic('clock') + ' <span id="tmv">--:--</span></span>' +
      '<div class="prog"><div class="t"><span id="pt"></span> · <span id="sv" class="sv ok">💾 محفوظ</span></div><div class="track"><i id="pb"></i></div></div>' +
      '<button class="btn ghost" id="svBtn" aria-label="حفظ وإكمال لاحقًا" title="حفظ وإكمال لاحقًا">💾<span class="lbl">حفظ وإكمال لاحقًا</span></button>' +
      (locked() ? '' : '<button class="btn gold" id="fin" aria-label="تسليم">' + ic('send') + '<span class="lbl">تسليم</span></button>') + '</div><div id="warn"></div><div id="net"></div></div>' +
      '<div class="wrap examwrap"><div class="card" id="qcard"></div><details class="card qmap"' + (window.innerWidth > 700 ? ' open' : '') + '><summary>خريطة الأسئلة</summary><div class="grid" id="grid"></div></details></div>';
    var fin = document.getElementById('fin'); if (fin) fin.onclick = confirmSubmit;
    document.getElementById('svBtn').onclick = function () { persist(); clearTimeout(S.saveT); remoteSave(function (ok) {
      alert(ok ? 'حُفظت إجاباتك في الخادم وعلى جهازك.\nتستطيع إغلاق الصفحة والعودة من الرابط نفسه، ولو من جهاز آخر، لتكمل من حيث توقفت.\nتنبيه: وقت الاختبار مستمر ولا يتوقف.'
               : 'حُفظت إجاباتك على جهازك.\nإن عدت من الجهاز نفسه تكمل من حيث توقفت.\nتنبيه: وقت الاختبار مستمر ولا يتوقف.'); }); };
    if (!navigator.onLine) setSave('off', '📴 غير متصل — إجاباتك محفوظة على جهازك');
    if (S.exam.noCopy) document.body.classList.add('nocopy');
    drawWarn(); drawQ(); tick(); clearInterval(S.timer); S.timer = setInterval(tick, 1000);
  }
  function tick() {
    var left = (S.endsAt - Date.now()) / 1000, el = document.getElementById('tmv');
    if (!el) return;
    el.textContent = fmt(left);
    document.getElementById('tm').className = 'timer' + (left < 300 ? ' warn' : '');
    if (left <= 0) { clearInterval(S.timer); doSubmit(true, 'time'); return; }
    var P = S.exam.perQuestionSec;
    if (P > 0 && S.qEnd) {
      var n = S.order.length, moved = false;
      while (S.qEnd && Date.now() >= S.qEnd) {
        if (S.answers[S.order[S.cur]] === undefined) S.timedOut++;
        if (S.cur < n - 1) { S.cur++; S.qEnd += P * 1000; moved = true; }
        else { persist(); clearInterval(S.timer); doSubmit(true, 'perq'); return; }
      }
      if (moved) { persist(); drawQ(); scrollTo(0, 0); }
      var ql = Math.max(0, (S.qEnd - Date.now()) / 1000), qt = document.getElementById('qt');
      if (qt) { qt.className = 'qtimer' + (ql <= 10 ? ' warn' : ''); document.getElementById('qtv').textContent = fmt(ql); document.getElementById('qtb').style.width = Math.round(ql / P * 100) + '%'; }
    }
  }
  function drawWarn() {
    var w = document.getElementById('warn'); if (!w) return;
    w.innerHTML = S.blur > 0 && S.exam.trackFocus ? '<div class="warnbar">رُصد خروجك من صفحة الاختبار ' + S.blur + ' مرة' +
      (S.exam.maxBlur > 0 ? ' — الحد المسموح ' + S.exam.maxBlur + '، وبعده يُسلَّم الاختبار تلقائيًا' : '') + '.</div>' : '';
  }
  function goNext() {
    var n = S.order.length, id = S.order[S.cur];
    if (S.exam.requireAnswer && S.answers[id] === undefined) return;
    if (S.cur < n - 1) { S.cur++; if (S.exam.perQuestionSec > 0) S.qEnd = Date.now() + S.exam.perQuestionSec * 1000; persist(); drawQ(); scrollTo(0, 0); }
    else confirmSubmit();
  }
  function drawQ() {
    var id = S.order[S.cur], q = qById(id), n = S.order.length, a = answered();
    document.getElementById('pt').textContent = 'أجبت عن ' + a + ' من ' + n;
    document.getElementById('pb').style.width = Math.round(a / n * 100) + '%';
    var P = S.exam.perQuestionSec, need = S.exam.requireAnswer && S.answers[id] === undefined;
    var h = (P > 0 ? '<div class="qtimer" id="qt">' + ic('clock') + ' <span id="qtv">' + fmt(Math.max(0, (S.qEnd - Date.now()) / 1000)) + '</span><div class="tr"><i id="qtb" style="width:' + Math.round(Math.max(0, (S.qEnd - Date.now()) / 1000) / P * 100) + '%"></i></div></div>' : '') +
      '<div class="qno">السؤال ' + (S.cur + 1) + ' من ' + n + '</div><p class="qtext">' + esc(q.text) + '</p>' + imgHTML(q, true);
    S.optOrder[id].forEach(function (oi, k) {
      var on = S.answers[id] === oi;
      h += '<button class="opt' + (on ? ' on' : '') + '" data-o="' + oi + '" aria-pressed="' + on + '"><span class="l">' + (LET[k] || k + 1) + '</span><span>' + esc(q.options[oi]) + '</span></button>';
    });
    h += '<div class="nav">' + (locked() ? '<span></span>' : '<button class="btn ghost" id="prev"' + (S.cur === 0 ? ' disabled' : '') + '>السابق</button>') +
      (S.cur < n - 1 ? '<button class="btn" id="next"' + (need ? ' disabled' : '') + '>التالي</button>' : '<button class="btn gold" id="next"' + (need ? ' disabled' : '') + '>تسليم الاختبار</button>') + '</div>' +
      (need ? '<div class="need">اختر إجابة للمتابعة.</div>' : '');
    var c = document.getElementById('qcard'); c.innerHTML = h; bindZoom(c);
    var nx = S.order[S.cur + 1] && qById(S.order[S.cur + 1]); if (nx && nx.img) { var pre = new Image(); pre.src = nx.img; }
    c.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () { S.answers[id] = +b.getAttribute('data-o'); persist(); drawQ(); };
    });
    var pv = document.getElementById('prev'); if (pv) pv.onclick = function () { if (S.cur > 0 && !locked()) { S.cur--; persist(); drawQ(); scrollTo(0, 0); } };
    document.getElementById('next').onclick = goNext;
    var g = ''; S.order.forEach(function (qid, i) { g += '<button class="' + (S.answers[qid] !== undefined ? 'a' : '') + (i === S.cur ? ' cur' : '') + '" data-i="' + i + '" aria-label="السؤال ' + (i + 1) + '"' + (locked() ? ' disabled' : '') + '>' + (i + 1) + '</button>'; });
    var gr = document.getElementById('grid'); gr.innerHTML = g;
    if (!locked()) gr.querySelectorAll('button').forEach(function (b) { b.onclick = function () { S.cur = +b.getAttribute('data-i'); persist(); drawQ(); scrollTo(0, 0); }; });
  }
  function confirmSubmit() {
    var left = S.order.length - answered();
    if (S.exam.requireAnswer && left > 0) {
      var first = -1; S.order.forEach(function (q, i) { if (first < 0 && S.answers[q] === undefined) first = i; });
      alert('الإجابة إلزامية: بقي ' + left + ' سؤالًا دون إجابة.' + (locked() ? '' : ' سننقلك إلى أول سؤال لم تُجب عنه.'));
      if (!locked() && first >= 0) { S.cur = first; persist(); drawQ(); scrollTo(0, 0); }
      return;
    }
    if (!confirm(left ? 'لم تُجب عن ' + left + ' سؤالًا. هل تريد التسليم الآن؟' : 'تسليم الاختبار الآن؟ لن تستطيع تعديل إجاباتك بعد التسليم.')) return;
    doSubmit(false);
  }

  /* ---------------- التسليم ---------------- */
  function doSubmit(auto, reason) {
    if (S.submitting) return; S.submitting = true; clearInterval(S.timer); S.reason = reason || (auto ? 'time' : '');
    document.body.classList.remove('nocopy');
    app.innerHTML = '<div class="wrap"><div class="card center"><div class="spin"></div><h2>جارٍ إرسال إجاباتك وتصحيحها…</h2>' +
      (auto ? '<p class="note">' + (reason === 'blur' ? 'تجاوزت الحد المسموح للخروج من صفحة الاختبار، فسُلّم تلقائيًا بما أجبت عنه.' : 'انتهى الوقت، فسُلّم الاختبار تلقائيًا بما أجبت عنه.') + '</p>' : '') + '</div></div>';
    var ans = {}; Object.keys(S.answers).forEach(function (k) { ans[k] = S.answers[k]; });
    sb.rpc('exam_submit', { p_code: S.code, p_uid: S.uid, p_name: S.name || '', p_answers: ans, p_started: S.startedAt, p_auto: !!auto, p_meta: { blur: S.blur, reason: S.reason, timedOut: S.timedOut } }).then(function (r) {
      S.submitting = false;
      if (r.error || !r.data) { screenRetry('تعذر إرسال إجاباتك بسبب الاتصال. إجاباتك محفوظة على جهازك — اضغط «إعادة الإرسال».', auto, false, reason); return; }
      if (!r.data.ok) {
        if (r.data.submitted) { recoverResult(r.data.error); return; }
        screenRetry(r.data.error || 'تعذر التسليم.', auto, r.data.submitted); return;
      }
      try { localStorage.removeItem(key()); } catch (e) {}
      S.result = r.data; screenResult();
    });
  }
  function recoverResult(msg) {
    var st = null; try { st = JSON.parse(localStorage.getItem(ckey()) || 'null'); } catch (e) {}
    if (!st || !st.startedAt) { screenRetry(msg || 'سبق أن سلّمت هذا الاختبار.', false, true); return; }
    app.innerHTML = '<div class="wrap"><div class="card center"><div class="spin"></div><h2>اختبارك مُسلَّم — جارٍ استرجاع نتيجتك…</h2></div></div>';
    sb.rpc('exam_result', { p_code: S.code, p_uid: S.uid, p_started: st.startedAt }).then(function (r) {
      if (r.error || !r.data || !r.data.ok) { screenRetry((msg || 'سبق أن سلّمت هذا الاختبار.') + ' إجاباتك وصلت إلى الدكتور.', false, true); return; }
      if (!S.exam && r.data.exam) { S.exam = r.data.exam; setOrg(S.exam.org); }
      S.result = r.data; try { if (S.exam && S.exam.id) localStorage.removeItem(key()); } catch (e) {}
      screenResult();
    }, function () { screenRetry('تعذر الاتصال. أعد المحاولة بعد عودة الإنترنت.', false, false, null, function () { recoverResult(msg); }); });
  }
  function screenRetry(msg, auto, final, reason, retryFn) {
    var again = retryFn || function () { doSubmit(auto, reason); };
    app.innerHTML = '<div class="wrap"><div class="card"><h2>' + (final ? 'تم التسليم مسبقًا' : 'لم يكتمل الإرسال') + '</h2><div class="err">' + esc(msg) + '</div>' +
      (final ? '' : '<p class="note" style="margin-top:12px">إجاباتك محفوظة على جهازك. سنعيد المحاولة تلقائيًا عند عودة الاتصال، ويمكنك الضغط على الزر في أي وقت.</p><button class="btn wide" id="retry">' + ic('send') + ' إعادة الإرسال</button>') + '</div></div>';
    var b = document.getElementById('retry'); if (b) b.onclick = function () { clearInterval(S.retryT); again(); };
    clearInterval(S.retryT);
    if (!final) S.retryT = setInterval(function () { if (navigator.onLine && document.getElementById('retry')) { clearInterval(S.retryT); again(); } }, 15000);
  }

  /* ---------------- النتيجة ---------------- */
  function decCls(d) { return d === 'جاهز' ? 'ready' : d === 'شبه جاهز' ? 'partial' : 'weak'; }
  function barColor(p, t) { return p >= t.ready ? 'var(--ok)' : p >= t.partial ? 'var(--mid)' : 'var(--orange)'; }
  function screenResult(tab) {
    var R = S.result, t = R.thresholds || { ready: 80, partial: 60 };
    var sugg = (R.suggestions || []).map(function (s) { var p = splitMark(s.tip, '\n⟦S⟧'); return { name: s.name, pct: s.pct, level: s.level, tip: p[0], sum: p[1] }; });
    var sums = sugg.filter(function (s) { return s.sum; });
    var hasEl = R.elements && R.elements.length, hasRv = R.review && R.review.length, hasSm = sums.length;
    tab = tab || 'sum';
    var h = '<div class="wrap">';
    h += '<div class="sent noprint">' + ic('check') + ' استُلمت إجاباتك ووصلت نتيجتك إلى الدكتور.</div>';
    if (S.reason === 'blur') h += '<div class="err" style="margin:0 0 14px">سُلّم الاختبار تلقائيًا لتجاوز الحد المسموح للخروج من صفحته.</div>';
    h += '<div class="hero"><div>' + esc(S.exam.title) + '</div><div style="opacity:.85;font-size:14px">' + esc(R.student.name) + ' · ' + esc(R.student.uid) + '</div>';
    if (R.score != null) {
      var B = band(R.score);
      h += '<div class="sc">' + R.score + '%</div><span class="mv"><i>' + esc(B.e || '') + '</i>' + esc(B.t || '') + '</span>' +
        (B.m ? '<div class="msg">' + esc(B.m) + '</div>' : '') +
        '<div class="sub">إجابات صحيحة: ' + R.correct + ' من ' + R.total + '</div>' +
        (R.score < t.ready ? '<span class="goal">🎯 هدفك القادم: ' + t.ready + '% فأكثر</span>' : '<span class="goal">🎯 هدفك القادم: الحفاظ على مستواك</span>');
    } else h += '<div class="sub" style="margin-top:12px">ستعلن نتيجتك من الدكتور.</div>';
    h += '</div>';
    var tabs = [];
    if (hasEl) tabs.push(['sum', 'التحليل والمقترحات']);
    if (hasSm) tabs.push(['study', '📘 ملخصات للمذاكرة (' + sums.length + ')']);
    if (hasRv) tabs.push(['rev', 'مراجعة الإجابات مع الشرح']);
    if (tabs.length && !tabs.some(function (x) { return x[0] === tab; })) tab = tabs[0][0];
    if (tabs.length > 1) h += '<div class="tabs noprint">' + tabs.map(function (x) { return '<button data-t="' + x[0] + '" class="' + (tab === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div>';
    if (hasEl && tab === 'sum') {
      if (sugg.length) {
        h += '<div class="card"><h2>' + ic('bulb') + ' خطتك لتطوير نتيجتك</h2>';
        sugg.forEach(function (s) {
          h += '<div class="sg ' + s.level + '"><b>' + esc(s.name) + ' — ' + s.pct + '%</b><span>' + esc(s.tip || ('راجع هذا الموضوع وحلّ أسئلة تدريبية عليه.')) + '</span></div>';
        });
        h += '<p class="note" style="margin:6px 0 0">ابدأ بالمحاور ذات النسبة الأقل' + (hasSm ? '، واقرأ ملخصها في تبويب «ملخصات للمذاكرة»' : '') + '، ثم أعد الاختبار التجريبي لتقيس تقدمك.</p>' +
          (hasSm ? '<div class="center" style="margin-top:10px"><button class="btn gold noprint" data-go="study">📘 افتح ملخصات المذاكرة</button></div>' : '') + '</div>';
      } else if (R.score != null) {
        h += '<div class="card"><h2>' + ic('bulb') + ' مقترحات</h2><p style="margin:0">أداء ممتاز في كل المحاور. حافظ على مستواك بمراجعة دورية وحل أسئلة محاكاة متنوعة.</p></div>';
      }
      h += '<div class="card"><h2>أداؤك في كل محور</h2>';
      R.elements.forEach(function (e) {
        h += '<div class="el"><div>' + esc(e.name) + (e.unit ? '<small>' + esc(e.unit) + '</small>' : '') + '</div><div class="eb"><i style="width:' + e.pct + '%;background:' + barColor(e.pct, t) + '"></i></div><b>' + e.pct + '%</b></div>';
      });
      h += '</div>';
    }
    if (hasSm && tab === 'study') {
      h += '<div class="sumhd"><div class="note" style="flex:1">ملخص قصير لكل محور تحتاج إلى تقويته، مرتّب من الأولوية الأعلى. احفظه PDF وراجعه قبل محاولتك القادمة.</div></div>';
      for (var si = 0; si < sums.length; si += 2) { h += '<div class="smpg' + (si ? '' : ' first') + '">' + rdSumHTML(sums[si].sum, { pct: sums[si].pct }) + (sums[si + 1] ? rdSumHTML(sums[si + 1].sum, { pct: sums[si + 1].pct }) : '') + '</div>'; }
    }
    if (hasRv && tab === 'rev') {
      h += '<div class="card"><h2>مراجعة الإجابات</h2>';
      R.review.forEach(function (rv, i) {
        var q = qById(rv.id); if (!q) return;
        var p = splitMark(rv.exp, '\n⟦W⟧'), exp = p[0], why = p[1] || [];
        h += '<div class="rv ' + (rv.ok ? 'ok' : 'no') + '"><div class="h"><span>السؤال ' + (i + 1) + '</span>' +
          (rv.ok ? '<span class="ok">' + ic('check') + ' إجابة صحيحة</span>' : '<span class="no">' + ic('x') + (rv.chosen == null ? ' لم تُجب' : ' إجابة خاطئة') + '</span>') + '</div>' +
          '<div style="font-weight:600;margin-bottom:6px;white-space:pre-wrap">' + esc(q.text) + '</div>' + imgHTML(q, false);
        if (!rv.ok && rv.chosen != null) h += '<div class="o wrong">إجابتك: ' + esc(q.options[rv.chosen]) + '</div>';
        h += '<div class="o right">الإجابة الصحيحة: ' + esc(q.options[rv.correct]) + '</div>';
        if (!rv.ok && rv.chosen != null && why[rv.chosen]) h += '<div class="w"><b>لماذا إجابتك غير صحيحة؟</b> ' + esc(why[rv.chosen]) + '</div>';
        if (exp) h += '<div class="x"><b>' + (why.length ? 'لماذا هذه هي الإجابة الصحيحة؟' : 'الشرح:') + '</b> ' + esc(exp) + '</div>';
        var others = []; why.forEach(function (w, k) { if (w && k !== rv.correct && k !== rv.chosen && q.options[k] != null) others.push('<li><b>' + esc(q.options[k]) + ':</b> ' + esc(w) + '</li>'); });
        if (others.length) h += '<div class="oth"><b>لماذا بقية الخيارات خطأ؟</b><ul>' + others.join('') + '</ul></div>';
        h += '</div>';
      });
      h += '</div>';
    }
    h += '<div class="center noprint" style="margin-top:6px"><button class="btn ghost" onclick="print()">' + ic('print') + ' طباعة / حفظ PDF</button></div>';
    h += '<p class="center" style="color:var(--muted);font-size:12.5px;margin-top:14px">وقت التسليم: ' + new Date(R.submitted_at).toLocaleString('ar-SA') + '</p></div>';
    app.innerHTML = h; bindZoom(app);
    app.querySelectorAll('[data-t],[data-go]').forEach(function (b) { b.onclick = function () { screenResult(b.getAttribute('data-t') || b.getAttribute('data-go')); scrollTo(0, 0); }; });
  }

  window.addEventListener('offline', function () { if (active()) setSave('off', '📴 غير متصل — إجاباتك محفوظة على جهازك'); });
  window.addEventListener('online', function () { if (active()) remoteSave(); });
  document.addEventListener('visibilitychange', function () {
    if (!S.exam || !S.exam.trackFocus || !active()) return;
    if (document.hidden) {
      S.blur++; persist();
      if (S.exam.maxBlur > 0 && S.blur > S.exam.maxBlur) doSubmit(true, 'blur');
    } else drawWarn();
  });
  ['copy', 'cut', 'contextmenu', 'selectstart', 'dragstart'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { if (S.exam && S.exam.noCopy && active()) e.preventDefault(); });
  });
  document.addEventListener('keydown', function (e) {
    if (S.exam && S.exam.noCopy && active() && (e.ctrlKey || e.metaKey) && /^[cxpsau]$/i.test(e.key)) e.preventDefault();
  });
  window.addEventListener('beforeunload', function (e) { if (S.timer && !S.result) { e.preventDefault(); e.returnValue = ''; } });
  screenLogin();
})();
</script>
</body>
</html>
